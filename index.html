/* ============================================================
   GUIA DA CONTRIBUICAO (GPS) — itens 69 e 70

   A guia e emitida a mao pelo Esdras, as vezes com semanas de
   antecedencia. Aqui ela so e CADASTRADA: quem decide o dia do envio e
   o motor, pelo vencimento — dia 1 do mes do vencimento, ou na proxima
   rodada se esse dia 1 ja passou.

   POR QUE O ANEXO NAO PASSA PELO BOTAO SALVAR. Anexar e fechar o card
   sem salvar deixaria o arquivo no bucket e a coluna vazia: o motor
   nunca acharia a guia e a cliente nunca receberia nada. Upload e
   marcacao de pagamento gravam na hora. So o vencimento vai no Salvar,
   porque e campo digitado junto dos outros.

   POR QUE A GUIA NAO ENTRA EM crm_anexos. Se entrasse, o X da aba
   Anexos apagaria o arquivo do bucket sem limpar gps_anexo, e o envio
   quebraria com o card dizendo que a guia esta la.
   ============================================================ */
function mcDataBR(iso){
  if(!iso)return '';
  const p=String(iso).slice(0,10).split('-');
  return p.length===3?`${p[2]}/${p[1]}/${p[0]}`:'';
}
function mcCarimbo(ts){
  if(!ts)return '';
  return new Date(ts).toLocaleDateString('pt-BR',{timeZone:'America/Sao_Paulo'});
}
/* O prazo real: guia que vence em sabado ou domingo prorroga para o
   proximo dia util. Espelha o prazoEfetivoGPS do motor — os dois
   precisam concordar, senao a tela promete um dia e a cobranca sai em
   outro. */
/* CONFERENCIA DA LINHA DIGITAVEL — espelho do linhaGpsConfere do motor.
   Os dois precisam concordar: se a tela aceitar um numero que o motor
   recusa, o campo fica preenchido e o balao do codigo nunca sai, sem
   ninguem entender por que. Sao 48 digitos em quatro blocos de 11 mais
   verificador; testa modulo 10 e modulo 11 e aceita se um fechar os
   quatro, para nao depender do identificador de valor. */
function mcDvMod10(b){
  let soma=0;
  for(let i=b.length-1,pos=0;i>=0;i--,pos++){
    let v=Number(b[i])*(pos%2===0?2:1);
    if(v>9)v-=9;
    soma+=v;
  }
  return (10-soma%10)%10;
}
function mcDvMod11(b){
  const pesos=[2,3,4,5,6,7,8,9];
  let soma=0;
  for(let i=b.length-1,pos=0;i>=0;i--,pos++)soma+=Number(b[i])*pesos[pos%8];
  const d=11-soma%11;
  return (d===10||d===11||d===0||d===1)?0:d;
}
function mcLinhaGpsConfere(dig){
  if(!/^\d{48}$/.test(dig||''))return false;
  for(const dv of [mcDvMod10,mcDvMod11]){
    let ok=true;
    for(let b=0;b<4;b++){
      if(String(dv(dig.slice(b*12,b*12+11)))!==dig[b*12+11]){ok=false;break;}
    }
    if(ok)return true;
  }
  return false;
}
/* So para ler na tela. O que vai para a cliente e para o banco continua
   sendo a sequencia crua de 48 digitos, sem espaco: e ela que se cola no
   aplicativo. */
function mcLinhaGpsBonita(dig){
  const d=String(dig||'').replace(/\D/g,'');
  if(d.length!==48)return d;
  return [d.slice(0,12),d.slice(12,24),d.slice(24,36),d.slice(36,48)].join(' ');
}
function mcPrazoGps(iso){
  const p=String(iso||'').slice(0,10).split('-');
  if(p.length!==3)return null;
  const d=new Date(Date.UTC(+p[0],+p[1]-1,+p[2]));
  while(d.getUTCDay()===0||d.getUTCDay()===6)d.setUTCDate(d.getUTCDate()+1);
  return d;
}
function mcGpsHtml(c){
  const nomeArq=c.gps_anexo?String(c.gps_anexo).split('/').pop().replace(/^\d+_/,''):'';
  const anexo = c.gps_anexo
    ? `<div style="display:flex;align-items:center;gap:7px;flex-wrap:wrap">
         <span style="font-size:12px">📎 <b>${esc(nomeArq)}</b></span>
         <button class="btn btns" style="padding:3px 9px;font-size:11px" onclick="visualizarAnexo('${escA(c.gps_anexo)}','${escA(nomeArq)}')">Ver</button>
         <button class="btn btns" style="padding:3px 9px;font-size:11px" onclick="removerGuiaGPS('${c.id}')">Remover</button>
       </div>`
    : `<label class="btn btns" style="padding:4px 11px;font-size:11px;cursor:pointer">Anexar a guia
         <input type="file" accept="application/pdf,image/*" style="display:none" onchange="uploadGuiaGPS(this,'${c.id}')"/>
       </label>`;
  /* O estado em uma frase. Sem isto o card mostra tres campos e nenhuma
     resposta para "ja saiu?" — que e a unica pergunta que importa. */
  let estado, cor='var(--text3)';
  if(c.gps_paga_em){
    estado=`✅ Paga em ${mcCarimbo(c.gps_paga_em)}. A cobrança do vencimento não sai.`;cor='var(--green,#2e7d32)';
  }else if(!c.gps_anexo){
    estado='Anexe a guia para ela entrar na fila.';
  }else if(!c.gps_vencimento){
    estado='Preencha o vencimento: é ele que decide o dia do envio.';
  }else if(c.gps_enviada_em){
    const pz=mcPrazoGps(c.gps_vencimento);
    estado=`Enviada em ${mcCarimbo(c.gps_enviada_em)}. Cobrança automática em ${pz?mcDataBR(pz.toISOString()):''} se ninguém marcar o pagamento.`;
  }else{
    const p=String(c.gps_vencimento).slice(0,10).split('-');
    const dia1=new Date(Date.UTC(+p[0],+p[1]-1,1));
    const hoje=new Date();
    const hojeUTC=new Date(Date.UTC(hoje.getFullYear(),hoje.getMonth(),hoje.getDate()));
    estado = hojeUTC.getTime()<dia1.getTime()
      ? `Vai sair em ${mcDataBR(dia1.toISOString())}, no dia 1º do mês do vencimento.`
      : 'Sai na próxima rodada do motor.';
  }
  const pago = c.gps_paga_em
    ? `<button class="btn btns" style="padding:4px 10px;font-size:11px" onclick="marcarGpsPaga('${c.id}',false)">Desfazer pagamento</button>`
    : `<button class="btn btnp" style="padding:4px 10px;font-size:11px" onclick="marcarGpsPaga('${c.id}',true)">Marcar guia paga</button>`;
  /* A LINHA DIGITAVEL. O motor le do PDF e confere os quatro
     verificadores antes de gravar aqui; quando nao consegue, o campo
     fica vazio com a nota no card e este e o lugar de digitar na mao.
     O que a cliente recebe e exatamente o que esta neste campo. */
  const linhaCrua=String(c.gps_linha_digitavel||'').replace(/\D/g,'');
  const linhaOk=mcLinhaGpsConfere(linhaCrua);
  let dicaLinha;
  if(!linhaCrua){
    dicaLinha = c.gps_linha_lida_em
      ? '<span style="color:var(--orange,#b26a00)">Não consegui ler o código do PDF. Digite aqui para ele ir junto com a guia.</span>'
      : 'Vou ler o código do PDF na próxima rodada.';
  }else if(!linhaOk){
    dicaLinha = '<span style="color:var(--red,#c62828)">Este número não fecha o dígito verificador — confira antes, porque assim ele NÃO é enviado.</span>';
  }else{
    dicaLinha = '✅ Confere. Vai numa mensagem sozinha, depois da guia, para a cliente conseguir copiar.';
  }
  const campoLinha = c.gps_anexo ? `
    <div class="fld" style="grid-column:1/-1">
      <label>Linha digitável do código de barras</label>
      <input type="text" id="mc-gps-linha" inputmode="numeric" placeholder="48 dígitos"
             value="${escA(mcLinhaGpsBonita(linhaCrua))}" oninput="mcLinhaGpsDica(this)"/>
      <div class="fhint" id="mc-gps-linhadica" style="margin-top:3px">${dicaLinha}</div>
    </div>` : '';
  /* ENVIO AVULSO. Manda a guia e, se o numero conferir, o codigo logo

  const enviar = c.gps_anexo
    ? `<button class="btn btns" style="padding:4px 10px;font-size:11px" onclick="enviarGuiaGPSAgora('${c.id}')">Enviar guia no chat</button>`

    {acoes:(c.gps_anexo?enviar+' '+pago:'')});
}
/* A conferencia aparece enquanto se digita, e nao depois de salvar:
   quem digita 48 numeros a mao erra, e descobrir isso no dia do
   vencimento nao adianta mais. */
function mcLinhaGpsDica(el){
  const d=$('mc-gps-linhadica');
  if(!d)return;
  const dig=String(el.value||'').replace(/\D/g,'');
  if(!dig){d.innerHTML='Digite os 48 dígitos, ou deixe vazio para a guia sair sem o código.';return;}
  if(dig.length!==48){d.innerHTML='<span style="color:var(--text3)">'+dig.length+' de 48 dígitos.</span>';return;}
  d.innerHTML=mcLinhaGpsConfere(dig)
    ? '✅ Confere.'
    : '<span style="color:var(--red,#c62828)">Não fecha o dígito verificador — confira o número na guia.</span>';
}
/* ENVIO AVULSO DA GUIA. Duas linhas na fila de saida, na ordem: o PDF e
   depois o codigo sozinho. A ordem e garantida por criado_em, que e como
   a fila manual ordena — por isso os dois inserts sao sequenciais e nao
   um insert de duas linhas. */
async function enviarGuiaGPSAgora(clienteId){
  if(!mcChatCanal){toast('Defina o Canal WhatsApp da cliente antes de enviar','er');return;}
  if(!mcChatChave){toast('Esta cliente não tem telefone válido cadastrado','er');return;}
  const{data:c,error:ec}=await sb.from('crm_clientes')
    .select('gps_anexo,gps_vencimento,gps_linha_digitavel,gps_enviada_em').eq('id',clienteId).single();
  if(ec||!c){toast('Erro ao ler o card: '+(ec?ec.message:''),'er');return;}
  if(!c.gps_anexo){toast('Não há guia anexada neste card','er');return;}
  /* O campo da tela ganha do banco: se o Esdras acabou de digitar o
     numero e ainda nao salvou, e esse que ele quer mandar. */
  const daTela=$('mc-gps-linha')?String($('mc-gps-linha').value||'').replace(/\D/g,''):'';
  const linha=daTela||String(c.gps_linha_digitavel||'').replace(/\D/g,'');
  const linhaOk=mcLinhaGpsConfere(linha);
  const ext=(String(c.gps_anexo).split('.').pop()||'pdf').toLowerCase();
  const nome='Guia INSS '+(c.gps_vencimento?mcDataBR(c.gps_vencimento).replace(/\//g,'-'):'PreviMater')+'.'+ext;
  let aviso='Enviar a guia para a cliente agora?';
  aviso += linhaOk
    ? '\n\nVai a guia e, na mensagem seguinte, o código de barras sozinho.'
    : (linha
       ? '\n\nATENÇÃO: o número digitado não fecha o dígito verificador. Vai SÓ a guia, sem o código.'
       : '\n\nVai só a guia — não há código de barras conferido neste card.');
  if(!c.gps_enviada_em)aviso+='\n\nA mensagem automática com a explicação do prazo continua marcada para sair; isto aqui não substitui ela.';
  if(!confirm(aviso))return;
  const base='crm:'+Date.now()+':'+Math.random().toString(36).slice(2,8);
  const{error}=await sb.from('crm_mensagens').insert({
    cliente_id:clienteId,
    telefone_chave:mcChatChave,
    telefone_bruto:mcChatTel||null,
    canal:mcChatCanal,
    direcao:'saida',
    autor_tipo:'humano',
    usuario_id:U.id,
    tipo:anexoEhImagem(nome)?'imagem':'documento',
    midia_caminho:c.gps_anexo,
    midia_nome:nome,
    midia_mime:mimeDoNome(nome),
    id_externo:base+':guia',
    status:'pendente_envio'
  });
  if(error){toast('Erro ao enfileirar a guia: '+error.message,'er');return;}
  if(linhaOk){
    const{error:el}=await sb.from('crm_mensagens').insert({
      cliente_id:clienteId,
      telefone_chave:mcChatChave,
      telefone_bruto:mcChatTel||null,
      canal:mcChatCanal,
      direcao:'saida',
      autor_tipo:'humano',
      usuario_id:U.id,
      tipo:'texto',
      texto:linha,
      id_externo:base+':codigo',
      status:'pendente_envio'
    });
    if(el)toast('A guia foi enfileirada, mas o código não: '+el.message,'er');
  }
  toast(linhaOk?'Guia e código na fila — saem em até 1 minuto':'Guia na fila — sai em até 1 minuto','ok');
  if(mcAbaAtual==='chat'){mcChatAssinatura='';carregarChat(clienteId);}
  registrarAtividade(clienteId,'enviou a guia da contribuição'+(linhaOk?' com o código de barras':'')+' para a cliente');
}

/* O WhatsGW decide como entregar pelo formato do arquivo. Sem isso ele
   trata tudo como binario generico e a cliente recebe algo que nao abre. */
function mimeDoNome(nome){
  const m={pdf:'application/pdf',png:'image/png',jpg:'image/jpeg',jpeg:'image/jpeg',
    gif:'image/gif',webp:'image/webp',doc:'application/msword',
    docx:'application/vnd.openxmlformats-officedocument.wordprocessingml.document',
    xls:'application/vnd.ms-excel',
    xlsx:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet',
    txt:'text/plain',zip:'application/zip',mp3:'audio/mpeg',mp4:'video/mp4'};
  return m[anexoExt(nome)]||'application/octet-stream';
}
async function baixarBlobAnexo(caminho){
  const{data,error}=await sb.storage.from(ANEXO_BUCKET).download(caminho);
  if(error||!data)throw new Error(error?error.message:'arquivo nao encontrado');
  return data;
}
/* navigator.share com arquivo so existe em celular. No computador o
   navegador recusa, entao caimos no download em vez de falhar calado. */
async function compartilharNativo(caminho,nome){
  document.querySelectorAll('.anexomenu').forEach(x=>x.classList.add('h'));
  try{
    const blob=await baixarBlobAnexo(caminho);
    const arq=new File([blob],nome,{type:blob.type||'application/octet-stream'});
    if(navigator.canShare&&navigator.canShare({files:[arq]})){
      await navigator.share({files:[arq]});
      return;
    }
    toast('Este navegador nao compartilha arquivo. Baixando...','in');
    const url=URL.createObjectURL(blob);
    const a=document.createElement('a');a.href=url;a.download=nome;a.click();
    setTimeout(()=>URL.revokeObjectURL(url),4000);
  }catch(e){
    if(e&&e.name==='AbortError')return; // usuario fechou o menu, nao e erro
    toast('Nao foi possivel compartilhar: '+(e.message||e),'er');
  }
}
/* Grava na conversa como mensagem de saida pendente. Quem entrega no
   WhatsApp e o motor. telefone_chave e id_externo sao obrigatorios pelo
   CHECK crm_mensagens_conteudo_minimo — sem eles o banco recusa a linha. */
async function enviarAnexoCliente(caminho,nome,clienteId){

  const tam=(meta&&meta[0])?meta[0].tamanho_bytes:null;
  /* A recusa vem antes do confirm de proposito: perguntar "envia?" para
     depois falhar na fila e pior do que dizer o motivo de cara. */
  if(tam&&tam>LIMITE_ENVIO_BYTES){toast('Arquivo de '+(Math.round(tam/104857.6)/10)+' MB. O limite de envio pelo WhatsApp é 5 MB.','er');return;}
  if(!confirm('Enviar "'+nome+'" para a cliente agora?'))return;
  const{error}=await sb.from('crm_mensagens').insert({
    cliente_id:clienteId,
    telefone_chave:mcChatChave,

    id_externo:'crm:'+Date.now()+':'+Math.random().toString(36).slice(2,8),
    status:'pendente_envio'
  });
  if(error){toast('Erro ao enfileirar: '+error.message,'er');return;}
  toast('Arquivo na fila — sai em até 1 minuto','ok');
  if(mcAbaAtual==='chat'){mcChatAssinatura='';carregarChat(clienteId);}
  registrarAtividade(clienteId,'enviou o arquivo '+nome+' para a cliente');

/* ============================================================
   ARRASTAR E SOLTAR
   Vale so com o card aberto e so para arquivo vindo de fora. Se o que
   esta sendo arrastado nao for arquivo, deixamos passar — senao o
   arrastar de card entre colunas do Kanban quebraria.
   ============================================================ */
let mcDropLigado=false,mcDropProf=0;
function ehArrastoDeArquivo(e){
  const t=e.dataTransfer&&e.dataTransfer.types;
  return !!t&&Array.prototype.indexOf.call(t,'Files')!==-1;
}
function mcMostrarVeu(mostrar){
  let v=$('mc-dropvel');
  if(mostrar&&!v){
    v=document.createElement('div');v.id='mc-dropvel';v.className='dropvel';
    v.innerHTML='<div class="dropmsg">Solte para anexar ao card</div>';
    document.body.appendChild(v);
  }else if(!mostrar&&v)v.remove();
  const box=$('modalbox');
  if(box)box.classList.toggle('dropon',!!mostrar);
}
function mcLigarDropAnexos(){
  if(mcDropLigado)return;
  mcDropLigado=true;
  const box=$('modalbox');
  if(!box)return;
  const ativo=()=>!$('modal').classList.contains('h')&&box.classList.contains('mb-card')&&!!mcClienteId;
  box.addEventListener('dragenter',e=>{
    if(!ativo()||!ehArrastoDeArquivo(e))return;
    e.preventDefault();e.stopPropagation();mcDropProf++;mcMostrarVeu(true);
  });
  box.addEventListener('dragover',e=>{
    if(!ativo()||!ehArrastoDeArquivo(e))return;
    e.preventDefault();e.stopPropagation();e.dataTransfer.dropEffect='copy';
  });
  box.addEventListener('dragleave',e=>{
    if(!ativo()||!ehArrastoDeArquivo(e))return;
    mcDropProf--;if(mcDropProf<=0){mcDropProf=0;mcMostrarVeu(false);}
  });
  box.addEventListener('drop',async e=>{
    if(!ativo()||!ehArrastoDeArquivo(e))return;
    e.preventDefault();e.stopPropagation();
    mcDropProf=0;mcMostrarVeu(false);
    const arquivos=[...(e.dataTransfer.files||[])];
    if(!arquivos.length){toast('Nao veio arquivo nenhum','er');return;}
    const id=mcClienteId;
    toast('Enviando '+arquivos.length+(arquivos.length>1?' arquivos...':' arquivo...'),'in');
    await subirArquivosAnexo(arquivos,id);
  });
}

async function loadFin(forcar){
  if(finCarregado&&!forcar)return;
  const[rr,rp]=await Promise.all([
    sb.from('pm_recebimentos').select('*').order('created_at',{ascending:false}),
    sb.from('pm_parcelas').select('*').order('data_vencimento')
  ]);
  REC=rr.data||[];
  PARC=rp.data||[];
  /* CLI CARREGA SÓ QUEM TEM DINHEIRO ENVOLVIDO, E NÃO A BASE INTEIRA.
     Antes era um select sem filtro em crm_clientes. Parecia trazer todo
     mundo, mas o PostgREST corta em 1000 linhas caladamente — com 37 mil
     clientes na base, o seletor de Recebimentos enxergava só a primeira
     fatia em ordem alfabética. Cliente fora dela sumia da busca e não
     dava para cadastrar pagamento nenhum para ela.
     Aqui só entram os que já têm parcela ou recebimento, que é para o
     que este array serve nesta tela (WhatsApp, Trello, nome). Quem for
     novo entra pela busca no banco, em buscaCliAgora(). */
  const ids=[...new Set([].concat(
    PARC.map(pCli),
    REC.map(r=>r.crm_cliente_id||r.cliente_id)
  ).filter(Boolean))];
  CLI=[];
  for(let i=0;i<ids.length;i+=200){
    const{data}=await sb.from('crm_clientes')
      .select('id,nome_completo,telefone_principal,trello_url,origem')
      .in('id',ids.slice(i,i+200));
    (data||[]).forEach(c=>CLI.push({id:c.id,nome:c.nome_completo,whatsapp:c.telefone_principal,trello_url:c.trello_url,origem:c.origem}));
  }
  finCarregado=true;
}
/* Guarda no CLI quem veio da busca ou da pré-seleção. selCli() e
   submitRec() procuram a cliente aqui dentro — sem isto, escolher uma
   cliente que não estava no array daria "Cliente não encontrada" na
   hora de salvar. */
function mesclarCli(lista){
  (lista||[]).forEach(n=>{
    if(!CLI.some(c=>String(c.id)===String(n.id)))CLI.push(n);
  });
}
const pCli=p=>p.crm_cliente_id||p.cliente_id;

async function pageQuadro(q){
  const pc=$('pc');marcarNav(q);
  if(!QUADROS[q]||!QPERM.includes(q)){pc.innerHTML='<div class="emp"><div class="empt">Você não tem acesso a este quadro</div></div>';return;}
  pc.innerHTML=`<div class="pgh"><div><div class="pgt">${QUADROS[q].rotulo}</div><div class="pgs">Carregando...</div></div></div>`;
  if(q==='financeiro'){
    _cacheListasFin=null;
    await sb.rpc('arquivar_finalizados_antigos');
    await loadFin(true);
    await varrerAtrasos();
  }
  const[{data:listas},{data:clientes,error}]=await Promise.all([
    sb.from('crm_listas').select('*').eq('quadro',q).eq('arquivada',false).order('ordem'),
    sb.from('crm_clientes').select('id,nome_completo,lista_id,posicao,telefone_principal,data_nascimento_bebe,data_entrega,data_desbloqueio_inss,valor_beneficio_esperado,valor_honorarios,crm_clientes_etiquetas(etiqueta_id)').eq('quadro',q).is('arquivado_em',null).order('posicao')
  ]);
  if(error){pc.innerHTML=`<div class="emp"><div class="empt">Erro ao carregar</div>${esc(error.message)}</div>`;return;}
  const L=listas||[],C=clientes||[];

  // quantos cards arquivados existem em cada lista deste quadro
  const ARQ={};let ARQTOTAL=0;
  {
    // count exato por lista: o select comum para em 1000 linhas e mentiria o total
    const{count:tot}=await sb.from('crm_clientes')
      .select('id',{count:'exact',head:true}).eq('quadro',q).not('arquivado_em','is',null);
    ARQTOTAL=tot||0;
    if(ARQTOTAL){
      const contagens=await Promise.all(L.map(l=>
        sb.from('crm_clientes').select('id',{count:'exact',head:true})
          .eq('lista_id',l.id).not('arquivado_em','is',null)
      ));
      L.forEach((l,i)=>{const n=contagens[i]?contagens[i].count||0:0;if(n)ARQ[l.id]=n;});
    }
  }

  if(q==='financeiro'&&C.length){
    const ids=C.map(c=>c.id);
    const{data:parc}=await sb.from('pm_parcelas').select('crm_cliente_id,status,data_vencimento').in('crm_cliente_id',ids).neq('status','cancelado');
    const porCliente={};
    (parc||[]).forEach(p=>{
      if(!porCliente[p.crm_cliente_id])porCliente[p.crm_cliente_id]={total:0,recebidas:0,proxima:null,atraso:0,inad:0};
      const r=porCliente[p.crm_cliente_id];
      r.total++;
      if(p.status==='recebido')r.recebidas++;
      else if(p.status==='inadimplente')r.inad++;
      else{
        if(!r.proxima||p.data_vencimento<r.proxima)r.proxima=p.data_vencimento;
        const da=diasAtrasoParcela(p);
        if(da>r.atraso)r.atraso=da;
      }
    });
    C.forEach(c=>{c.finResumo=porCliente[c.id]||null;});
  }

  /* OS PARADOS DESTE QUADRO.
     Uma consulta so, na view, filtrada pelo quadro: ela ja devolve apenas
     quem passou do prazo, entao sao dezenas de linhas e nao a base. NAO
     da para perguntar isso card a card — seriam N consultas — nem trazer
     tudo e filtrar aqui, que esbarraria no teto de 1.000 do PostgREST
     quando o volume crescer.
     Falha nao quebra o quadro: sem os parados o quadro fica como era
     antes de 26/08, que e uma tela pior e nao uma tela quebrada. */
  PARADOS={};
  try{
    const{data:par}=await sb.from('vw_cards_parados')
      .select('cliente_id,dias_parado,veredito').eq('quadro',q).limit(1000);
    (par||[]).forEach(x=>{PARADOS[x.cliente_id]=x;});
  }catch(_){}

  if(C.length){
    const ids=C.map(c=>c.id);
    const{data:anx}=await sb.from('crm_anexos').select('cliente_id').in('cliente_id',ids);
    const anxCont={};
    (anx||[]).forEach(a=>{anxCont[a.cliente_id]=(anxCont[a.cliente_id]||0)+1;});
    C.forEach(c=>{c.anexosCount=anxCont[c.id]||0;});
  }

  const porLista={};L.forEach(l=>porLista[l.id]=[]);
  const orfaos=[];
  C.forEach(c=>{if(porLista[c.lista_id])porLista[c.lista_id].push(c);else orfaos.push(c);});
  let kb=L.map(l=>listaHtml(l,porLista[l.id],false,ARQ[l.id]||0)).join('');
  if(orfaos.length)kb+=listaHtml({id:'__sem__',nome:'Sem lista',cor:'#5A7070'},orfaos,true,0);

/* Quais cartoes deste quadro estao parados, por id. Preenchido pelo
   pageQuadro e lido pelo cardHtml, que e sincrono. */
let PARADOS={};
/* O veredito e o que separa "dinheiro na mesa" de "faxina".
   CAMINHO_CONTRIBUICAO entra junto com TEM_DIREITO de proposito: ali a
   cliente TEM caminho, so depende de uma guia paga dentro do prazo — e
   prazo de guia vence, entao parada ali e a que mais custa. */
function paradoComDireito(par){
  return par&&(par.veredito==='TEM_DIREITO'||par.veredito==='CAMINHO_CONTRIBUICAO');
}
/* Card de gravida: a etiqueta PRE e o que diz que o acompanhamento
   gestacional se aplica. Sem a data ele nao dispara — por isso a falta
   aparece em vermelho na face do card, e nao escondida no formulario. */
function temEtiquetaPre(c){
  return (c.crm_clientes_etiquetas||[]).some(e=>{
    const t=ETQ.find(x=>x.id===e.etiqueta_id);
    return t&&/^pr[eé]$/i.test((t.nome||'').trim());
  });
}
function cardHtml(c){
  const chips=(c.crm_clientes_etiquetas||[]).map(e=>{
    const t=ETQ.find(x=>x.id===e.etiqueta_id);
    return t?`<span class="chip" style="background:${escA(t.cor)}">${esc(t.nome)}</span>`:'';
  }).join('');
  const meta=[];
  if(c.telefone_principal)meta.push(esc(c.telefone_principal));
  /* UMA DATA SO PARA O BEBE.
     DN e DPP sao a mesma informacao em dois momentos: enquanto nao
     nasceu a data e prevista, quando nasce e real e voce corrige o mesmo
     campo. Duas colunas obrigavam a olhar em dois lugares e decidir qual
     valia. Quem manda na conta de elegibilidade e no acompanhamento
     gestacional e o samara_dados, que nunca leu coluna nenhuma.
     Card com etiqueta PRE e sem data nao dispara acompanhamento — por
     isso a falta grita em vermelho em vez de ficar campo vazio calado. */
  if(c.data_nascimento_bebe)meta.push('DN '+fD(c.data_nascimento_bebe));
  else if(temEtiquetaPre(c))meta.push('<span style="color:var(--red);font-weight:700">sem DN</span>');
  /* PARADO: nenhuma automacao pendente e mais tempo na lista que o prazo
     dela. Quem decide isso e a view vw_cards_parados, no banco — a tela
     so pinta. O cartao NAO muda de lista: mover por diagnostico
     destruiria o significado da lista ("Aguardando documentos" deixaria
     de responder quem esta aguardando documentos), e a ordem do quadro e
     sua, montada arrastando. Por isso cor e faixa, nunca movimento. */
  const par=PARADOS[c.id];
  if(c.anexosCount)meta.push(`<span class="kc-anexo">${clipeSvg()}${c.anexosCount}</span>`);
  let finHtml='';
  if(c.finResumo){
    const f=c.finResumo;
    finHtml=`<div class="kcm"><span class="kcv">${f.recebidas}/${f.total} parcelas</span>${f.proxima?` · próxima ${fD(f.proxima)}`:''}</div>`;
    if(f.inad>0)finHtml+=`<div class="kcm"><span class="ent ent-late">⚑ ${f.inad} parcela(s) inadimplente(s)</span></div>`;
    else if(f.atraso>=DIAS_AVISO_ATRASO)finHtml+=`<div class="kcm"><span class="ent ent-late">⚑ atrasado há ${f.atraso}d</span></div>`;
  }
  const clsPar=par?(paradoComDireito(par)?' kc-parado-direito':' kc-parado'):'';
  const parHtml=par?`<div class="kcm"><span class="kcpar">◉ parado há ${par.dias_parado}d${paradoComDireito(par)?' · TEM DIREITO':''}</span></div>`:'';

  return `<div class="kc${clsPar}" draggable="true" data-card="${c.id}" onclick="abrirCardCliente('${c.id}')">
      <button class="kcmv" title="Mover cartão" onclick="event.stopPropagation();modalMover('${c.id}')">⇄</button>
      <div class="kcn">${esc(c.nome_completo)}</div>
      ${parHtml}
      ${meta.length?`<div class="kcm">${meta.join(' · ')}</div>`:''}
      ${finHtml||(c.valor_honorarios?`<div class="kcm"><span class="kcv">${R(c.valor_honorarios)}</span></div>`:'')}
      ${entregaHtml(c.data_entrega)}
      ${bloqueioHtml(c.data_desbloqueio_inss)}
      ${chips?`<div class="kce">${chips}</div>`:''}
    </div>`;
}
function clipeSvg(){return'<svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-1px;margin-right:2px"><path d="m21.44 11.05-9.19 9.19a6 6 0 0 1-8.49-8.49l8.57-8.57A4 4 0 1 1 18 8.84l-8.59 8.57a2 2 0 0 1-2.83-2.83l8.49-8.48"/></svg>';}

function ligarDragDrop(){
  document.querySelectorAll('.kc').forEach(card=>{
    card.addEventListener('dragstart',e=>{
      dragCardId=card.getAttribute('data-card');
      const kl=card.closest('.kl');
      dragOrigLista=kl?kl.getAttribute('data-lista'):null;
      card.classList.add('dragging');e.dataTransfer.effectAllowed='move';
    });
    card.addEventListener('dragend',()=>{card.classList.remove('dragging');document.querySelectorAll('.kl').forEach(l=>l.classList.remove('dragover'));});
  });
  document.querySelectorAll('.klb').forEach(body=>{
    body.addEventListener('dragover',e=>{
      e.preventDefault();body.closest('.kl').classList.add('dragover');
      const arr=document.querySelector('.dragging');if(!arr)return;
      const dep=cardDepoisDe(body,e.clientY);
      if(dep==null)body.appendChild(arr);else body.insertBefore(arr,dep);
    });
    body.addEventListener('dragleave',e=>{if(!body.contains(e.relatedTarget))body.closest('.kl').classList.remove('dragover');});
    body.addEventListener('drop',async e=>{
      e.preventDefault();body.closest('.kl').classList.remove('dragover');
      const lid=body.getAttribute('data-drop');
      if(lid==='__sem__')return;
      const cid=dragCardId,origLista=dragOrigLista;
      await salvarOrdemLista(lid,body);
      if(cid&&origLista&&origLista!==lid)await registrarMovimentoLista(cid,origLista,lid);
    });
  });
}
/* ARRASTAR O FUNDO PARA ANDAR ENTRE AS LISTAS.
   Com nove listas no comercial, chegar na ultima exigia achar a barra
   de rolagem ou girar a roda com shift. Agora: segurar o botao esquerdo
   em qualquer lugar que NAO seja um cartao e puxar.

   Tres cuidados que fazem a diferenca entre util e irritante:

   1. So comeca fora de .kc — se comecasse em cima do cartao, brigaria
      com o arrastar-para-outra-lista, que e a funcao principal daqui.
   2. So comeca fora de campo, botao e link: dentro de um input o
      arrasto e para selecionar texto, e roubar isso impede editar.
   3. So vira arrasto depois de 5 pixels. Abaixo disso continua sendo
      clique — senao um clique tremido no botao de recolher a lista
      viraria arrasto e o botao nunca funcionaria. */
/* SECOES QUE APARECEM CONFORME O CASO ANDA.
   Um card em "Lead novo" mostrava CPF, senha do INSS, link de contrato,
   referencias e pagamentos — cinco blocos vazios que nao tem nada a ver
   com uma lead que acabou de chegar. O olho tinha que pular por cima
   deles toda vez para achar telefone e DN.

   Cada lista tem uma ETAPA, e cada bloco aparece a partir de uma etapa:
     0  antes do contrato ....... nada extra
     1  Montar Contrato ......... aparece Contrato
     2  contrato enviado adiante  aparece tambem Acesso INSS
     3  beneficio concedido ..... aparece tambem Pagamentos

   O Acesso INSS entra ja em "Contrato enviado", e nao depois: e ali que
   a sequencia pedir_senha roda e a senha chega. Se so aparecesse em
   Montar Processo, o campo estaria escondido justamente no dia em que
   e usado.

   Lista que nao esta no mapa mostra TUDO. Lista nova nasce mostrando
   demais, que e chato; nasceria escondendo campo, que e perda de
   trabalho. */
const ETAPA_LISTA={
  'Chamar indicada':0,'Lead novo':0,'Em triagem':0,'Aguardando documentos':0,
  'Reativação Trello':0,'Descartado':0,
  'Montar Contrato':1,
  'Contrato enviado':2,'Contrato Cancelado':2,
  'Aguardando nascimento':2,'Reta final':2,'Aguardando adoção':2,
  'Montar Processo':2,'Protocolar':2,'Em análise':2,'Exigência':2,'Benefício negado':2,
  'Benefício concedido':3,
  'Em pagamento INSS':3,'Pago / encerrado':3,'Inadimplente':3
};
const ETAPA_CONTRATO=1, ETAPA_INSS=2, ETAPA_PAGAMENTOS=3;
/* A guia da contribuicao aparece a partir de "Contrato enviado": e dali
   em diante que existe cliente PRE pagando GPS. */
const ETAPA_GPS=2;
let mcMostrarTudo=false;   // o "mostrar assim mesmo" do rodape do card

function etapaDaLista(nome){
  const e=ETAPA_LISTA[(nome||'').trim()];
  return e===undefined?99:e;   // desconhecida = mostra tudo
}
/* CAMPO COM CONTEUDO NUNCA SOME.
   Esconder um bloco que ja tem dado seria pior que a poluicao que isto
   veio resolver: o dado sumiria da tela sem sumir do banco, e alguem
   concluiria que esta vazio. Por isso a visibilidade e "chegou na
   etapa OU ja tem coisa dentro". */
function mcVerSecao(minimo, etapa, temDado){
  return mcMostrarTudo || temDado || etapa>=minimo;
}
function mcAlternarSecoes(){
  mcMostrarTudo=!mcMostrarTudo;
  if(mcClienteId)abrirCardCliente(mcClienteId);
}
function ligarArrastoDoQuadro(){
  const kb=$('kb');
  if(!kb)return;
  let ativo=false,puxando=false,x0=0,scroll0=0;
  kb.addEventListener('mousedown',e=>{
    if(e.button!==0)return;
    if(e.target.closest('.kc'))return;
    if(e.target.closest('input,textarea,select,button,a,label'))return;
    ativo=true;puxando=false;x0=e.clientX;scroll0=kb.scrollLeft;
  });
  window.addEventListener('mousemove',e=>{
    if(!ativo)return;
    const d=e.clientX-x0;
    if(!puxando){
      if(Math.abs(d)<5)return;
      puxando=true;kb.classList.add('arrastando');
    }
    kb.scrollLeft=scroll0-d;
    e.preventDefault();
  });
  window.addEventListener('mouseup',()=>{
    if(puxando)kb.classList.remove('arrastando');
    ativo=false;puxando=false;
  });
  // Sair da janela no meio do arrasto deixava o quadro presente no
  // estado "arrastando" ate o proximo clique.
  window.addEventListener('mouseleave',()=>{
    if(puxando)kb.classList.remove('arrastando');
    ativo=false;puxando=false;
  });
}
function cardDepoisDe(cont,y){
  const cards=[...cont.querySelectorAll('.kc:not(.dragging)')];
  return cards.reduce((mais,card)=>{
    const box=card.getBoundingClientRect();
    const off=y-box.top-box.height/2;
    if(off<0&&off>mais.off)return{off:off,el:card};
    return mais;
  },{off:Number.NEGATIVE_INFINITY,el:null}).el;
}
async function salvarOrdemLista(listaId,body){
  const ids=[...body.querySelectorAll('.kc')].map(c=>c.getAttribute('data-card'));
  const res=await Promise.all(ids.map((id,i)=>sb.from('crm_clientes').update({lista_id:listaId,posicao:i,atualizado_em:new Date().toISOString()}).eq('id',id)));
  if(res.find(r=>r.error)){toast('Não foi possível mover','er');route();return;}
  toast('Cliente movido','ok');atualizarContadores();
}
async function registrarMovimentoLista(clienteId,origListaId,destListaId){
  const[{data:lo},{data:ld}]=await Promise.all([
    sb.from('crm_listas').select('nome').eq('id',origListaId).single(),
    sb.from('crm_listas').select('nome').eq('id',destListaId).single()
  ]);
  registrarAtividade(clienteId,`moveu o cartão de "${lo?lo.nome:'?'}" para "${ld?ld.nome:'?'}"`,undefined,
    {tipo:'movimento',lista_origem:lo?lo.nome:null,lista_destino:ld?ld.nome:null});
  /* TODO MOVIMENTO PASSA POR AQUI — arrastar, o balão Mover, o Salvar do
     cartão e as setas do quadro. Por isso o motivo do descarte mora
     nesta função e não em cada botão: um caminho novo de mover cartão
     nasce já registrando o motivo, sem ninguém lembrar de plugar. */
  const entrou = ld && ld.nome==='Descartado';
  const saiu   = lo && lo.nome==='Descartado' && !entrou;
  /* CONTRATO CANCELADO TEM A MESMA MECANICA DO DESCARTE, E DE PROPOSITO.
     Contrato que morre depois de assinado NAO e descarte de lead: ela
     passou pela triagem, assinou e custou trabalho. Misturar os dois em
     `descartado_em` poluiria o painel do trafego, que existe para julgar
     anuncio — um contrato cancelado entrando ali faria o custo por lead
     descartada mentir. Por isso data e motivo proprios. */
  const entrouCanc = ld && ld.nome==='Contrato Cancelado';
  const saiuCanc   = lo && lo.nome==='Contrato Cancelado' && !entrouCanc;
  if(entrouCanc){
    await sb.from('crm_clientes').update({cancelado_em:new Date().toISOString()}).eq('id',clienteId);
    if(!mcClienteId||mcClienteId!==clienteId) toast('Contrato cancelado. Abra o cartão para registrar o motivo','ok');
  }else if(saiuCanc){
    /* Voltou atras: o cancelamento nao aconteceu. Deixar a data ali
       faria o contrato contar como cancelado para sempre no relatorio,
       mesmo depois de virar processo. Mesma regra do descarte. */
    await sb.from('crm_clientes').update({cancelado_em:null,cancelamento_motivo:null}).eq('id',clienteId);
  }
  if(entrou){
    await sb.from('crm_clientes').update({descartado_em:new Date().toISOString()}).eq('id',clienteId);
    /* Arrastado no quadro, com o cartao fechado: nao ha onde mostrar o
       campo, e abrir um balao por cima do quadro atrapalha quem esta
       arrastando varios. Um aviso resolve — o campo espera dentro do
       cartao. Movido de dentro do cartao, o campo ja estava a vista e
       o motivo foi junto no mesmo Salvar. */
    if(!mcClienteId||mcClienteId!==clienteId) toast('Descartada. Abra o cartão para registrar o motivo','ok');
  }else if(saiu){
    /* Saiu de Descartado = foi requalificada. O motivo antigo tem que
       ir junto: deixá-lo ali faz ela continuar contando como descarte
       por "filho com 5 anos" no painel do tráfego para sempre, mesmo
       depois de virar contrato. */
    await sb.from('crm_clientes').update({motivo_descarte:null,descartado_em:null}).eq('id',clienteId);
  }
}

async function modalMover(clienteId){
  abrirModal('<div class="mbt">Mover cartão</div><div class="mbs">Carregando...</div>');
  const{data:c}=await sb.from('crm_clientes').select('id,nome_completo,quadro,lista_id,posicao').eq('id',clienteId).single();

function posicionarFlutuante(el,botao,largura){
  if(!botao)return;
  const r=botao.getBoundingClientRect();
  let left=r.left;
  if(left+largura>window.innerWidth-12)left=window.innerWidth-largura-12;
  if(left<12)left=12;
  let top=r.bottom+6;
  const maxTop=window.innerHeight-40;
  if(top>maxTop)top=maxTop;
  el.style.left=left+'px';
  el.style.top=top+'px';
}

async function mvpConfirmar(listaIdArg,posArg){
  const id=mcClienteId;
  const quadro=$('mvp-quadro').value;
  const listaId=listaIdArg||$('mvp-lista').value;
  const pos=listaIdArg!==undefined&&posArg!==undefined?posArg:(parseInt($('mvp-pos').value,10)||0);
  if(!listaId){toast('Escolha uma lista','er');return;}

  // O LINK DIGITADO E NAO SALVO.
  //
  // Este balao move o card e depois chama abrirCardCliente(), que
  // recarrega tudo do banco. Ate 15/08/2026 isso jogava fora o que
  // estivesse digitado no cartao sem ter passado pelo Salvar — e o
  // campo mais caro de perder e o link do contrato: o card chegava em
  // "Contrato enviado" sem link, o motor ficava esperando quieto e a
  // cliente nao recebia nada. Aconteceu de verdade.
  //
  // Agora o link vai junto no mesmo update do movimento.
  const campoLink=$('mc-link-contrato');
  const linkDigitado=campoLink?campoLink.value.trim():'';

  if(listaId===LISTA_CONTRATO_ENVIADO&&!linkDigitado){
    if(!confirm('Este card esta indo para "Contrato enviado" sem o link do contrato.\n\nA Samara nao vai mandar nada ate o link ser preenchido — o card fica parado.\n\nMover assim mesmo?'))return;
  }

  const{data:atualCli}=await sb.from('crm_clientes').select('lista_id,quadro').eq('id',id).single();
  const origListaId=atualCli?atualCli.lista_id:null;
  const{data:naLista}=await sb.from('crm_clientes').select('id,posicao').eq('lista_id',listaId).neq('id',id).order('posicao');
  const ord=(naLista||[]).map(x=>x.id);
  ord.splice(pos,0,id);
  const res=await Promise.all(ord.map((cid,i)=>{
    const p={lista_id:listaId,posicao:i,atualizado_em:new Date().toISOString()};
    if(cid===id){
      p.quadro=quadro;
      // So grava quando ha algo digitado. Campo vazio nao apaga o link
      // que ja estiver salvo no banco — para apagar de proposito, use o
      // botao Salvar do cartao.
      if(linkDigitado)p.link_contrato=linkDigitado;
    }
    return sb.from('crm_clientes').update(p).eq('id',cid);
  }));
  if(res.find(r=>r.error)){toast('Não foi possível mover','er');return;}
  toast('Cartão movido','ok');
  if(origListaId&&origListaId!==listaId)await registrarMovimentoLista(id,origListaId,listaId);
  finCarregado=false;
  fecharMoverPopover();
  abrirCardCliente(id);
}

/* O que a Samara apurou na triagem mora em crm_clientes.samara_dados,
   um JSON. Ate aqui isso so aparecia na Fila de Automacoes — o card, que
   e onde voce olha para decidir, nao mostrava nada. O efeito era achar
   que a DPP nao tinha sido coletada quando ela estava gravada o tempo
   todo.

   A ordem dos campos e a ordem das perguntas da triagem, entao da para
   ler de cima para baixo e ver onde a conversa parou. */
const TRIAGEM_ROTULOS=[
  ['contribuiu','Contribuiu ao INSS'],
  ['gravida','Grávida'],
  ['dn','Nascimento do bebê'],
  ['dpp','DPP (prevista)'],
  ['ds','Saída do emprego'],
  ['ds_registrada','Era registrado'],
  ['seguro_desemprego','Seguro-desemprego'],
  ['desemprego_involuntario','Emprega Brasil / SINE'],
  ['data_desemprego_involuntario','Cadastro em'],
  ['empregada_no_parto','Empregada no parto'],
  ['licenca_empregador','Licença pelo empregador'],
  ['pedido_negado','Pedido já negado'],
  ['adocao','Adoção']
];
function mcTriagemHtml(dados,chave){
  const d=dados||{};
  /* Chave propria por lugar: o mesmo bloco aparece no cartao e no painel
     da Caixa de Entrada, e os dois ficam no DOM ao mesmo tempo quando o
     cartao abre por cima da conversa. Ids iguais fariam um clique fechar
     o bloco errado. */
  const ch=chave||'triagem';
  // Credencial nunca aparece aqui. O motor já barra na entrada, mas
  // card antigo pode ter senha gravada de antes da trava — e este painel
  // fica aberto para quem passar pela tela.
  const PROIBIDAS=['senha','senha_inss','senha_gov','password'];
  const conhecidas=TRIAGEM_ROTULOS.filter(([k])=>{
    if(PROIBIDAS.includes(k))return false;
    const v=d[k];return v!==null&&v!==undefined&&String(v).trim()!=='';
  });
  // Chave que a Samara gravou e nao esta na lista acima: mostra assim
  // mesmo, com o nome cru. Melhor feio que escondido.
  const sobrando=Object.keys(d).filter(k=>!PROIBIDAS.includes(String(k).toLowerCase())&&!TRIAGEM_ROTULOS.some(([r])=>r===k)&&String(d[k]??'').trim()!=='');
  if(!conhecidas.length&&!sobrando.length){
    return mcSecao(ch,'🔎 Triagem',
      `<div class="fhint">A Samara ainda não coletou nada desta cliente.</div>`,
      {estilo:'background:var(--bg2,#f6f7f8);border:1.5px dashed var(--border)'});
  }
  const linha=(rot,val)=>`<div style="display:flex;justify-content:space-between;gap:10px;padding:3px 0;font-size:13px">
      <span style="color:var(--text3)">${esc(rot)}</span><b>${esc(String(val))}</b></div>`;
  return mcSecao(ch,'🔎 Triagem — o que a Samara coletou',`
    ${conhecidas.map(([k,rot])=>linha(rot,d[k])).join('')}
    ${sobrando.map(k=>linha(k,d[k])).join('')}
    <div class="fhint" style="margin-top:7px">Coletado na conversa. Para corrigir, fale com a cliente ou ajuste em <code>samara_dados</code>.</div>`);
}
/* De qual anuncio esta mae veio.
   Bloco SO DE LEITURA, e de proposito: o dado e carimbado pelo webhook
   a partir do que o Meta manda na PRIMEIRA mensagem e nao existe mais
   depois dela. Campo editavel aqui viraria numero digitado a mao
   entrando no relatorio de trafego como se fosse medicao.

   Card que nao veio de anuncio devolve string vazia e o bloco nem
   aparece — sao 37 mil, e a maioria esmagadora nao tem anuncio. */
function blocoAnuncioHtml(c){
  if(!c||!c.anuncio_id) return '';
  const linha=(rot,val)=>`<div style="display:flex;justify-content:space-between;gap:10px;padding:3px 0;font-size:13px">
      <span style="color:var(--text3)">${esc(rot)}</span><b>${esc(String(val))}</b></div>`;
  const app=c.anuncio_app?(c.anuncio_app==='instagram'?'Instagram':(c.anuncio_app==='facebook'?'Facebook':c.anuncio_app)):'—';
  let quando='—', janela='';
  if(c.anuncio_em){
    const d=new Date(c.anuncio_em);
    quando=d.toLocaleString('pt-BR',{timeZone:'America/Sao_Paulo',day:'2-digit',month:'2-digit',year:'numeric',hour:'2-digit',minute:'2-digit'});
    /* A janela de atribuicao do Meta e de 7 dias contados do CLIQUE.
       Depois disso o evento de conversao e descartado sem aviso: nao
       adianta mover o card correndo, o credito daquele anuncio ja
       passou. Mostrar aqui evita a pergunta "por que nao contou". */
    const faltam=Math.ceil((d.getTime()+7*86400000-Date.now())/86400000);
    janela = faltam>0
      ? `<div class="fhint" style="margin-top:7px">Atribuição no Meta vale por mais ${faltam} dia${faltam===1?'':'s'}.</div>`
      : `<div class="fhint" style="margin-top:7px">Passou dos 7 dias do clique: mudança de etapa daqui em diante não conta mais para o anúncio.</div>`;
  }
  return mcSecao('anuncio','📣 Veio de anúncio',`
    ${linha('Anúncio (ID)',c.anuncio_id)}
    ${linha('Plataforma',app)}
    ${c.anuncio_codigo?linha('Código no texto',c.anuncio_codigo):''}
    ${linha('Clicou em',quando)}
    ${janela}
    <div class="fhint" style="margin-top:5px">Preenchido sozinho na primeira mensagem. O nome do criativo está no painel de tráfego.</div>`);
}
/* SECOES QUE FECHAM — 04/09/2026.

   O cartao empilha ate seis blocos coloridos (Triagem, Acesso INSS,
   Contrato, Contribuicao, Pagamentos, Veio de anuncio) e em card
   antigo isso vira rolagem longa para chegar num campo de duas linhas.
   Cada bloco agora fecha no clique do titulo.

   FECHA COM display:none, NAO tira do DOM. Salvar e "Marcar como
   conferido" leem os INPUTS da tela: bloco removido do DOM viraria
   campo inexistente, e campo inexistente e exatamente a armadilha do
   CPF da Denise (03/09) — o aviso cobrava um campo que a tela nao
   tinha e o UPDATE gravava undefined. Escondido continua sendo lido.

   O ESTADO E POR CARTAO e mora no navegador. E preferencia de tela, nao
   dado do negocio: nao vale uma coluna no banco nem um UPDATE por
   clique. A contrapartida esta assumida — o que for fechado no
   computador nao chega fechado no celular. */
let mcSecCliente=null, mcSecEstado={};
function mcSecCarregar(id){
  mcSecCliente=id; mcSecEstado={};
  try{ mcSecEstado=JSON.parse(localStorage.getItem('mcsec:'+id)||'{}')||{}; }catch(e){ mcSecEstado={}; }
}
function mcSecFechada(chave){ return mcSecEstado[chave]===1; }
function mcSecTogglar(chave){
  const corpo=$('mcsec-corpo-'+chave), seta=$('mcsec-seta-'+chave);
  if(!corpo) return;
  const fechando = corpo.style.display!=='none';
  corpo.style.display = fechando?'none':'';
  if(seta) seta.textContent = fechando?'\u25b8':'\u25be';
  /* So grava o que foge do padrao: aberto e o normal, entao a chave sai
     do objeto ao reabrir. Assim o localStorage nao vira lista de 37 mil
     cartoes dizendo "esta como sempre esteve". */
  if(fechando) mcSecEstado[chave]=1; else delete mcSecEstado[chave];
  try{ if(mcSecCliente) localStorage.setItem('mcsec:'+mcSecCliente, JSON.stringify(mcSecEstado)); }catch(e){}
}
/* Casca unica dos blocos coloridos. Existia copiada seis vezes, com a
   mesma borda e o mesmo padding em cada uma — trocar a seta em seis
   lugares e como as seis versoes divergem. */
function mcSecao(chave,titulo,corpo,opts){
  const o=opts||{};
  const fech=mcSecFechada(chave);
  const estilo=o.estilo||'background:var(--bg2,#f6f7f8);border:1.5px solid var(--border)';

     fechada e aviso que nao existe: o card da Leonara ja mostrou o que
     custa o contrato nao ser gerado em silencio. */
  const alerta=o.alerta?`<span title="${escA(o.alerta)}" style="font-size:12px">\u26a0</span>`:'';
  return `<div class="mcsens" style="${estilo};border-radius:12px;padding:13px 14px;margin-bottom:13px">
    <div style="display:flex;align-items:center;justify-content:space-between;gap:8px">
      <button type="button" onclick="mcSecTogglar('${chave}')" title="Fechar ou abrir este bloco"
        style="display:flex;align-items:center;gap:6px;flex:1;background:none;border:none;padding:0;margin:0;cursor:pointer;text-align:left;font-size:12px;font-weight:700;color:var(--text2);font-family:inherit">
        <span id="mcsec-seta-${chave}" style="font-size:10px;color:var(--text3)">${fech?'\u25b8':'\u25be'}</span>
        <span>${titulo}</span>${alerta}
      </button>
      ${o.acoes||''}
    </div>
    <div id="mcsec-corpo-${chave}" style="margin-top:10px${fech?';display:none':''}">${corpo}</div>
  </div>`;
}

     conferido campo a campo: basta um preenchido para o bloco inteiro
     ficar visivel, porque esconder dado gravado e pior que mostrar
     campo vazio. */
  const etapa=etapaDaLista(listaAtual?listaAtual.nome:'');
  /* contrato_dados_lidos entra aqui porque 78% dos documentos chegam
     ANTES de alguem pedir (medido em 31/08). Sem isso a proposta da
     leitura ficaria escondida justamente em quem mandou cedo. */
  const temContrato=!!(c.link_contrato||c.referencia1_nome||c.referencia1_telefone||c.referencia2_nome||c.referencia2_telefone||c.contrato_dados_lidos||c.endereco_completo);

     O campo CPF mora no Acesso INSS, que so abre na etapa 2 (contrato
     enviado adiante) ou quando ja tem CPF/senha gravados. Mas quem gera
     contrato e a etapa 1, Montar Contrato — e o motor exige CPF para
     gerar. Ou seja: o card em que faltava o CPF era exatamente o card
     em que o campo estava escondido, e a unica forma de preencher era
     descobrir o botao "mostrar tudo". Foi o caso da Leonara.

     A regra continua sendo por etapa; o que entra aqui e uma excecao
     nomeada: conferencia marcada e um pedido explicito de gerar
     contrato, e a partir dai todo campo que o gerador exige tem que
     estar a mao. */

     A excecao acima abria o bloco para quem ja tinha CPF, senha ou
     carimbo. Faltava o caso do meio: leitor achou o CPF, cadastro
     ainda nao tem. Como o input mc-cpf so existia com o bloco aberto,
     o botao "usar" respondia "campo nao esta visivel nesta etapa", o
     "Marcar como conferido" contava o CPF como faltando e o UPDATE

/* FOTO DOS CAMPOS.
   Navegar entre cartoes com as setas troca o conteudo do modal inteiro.
   Sem isso, quem digitou o link do contrato e apertou a seta perde o que
   digitou sem nem ver — foi exatamente o que ja aconteceu com o balao de
   mover. A foto e tirada quando o cartao abre e refeita a cada Salvar;
   se ela mudou, a saida pergunta antes. */
let mcSnapshot='';
function mcFotoCampos(){
  const box=$('modalbox');
  if(!box)return'';
  return [...box.querySelectorAll('.mcinner input,.mcinner select,.mcinner textarea')]
    .filter(el=>el.id&&el.type!=='file')
    .map(el=>el.id+'='+(el.type==='checkbox'?el.checked:el.value)).join('|');
}
function mcTemAlteracaoNaoSalva(){
  return !!mcSnapshot&&mcFotoCampos()!==mcSnapshot;
}
/* SETAS ← → ANDAM ENTRE OS CARTOES.
   A ordem e a do quadro que ficou atras do modal, lida do proprio DOM —
   nao ha copia em memoria que possa divergir do que esta na tela, e o
   limite de 1.000 linhas do PostgREST nao entra na conta porque nada
   aqui vai ao banco buscar lista. Fora do quadro (Financeiro, Caixa de
   Entrada) nao ha cartoes na tela e a seta simplesmente avisa. */
function mcIrmaosNaTela(){
  return [...document.querySelectorAll('.kc[data-card]')].map(el=>el.getAttribute('data-card'));
}
function mcNavegar(passo){
  if(!mcClienteId)return;
  const ids=mcIrmaosNaTela();
  const i=ids.indexOf(mcClienteId);

/* O base64 da midia chega dentro de crm_mensagens.texto e destroi a
   leitura da conversa: um audio de 10 segundos vira uma parede de 40 mil
   caracteres e empurra o resto do papo para fora da tela.

   Aqui so escondemos. A correcao de origem (nao gravar o base64 no
   texto) e outra briga — esta funcao continua valendo depois dela,
   porque as 31 mensagens que ja estao no banco nao se consertam
   sozinhas.

   Como reconhecer: base64 nao tem espaco e so usa o alfabeto dele.
   Qualquer frase de gente tem espaco nos primeiros caracteres, e URL
   tem dois-pontos — que nao esta no alfabeto. */
function pareceBase64(t){
  const s=String(t||'').trim();
  if(s.length<200)return false;
  /* O WhatsGW manda o base64 quebrado em linhas. A versao antiga
     desistia no primeiro \n e por isso o audio passava batido e a
     parede de caracteres ia para a tela. Agora o espaco e ignorado —
     mas so ate um limite, senao frase longa de gente vira "midia":
     texto em portugues tem cerca de 16% de espaco, base64 quebrado
     em linhas tem perto de 1%. */
  const semEspaco=s.replace(/\s+/g,'');
  if((s.length-semEspaco.length)/s.length>0.03)return false;
  return /^[A-Za-z0-9+/=_-]+$/.test(semEspaco.slice(0,400));
}
function rotuloMidia(m){
  const ic={imagem:'🖼',audio:'🎤',video:'🎬',documento:'📄',figurinha:'🩹',localizacao:'📍',reacao:'❤',chamada:'📞',desconhecido:'📎'};
  const nome={imagem:'imagem',audio:'áudio',video:'vídeo',documento:'documento',figurinha:'figurinha',localizacao:'localização',reacao:'reação',chamada:'chamada',desconhecido:'arquivo'};
  const t=m&&m.tipo&&m.tipo!=='texto'?m.tipo:null;
  if(t)return (ic[t]||'📎')+' '+(m.midia_nome||nome[t]||t);
  return '📎 mídia';
}
/* TROCA O LUGAR VAZIO PELO ARQUIVO, depois que o feed ja foi pintado.
   Roda uma vez por bolha (data-pronto), entao repintar a conversa no
   poll nao refaz assinatura do que ja esta na tela.
   O link assinado vale 300s: tempo de olhar, e curto o bastante para
   nao virar url publica se alguem copiar.
   SOBRE EGRESS: imagem carrega sozinha ao abrir a conversa, e isso e
   egress de storage. E aceitavel porque e humano abrindo UMA conversa
   de 40 mensagens — diferente da consulta do motor que rodava 780x por
   dia sozinha (item 251). Mesmo assim: loading=lazy so busca o que
   esta visivel, e audio e video vao com preload=none, ou seja nao
   baixam nada ate alguem apertar o play. */
/* O CHAT ABRE NO FIM E FICA LA — 04/09/2026.

   Ja havia um feed.scrollTop=feed.scrollHeight depois do innerHTML, e
   ele funcionava: o problema e o que acontece DEPOIS. A midia entra por
   createSignedUrl, que e assincrono — quando a primeira imagem aparece,
   o feed cresce por baixo do scroll que ja tinha sido posto no fim, e a
   conversa fica exibindo o comeco. Quanto mais anexo, mais alto para.

   Entao nao basta rolar uma vez: fica colado enquanto a midia entra, e
   solta no instante em que voce rola para cima para ler algo antigo —
   caso contrario a proxima imagem carregada arrancaria a tela da sua
   mao. Os 80px de folga sao para o "estou no fim" sobreviver ao
   arredondamento de zoom do navegador. */
/* QUEM ROLA NEM SEMPRE E O FEED — 04/09/2026, correcao da primeira
   tentativa.

   No cartao o .chatfeed rola sozinho (max-height:420px). Na Caixa de
   Entrada o CSS faz .inb-chat-body .chatfeed{max-height:none} e quem
   rola e o PAI. Mandar scrollTop para o feed la nao move nada: ele nao
   tem para onde rolar. Por isso o cartao obedecia e a Caixa de Entrada
   continuava abrindo no comeco.

   Entao a caixa e procurada, e nao presumida: sobe do feed ate achar
   quem tem overflow auto/scroll E de fato transborda. Procura de novo a
   cada chamada porque a altura muda quando a midia entra — o que nao
   transbordava no primeiro milissegundo transborda depois. */
function chatCaixaQueRola(feed){
  let n=feed;
  while(n&&n!==document.body){
    const o=getComputedStyle(n).overflowY;
    if((o==='auto'||o==='scroll')&&n.scrollHeight>n.clientHeight+2)return n;
    n=n.parentElement;
  }
  return feed;
}
function chatGrudarNoFim(feed){
  if(!feed)return;
  const fim=()=>{const cx=chatCaixaQueRola(feed);cx.scrollTop=cx.scrollHeight;};
  fim();
  const cx=chatCaixaQueRola(feed);
  /* Ouvintes uma vez so por elemento: a Caixa de Entrada recarrega o
     feed a cada 15s, e sem a trava seria mais um ouvinte por rodada.
     A marca fica na CAIXA, que e quem recebe o scroll. */
  if(!cx.dataset.gruda){
    cx.dataset.gruda='1';
    cx.addEventListener('scroll',()=>{
      const noFim=cx.scrollHeight-cx.scrollTop-cx.clientHeight<80;
      cx.dataset.solto=noFim?'':'1';
    });
    /* load NAO borbulha: capturar na descida e o unico jeito de saber
       que uma <img> la dentro terminou. */
    cx.addEventListener('load',()=>{if(!cx.dataset.solto)fim();},true);
  }
  cx.dataset.solto='';
  /* Reforcos para o intervalo entre o innerHTML e o primeiro load:
     fonte, audio sem preload e imagem que veio do cache nao disparam
     load a tempo. */
  [60,300,1000].forEach(ms=>setTimeout(()=>{
    const c2=chatCaixaQueRola(feed);
    if(!c2.dataset.solto)c2.scrollTop=c2.scrollHeight;
  },ms));
}
async function chatCarregarMidias(feed){
  if(!feed)return;
  const alvos=Array.from(feed.querySelectorAll('[data-midia]')).filter(el=>!el.dataset.pronto);
  for(const el of alvos){
    el.dataset.pronto='1';
    const caminho=el.dataset.midia;
    const mime=el.dataset.mime||'';
    const nome=el.dataset.nome||'arquivo';
    try{
      const{data,error}=await sb.storage.from(ANEXO_BUCKET).createSignedUrl(caminho,300);
      if(error||!data||!data.signedUrl)continue;
      const u=escA(data.signedUrl);
      if(mime.indexOf('image/')===0)el.innerHTML=`<img src="${u}" alt="${escA(nome)}" loading="lazy" onclick="window.open(this.src,'_blank')">`;
      else if(mime.indexOf('audio/')===0)el.innerHTML=`<audio controls preload="none" src="${u}"></audio>`;
      else if(mime.indexOf('video/')===0)el.innerHTML=`<video controls preload="none" src="${u}"></video>`;
      else el.innerHTML=`<a href="${u}" target="_blank" rel="noopener">📄 ${esc(nome)}</a>`;
    }catch(e){/* arquivo sumido do bucket nao pode derrubar a conversa */}
  }
}
function chatCorpoMsg(m){
  const ehMidia=m.tipo&&m.tipo!=='texto';
  /* MIDIA — 25/08, item 115.
     A partir do webhook v11 o arquivo vai para o bucket crm-anexos e a
     linha guarda midia_caminho; o texto passou a ser a LEGENDA, que
     antes era descartada. Aqui sai um lugar vazio com o caminho no
     data-midia, e o chatCarregarMidias() troca pelo arquivo depois que
     o feed ja esta na tela — createSignedUrl e assincrono e este render
     e sincrono.
     Linha ANTIGA (anterior ao v11) nao tem midia_caminho: continua
     saindo so o rotulo, e o texto dela ainda e base64, por isso o
     pareceBase64 guarda a legenda. Some quando o backfill rodar. */
  /* REACAO E CHAMADA — 27/08. Nenhuma das duas tem arquivo, entao nao
     podem cair no caminho de midia (que desenha um lugar vazio esperando
     o bucket devolver algo que nao existe). Ate a v13 do webhook as duas
     chegavam aqui com tipo 'documento' e a bolha dizia "📄 documento" —
     era esse mesmo apelido errado que fazia a Samara agradecer arquivo
     que ninguem mandou. */
  if(m.tipo==='reacao')return `<span class="chatb-mid">reagiu com ${esc(m.texto||'❤️')}</span>`;
  if(m.tipo==='chamada')return '<span class="chatb-mid">📞 tentou ligar</span>';
  if(ehMidia){
    const rot=`<span class="chatb-mid">${esc(rotuloMidia(m))}</span>`;
    const leg=(m.texto&&!pareceBase64(m.texto))?`<div class="chatb-leg">${esc(m.texto).replace(/\n/g,'<br>')}</div>`:'';
    if(!m.midia_caminho)return rot+leg;
    return `<div class="chatb-arq" data-midia="${escA(m.midia_caminho)}" data-mime="${escA(m.midia_mime||'')}" data-nome="${escA(m.midia_nome||'')}">${rot}</div>${leg}`;
  }
  const cru=m.texto||'';
  if(!cru)return '<span style="opacity:.6">(mensagem sem texto)</span>';
  /* Sobra o caso do tipo vir como "texto" mas o conteudo ser base64 —
     acontece quando o WhatsGW nao classifica a midia. */
  if(pareceBase64(cru))return `<span class="chatb-mid">${esc(rotuloMidia(m))}</span>`;
  return esc(cru).replace(/\n/g,'<br>');
}
function chatJanelaHtml(msgs,canal){
  if(canal!=='meta_oficial')return'';
  const ultima=[...msgs].reverse().find(m=>m.direcao==='entrada');
  if(!ultima)return'<div class="chatjanela off">⛔ Janela de 24h fechada — nenhuma mensagem recebida da cliente. No canal oficial só dá pra iniciar com um template aprovado pela Meta.</div>';
  const passou=(Date.now()-new Date(ultima.enviada_em||ultima.criado_em).getTime())/3600000;
  const resta=24-passou;
  if(resta<=0)return'<div class="chatjanela off">⛔ Janela de 24h fechada — a última mensagem da cliente foi há '+Math.floor(passou)+'h. Só dá pra retomar com um template aprovado pela Meta.</div>';
  if(resta<=4)return'<div class="chatjanela warn">⚠ Janela de 24h fechando — faltam '+(resta<1?Math.round(resta*60)+' min':Math.floor(resta)+'h')+' para responder livremente.</div>';
  return'<div class="chatjanela ok">✔ Janela de 24h aberta — faltam '+Math.floor(resta)+'h para responder livremente.</div>';
}
/* COLUNAS DO CHAT — tudo menos 'bruto'.
   'bruto' e o payload cru que o WhatsApp mandou, guardado so para
   diagnostico. Nunca aparece na tela, mas viajava junto em todo
   carregamento e responde por metade do peso da tabela.

   E o limite caiu de 300 para 40 mensagens, lidas da mais nova para a
   mais velha (antes vinha ascending, o que num limite baixo devolveria
   as 40 MAIS ANTIGAS e a conversa apareceria congelada no passado).
   A ordem e invertida no JS, entao a tela continua igual: mais antiga
   em cima, mais nova embaixo. Historico completo, quando precisar, e no
   proprio WhatsApp do celular. */
const COLS_CHAT='id,cliente_id,telefone_chave,telefone_bruto,canal,instancia_numero,direcao,autor_tipo,usuario_id,tipo,texto,midia_caminho,midia_nome,midia_mime,midia_tamanho,id_externo,status,enviada_em,criado_em';
async function carregarChat(clienteId,silencioso){
  const feed=$('mc-chat-feed');
  if(!feed||!clienteId)return;
  const{data,error}=await sb.from('crm_mensagens').select(COLS_CHAT).eq('cliente_id',clienteId).order('criado_em',{ascending:false}).limit(40);
  if(error){if(!silencioso)feed.innerHTML='<div class="fhint" style="text-align:center;padding:14px 0">Erro ao carregar a conversa: '+esc(error.message)+'</div>';return;}
  const msgs=(data||[]).slice().reverse();
  const assinatura=msgs.length+'|'+(msgs.length?(msgs[msgs.length-1].id||''):'');
  const jan=$('mc-chat-janela');
  if(jan)jan.innerHTML=chatJanelaHtml(msgs,mcChatCanal);
  const av=$('mc-chat-aviso');
  /* O motor so entrega pelo WhatsGW. Dizer isso aqui evita a pergunta
     "mandei e nao chegou": nos outros canais a linha fica na conversa e
     e marcada como nao enviada. */
  if(av)av.innerHTML=!mcChatCanal?'Defina o <b>Canal WhatsApp</b> desta cliente na coluna ao lado para o chat saber por onde a conversa acontece.':(mcChatCanal==='whatsgw'?'A mensagem entra na fila e o motor entrega em até 1 minuto.':'Esta cliente está no canal <b>'+esc(CANAIS_ENVIO[mcChatCanal]||mcChatCanal)+'</b>. O envio automático hoje só funciona pelo WhatsGW — aqui a mensagem fica registrada, mas não sai.');
  if(silencioso&&assinatura===mcChatAssinatura)return;
  mcChatAssinatura=assinatura;
  if(!msgs.length){feed.innerHTML='<div class="fhint" style="text-align:center;padding:20px 0">Nenhuma mensagem ainda.<br>A conversa aparece aqui a partir do dia em que o webhook estiver ligado.</div>';return;}
  let html='',diaAnt='';
  msgs.forEach(m=>{
    const dia=chatDiaMsg(m);
    if(dia!==diaAnt){html+=`<div class="chatdia">${esc(dia)}</div>`;diaAnt=dia;}
    const cls=m.direcao==='entrada'?'chatb-in':(m.autor_tipo==='bot'?'chatb-bot':'chatb-out');
    const autor=m.direcao==='entrada'?'':(m.autor_tipo==='bot'?'Samara · ':(nomeUsuario(m.usuario_id)?nomeUsuario(m.usuario_id)+' · ':''));
    /* Situacao do envio. O motor troca o status desta linha: pendente_envio
       -> enviando -> enviado, ou erro_envio quando desistiu. O motivo da
       falha fica em bruto.envio.erro e aparece ao passar o mouse. */
    const pend=m.status==='pendente_envio'?' · ⏳ na fila':(m.status==='enviando'?' · ⏳ enviando':(m.status==='erro_envio'?' · ⚠ não saiu':''));
    const motivo=(m.status==='erro_envio'&&m.bruto&&m.bruto.envio&&m.bruto.envio.erro)?` title="${escA(m.bruto.envio.erro)}"`:'';
    html+=`<div class="chatb ${cls}"${motivo}>${chatCorpoMsg(m)}<span class="chatb-meta">${esc(autor)}${chatHoraMsg(m)}${pend}</span></div>`;
  });
  feed.innerHTML=html;
  chatCarregarMidias(feed);
  chatGrudarNoFim(feed);
}
/* ENTER MANDA, SHIFT+ENTER PULA LINHA.
   Vale para os dois chats (cartao e Caixa de Entrada), que sao conversa
   de WhatsApp: ninguem escreve paragrafo ali, e o caminho ate o botao
   Enviar era o passo mais repetido do dia.
   isComposing e o teclado de acento ainda montando a letra (ã, ç): se
   o Enter for capturado no meio, a palavra sai quebrada. */
function chatEnviarComEnter(e){
  if(e.key!=='Enter'||e.shiftKey||e.ctrlKey||e.metaKey||e.altKey)return false;
  if(e.isComposing||e.keyCode===229)return false;
  e.preventDefault();
  return true;
}
/* ENVIO IMEDIATO — pede ao motor que entregue ESTA linha agora, em vez
   de ela esperar a rodada do minuto seguinte.
   Na chamada vai so o id: nem texto, nem telefone, nem destino. Quem
   criou a linha foi o insert daqui, com a RLS de sempre — a rota do
   motor nao cria nada, so antecipa o que ja sairia sozinho.
   Falha nao vira erro na tela. Se a function estiver fora, a rede cair
   ou a sessao tiver vencido, a linha continua "pendente_envio" e sai na
   rodada seguinte, como sempre saiu: o aviso volta a ser o de fila. */
/* ENTREGA AVULSA DE UMA VENCIDA — irma da funcao acima, para a aba
   Vencidas. Na chamada vai so o id da linha em crm_automacoes: nem
   texto, nem telefone, nem destino.
   O timeout e maior porque aqui a resposta so volta depois de o
   WhatsGW aceitar a mensagem. Se estourar do lado de ca e a entrega
   tiver completado do lado de la, clicar de novo nao duplica: a rota
   reserva a linha trocando o status, e o segundo clique encontra ela
   fora de "vencida" e devolve nao_vencida. */
async function enviarVencidaPeloMotor(idAutomacao){
  const corta=new AbortController();
  const t=setTimeout(()=>corta.abort(),25000);
  try{
    const{data:sess}=await sb.auth.getSession();
    const tk=(sess&&sess.session)?sess.session.access_token:SUPABASE_ANON_KEY;
    const r=await fetch(SUPABASE_URL+'/functions/v1/motor?enviar_automacao='+encodeURIComponent(idAutomacao),{
      method:'POST',
      headers:{apikey:SUPABASE_ANON_KEY,Authorization:'Bearer '+tk},
      signal:corta.signal
    });
    if(!r.ok)return{ok:false,motivo:'o motor respondeu '+r.status};
    return await r.json();
  }catch(e){
    return{ok:false,motivo:'não foi possível falar com o motor'};
  }finally{
    clearTimeout(t);
  }
}

async function enviarMensagemChat(clienteId){

  const btn=$('mc-chat-btn');
  if(btn){btn.disabled=true;btn.textContent='Registrando...';}
  /* telefone_chave e id_externo sao exigidos pelo CHECK
     crm_mensagens_conteudo_minimo. Faltavam os dois — era por isso que
     este botao nunca gravou nada. enviada_em fica vazio de proposito:
     quem preenche e o motor, quando o envio sai de fato. */
  if(!mcChatChave){toast('Esta cliente nao tem telefone valido cadastrado','er');if(btn){btn.disabled=false;btn.textContent='Enviar';}return;}
  const{data:nova,error}=await sb.from('crm_mensagens').insert({
    cliente_id:clienteId,
    telefone_chave:mcChatChave,
    telefone_bruto:mcChatTel||null,
    canal:mcChatCanal,
    direcao:'saida',
    autor_tipo:'humano',
    usuario_id:U.id,
    tipo:'texto',
    texto:txt,
    id_externo:'crm:'+Date.now()+':'+Math.random().toString(36).slice(2,8),
    status:'pendente_envio'
  }).select('id').single();
  if(error){
    if(btn){btn.disabled=false;btn.textContent='Enviar';}
    toast('Erro ao registrar: '+error.message,'er');
    return;
  }
  /* A caixa esvazia ANTES da entrega: quem esta atendendo ja pode
     digitar a proxima enquanto esta sai. O chat e recarregado duas
     vezes de proposito — a primeira mostra a mensagem na conversa, a
     segunda troca o "na fila" pelo estado real do envio. */
  inp.value='';
  mcChatAssinatura='';
  carregarChat(clienteId);
  if(btn)btn.textContent='Enviando...';
  const env=await enviarJaPeloMotor(nova.id);
  if(btn){btn.disabled=false;btn.textContent='Enviar';}
  mcChatAssinatura='';
  carregarChat(clienteId);
  toast(env.ok?'Enviada':'Na fila — sai em até 1 minuto','ok');
}

let gbTimer=null;
function abrirBuscaGlobal(){
  abrirModal(`
    <button class="mbc" onclick="fecharModal()">×</button>
    <div class="mctit" style="margin-bottom:14px">🔍 Buscar cliente</div>
    <input type="text" id="gb-input" class="etp-search" style="width:100%;margin-bottom:14px" placeholder="Nome, telefone, CPF, observações..." oninput="globalBuscaInput(this.value)"/>
    <div id="gb-resultados"><div class="fhint" style="text-align:center;padding:14px 0">Busca em todos os quadros, inclusive clientes arquivados.</div></div>
  `);
  setTimeout(()=>{const i=$('gb-input');if(i)i.focus();},50);
}
function globalBuscaInput(valor){
  clearTimeout(gbTimer);
  const termo=(valor||'').trim();
  const alvo=$('gb-resultados');
  if(!alvo)return;
  if(termo.length<2){
    alvo.innerHTML='<div class="fhint" style="text-align:center;padding:14px 0">Digite ao menos 2 letras.</div>';
    return;
  }
  alvo.innerHTML='<div class="fhint" style="text-align:center;padding:14px 0">Buscando...</div>';
  gbTimer=setTimeout(()=>executarBuscaGlobal(termo),300);
}
async function executarBuscaGlobal(termo){
  const alvo=$('gb-resultados');
  if(!alvo)return;
  const escQ=v=>String(v).replace(/"/g,'\\"');
  /* BUSCA POR PEDACOS — 04/09/2026, caso da Bianca.

     Antes o termo inteiro ia como uma frase so: "BIANCA 3629" virava
     ilike '%BIANCA 3629%' e nao achava nada, porque essa sequencia nao
     existe em campo nenhum. E o cadastro antigo da Bianca estava
     gravado com OUTRO nome ("Bianca indicacao 3677 Franciele Santos"),
     entao procurar pelo nome completo de hoje tambem nao achava — o
     unico ponto em comum entre os dois cadastros era o telefone.

     Agora cada pedaco e uma condicao: TODOS precisam bater, cada um em
     QUALQUER campo. "BIANCA 3629" acha quem tem Bianca no nome E 3629
     no telefone. Chamar .or() varias vezes e o que produz esse E — no
     PostgREST cada filtro encadeado entra como AND com os anteriores.

     Pedaco de uma letra fica de fora: "Ana C" traria a base inteira. */
  const pedacos=termo.trim().split(/\s+/).filter(t=>t.length>=2).slice(0,4);
  const alvos=pedacos.length?pedacos:[termo];
  let q=sb.from('crm_clientes')
    .select('id,nome_completo,telefone_principal,quadro,arquivado_em');
  alvos.forEach(t=>{
    const d=t.replace(/\D/g,'');
    const conds=[
      `nome_completo.ilike."%${escQ(t)}%"`,
      `telefone_principal.ilike."%${escQ(t)}%"`,
      `cpf.ilike."%${escQ(t)}%"`,
      `observacoes.ilike."%${escQ(t)}%"`,
      `trello_url.ilike."%${escQ(t)}%"`
    ];
    if(d.length>=3)conds.push(`telefone_chave.ilike."%${d}%"`);
    q=q.or(conds.join(','));
  });
  const{data,error}=await q.order('nome_completo').limit(25);
  if(!$('gb-resultados')||$('gb-input')&&$('gb-input').value.trim()!==termo)return;
  if(error){alvo.innerHTML='<div class="fhint" style="text-align:center;padding:14px 0">Erro ao buscar: '+esc(error.message)+'</div>';return;}
  if(!data||!data.length){alvo.innerHTML='<div class="fhint" style="text-align:center;padding:14px 0">Nada encontrado</div>';return;}
  alvo.innerHTML=data.map(c=>`
    <div class="gb-item" onclick="abrirCardCliente('${c.id}')">
      <div class="gb-nome">${esc(c.nome_completo)}${c.arquivado_em?'<span class="gb-arq">Arquivado</span>':''}</div>
      <div class="gb-meta">${QUADROS[c.quadro]?QUADROS[c.quadro].rotulo:(c.quadro||'—')}${c.telefone_principal?' · '+esc(c.telefone_principal):''}</div>
    </div>`).join('');
}

function mcPagamentosHtml(clienteId){
  const parc=(PARC||[]).filter(p=>pCli(p)===clienteId&&p.status!=='cancelado').sort((a,b)=>(a.num_parcela||0)-(b.num_parcela||0));
  if(!parc.length)return{temParc:false,html:'<div class="fhint" style="padding:2px">Nenhum recebimento cadastrado para este cliente.</div>'};
  const recebidas=parc.filter(p=>p.status==='recebido');
  const totalHon=parc.reduce((s,p)=>s+(p.valor_honorario||0),0);
  const recHon=recebidas.reduce((s,p)=>s+(p.valor_honorario||0),0);
  const proxima=parc.filter(p=>p.status!=='recebido').sort((a,b)=>(a.data_vencimento||'').localeCompare(b.data_vencimento||''))[0];
  /* O QUE A CLIENTE RECEBE FICA AO LADO DO QUE ELA PAGA.
     Sem isto, saber se R$ 990 de honorário bate com o valor do INSS
     exigia abrir Recebimentos e procurar a cliente lá — que é
     justamente a busca que não achava todo mundo. */
  const totalCli=parc.reduce((s,p)=>s+(parseFloat(p.valor_cliente)||0),0);
  const linhaCli=totalCli>0?`<div style="font-size:12.5px;color:var(--green);font-weight:700;margin-bottom:9px">Cliente recebe ${R(totalCli)} · nossos honorários ${R(totalHon)}</div>`:'';
  const pend=parc.filter(p=>p.status!=='recebido'&&p.status!=='inadimplente');
  const aConsultar=pend.filter(p=>!p.data_confirmada).length;
  const aComunicar=pend.filter(p=>p.data_confirmada&&!p.comunicada_em).length;
  const pilha=[];
  if(aConsultar)pilha.push(aConsultar+' a consultar no INSS');
  if(aComunicar)pilha.push(aComunicar+' a avisar a cliente');
  const linhaPend=pilha.length?`<div style="font-size:12px;color:var(--orange,#B06000);font-weight:700;margin-bottom:9px">⏳ ${pilha.join(' · ')}</div>`:'';
  const resumo=linhaCli+linhaPend+`<div style="font-size:12.5px;color:var(--text2);margin-bottom:9px">${recebidas.length} de ${parc.length} parcelas recebidas · ${R(recHon)} de ${R(totalHon)}${proxima?' · Próxima: '+fD(proxima.data_vencimento):''}</div>`;
  const badgeCor={recebido:['var(--green-bg)','var(--green)'],inadimplente:['var(--red-bg)','var(--red)'],previsto:['var(--gray-bg)','var(--gray)']};
  const linhas=parc.map(p=>{
    const[bg,fg]=badgeCor[p.status]||badgeCor.previsto;
    const rotulo=p.status==='recebido'?'Recebido':p.status==='inadimplente'?'Inadimplente':'Previsto';
    const vc=parseFloat(p.valor_cliente)||0;
    /* A data que o cadastro gerou e projecao: somou um mes e parou. So vira
       data firme depois de conferida no Meu INSS, porque o INSS paga entre o
       1o e o 5o dia util mas tambem solta na ultima semana. Sem essa
       distincao a tela mostra chute com a mesma cara de certeza do que ja
       caiu, e nao ha como saber quem falta consultar. */
    const pendente=p.status!=='recebido'&&p.status!=='inadimplente';
    const marcaData=pendente&&!p.data_confirmada
      ?`<span style="color:var(--text3);font-weight:600"> (estimada)</span>`:'';
    let acao='';
    if(pendente&&!p.data_confirmada){
      acao=`<button class="btn btns" style="padding:2px 9px;font-size:10.5px" onclick="confirmarDataINSS('${p.id}')">Confirmar no INSS</button>`;
    }else if(pendente&&!p.comunicada_em){
      acao=`<button class="btn btnp" style="padding:2px 9px;font-size:10.5px" onclick="marcarComunicada('${p.id}')">Avisar cliente</button>`;
    }else if(p.comunicada_em){
      acao=`<span style="color:var(--green);font-size:10.5px;font-weight:700">avisada ${fD(String(p.comunicada_em).slice(0,10))}</span>`;
    }
    return`<div style="padding:6px 0;border-top:1px solid var(--border2);font-size:12.5px">
      <div style="display:flex;align-items:center;justify-content:space-between">
      <span>Parcela ${p.num_parcela}/${p.total_parcelas} · ${fD(p.data_vencimento)}${marcaData}${vc>0?`<span style="color:var(--green);font-weight:600"> · cliente recebe ${R(vc)}</span>`:''}</span>
      <span style="display:flex;align-items:center;gap:8px">${R(p.valor_honorario)}<span style="background:${bg};color:${fg};padding:2px 8px;border-radius:20px;font-size:10.5px;font-weight:700">${rotulo}</span></span>
      </div>

  return{temParc:true,html:resumo+linhas};

/* CONFIRMAR NO INSS e AVISAR CLIENTE.
   Sao as duas metades do trabalho que voce faz entre os dias 15 e 20 e que
   ate agora nao existia em lugar nenhum: descobrir quando e quanto o INSS vai
   pagar, e contar isso para a mae. Separadas de proposito — uma e consulta,
   a outra e conversa, e misturar as duas na mesma pilha obriga a separar de
   novo na cabeca toda vez. */
async function confirmarDataINSS(parcelaId){
  const p=(PARC||[]).find(x=>String(x.id)===String(parcelaId));
  if(!p){toast('Parcela não encontrada','er');return;}
  const dt=prompt('Data do pagamento conforme o Meu INSS (dd/mm/aaaa):',fD(p.data_vencimento));
  if(dt===null)return;
  const m=(dt||'').trim().match(/^(\d{2})\/(\d{2})\/(\d{4})$/);
  if(!m){toast('Data inválida. Use dd/mm/aaaa','er');return;}
  const iso=m[3]+'-'+m[2]+'-'+m[1];
  const vlTxt=prompt('Valor que a cliente recebe nesta parcela (R$):',floatToMoney(parseFloat(p.valor_cliente)||0));
  if(vlTxt===null)return;
  const vl=moneyToFloat(vlTxt);
  const{error}=await sb.from('pm_parcelas')
    .update({data_vencimento:iso,valor_cliente:vl,data_confirmada:true}).eq('id',p.id);
  if(error){toast('Erro ao confirmar: '+error.message,'er');return;}
  await registrarAtividade(pCli(p),'confirmou no INSS a parcela '+p.num_parcela+'/'+p.total_parcelas+': '+fD(iso)+', cliente recebe '+R(vl),null);
  toast('Data confirmada','ok');
  await loadFin(true);
  await abrirCardCliente(pCli(p));
}
/* O PRIMEIRO NOME, EM CAIXA DE GENTE.
   O cadastro vem do contrato e da migracao, e boa parte esta em CAIXA
   ALTA: "JHENNIFER APARECIDA" viraria "Oi JHENNIFER." na mensagem, que
   parece grito ou robo. So arruma quando NAO HA nenhuma minuscula no
   nome — se a pessoa digitou com capitalizacao propria, ela sabe o que
   fez e nao cabe a nos corrigir. Nomes com acento passam certo: o
   toLowerCase/toUpperCase do JS trata acentuacao. */
function primeiroNomeBonito(completo){
  const n=(completo||'').trim().split(/\s+/)[0]||'';
  if(!n) return '';
  if(/[a-zà-ÿ]/.test(n)) return n;          // ja tem minuscula: nao mexe
  return n.charAt(0).toUpperCase()+n.slice(1).toLowerCase();
}
async function marcarComunicada(parcelaId){
  const p=(PARC||[]).find(x=>String(x.id)===String(parcelaId));
  if(!p){toast('Parcela não encontrada','er');return;}
  const vc=parseFloat(p.valor_cliente)||0;
  /* O texto sai por copiar-e-colar: o que estiver escrito aqui e literalmente
     o que a mae le no WhatsApp, quebra de linha e asterisco inclusos. Os '*'
     em data, valor e honorario viram negrito no WhatsApp — sao os tres numeros
     que ela precisa achar sem ler a mensagem inteira.
     O numero da parcela saiu de proposito: a mae nao precisa saber quantas sao,
     e a Samara ja tem a regra de nunca prometer numero de parcelas. */
  const nome=primeiroNomeBonito(p.cliente_nome);
  const texto='Oi'+(nome?' '+nome:'')+'. Tudo bem?\n'
    +'Passando pra avisar que saiu data e valor do seu próximo recebimento.\n'
    +'Será no dia *'+fD(p.data_vencimento)+'*, no valor de *'+R(vc)+'*.\n'
    +'Os nossos honorários dessa parcela ficam em *'+R(p.valor_honorario||0)+'* ☺️';
  if(!confirm('Marcar como avisada e copiar a mensagem?\n\n'+texto))return;
  try{await navigator.clipboard.writeText(texto);}catch(e){}
  const{error}=await sb.from('pm_parcelas')
    .update({comunicada_em:new Date().toISOString()}).eq('id',p.id);
  if(error){toast('Erro ao marcar: '+error.message,'er');return;}
  await registrarAtividade(pCli(p),'avisou a cliente sobre a parcela '+p.num_parcela+'/'+p.total_parcelas+' ('+fD(p.data_vencimento)+')',null);
  toast('Marcada como avisada · mensagem copiada','ok');
  await loadFin(true);
  await abrirCardCliente(pCli(p));
}

/* Copiar sem precisar revelar. A senha fica mascarada porque a tela do
   CRM é aberta ao lado de gente, mas quem vai protocolar precisa dela na
   área de transferência — e selecionar texto num campo password não
   funciona em todo navegador. */
async function mcCopiarSenha(btn){
  const inp=$('mc-senha-inss');
  const v=(inp&&inp.value||'').trim();
  if(!v){toast('Nenhuma senha salva neste card','er');return;}
  try{
    await navigator.clipboard.writeText(v);
  }catch(e){
    // clipboard bloqueado (http, permissão): cai no jeito antigo
    const era=inp.type; inp.type='text'; inp.select();
    try{document.execCommand('copy');}catch(_){ }
    inp.type=era; window.getSelection&&window.getSelection().removeAllRanges();
  }
  const antes=btn.textContent;
  btn.textContent='✅';
  setTimeout(()=>{btn.textContent=antes;},1200);
  toast('Senha copiada');
}

/* CAMPO QUE PODE NAO ESTAR NA TELA.
   Com as secoes aparecendo por etapa, CPF, senha e referencias nao
   existem no DOM enquanto o caso nao chega la. Ler .value de null
   derruba o Salvar inteiro — o cartao pareceria travado e ninguem
   ligaria a causa a uma secao escondida.
   O truque esta no `undefined`: uma chave com undefined some do JSON
   antes de virar requisicao, entao o Supabase nao recebe o campo e NAO
   sobrescreve o que ja estava gravado. Se devolvesse null, salvar uma
   lead nova apagaria o CPF de quem ja tinha. */
function vCampo(id){
  const el=$(id);
  if(!el)return undefined;

function mcIrAoCampo(inputId) {

/* Preenche o input e para por ai. Quem grava e o Salvar, como em todo
   o resto do card.

   O VALOR VEM DO CAMPO DA TELA, nao mais de mcLidos: se alguem
   corrigiu o texto ali em cima, e a correcao que tem que descer. O
   mcLidos continua sendo a fonte so quando o campo nao existe. */
function mcUsarLido(chave, inputId, silencioso) {
  if (!mcLidos || !mcLidos[chave]) return;
  const src = $('mc-lido-' + chave);
  const val = String(src ? src.value : mcLidos[chave]).trim();
  if (!val) { toast('Campo vazio — nada para preencher', 'er'); return; }
  /* O CPF era o unico campo com garantia automatica: o motor so grava
     depois de passar no digito verificador. Deixar editar devolve o
     risco que a leitura tinha tirado, entao a checagem volta aqui. */

    }

  if (!el) { toast('Campo não está visível nesta etapa', 'er'); return; }
  el.value = val;
  if (chave === 'cpf' && typeof cpfMask === 'function') cpfMask(el);
  el.style.background = 'var(--yellow-bg,#fff8e1)';
  /* SILENCIOSO quando quem chama e o "Marcar como conferido": ele
     aplica ate cinco campos de uma vez e ja grava tudo em seguida, entao
     cinco avisos dizendo "clique em Salvar" seriam cinco vezes errado. */
  if (!silencioso) toast('Preenchido. Clique em Salvar para gravar.');

  ta.style.height = 'auto';
  ta.style.height = (ta.scrollHeight + 2) + 'px';

  if (r) r.style.display = (ta.value.trim() !== orig.trim()) ? '' : 'none';

/* Volta ao que o documento leu. Existe porque o campo agora e editavel:
