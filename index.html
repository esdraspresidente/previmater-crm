<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="theme-color" content="#0A9396"/>
<title>PreviMater — CRM</title>
<link rel="manifest" href="manifest.json"/>
<link rel="icon" href="icon192.png"/>
<link rel="apple-touch-icon" href="icon192.png"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet"/>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{
  --teal:#0A9396;--teal2:#00B4D8;--teal-l:#E0F4F5;--teal-m:#94D2BD;
  --rose:#E87CA0;--rose-l:#FCE8F0;
  --bg:#EFF7F7;--white:#FFFFFF;
  --text:#0D2B2B;--text2:#3D6060;--text3:#7FA8A8;
  --border:#D4EBEB;--border2:#E8F4F4;
  --green:#0A7A5C;--green-bg:#E0F5EE;
  --yellow:#B06000;--yellow-bg:#FEF3E0;
  --red:#C0392B;--red-bg:#FDECEA;
  --purple:#6B3FA0;--purple-bg:#F0EAFA;
  --gray:#5A7070;--gray-bg:#EEF3F3;
  --sw:248px;--r:12px;--rl:16px;--rx:20px;
  --sh:0 1px 4px rgba(10,147,150,.08);
  --shm:0 4px 20px rgba(10,147,150,.13);
  --shl:0 8px 40px rgba(10,147,150,.18);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
html,body{min-height:100%;font-family:'Plus Jakarta Sans',sans-serif;background:var(--bg);color:var(--text);font-size:14px;-webkit-font-smoothing:antialiased;}

#ls{position:fixed;inset:0;background:linear-gradient(135deg,#0A9396,#00B4D8);display:flex;align-items:center;justify-content:center;z-index:999;flex-direction:column;gap:18px;}
#ls.h{display:none;}
.spin{width:30px;height:30px;border:3px solid rgba(255,255,255,.3);border-top-color:#fff;border-radius:50%;animation:sp .7s linear infinite;}
@keyframes sp{to{transform:rotate(360deg)}}

#ln{position:fixed;inset:0;background:linear-gradient(135deg,#0A9396 0%,#00B4D8 60%,#94D2BD 100%);display:flex;align-items:center;justify-content:center;z-index:998;padding:24px;}
#ln.h{display:none;}
.lbox{background:var(--white);border-radius:22px;padding:40px 36px;width:100%;max-width:370px;box-shadow:var(--shl);}
.llogo{display:flex;flex-direction:column;align-items:center;gap:10px;margin-bottom:28px;}
.lico{width:60px;height:60px;border-radius:16px;overflow:hidden;box-shadow:0 8px 24px rgba(10,147,150,.3);}
.ltitle{font-size:22px;font-weight:800;color:var(--text);letter-spacing:-.4px;}
.lsub{font-size:12px;color:var(--text3);margin-top:-6px;}
.lf{display:flex;flex-direction:column;gap:5px;margin-bottom:13px;}
.lf label{font-size:10px;font-weight:700;color:var(--text3);text-transform:uppercase;letter-spacing:.8px;}
.lf input{background:#F3FAFA;border:1.5px solid var(--border);border-radius:9px;padding:11px 14px;color:var(--text);font-size:14px;font-family:inherit;width:100%;transition:border .15s;}
.lf input:focus{outline:none;border-color:var(--teal);box-shadow:0 0 0 3px rgba(10,147,150,.14);}
.lbtn{width:100%;background:linear-gradient(135deg,#0A9396,#00B4D8);color:#fff;border:none;padding:13px;border-radius:10px;font-weight:700;font-size:15px;cursor:pointer;font-family:inherit;margin-top:6px;box-shadow:0 4px 14px rgba(10,147,150,.28);}
.lbtn:active{opacity:.85;}
.lerr{font-size:12px;color:var(--red);text-align:center;margin-top:8px;min-height:14px;}

#app{display:none;min-height:100vh;}
#app.v{display:flex;}
#sb{position:fixed;top:0;left:0;bottom:0;width:var(--sw);background:var(--white);border-right:1px solid var(--border);display:flex;flex-direction:column;z-index:100;overflow-y:auto;transition:transform .25s cubic-bezier(.4,0,.2,1);}
@media(max-width:900px){#sb{transform:translateX(-100%);}#sb.o{transform:none;}}
#ov{position:fixed;inset:0;background:rgba(0,0,0,.38);z-index:99;display:none;}
#ov.o{display:block;}
.sbh{padding:20px 18px 16px;border-bottom:1px solid var(--border2);}
.sbl{display:flex;align-items:center;gap:11px;}
.sbi{width:38px;height:38px;border-radius:11px;overflow:hidden;flex-shrink:0;box-shadow:0 4px 12px rgba(10,147,150,.25);}
.sblt{font-size:15px;font-weight:800;color:var(--text);letter-spacing:-.3px;line-height:1.1;}
.sbls{font-size:10px;color:var(--text3);}
.sbn{flex:1;padding:14px 10px;}
.snl{font-size:10px;font-weight:700;color:var(--text3);text-transform:uppercase;letter-spacing:1px;padding:0 10px;margin:12px 0 4px;}
.ni{width:100%;background:none;border:none;display:flex;align-items:center;gap:10px;padding:9px 12px;font-size:13px;font-weight:600;color:var(--text2);cursor:pointer;font-family:inherit;border-radius:10px;margin-bottom:2px;transition:all .12s;text-align:left;}
.ni:hover{background:var(--teal-l);color:var(--teal);}
.ni.a{background:var(--teal-l);color:var(--teal);}
.nic{width:30px;height:30px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:14px;background:var(--bg);transition:all .12s;flex-shrink:0;}
.ni.a .nic{background:var(--teal);color:#fff;}
.sbf{padding:12px 10px;border-top:1px solid var(--border2);}
.sbu{display:flex;align-items:center;gap:9px;padding:9px 12px;border-radius:10px;margin-bottom:8px;}
.sbav{width:32px;height:32px;border-radius:50%;background:linear-gradient(135deg,#0A9396,#00B4D8);display:flex;align-items:center;justify-content:center;color:#fff;font-size:12px;font-weight:700;flex-shrink:0;}
.sbnm{font-size:13px;font-weight:700;color:var(--text);}
.sbem{font-size:10px;color:var(--text3);}
.sblg{width:100%;background:none;border:1.5px solid var(--border);color:var(--text3);padding:8px;border-radius:9px;font-size:12px;font-weight:600;cursor:pointer;font-family:inherit;display:flex;align-items:center;gap:5px;justify-content:center;transition:all .12s;}
.sblg:hover{border-color:var(--red);color:var(--red);}

#mw{margin-left:var(--sw);flex:1;min-height:100vh;display:flex;flex-direction:column;min-width:0;}
@media(max-width:900px){#mw{margin-left:0;}}
#tb{display:none;background:var(--white);border-bottom:1px solid var(--border);padding:0 16px;height:54px;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:98;}
@media(max-width:900px){#tb{display:flex;}}
#pc{flex:1;padding:26px 26px 70px;min-width:0;}
@media(max-width:900px){#pc{padding:18px 14px 70px;}}

.pgh{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:20px;flex-wrap:wrap;gap:12px;}
.pgt{font-size:24px;font-weight:800;color:var(--text);letter-spacing:-.5px;}
.pgs{font-size:13px;color:var(--text3);margin-top:3px;}
.st{font-size:11px;font-weight:700;color:var(--text3);text-transform:uppercase;letter-spacing:.9px;margin:22px 0 10px;}
.card{background:var(--white);border:1px solid var(--border);border-radius:var(--rl);box-shadow:var(--sh);}

/* KANBAN */
.kb{display:flex;gap:12px;align-items:flex-start;overflow-x:auto;height:calc(100vh - 210px);padding-bottom:16px;}
.kl{flex:0 0 262px;width:262px;background:var(--white);border:1px solid var(--border);border-radius:var(--rl);box-shadow:var(--sh);display:flex;flex-direction:column;max-height:calc(100vh - 226px);}
.kl.dragover{border-color:var(--teal);box-shadow:0 0 0 3px rgba(10,147,150,.16);}
.klh{padding:12px 14px 10px;border-bottom:1px solid var(--border2);border-top:3px solid var(--teal);border-radius:var(--rl) var(--rl) 0 0;display:flex;align-items:center;justify-content:space-between;gap:6px;}
.kln{font-size:12px;font-weight:800;color:var(--text);line-height:1.25;}
.klc{font-size:10px;font-weight:700;color:var(--text3);background:var(--bg);padding:2px 7px;border-radius:8px;flex-shrink:0;}
.klm{background:none;border:none;color:var(--text3);cursor:pointer;font-size:15px;line-height:1;padding:2px 4px;border-radius:6px;flex-shrink:0;}
.klm:hover{background:var(--teal-l);color:var(--teal);}
.klb{padding:10px;overflow-y:auto;flex:1;min-height:56px;}
.kc{background:var(--white);border:1.5px solid var(--border);border-radius:11px;padding:11px 12px;margin-bottom:8px;cursor:grab;transition:all .13s;box-shadow:var(--sh);position:relative;}
.kc:hover{border-color:var(--teal);box-shadow:var(--shm);transform:translateY(-1px);}
.kc.dragging{opacity:.4;cursor:grabbing;}
.kcn{font-size:13px;font-weight:700;color:var(--text);line-height:1.3;padding-right:26px;}
.kcm{font-size:11px;color:var(--text3);margin-top:3px;display:flex;align-items:center;gap:5px;flex-wrap:wrap;}
.kcv{font-size:12px;font-weight:800;color:var(--teal);}
.kce{display:flex;flex-wrap:wrap;gap:4px;margin-top:7px;}
.kcmv{position:absolute;top:7px;right:7px;background:var(--bg);border:none;color:var(--text3);width:24px;height:24px;border-radius:7px;cursor:pointer;font-size:12px;line-height:1;opacity:0;transition:opacity .13s;}
.kc:hover .kcmv{opacity:1;}
@media(max-width:900px){.kcmv{opacity:1;}}
.kcmv:hover{background:var(--teal);color:#fff;}
.chip{font-size:9px;font-weight:800;color:#fff;padding:2px 7px;border-radius:6px;letter-spacing:.3px;text-transform:uppercase;}
.ent{display:inline-flex;align-items:center;gap:4px;font-size:10px;font-weight:800;padding:3px 8px;border-radius:7px;}
.ent-ok{background:var(--gray-bg);color:var(--gray);}
.ent-soon{background:var(--yellow-bg);color:var(--yellow);}
.ent-late{background:var(--red-bg);color:var(--red);}
.klf{padding:8px 10px 10px;}
.kadd{width:100%;background:none;border:none;color:var(--text3);font-family:inherit;font-size:12px;font-weight:700;cursor:pointer;padding:7px;border-radius:8px;text-align:left;}
.kadd:hover{background:var(--teal-l);color:var(--teal);}
.knl{flex:0 0 200px;width:200px;border:2px dashed var(--border);border-radius:var(--rl);background:none;color:var(--text3);font-family:inherit;font-size:12px;font-weight:700;padding:14px;cursor:pointer;transition:all .15s;}
.knl:hover{border-color:var(--teal);color:var(--teal);background:var(--teal-l);}
.kempty{font-size:11px;color:var(--text3);text-align:center;padding:14px 6px;}

/* STAT / KPI */
.sgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:20px;}
@media(max-width:1100px){.sgrid{grid-template-columns:repeat(2,1fr);}}
@media(max-width:500px){.sgrid{grid-template-columns:1fr 1fr;gap:8px;}}
.sc{background:var(--white);border:1px solid var(--border);border-radius:var(--rl);padding:16px 18px;box-shadow:var(--sh);transition:all .15s;}
.sc:hover{box-shadow:var(--shm);transform:translateY(-1px);}
.scl{font-size:10px;font-weight:700;color:var(--text3);text-transform:uppercase;letter-spacing:.7px;margin-bottom:6px;}
.scv{font-size:20px;font-weight:800;letter-spacing:-.5px;color:var(--text);}
.scv.tl{color:var(--teal);}.scv.yw{color:var(--yellow);}.scv.rd{color:var(--red);}
.scs{font-size:11px;color:var(--text3);margin-top:4px;}
.kgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:20px;}
@media(max-width:1100px){.kgrid{grid-template-columns:repeat(2,1fr);}}
@media(max-width:500px){.kgrid{grid-template-columns:1fr 1fr;gap:8px;}}
.kpc{background:var(--white);border:1px solid var(--border);border-radius:var(--rl);padding:16px 18px;box-shadow:var(--sh);cursor:pointer;transition:all .15s;}
.kpc:hover{box-shadow:var(--shm);transform:translateY(-1px);}
.ki{width:36px;height:36px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:17px;margin-bottom:10px;}
.kpl{font-size:10px;font-weight:700;color:var(--text3);text-transform:uppercase;letter-spacing:.7px;margin-bottom:4px;}
.kv{font-size:17px;font-weight:800;letter-spacing:-.3px;}
.kh{font-size:11px;color:var(--text3);margin-top:4px;}
.mn{display:flex;align-items:center;gap:7px;}
.mb2{width:28px;height:28px;border-radius:7px;border:1.5px solid var(--border);background:none;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:14px;color:var(--text2);transition:all .12s;}
.mb2:hover{border-color:var(--teal);color:var(--teal);}
.ml{font-size:14px;font-weight:700;color:var(--text);min-width:130px;text-align:center;}

/* BADGES */
.bdg{display:inline-flex;align-items:center;padding:3px 9px;border-radius:20px;font-size:11px;font-weight:700;white-space:nowrap;}
.bp{background:var(--yellow-bg);color:var(--yellow);}
.br{background:var(--green-bg);color:var(--green);}
.ba{background:var(--red-bg);color:var(--red);}
.bi{background:var(--purple-bg);color:var(--purple);}
.bc{background:var(--gray-bg);color:var(--gray);}
.bdg.ok{background:var(--green-bg);color:var(--green);}
.bdg.wr{background:var(--red-bg);color:var(--red);}
.bdg.nt{background:var(--gray-bg);color:var(--gray);}

.aw{border-left:3px solid var(--red);padding-left:14px;margin-bottom:20px;}
.at{font-size:13px;font-weight:700;color:var(--red);display:flex;align-items:center;gap:6px;margin-bottom:10px;}
.lr{padding:12px 16px;display:flex;align-items:center;gap:11px;border-bottom:1px solid var(--border2);transition:background .1s;}
.lr:last-child{border-bottom:none;}
.lr:hover{background:#FAFEFE;}
.av{width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:700;color:#fff;flex-shrink:0;}
.rn{font-size:13px;font-weight:700;color:var(--text);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:200px;}
.rm{font-size:11px;color:var(--text3);margin-top:2px;}
.rr{margin-left:auto;text-align:right;flex-shrink:0;}
.rv{font-size:14px;font-weight:800;color:var(--text);}
.rv.rd{color:var(--red);}
.dh{background:var(--red-bg);color:var(--red);font-size:10px;font-weight:700;padding:2px 6px;border-radius:7px;margin-left:4px;}
.dw{background:var(--yellow-bg);color:var(--yellow);font-size:10px;font-weight:700;padding:2px 6px;border-radius:7px;margin-left:4px;}
.dn{background:var(--gray-bg);color:var(--gray);font-size:10px;font-weight:700;padding:2px 6px;border-radius:7px;margin-left:4px;}

.fchips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px;}
.fchip{background:var(--white);border:1.5px solid var(--border);color:var(--text2);padding:5px 13px;border-radius:20px;font-size:12px;font-weight:600;cursor:pointer;transition:all .15s;font-family:inherit;}
.fchip:hover{border-color:var(--teal);color:var(--teal);}
.fchip.a{background:var(--teal);border-color:var(--teal);color:#fff;}
.fchip.ra.a{background:var(--red);border-color:var(--red);}
.fchip.ga.a{background:var(--green);border-color:var(--green);}
.sr{display:flex;gap:8px;margin-bottom:12px;}
.si{flex:1;background:var(--white);border:1.5px solid var(--border);border-radius:10px;padding:9px 13px;font-size:13px;font-family:inherit;color:var(--text);transition:border .15s;}
.si:focus{outline:none;border-color:var(--teal);box-shadow:0 0 0 3px rgba(10,147,150,.1);}
.ss{background:var(--white);border:1.5px solid var(--border);border-radius:10px;padding:9px 11px;font-size:12px;font-family:inherit;color:var(--text2);cursor:pointer;}
.ss:focus{outline:none;border-color:var(--teal);}

/* CALENDARIO */
.ch{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;}
.cl{display:flex;gap:12px;margin-bottom:10px;flex-wrap:wrap;}
.cli2{display:flex;align-items:center;gap:5px;font-size:11px;color:var(--text3);}
.cdo{width:8px;height:8px;border-radius:2px;}
.cg{display:grid;grid-template-columns:repeat(7,1fr);gap:3px;}
.chd{font-size:9px;font-weight:700;color:var(--text3);text-align:center;padding:3px 0;text-transform:uppercase;}
.cc{min-height:50px;border:1.5px solid var(--border2);border-radius:9px;padding:6px;background:var(--white);transition:all .12s;}
.cc.em{background:transparent;border-color:transparent;}
.cc.hp{cursor:pointer;}
.cc.hp:hover{border-color:var(--teal);box-shadow:0 0 0 2px rgba(10,147,150,.12);}
.cc.td{border-color:var(--teal);background:var(--teal-l);}
.cc.cr{background:#FFF5F5;border-color:#FECACA;}
.cc.cg2{background:#F0FFF8;border-color:#99E6C8;}
.cc.cy{background:#FFFBF0;border-color:#FDE68A;}
.cd{font-size:11px;font-weight:700;color:var(--text2);}
.cn{font-size:10px;color:var(--text3);margin-top:1px;}

/* CLIENTE CARD (recebimentos) */
.ccard{background:var(--white);border:1px solid var(--border);border-radius:var(--rl);overflow:hidden;margin-bottom:8px;box-shadow:var(--sh);}
.cch{padding:13px 16px;display:flex;align-items:center;gap:11px;cursor:pointer;transition:background .1s;}
.cch:hover{background:#FAFEFE;}
.cci{flex:1;min-width:0;}
.ccn{font-size:14px;font-weight:700;color:var(--text);}
.ccm{font-size:11px;color:var(--text3);display:flex;gap:7px;flex-wrap:wrap;margin-top:2px;}
.ccv{font-size:15px;font-weight:800;color:var(--text);margin-right:6px;white-space:nowrap;}
.chv{font-size:11px;color:var(--text3);transition:transform .2s;flex-shrink:0;}
.chv.o{transform:rotate(180deg);}
.ccb{display:none;padding:0 16px 12px;}
.ccb.o{display:block;}
.ccl{display:flex;gap:7px;margin-bottom:10px;flex-wrap:wrap;}
.cl2{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:700;padding:5px 10px;border-radius:20px;text-decoration:none;border:none;cursor:pointer;font-family:inherit;}
.lwa{background:#E0F5EE;color:#0A7A5C;}
.ltr{background:#EDF2FC;color:#1D4ED8;}
.lcr{background:var(--teal-l);color:var(--teal);}
.pi{display:flex;align-items:center;gap:9px;padding:8px 0;border-bottom:1px solid var(--border2);}
.pi:last-child{border-bottom:none;}
.pin{font-size:11px;font-weight:700;color:var(--text3);min-width:28px;}
.pii{flex:1;}
.pid{font-size:12px;color:var(--text2);font-weight:600;}
.piv{font-size:11px;color:var(--text3);margin-top:1px;}
.pir{display:flex;align-items:center;gap:5px;flex-shrink:0;}
.piac{display:flex;gap:2px;}
.bic{background:none;border:none;cursor:pointer;padding:4px;border-radius:6px;font-size:13px;transition:background .1s;line-height:1;}
.bic:hover{background:var(--teal-l);}
.bg{color:var(--green);}.bd{color:var(--red);}.bp2{color:var(--purple);}
.remr{text-align:right;margin-top:6px;}
.brem{background:none;border:none;color:var(--red);font-size:11px;font-weight:700;cursor:pointer;font-family:inherit;}

/* FORM */
.fs{background:var(--white);border:1px solid var(--border);border-radius:var(--rl);padding:20px;margin-bottom:14px;box-shadow:var(--sh);}
.fst{font-size:11px;font-weight:700;color:var(--text3);text-transform:uppercase;letter-spacing:.9px;margin-bottom:14px;}
.fg{display:grid;grid-template-columns:1fr 1fr;gap:13px;}
@media(max-width:520px){.fg{grid-template-columns:1fr;}}
.ff{grid-column:1/-1;}
.fld{display:flex;flex-direction:column;gap:5px;}
.fld label{font-size:11px;font-weight:700;color:var(--text3);text-transform:uppercase;letter-spacing:.6px;}
.fld input,.fld select,.fld textarea{background:#F3FAFA;border:1.5px solid var(--border);border-radius:9px;padding:9px 12px;color:var(--text);font-size:13px;font-family:inherit;width:100%;transition:border .15s;}
.fld input:focus,.fld select:focus,.fld textarea:focus{outline:none;border-color:var(--teal);box-shadow:0 0 0 3px rgba(10,147,150,.1);}
.fld textarea{min-height:68px;resize:vertical;}
.fhint{font-size:10px;color:var(--text3);line-height:1.4;}
.tg{display:grid;grid-template-columns:1fr 1fr;gap:9px;}
.to{border:2px solid var(--border);border-radius:11px;padding:13px 15px;cursor:pointer;transition:all .15s;}
.to.s{border-color:var(--teal);background:var(--teal-l);}
.tot{font-size:13px;font-weight:700;color:var(--text);}
.to.s .tot{color:var(--teal);}
.tos{font-size:11px;color:var(--text3);margin-top:2px;}

const today=()=>{const d=new Date();return new Date(d.getFullYear(),d.getMonth(),d.getDate());};
const dAtr=s=>Math.floor((today()-new Date(s+'T12:00:00'))/86400000);

function moneyToFloat(v){if(!v)return 0;return parseFloat(String(v).replace(/\./g,'').replace(',','.'))||0;}
function m2f(el){return el?moneyToFloat(el.value):0;}
function floatToMoney(v){v=parseFloat(v)||0;return v>0?v.toFixed(2).replace('.',',').replace(/\B(?=(\d{3})+(?!\d))/g,'.'):'';}
function moneyMask(el){
  let d=(el.value||'').replace(/\D/g,'');
  if(!d){el.value='';return;}
  while(d.length<3)d='0'+d;
  const c=d.slice(-2);
  let r=d.slice(0,-2).replace(/^0+/,'')||'0';
  r=r.replace(/\B(?=(\d{3})+(?!\d))/g,'.');
  el.value=r+','+c;
}
function cpfMask(el){
  let d=(el.value||'').replace(/\D/g,'').slice(0,11);
  if(d.length>9)d=d.replace(/(\d{3})(\d{3})(\d{3})(\d{1,2})/,'$1.$2.$3-$4');
  else if(d.length>6)d=d.replace(/(\d{3})(\d{3})(\d{1,3})/,'$1.$2.$3');
  else if(d.length>3)d=d.replace(/(\d{3})(\d{1,3})/,'$1.$2');
  el.value=d;
}
// mascara de dinheiro delegada: so formata no input, nunca redesenha o DOM
document.addEventListener('input',e=>{
  if(e.target.dataset&&e.target.dataset.money!==undefined)moneyMask(e.target);
});
document.addEventListener('focusin',e=>{
  if(e.target.dataset&&e.target.dataset.money!==undefined){try{e.target.select();}catch(_){}}

}

async function boot(){
  const{data}=await sb.auth.getSession();
  S=data.session;
  if(S)await carregarUsuario();
  $('ls').classList.add('h');
  if(U){mostrarApp();route();}
  else $('ln').classList.remove('h');
}
async function carregarUsuario(){
  const{data,error}=await sb.from('crm_usuarios').select('id,nome,nivel,email').eq('auth_user_id',S.user.id).single();
  if(error||!data)return;
  U=data;
  const{data:p}=await sb.from('crm_permissoes_quadro').select('quadro').eq('usuario_id',U.id);
  QPERM=(p||[]).map(x=>x.quadro).filter(q=>QUADROS[q]).sort((a,b)=>QUADROS[a].ordem-QUADROS[b].ordem);
  const{data:e}=await sb.from('crm_etiquetas').select('*').order('nome');
  ETQ=e||[];
}
async function doLogin(){
  const em=$('le').value.trim(),pw=$('lp').value,err=$('lerr');
  err.textContent='';
  if(!em||!pw){err.textContent='Preencha e-mail e senha.';return;}
  const btn=document.querySelector('.lbtn');btn.textContent='Entrando...';btn.disabled=true;
  const{data,error}=await sb.auth.signInWithPassword({email:em,password:pw});
  btn.disabled=false;btn.textContent='Entrar';
  if(error){err.textContent='E-mail ou senha incorretos.';return;}
  S=data.session;
  await carregarUsuario();
  if(!U){err.textContent='Usuário não cadastrado no CRM.';await sb.auth.signOut();S=null;return;}
  $('ln').classList.add('h');mostrarApp();location.hash='#/';route();
}
async function doLogout(){
  await sb.auth.signOut();
  S=null;U=null;QPERM=[];ETQ=[];CLI=[];REC=[];PARC=[];finCarregado=false;
  $('app').classList.remove('v');$('ln').classList.remove('h');
}

window.addEventListener('hashchange',route);

function route(){
  if(!U)return;
  const r=(location.hash.slice(1)||'/').split('?')[0];
  if(r==='/'){location.hash='#/quadro/'+(QPERM[0]||'comercial');return;}
  let m;
  if(m=r.match(/^\/quadro\/(.+)$/))return pageQuadro(m[1]);
  if(r==='/cliente/novo')return pageCliente(null);
  if(m=r.match(/^\/cliente\/(.+)$/))return pageCliente(m[1]);
  if(r==='/etiquetas')return pageEtiquetas();
  if(r==='/campanha')return pageCampanha();
  if(r==='/dashboard')return pageDash();
  if(r==='/recebimentos')return pageRec();
  if(r==='/recebimento/novo')return pageNovoRec();

}

// QUADRO / KANBAN
// ============================================================
async function pageQuadro(q){
  const pc=$('pc');marcarNav(q);
  if(!QUADROS[q]||!QPERM.includes(q)){pc.innerHTML='<div class="emp"><div class="empt">Você não tem acesso a este quadro</div></div>';return;}
  pc.innerHTML=`<div class="pgh"><div><div class="pgt">${QUADROS[q].rotulo}</div><div class="pgs">Carregando...</div></div></div>`;
  const[{data:listas},{data:clientes,error}]=await Promise.all([
    sb.from('crm_listas').select('*').eq('quadro',q).eq('arquivada',false).order('ordem'),
    sb.from('crm_clientes').select('id,nome_completo,lista_id,posicao,telefone_principal,data_nascimento_bebe,data_entrega,valor_beneficio_esperado,crm_clientes_etiquetas(etiqueta_id)').eq('quadro',q).order('posicao')
  ]);
  if(error){pc.innerHTML=`<div class="emp"><div class="empt">Erro ao carregar</div>${esc(error.message)}</div>`;return;}
  const L=listas||[],C=clientes||[];

  if(q==='financeiro'&&C.length){
    const ids=C.map(c=>c.id);
    const{data:parc}=await sb.from('pm_parcelas').select('crm_cliente_id,status,data_vencimento').in('crm_cliente_id',ids).neq('status','cancelado');
    const porCliente={};
    (parc||[]).forEach(p=>{
      if(!porCliente[p.crm_cliente_id])porCliente[p.crm_cliente_id]={total:0,recebidas:0,proxima:null};
      const r=porCliente[p.crm_cliente_id];
      r.total++;
      if(p.status==='recebido')r.recebidas++;
      else if(!r.proxima||p.data_vencimento<r.proxima)r.proxima=p.data_vencimento;
    });
    C.forEach(c=>{c.finResumo=porCliente[c.id]||null;});
  }

  const porLista={};L.forEach(l=>porLista[l.id]=[]);
  const orfaos=[];
  C.forEach(c=>{if(porLista[c.lista_id])porLista[c.lista_id].push(c);else orfaos.push(c);});
  let kb=L.map(l=>listaHtml(l,porLista[l.id])).join('');
  if(orfaos.length)kb+=listaHtml({id:'__sem__',nome:'Sem lista',cor:'#5A7070'},orfaos,true);
  kb+=`<button class="knl" onclick="modalNovaLista('${q}')">+ nova lista</button>`;
  pc.innerHTML=`<div class="pgh">
      <div><div class="pgt">${QUADROS[q].rotulo}</div><div class="pgs">${C.length} ${C.length===1?'cliente':'clientes'} neste quadro</div></div>
      <button class="bnew" onclick="location.hash='#/cliente/novo'">+ Novo cliente</button>
    </div><div class="kb" id="kb">${kb}</div>`;
  ligarDragDrop();
}
function listaHtml(l,cards,semAcoes){
  const cs=cards.length?cards.map(cardHtml).join(''):'<div class="kempty">Vazia</div>';
  return `<div class="kl" data-lista="${l.id}">
      <div class="klh" style="border-top-color:${escA(l.cor)}">
        <div class="kln">${esc(l.nome)}</div>
        <div style="display:flex;align-items:center;gap:4px">
          <span class="klc">${cards.length}</span>
          ${semAcoes?'':`<button class="klm" onclick="modalEditarLista('${l.id}')" title="Editar lista">⋯</button>`}
        </div>
      </div>
      <div class="klb" data-drop="${l.id}">${cs}</div>
      ${semAcoes?'':`<div class="klf"><button class="kadd" onclick="location.hash='#/cliente/novo?lista=${l.id}'">+ adicionar cliente</button></div>`}
    </div>`;
}
function cardHtml(c){
  const chips=(c.crm_clientes_etiquetas||[]).map(e=>{
    const t=ETQ.find(x=>x.id===e.etiqueta_id);
    return t?`<span class="chip" style="background:${escA(t.cor)}">${esc(t.nome)}</span>`:'';
  }).join('');
  const meta=[];
  if(c.telefone_principal)meta.push(esc(c.telefone_principal));
  if(c.data_nascimento_bebe)meta.push('DN '+fD(c.data_nascimento_bebe));
  let finHtml='';
  if(c.finResumo){
    const f=c.finResumo;
    finHtml=`<div class="kcm"><span class="kcv">${f.recebidas}/${f.total} parcelas</span>${f.proxima?` · próxima ${fD(f.proxima)}`:''}</div>`;
  }
  return `<div class="kc" draggable="true" data-card="${c.id}" onclick="abrirCardCliente('${c.id}')">
      <button class="kcmv" title="Mover cartão" onclick="event.stopPropagation();modalMover('${c.id}')">⇄</button>
      <div class="kcn">${esc(c.nome_completo)}</div>
      ${meta.length?`<div class="kcm">${meta.join(' · ')}</div>`:''}
      ${finHtml||(c.valor_beneficio_esperado?`<div class="kcm"><span class="kcv">${R(c.valor_beneficio_esperado)}</span></div>`:'')}
      ${entregaHtml(c.data_entrega)}
      ${chips?`<div class="kce">${chips}</div>`:''}
    </div>`;
}
function entregaHtml(d){
  if(!d)return'';
  const dias=dVenc(d);
  let cls='ent-ok',txt=fD(d);
  if(dias<0){cls='ent-late';txt=fD(d)+' · atrasado';}
  else if(dias===0){cls='ent-soon';txt='entrega hoje';}
  else if(dias<=3){cls='ent-soon';txt=fD(d)+' · em '+dias+'d';}
  return`<div class="kcm"><span class="ent ${cls}">◷ ${txt}</span></div>`;
}
function ligarDragDrop(){
  document.querySelectorAll('.kc').forEach(card=>{
    card.addEventListener('dragstart',e=>{dragCardId=card.getAttribute('data-card');card.classList.add('dragging');e.dataTransfer.effectAllowed='move';});
    card.addEventListener('dragend',()=>{card.classList.remove('dragging');document.querySelectorAll('.kl').forEach(l=>l.classList.remove('dragover'));});
  });
  document.querySelectorAll('.klb').forEach(body=>{
    body.addEventListener('dragover',e=>{
      e.preventDefault();body.closest('.kl').classList.add('dragover');
      const arr=document.querySelector('.dragging');if(!arr)return;
      const dep=cardDepoisDe(body,e.clientY);
      if(dep==null)body.appendChild(arr);else body.insertBefore(arr,dep);
    });
    body.addEventListener('dragleave',e=>{if(!body.contains(e.relatedTarget))body.closest('.kl').classList.remove('dragover');});
    body.addEventListener('drop',async e=>{
      e.preventDefault();body.closest('.kl').classList.remove('dragover');
      const lid=body.getAttribute('data-drop');
      if(lid==='__sem__')return;
      await salvarOrdemLista(lid,body);
    });
  });
}
function cardDepoisDe(cont,y){
  const cards=[...cont.querySelectorAll('.kc:not(.dragging)')];
  return cards.reduce((mais,card)=>{
    const box=card.getBoundingClientRect();
    const off=y-box.top-box.height/2;
    if(off<0&&off>mais.off)return{off:off,el:card};
    return mais;
  },{off:Number.NEGATIVE_INFINITY,el:null}).el;
}
async function salvarOrdemLista(listaId,body){
  const ids=[...body.querySelectorAll('.kc')].map(c=>c.getAttribute('data-card'));
  const res=await Promise.all(ids.map((id,i)=>sb.from('crm_clientes').update({lista_id:listaId,posicao:i,atualizado_em:new Date().toISOString()}).eq('id',id)));
  if(res.find(r=>r.error)){toast('Não foi possível mover','er');route();return;}
  toast('Cliente movido','ok');atualizarContadores();
}
function atualizarContadores(){
  document.querySelectorAll('.kl').forEach(l=>{
    const n=l.querySelectorAll('.kc').length,c=l.querySelector('.klc');
    if(c)c.textContent=n;
    const b=l.querySelector('.klb');
    if(b&&n===0&&!b.querySelector('.kempty'))b.innerHTML='<div class="kempty">Vazia</div>';
    if(b&&n>0){const e=b.querySelector('.kempty');if(e)e.remove();}
  });
}

async function modalMover(clienteId){

  const{data:c}=await sb.from('crm_clientes').select('id,nome_completo,quadro,lista_id,posicao').eq('id',clienteId).single();

  const{data:LA}=await sb.from('crm_listas').select('*').eq('quadro',c.quadro).eq('arquivada',false).order('ordem');
  const L=LA||[],idx=L.findIndex(l=>l.id===c.lista_id);
  let sug='';
  if(idx>0)sug+=`<button class="mvs" onclick="moverPara('${c.id}','${c.quadro}','${L[idx-1].id}',0)">← ${esc(L[idx-1].nome)}</button>`;
  if(idx>=0&&idx<L.length-1)sug+=`<button class="mvs" onclick="moverPara('${c.id}','${c.quadro}','${L[idx+1].id}',0)">→ ${esc(L[idx+1].nome)}</button>`;
  const optQ=QPERM.map(q=>`<option value="${q}" ${c.quadro===q?'selected':''}>${QUADROS[q].rotulo}</option>`).join('');
  const optL=L.map(l=>`<option value="${l.id}" ${c.lista_id===l.id?'selected':''}>${esc(l.nome)}</option>`).join('');
  abrirModal(`<div class="mbt">Mover cartão</div><div class="mbs">${esc(c.nome_completo)}</div>
    ${sug?`<div class="mvsl">Sugeridas</div><div class="mvsug">${sug}</div>`:''}
    <div class="mvsl">Selecionar destino</div>
    <div class="fld" style="margin-bottom:12px"><label>Quadro</label><select id="mv-quadro" onchange="mvTrocarQuadro()">${optQ}</select></div>
    <div class="fg" style="margin-bottom:20px">
      <div class="fld"><label>Lista</label><select id="mv-lista" onchange="mvTrocarLista()">${optL}</select></div>
      <div class="fld"><label>Posição</label><select id="mv-pos"></select></div>
    </div>
    <div class="brow"><button class="btn btns" onclick="fecharModal()">Cancelar</button>
    <button class="btn btnp" onclick="moverConfirmar('${c.id}')">Mover</button></div>`);
  await mvTrocarLista(c.posicao);
}
async function mvTrocarQuadro(){
  const q=$('mv-quadro').value;
  const{data:L}=await sb.from('crm_listas').select('*').eq('quadro',q).eq('arquivada',false).order('ordem');
  $('mv-lista').innerHTML=(L||[]).map(l=>`<option value="${l.id}">${esc(l.nome)}</option>`).join('');
  await mvTrocarLista();
}
async function mvTrocarLista(posAtual){
  const lid=$('mv-lista').value,sel=$('mv-pos');
  if(!lid){sel.innerHTML='<option value="0">1</option>';return;}
  const{count}=await sb.from('crm_clientes').select('id',{count:'exact',head:true}).eq('lista_id',lid);
  let opts='';
  for(let i=0;i<=(count||0);i++)opts+=`<option value="${i}" ${(posAtual!==undefined&&posAtual===i)?'selected':''}>${i+1}</option>`;
  sel.innerHTML=opts;
}
async function moverConfirmar(id){
  const q=$('mv-quadro').value,l=$('mv-lista').value,p=parseInt($('mv-pos').value,10)||0;
  if(!l){toast('Escolha uma lista','er');return;}
  await moverPara(id,q,l,p);
}
async function moverPara(clienteId,quadro,listaId,pos){
  const{data:naLista}=await sb.from('crm_clientes').select('id,posicao').eq('lista_id',listaId).neq('id',clienteId).order('posicao');
  const ord=(naLista||[]).map(x=>x.id);
  ord.splice(pos,0,clienteId);
  const res=await Promise.all(ord.map((id,i)=>{
    const p={lista_id:listaId,posicao:i,atualizado_em:new Date().toISOString()};
    if(id===clienteId)p.quadro=quadro;
    return sb.from('crm_clientes').update(p).eq('id',id);
  }));
  if(res.find(r=>r.error)){toast('Não foi possível mover','er');return;}
  fecharModal();toast('Cartão movido','ok');
  const at=location.hash.match(/^#\/quadro\/(.+)$/);
  if(at)pageQuadro(at[1]);else location.hash='#/quadro/'+quadro;
}

async function pageCliente(id){
  const pc=$('pc');const novo=!id;

  const mq=location.hash.match(/lista=([^&]+)/);
  const listaPre=mq?mq[1]:null;
  if(!novo){
    pc.innerHTML='<div class="emp">Carregando...</div>';
    const{data,error}=await sb.from('crm_clientes').select('*,crm_clientes_etiquetas(etiqueta_id)').eq('id',id).single();
    if(error||!data){pc.innerHTML='<div class="emp"><div class="empt">Cliente não encontrado</div></div>';return;}
    c=data;etqSel=(data.crm_clientes_etiquetas||[]).map(e=>e.etiqueta_id);
  }
  const qAtual=(c&&c.quadro)||QPERM[0]||'comercial';
  const{data:listas}=await sb.from('crm_listas').select('*').eq('quadro',qAtual).eq('arquivada',false).order('ordem');
  const optQ=QPERM.map(q=>`<option value="${q}" ${qAtual===q?'selected':''}>${QUADROS[q].rotulo}</option>`).join('');

function recalcHonorariosCliente(){
  const vb=m2f($('f-vb'));
  if(vb>0)$('f-vh').value=floatToMoney(vb*PCT_HONORARIOS);

}
function renderCaixaCliente(){
  const vb=m2f($('f-vb')),vh=m2f($('f-vh')),box=$('cbox');
  if(!box)return;
  if(vb<=0&&vh<=0){box.style.display='none';return;}
  box.style.display='block';
  box.innerHTML=`<div class="cr2"><span>Benefício</span><span>${R(vb)}</span></div>
    <div class="cr2"><span>Honorários (30%)</span><span>${R(vh)}</span></div>

async function trocarQuadroForm(){
  const q=$('f-quadro').value;

async function salvarCliente(id){
  const btn=$('btn-salvar'),nome=$('f-nome').value.trim();
  if(!nome){toast('Preencha o nome completo','er');return;}
  const quadro=$('f-quadro').value;
  const payload={
    nome_completo:nome,
    cpf:$('f-cpf').value.trim()||null,
    telefone_principal:$('f-tel').value.trim()||null,
    canal_whatsapp:$('f-canal').value||null,
    origem:$('f-origem').value||null,
    trello_url:$('f-trello').value.trim()||null,
    quadro:quadro,
    lista_id:$('f-lista').value||null,
    data_nascimento_bebe:$('f-dn').value||null,
    data_saida_emprego:$('f-ds').value||null,
    data_entrega:$('f-entrega').value||null,
    valor_beneficio_esperado:m2f($('f-vb'))||null,
    valor_honorarios:m2f($('f-vh'))||null,
    observacoes:$('f-obs').value.trim()||null,
    atualizado_em:new Date().toISOString()
  };
  const etqSel=[...document.querySelectorAll('#etp .ett.on')].map(e=>e.getAttribute('data-etq'));
  btn.disabled=true;btn.textContent='Salvando...';
  let cid=id,error;
  if(id){({error}=await sb.from('crm_clientes').update(payload).eq('id',id));}
  else{const r=await sb.from('crm_clientes').insert(payload).select('id').single();error=r.error;if(r.data)cid=r.data.id;}
  if(error){toast('Erro ao salvar: '+error.message,'er');btn.disabled=false;btn.textContent=id?'Salvar alterações':'Criar cliente';return;}
  await sb.from('crm_clientes_etiquetas').delete().eq('cliente_id',cid);
  if(etqSel.length)await sb.from('crm_clientes_etiquetas').insert(etqSel.map(e=>({cliente_id:cid,etiqueta_id:e})));
  finCarregado=false;
  toast(id?'Cliente atualizado':'Cliente criado','ok');
  location.hash='#/quadro/'+quadro;
}
async function excluirCliente(id){
  if(!confirm('Excluir esta cliente? Essa ação não pode ser desfeita.'))return;
  const{error}=await sb.from('crm_clientes').delete().eq('id',id);
  if(error){toast('Erro ao excluir','er');return;}
  finCarregado=false;toast('Cliente excluída','ok');location.hash='#/';
}

function renderChips(){
  const c={todos:0,previstos:0,atrasados:0,recebidos:0,inadimplentes:0,cancelados:0};
  PARC.forEach(p=>{c.todos++;const s=stD(p);
    if(s==='previsto')c.previstos++;else if(s==='atrasado')c.atrasados++;
    else if(s==='recebido')c.recebidos++;else if(s==='inadimplente')c.inadimplentes++;
    else if(s==='cancelado')c.cancelados++;});
  $('rchips').innerHTML=[{k:'todos',l:'Todos',x:''},{k:'previstos',l:'Previstos',x:''},{k:'atrasados',l:'Atrasados',x:'ra'},{k:'recebidos',l:'Recebidos',x:'ga'},{k:'inadimplentes',l:'Inadimplentes',x:''},{k:'cancelados',l:'Cancelados',x:''}]
    .map(x=>`<button class="fchip ${x.x}${rfiltro===x.k?' a':''}" onclick="setFiltro('${x.k}')">${x.l} (${c[x.k]})</button>`).join('');
}
function renderCal(){
  $('calmes').textContent=fMes(calMes);
  const ano=calMes.getFullYear(),mes=calMes.getMonth();
  const dias=new Date(ano,mes+1,0).getDate(),prim=new Date(ano,mes,1).getDay();
  const ms=`${ano}-${String(mes+1).padStart(2,'0')}`,mapa={};
  PARC.filter(p=>p.data_vencimento&&p.data_vencimento.startsWith(ms)).forEach(p=>{
    const d=parseInt(p.data_vencimento.split('-')[2]);
    if(!mapa[d])mapa[d]={n:0,atr:false,rec:false,prev:false};
    mapa[d].n++;const s=stD(p);
    if(s==='atrasado'||s==='inadimplente')mapa[d].atr=true;
    else if(s==='recebido')mapa[d].rec=true;
    else if(s==='previsto')mapa[d].prev=true;
  });
  const tISO=fISO(today());
  let h='<div class="cg">';
  ['Dom','Seg','Ter','Qua','Qui','Sex','Sab'].forEach(d=>h+=`<div class="chd">${d}</div>`);
  for(let i=0;i<prim;i++)h+='<div class="cc em"></div>';
  for(let d=1;d<=dias;d++){
    const iso=`${ms}-${String(d).padStart(2,'0')}`,m=mapa[d];
    let cls='cc';if(iso===tISO)cls+=' td';
    if(m){cls+=' hp';if(m.atr)cls+=' cr';else if(m.rec&&!m.prev)cls+=' cg2';else if(m.prev)cls+=' cy';}
    h+=`<div class="${cls}" ${m?`onclick="abreMDia('${iso}')"`:''}><div class="cd">${d}</div>${m?`<div class="cn">${m.n}</div>`:''}</div>`;
  }
  $('calgrid').innerHTML=h+'</div>';
}
function renderLista(){
  const busca=($('rbusca')&&$('rbusca').value||'').toLowerCase();
  const ord=($('rordem')&&$('rordem').value)||'proximo';
  const mapa={};
  PARC.forEach(p=>{
    if(p.status==='cancelado'&&rfiltro!=='cancelados')return;
    const s=stD(p);
    if(rfiltro==='previstos'&&s!=='previsto')return;
    if(rfiltro==='atrasados'&&s!=='atrasado')return;
    if(rfiltro==='recebidos'&&s!=='recebido')return;
    if(rfiltro==='inadimplentes'&&s!=='inadimplente')return;
    if(rfiltro==='cancelados'&&s!=='cancelado')return;
    const cid=pCli(p)||p.cliente_nome;
    if(!mapa[cid])mapa[cid]={nm:p.cliente_nome,cid:pCli(p),ps:[],prox:null,tot:0};
    mapa[cid].ps.push(p);mapa[cid].tot+=parseFloat(p.valor_honorario||0);
    if(s==='previsto'||s==='atrasado'){if(!mapa[cid].prox||p.data_vencimento<mapa[cid].prox)mapa[cid].prox=p.data_vencimento;}
  });
  let lista=Object.values(mapa).filter(c=>!busca||(c.nm||'').toLowerCase().includes(busca));
  if(ord==='proximo')lista.sort((a,b)=>{if(!a.prox&&!b.prox)return(a.nm||'').localeCompare(b.nm||'');if(!a.prox)return 1;if(!b.prox)return-1;return a.prox.localeCompare(b.prox);});
  else if(ord==='nome')lista.sort((a,b)=>(a.nm||'').localeCompare(b.nm||''));
  else lista.sort((a,b)=>b.tot-a.tot);
  if(!lista.length){$('rlista').innerHTML=`<div class="emp"><div class="empi">📂</div><div class="empt">Nenhum resultado</div></div>`;return;}
  $('rlista').innerHTML=lista.map(c=>{
    const cli=CLI.find(x=>x.id==c.cid);
    const ind=(REC.find(r=>(r.crm_cliente_id||r.cliente_id)==c.cid&&r.indicador_nome)||{}).indicador_nome;
    const wa=cli&&cli.whatsapp?`<a class="cl2 lwa" href="https://wa.me/55${cli.whatsapp.replace(/\D/g,'')}" target="_blank">💬 WhatsApp</a>`:'';
    const tr=cli&&cli.trello_url?`<a class="cl2 ltr" href="${escA(cli.trello_url)}" target="_blank">📋 Trello</a>`:'';
    const fc=c.cid?`<button class="cl2 lcr" onclick="abrirCardCliente('${c.cid}')">◈ Abrir card</button>`:'';
    const key=`cc_${String(c.cid||c.nm).replace(/\W/g,'_')}`;
    const rid=c.ps[0]&&c.ps[0].recebimento_id;
    const ph=c.ps.map(p=>{
      const s=stD(p);
      const vc=p.valor_cliente&&parseFloat(p.valor_cliente)>0?`<span style="color:var(--green);font-weight:600"> · Cliente: ${R(p.valor_cliente)}</span>`:'';
      const ac=(s!=='recebido'&&s!=='cancelado')?`
        <button class="bic bg" title="Recebido" onclick="abreMRec('${p.id}')">✓</button>
        ${s==='atrasado'?`<button class="bic bp2" title="Inadimplente" onclick="marcaInad('${p.id}')">⚑</button>`:''}

// ---------- MOVIMENTO AUTOMATICO NO QUADRO FINANCEIRO ----------
async function moverClienteFinanceiro(crmClienteId,nomeLista){
  if(!crmClienteId)return;
  const{data:lista}=await sb.from('crm_listas').select('id').eq('quadro','financeiro').eq('nome',nomeLista).eq('arquivada',false).single();
  if(!lista)return;
  const{count}=await sb.from('crm_clientes').select('id',{count:'exact',head:true}).eq('lista_id',lista.id);
  await sb.from('crm_clientes').update({
    quadro:'financeiro',lista_id:lista.id,posicao:(count||0),atualizado_em:new Date().toISOString()
  }).eq('id',crmClienteId);
}

async function checarFinalizacaoCliente(crmClienteId){
  if(!crmClienteId)return;
  const{data:parcelas}=await sb.from('pm_parcelas').select('status').eq('crm_cliente_id',crmClienteId).neq('status','cancelado');
  if(!parcelas||!parcelas.length)return;
  const todasRecebidas=parcelas.every(p=>p.status==='recebido');
  if(todasRecebidas)await moverClienteFinanceiro(crmClienteId,'Finalizado');
}

function buscaCli(){
  const q=($('fbcli').value||'').toLowerCase(),res=$('fbres');

  res.style.display='block';
  res.innerHTML=f.map(c=>`<div class="sri" onclick="selCli('${c.id}')">
    <div class="av" style="background:${avC(c.nome)};width:30px;height:30px;font-size:12px">${avL(c.nome)}</div>
    <div><div style="font-size:13px;font-weight:700">${esc(c.nome)}</div><div style="font-size:11px;color:var(--text3)">${esc(c.whatsapp)||''}</div></div></div>`).join('');
}
function selCli(cid){
  const c=CLI.find(x=>String(x.id)===String(cid));if(!c)return;
  fCliId=c.id;
  $('fcav').textContent=avL(c.nome);$('fcav').style.background=avC(c.nome);
  $('fcnm').textContent=c.nome;
  $('fca').style.display='none';$('fcs').style.display='block';$('fbres').style.display='none';
}
function trocarCli(){fCliId=null;$('fca').style.display='block';$('fcs').style.display='none';$('fbcli').value='';}
function setTipo(t){
  fTipo=t;
  $('ti').classList.toggle('s',t==='i');$('tp').classList.toggle('s',t==='p');
  $('fcampoparc').style.display=t==='p'?'block':'none';
  $('ffd-wrap').style.display=t==='i'?'block':'none';
  $('cb-resumo').style.display=t==='i'?'block':'none';
  $('cb-resumo-simples').style.display=t==='p'?'block':'none';
  if(t==='i')$('fnp').value='1';
  geraParcs();
}
function togInd(){
  $('iarea').style.display=$('find').checked?'block':'none';
  if($('find').checked&&!$('findvl').value)$('findvl').value='200,00';
  recalc();
}
function recalc(){
  const vc=m2f($('fvc')),fp=parseFloat($('ffp').value)||30,fd=m2f($('ffd'));
  const br=vc*(fp/100),liq=Math.max(0,br-fd);
  $('cbruto').textContent=R(br);$('cdesc').textContent='- '+R(fd);$('cliq').textContent=R(liq);
  $('cliq-s').textContent=R(br);
  const ind=m2f($('findvl'));
  $('cliq2').textContent=R(liq);$('ccom').textContent='- '+R(ind);$('csob').textContent=R(Math.max(0,liq-ind));
  if(fParcs.length)recalcParcs();else geraParcs();
}
function geraParcs(){
  const n=parseInt($('fnp').value)||1,hoje=fISO(today());
  if(!fParcs.length||fParcs.length!==n){
    const old=fParcs;fParcs=[];
    for(let i=0;i<n;i++){
      let dt;
      if(old[0]&&old[0].data){dt=new Date(old[0].data+'T12:00:00');dt.setMonth(dt.getMonth()+i);}
      else{dt=new Date(hoje+'T12:00:00');dt.setMonth(dt.getMonth()+i);}
      fParcs.push({data:fISO(dt),cli:(old[i]&&old[i].cli)||(i>0&&i<n-1?1500:0),fd:(old[i]&&old[i].fd)||0});
    }
  }
  recalcParcs();
}
function recalcParcs(){
  const n=fParcs.length,vcTotal=m2f($('fvc')),fp=parseFloat($('ffp').value)||30;
  if(n>1){
    const soma=fParcs.slice(0,n-1).reduce((s,p)=>s+(parseFloat(p.cli)||0),0);
    fParcs[n-1].cli=Math.max(0,vcTotal-soma);
  }else if(n===1)fParcs[0].cli=vcTotal;
  fParcs.forEach(p=>{
    const cli=parseFloat(p.cli)||0,fd=parseFloat(p.fd)||0;
    p.hon=Math.max(0,cli*(fp/100)-fd);
  });
  renderParcsForm();
}
function renderParcsForm(){
  const n=fParcs.length,cont=$('parcsform');
  if(!cont)return;
  const fp=parseFloat($('ffp').value)||30;
  cont.innerHTML=fParcs.map((p,i)=>`<div class="pfc">
    <div style="display:flex;align-items:center;gap:8px;margin-bottom:12px;flex-wrap:wrap">
      <div class="pfn">${i+1}</div><div style="font-size:13px;font-weight:700">Parcela ${i+1}/${n}</div>
      ${i===0?`<span class="ti">Valor do INSS</span>`:`<span class="te">Estimativa</span>`}</div>
    <div class="fg">
      <div class="fld"><label>Data de vencimento</label><input type="date" id="fpd${i}" value="${p.data}" onchange="upP(${i},'d',this.value)"/></div>
      <div class="fld"><label>Valor que a cliente recebe (R$)</label>
        <input type="text" id="fpc${i}" value="${floatToMoney(p.cli)}" placeholder="Quanto o INSS paga" data-money="" inputmode="decimal" onchange="upP(${i},'c',this.value)" ${(i===n-1&&n>1)?'disabled style="opacity:.6"':''}/>
        ${(i===n-1&&n>1)?`<span class="fhint">Calculado automaticamente (resto do total)</span>`:''}</div>
      <div class="fld"><label>Desconto honorário (R$)</label>
        <input type="text" id="fpfd${i}" value="${floatToMoney(p.fd)}" placeholder="0,00" data-money="" inputmode="decimal" onchange="upP(${i},'fd',this.value)"/></div>
      <div class="fld"><label>Valor honorário (R$)</label>
        <input type="text" id="fph${i}" data-money="" inputmode="decimal" value="${floatToMoney(p.hon)}" onchange="upP(${i},'h',this.value)"/>
        <span class="fhint">${fp}% do valor da cliente${p.fd?` − ${R(p.fd)}`:''}</span></div>
    </div></div>`).join('');
}
function upP(i,c,v){
  if(c==='d'){
    fParcs[i].data=v;
    if(i===0){
      const base=new Date(v+'T12:00:00');
      for(let j=1;j<fParcs.length;j++){
        const dt=new Date(base);dt.setMonth(dt.getMonth()+j);
        fParcs[j].data=fISO(dt);
        const el=$('fpd'+j);if(el)el.value=fParcs[j].data;
      }
    }
    return;
  }
  if(c==='h'){fParcs[i].hon=moneyToFloat(v);return;}
  if(c==='fd'){fParcs[i].fd=moneyToFloat(v);recalcParcs();return;}
  if(c==='c'){
    fParcs[i].cli=moneyToFloat(v);
    if(i===1)for(let j=2;j<fParcs.length-1;j++)fParcs[j].cli=fParcs[1].cli;
    recalcParcs();
  }
}
async function submitRec(){
  if(!fCliId){toast('Selecione uma cliente.','er');return;}
  const vc=m2f($('fvc'));
  if(!vc){toast('Informe o valor da cliente.','er');return;}
  const cli=CLI.find(c=>String(c.id)===String(fCliId));
  if(!cli){toast('Cliente não encontrada.','er');return;}
  const fp=parseFloat($('ffp').value)||30,fd=m2f($('ffd'));
  const feeBr=vc*(fp/100),feeLiq=Math.max(0,feeBr-fd);
  const temInd=$('find').checked;
  const indNm=temInd?$('findnm').value.trim():'';
  const indVl=temInd?m2f($('findvl')):0;
  const n=parseInt($('fnp').value)||1;
  const btn=$('fsubmit');btn.textContent='Salvando...';btn.disabled=true;

  const rid=Date.now();
  const rd={id:rid,crm_cliente_id:fCliId,cliente_nome:cli.nome,valor_cliente:vc,num_parcelas:n,
    fee_percent:fp,fee_bruto:feeBr,fee_desconto:fd,fee_liquido:feeLiq,
    indicador_nome:indNm||null,indicador_comissao_tipo:temInd?'fixed':null,
    indicador_comissao_valor:indVl,indicador_comissao_total:indVl,
    sobra_liquida:Math.max(0,feeLiq-indVl),metodo_pagamento:'PIX',notas:$('fnotas').value||null};

  const{error:er}=await sb.from('pm_recebimentos').insert(rd);
  if(er){btn.disabled=false;btn.textContent='Salvar recebimento';toast('Erro ao salvar: '+er.message,'er');return;}

  const base=Date.now()+1;
  const linhas=fParcs.map((p,i)=>({id:base+i,recebimento_id:rid,crm_cliente_id:fCliId,cliente_nome:cli.nome,
    num_parcela:i+1,total_parcelas:n,valor_honorario:p.hon,valor_cliente:p.cli||0,
    data_vencimento:p.data,status:'previsto'}));
  const{error:ep}=await sb.from('pm_parcelas').insert(linhas);
  btn.disabled=false;btn.textContent='Salvar recebimento';
  if(ep){toast('Recebimento salvo, mas houve erro nas parcelas: '+ep.message,'er');return;}

  toast('Recebimento salvo!','ok');
  await loadFin(true);
  await moverClienteFinanceiro(fCliId,'Em pagamento');
  location.hash='#/recebimentos';
}

// ETIQUETAS
// ============================================================
async function pageEtiquetas(){
  const pc=$('pc');marcarNav('etiquetas');
  pc.innerHTML='<div class="emp">Carregando...</div>';
  const{data,error}=await sb.from('crm_etiquetas').select('*').order('nome');
  if(error){pc.innerHTML='<div class="emp"><div class="empt">Erro ao carregar</div></div>';return;}
  ETQ=data||[];
  const linhas=ETQ.map(t=>`<tr data-etq="${t.id}">
      <td><input class="inp-mini" style="width:170px" type="text" value="${escA(t.nome)}"/></td>
      <td><input class="inp-cor" type="color" value="${escA(t.cor)}"/></td>
      <td><span class="chip" style="background:${escA(t.cor)}">${esc(t.nome)}</span></td>
      <td style="text-align:right;white-space:nowrap">
        <button class="bmini" onclick="salvarEtiqueta('${t.id}',this)">Salvar</button>
        <button class="bmini" style="color:var(--red);border-color:#F0C8C2" onclick="excluirEtiqueta('${t.id}')">Excluir</button></td>
    </tr>`).join('');
  pc.innerHTML=`<div class="pgh"><div><div class="pgt">Etiquetas</div><div class="pgs">Marcadores coloridos para os cards</div></div></div>
    <div class="fs"><div class="fst">Criar nova etiqueta</div>
      <div class="fg" style="align-items:end">
        <div class="fld"><label>Nome</label><input type="text" id="ne-nome" placeholder="Ex: Tem direito"/></div>
        <div class="fld"><label>Cor</label><input type="color" class="inp-cor" id="ne-cor" value="#0A9396"/></div>
        <div class="fld ff"><button class="btn btnp" onclick="criarEtiqueta()" style="width:auto">Criar etiqueta</button></div>
      </div></div>
    ${ETQ.length?`<table class="tbl"><thead><tr><th>Nome</th><th>Cor</th><th>Como aparece</th><th></th></tr></thead><tbody>${linhas}</tbody></table>`
      :'<div class="emp"><div class="empt">Nenhuma etiqueta criada</div></div>'}`;
}
async function criarEtiqueta(){
  const nome=$('ne-nome').value.trim(),cor=$('ne-cor').value;
  if(!nome){toast('Digite o nome','er');return;}
  const{error}=await sb.from('crm_etiquetas').insert({nome,cor});
  if(error){toast('Erro ao criar','er');return;}
  toast('Etiqueta criada','ok');pageEtiquetas();
}
async function salvarEtiqueta(id,btn){
  const tr=btn.closest('tr');
  const nome=tr.querySelector('input[type=text]').value.trim(),cor=tr.querySelector('input[type=color]').value;
  if(!nome){toast('O nome não pode ficar vazio','er');return;}
  const{error}=await sb.from('crm_etiquetas').update({nome,cor}).eq('id',id);
  if(error){toast('Erro ao salvar','er');return;}
  toast('Etiqueta salva','ok');pageEtiquetas();
}
async function excluirEtiqueta(id){
  if(!confirm('Excluir esta etiqueta? Ela sai de todas as clientes que a tiverem.'))return;
  const{error}=await sb.from('crm_etiquetas').delete().eq('id',id);
  if(error){toast('Erro ao excluir','er');return;}
  toast('Etiqueta excluída','ok');pageEtiquetas();
}

// ============================================================
// CAMPANHA
// ============================================================
async function pageCampanha(){
  const pc=$('pc');marcarNav('campanha');
  if(U.nivel!=='proprietario'){pc.innerHTML='<div class="emp"><div class="empt">Tela restrita a proprietários</div></div>';return;}
  pc.innerHTML='<div class="emp">Carregando...</div>';
  const[{data:inst,error},{data:disp}]=await Promise.all([
    sb.from('crm_instancias_whatsapp').select('*').order('numero_telefone'),
    sb.from('crm_campanha_disparos').select('*').order('criado_em',{ascending:false}).limit(30)
  ]);
  if(error){pc.innerHTML='<div class="emp"><div class="empt">Erro ao carregar</div></div>';return;}
  const I=inst||[],D=disp||[];
  const ruins=I.filter(x=>x.status==='degradado'||(x.taxa_entrega!==null&&x.taxa_entrega<80));
  const alerta=ruins.length?`<div class="alertbar">Atenção: ${ruins.length===1?'o número '+esc(ruins[0].numero_telefone)+' está':ruins.length+' números estão'} com entrega baixa. Considere reduzir o teto diário ou pausar.</div>`:'';
  const linhasI=I.map(x=>{
    const tx=(x.taxa_entrega!==null&&x.taxa_entrega!==undefined)?Number(x.taxa_entrega).toFixed(0)+'%':'—';
    const cl=(x.taxa_entrega===null||x.taxa_entrega===undefined)?'nt':(x.taxa_entrega<80?'wr':'ok');
    const sc=x.status==='ativo'?'ok':(x.status==='degradado'?'wr':'nt');
    return`<tr data-inst="${x.id}">
      <td style="font-weight:700">${esc(x.numero_telefone)}</td><td>${CANAIS[x.canal]||esc(x.canal)}</td>
      <td><input class="inp-mini" type="number" min="0" value="${x.teto_diario_atual}"/> <button class="bmini" onclick="salvarTeto('${x.id}',this)">Salvar</button></td>
      <td>${x.disparos_hoje} / ${x.teto_diario_atual}</td>
      <td><span class="bdg ${cl}">${tx}</span></td><td><span class="bdg ${sc}">${esc(x.status)}</span></td></tr>`;
  }).join('');
  const cls={agendado:'nt',enviado:'nt',entregue:'ok',lido:'ok',respondido:'ok',falhou:'wr'};
  const mapa={};I.forEach(x=>mapa[x.id]=x.numero_telefone);
  const linhasD=D.map(d=>`<tr><td>${esc(d.contato_nome)||'—'}</td><td>${esc(d.contato_telefone)}</td>
      <td>${esc(mapa[d.instancia_id])||'—'}</td>
      <td>${d.data_hora_agendada?new Date(d.data_hora_agendada).toLocaleString('pt-BR'):'—'}</td>
      <td><span class="bdg ${cls[d.status]||'nt'}">${esc(d.status)}</span></td></tr>`).join('');
  pc.innerHTML=`<div class="pgh"><div><div class="pgt">Campanha</div><div class="pgs">Números, tetos diários e disparos de indicação</div></div></div>
    ${alerta}
    <div class="fs"><div class="fst">Adicionar número</div>
      <div class="fg" style="align-items:end">
        <div class="fld"><label>Número (com DDD)</label><input type="text" id="ni-num" placeholder="41999999999"/></div>
        <div class="fld"><label>Canal</label><select id="ni-canal"><option value="whatsgw">WhatsGW</option><option value="evolution">Evolution</option><option value="meta_oficial">Meta oficial</option></select></div>
        <div class="fld"><label>Teto diário inicial</label><input type="number" id="ni-teto" min="0" value="20"/></div>
        <div class="fld"><button class="btn btnp" onclick="criarInstancia()" style="width:auto">Adicionar</button></div>
      </div></div>
    <div class="st">Números / instâncias</div>
    ${I.length?`<table class="tbl"><thead><tr><th>Número</th><th>Canal</th><th>Teto diário</th><th>Hoje</th><th>Entrega</th><th>Status</th></tr></thead><tbody>${linhasI}</tbody></table>`
      :'<div class="emp"><div class="empt">Nenhum número cadastrado</div></div>'}
    <div class="st">Últimos disparos</div>
    ${D.length?`<table class="tbl"><thead><tr><th>Contato</th><th>Telefone</th><th>Número usado</th><th>Agendado</th><th>Status</th></tr></thead><tbody>${linhasD}</tbody></table>`
      :'<div class="emp"><div class="empt">Nenhum disparo registrado</div></div>'}`;
}
async function salvarTeto(id,btn){
  const v=parseInt(btn.closest('tr').querySelector('input').value,10);
  if(isNaN(v)||v<0){toast('Número inválido','er');return;}
  const{error}=await sb.from('crm_instancias_whatsapp').update({teto_diario_atual:v,atualizado_em:new Date().toISOString()}).eq('id',id);
  if(error){toast('Erro ao salvar','er');return;}
  toast('Teto atualizado','ok');pageCampanha();
}
async function criarInstancia(){
  const num=$('ni-num').value.trim(),canal=$('ni-canal').value,teto=parseInt($('ni-teto').value,10)||0;
  if(!num){toast('Digite o número','er');return;}
  const{error}=await sb.from('crm_instancias_whatsapp').insert({numero_telefone:num,canal,teto_diario_atual:teto,disparos_hoje:0,status:'ativo'});
  if(error){toast('Erro ao adicionar','er');return;}
  toast('Número adicionado','ok');pageCampanha();
}
</script>
