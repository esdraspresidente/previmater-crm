<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
<meta name="theme-color" content="#0A9396"/>
<title>PreviMater — CRM</title>
<link rel="manifest" href="manifest.json"/>
<link rel="icon" href="icon192.png"/>
<link rel="apple-touch-icon" href="icon192.png"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet"/>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{
  --teal:#0A9396;--teal2:#00B4D8;--teal-l:#E0F4F5;--teal-m:#94D2BD;
  --rose:#E87CA0;--rose-l:#FCE8F0;
  --bg:#EFF7F7;--white:#FFFFFF;
  --text:#0D2B2B;--text2:#3D6060;--text3:#7FA8A8;
  --border:#D4EBEB;--border2:#E8F4F4;
  --green:#0A7A5C;--green-bg:#E0F5EE;
  --yellow:#B06000;--yellow-bg:#FEF3E0;
  --red:#C0392B;--red-bg:#FDECEA;
  --purple:#6B3FA0;--purple-bg:#F0EAFA;
  --gray:#5A7070;--gray-bg:#EEF3F3;
  --sw:248px;--r:12px;--rl:16px;--rx:20px;
  --sh:0 1px 4px rgba(10,147,150,.08);
  --shm:0 4px 20px rgba(10,147,150,.13);
  --shl:0 8px 40px rgba(10,147,150,.18);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
html,body{min-height:100%;font-family:'Plus Jakarta Sans',sans-serif;background:var(--bg);color:var(--text);font-size:14px;-webkit-font-smoothing:antialiased;}

#ls{position:fixed;inset:0;background:linear-gradient(135deg,#0A9396,#00B4D8);display:flex;align-items:center;justify-content:center;z-index:999;flex-direction:column;gap:18px;}
#ls.h{display:none;}
.spin{width:30px;height:30px;border:3px solid rgba(255,255,255,.3);border-top-color:#fff;border-radius:50%;animation:sp .7s linear infinite;}
@keyframes sp{to{transform:rotate(360deg)}}

#ln{position:fixed;inset:0;background:linear-gradient(135deg,#0A9396 0%,#00B4D8 60%,#94D2BD 100%);display:flex;align-items:center;justify-content:center;z-index:998;padding:24px;}
#ln.h{display:none;}
.lbox{background:var(--white);border-radius:22px;padding:40px 36px;width:100%;max-width:370px;box-shadow:var(--shl);}
.llogo{display:flex;flex-direction:column;align-items:center;gap:10px;margin-bottom:28px;}
.lico{width:60px;height:60px;border-radius:16px;overflow:hidden;box-shadow:0 8px 24px rgba(10,147,150,.3);}
.ltitle{font-size:22px;font-weight:800;color:var(--text);letter-spacing:-.4px;}
.lsub{font-size:12px;color:var(--text3);margin-top:-6px;}
.lf{display:flex;flex-direction:column;gap:5px;margin-bottom:13px;}
.lf label{font-size:10px;font-weight:700;color:var(--text3);text-transform:uppercase;letter-spacing:.8px;}
.lf input{background:#F3FAFA;border:1.5px solid var(--border);border-radius:9px;padding:11px 14px;color:var(--text);font-size:14px;font-family:inherit;width:100%;transition:border .15s;}
.lf input:focus{outline:none;border-color:var(--teal);box-shadow:0 0 0 3px rgba(10,147,150,.14);}
.lbtn{width:100%;background:linear-gradient(135deg,#0A9396,#00B4D8);color:#fff;border:none;padding:13px;border-radius:10px;font-weight:700;font-size:15px;cursor:pointer;font-family:inherit;margin-top:6px;box-shadow:0 4px 14px rgba(10,147,150,.28);}
.lbtn:active{opacity:.85;}
.lerr{font-size:12px;color:var(--red);text-align:center;margin-top:8px;min-height:14px;}

#app{display:none;min-height:100vh;}
#app.v{display:flex;}
#sb{position:fixed;top:0;left:0;bottom:0;width:var(--sw);background:var(--white);border-right:1px solid var(--border);display:flex;flex-direction:column;z-index:100;overflow-y:auto;transition:transform .25s cubic-bezier(.4,0,.2,1);}
@media(max-width:900px){#sb{transform:translateX(-100%);}#sb.o{transform:none;}}
#ov{position:fixed;inset:0;background:rgba(0,0,0,.38);z-index:99;display:none;}
#ov.o{display:block;}
.sbh{padding:20px 18px 16px;border-bottom:1px solid var(--border2);display:flex;align-items:flex-start;justify-content:space-between;gap:8px;}
.sbl{display:flex;align-items:center;gap:11px;}
.sbi{width:38px;height:38px;border-radius:11px;overflow:hidden;flex-shrink:0;box-shadow:0 4px 12px rgba(10,147,150,.25);}
.sblt{font-size:15px;font-weight:800;color:var(--text);letter-spacing:-.3px;line-height:1.1;}
.sbls{font-size:10px;color:var(--text3);}
.sbsearch{display:flex;align-items:center;gap:9px;background:var(--bg);border:1.5px solid var(--border);border-radius:10px;padding:9px 13px;margin:2px 18px 14px;cursor:pointer;color:var(--text3);font-size:13px;font-family:inherit;}
.sbsearch:hover{border-color:var(--teal);color:var(--teal);}
.sbn{flex:1;padding:14px 10px;}
.snl{font-size:10px;font-weight:700;color:var(--text3);text-transform:uppercase;letter-spacing:1px;padding:0 10px;margin:12px 0 4px;}
.ni{width:100%;background:none;border:none;display:flex;align-items:center;gap:10px;padding:9px 12px;font-size:13px;font-weight:600;color:var(--text2);cursor:pointer;font-family:inherit;border-radius:10px;margin-bottom:2px;transition:all .12s;text-align:left;}
.ni:hover{background:var(--teal-l);color:var(--teal);}
.ni.a{background:var(--teal-l);color:var(--teal);}
.nic{width:30px;height:30px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:14px;background:var(--bg);transition:all .12s;flex-shrink:0;}
.ni.a .nic{background:var(--teal);color:#fff;}
.sbf{padding:12px 10px;border-top:1px solid var(--border2);}
.sbu{display:flex;align-items:center;gap:9px;padding:9px 12px;border-radius:10px;margin-bottom:8px;}
.sbav{width:32px;height:32px;border-radius:50%;background:linear-gradient(135deg,#0A9396,#00B4D8);display:flex;align-items:center;justify-content:center;color:#fff;font-size:12px;font-weight:700;flex-shrink:0;}
.sbnm{font-size:13px;font-weight:700;color:var(--text);}
.sbem{font-size:10px;color:var(--text3);}
.sblg{width:100%;background:none;border:1.5px solid var(--border);color:var(--text3);padding:8px;border-radius:9px;font-size:12px;font-weight:600;cursor:pointer;font-family:inherit;display:flex;align-items:center;gap:5px;justify-content:center;transition:all .12s;}
.sblg:hover{border-color:var(--red);color:var(--red);}

#mw{margin-left:var(--sw);flex:1;min-height:100vh;display:flex;flex-direction:column;min-width:0;}
@media(max-width:900px){#mw{margin-left:0;}}
#tb{display:none;background:var(--white);border-bottom:1px solid var(--border);padding:0 16px;height:54px;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:98;}
@media(max-width:900px){#tb{display:flex;}}
#pc{flex:1;padding:26px 26px 70px;min-width:0;}
@media(max-width:900px){#pc{padding:18px 14px 70px;}}

.pgh{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:20px;flex-wrap:wrap;gap:12px;}
.pgt{font-size:24px;font-weight:800;color:var(--text);letter-spacing:-.5px;}
.pgs{font-size:13px;color:var(--text3);margin-top:3px;}
.st{font-size:11px;font-weight:700;color:var(--text3);text-transform:uppercase;letter-spacing:.9px;margin:22px 0 10px;}
.card{background:var(--white);border:1px solid var(--border);border-radius:var(--rl);box-shadow:var(--sh);}

/* KANBAN */
.kb{display:flex;gap:12px;align-items:flex-start;overflow-x:auto;padding-bottom:14px;height:calc(100vh - 172px);}
@media(max-width:900px){.kb{height:calc(100vh - 226px);}}
.kl{flex:0 0 262px;width:262px;background:var(--white);border:1px solid var(--border);border-radius:var(--rl);box-shadow:var(--sh);display:flex;flex-direction:column;max-height:calc(100vh - 188px);transition:flex-basis .15s,width .15s;}
@media(max-width:900px){.kl{max-height:calc(100vh - 242px);}}
.kl.collapsed{flex:0 0 42px;width:42px;}
.kl.collapsed .klb,.kl.collapsed .klf{display:none;}
.kl.collapsed .klh{flex-direction:column-reverse;height:100%;padding:10px 6px;gap:10px;justify-content:flex-end;}
.kl.collapsed .klh>div{flex-direction:column;gap:8px;}
.kl.collapsed .kln{writing-mode:vertical-rl;transform:rotate(180deg);white-space:nowrap;font-size:11px;margin-top:4px;}
.kl.collapsed .klc{writing-mode:horizontal-tb;}
.kl.dragover{border-color:var(--teal);box-shadow:0 0 0 3px rgba(10,147,150,.16);}
.klh{padding:12px 14px 10px;border-bottom:1px solid var(--border2);border-top:3px solid var(--teal);border-radius:var(--rl) var(--rl) 0 0;display:flex;align-items:center;justify-content:space-between;gap:6px;}
.kln{font-size:12px;font-weight:800;color:var(--text);line-height:1.25;}
.klc{font-size:10px;font-weight:700;color:var(--text3);background:var(--bg);padding:2px 7px;border-radius:8px;flex-shrink:0;}
.klm{background:none;border:none;color:var(--text3);cursor:pointer;font-size:15px;line-height:1;padding:2px 4px;border-radius:6px;flex-shrink:0;}
.klm:hover{background:var(--teal-l);color:var(--teal);}
.klb{padding:10px;overflow-y:auto;flex:1;min-height:56px;}
.kc{background:var(--white);border:1.5px solid var(--border);border-radius:11px;padding:11px 12px;margin-bottom:8px;cursor:grab;transition:all .13s;box-shadow:var(--sh);position:relative;}
.kc:hover{border-color:var(--teal);box-shadow:var(--shm);transform:translateY(-1px);}
.kc.dragging{opacity:.4;cursor:grabbing;}
.kcn{font-size:13px;font-weight:700;color:var(--text);line-height:1.3;padding-right:26px;}
.kcm{font-size:11px;color:var(--text3);margin-top:3px;display:flex;align-items:center;gap:5px;flex-wrap:wrap;}
.kc-anexo{display:inline-flex;align-items:center;color:var(--text3);font-weight:700;}
.kcv{font-size:12px;font-weight:800;color:var(--teal);}
.kce{display:flex;flex-wrap:wrap;gap:4px;margin-top:7px;}
.kcmv{position:absolute;top:7px;right:7px;background:var(--bg);border:none;color:var(--text3);width:24px;height:24px;border-radius:7px;cursor:pointer;font-size:12px;line-height:1;opacity:0;transition:opacity .13s;}
.kc:hover .kcmv{opacity:1;}
@media(max-width:900px){.kcmv{opacity:1;}}
.kcmv:hover{background:var(--teal);color:#fff;}
.chip{font-size:11px;font-weight:700;color:#fff;padding:4px 10px;border-radius:5px;}
.ent{display:inline-flex;align-items:center;gap:4px;font-size:10px;font-weight:800;padding:3px 8px;border-radius:7px;}
.ent-ok{background:var(--gray-bg);color:var(--gray);}
.ent-soon{background:var(--yellow-bg);color:var(--yellow);}
.ent-late{background:var(--red-bg);color:var(--red);}
.klf{padding:8px 10px 10px;}
.kadd{width:100%;background:none;border:none;color:var(--text3);font-family:inherit;font-size:12px;font-weight:700;cursor:pointer;padding:7px;border-radius:8px;text-align:left;}
.kadd:hover{background:var(--teal-l);color:var(--teal);}
.knl{flex:0 0 200px;width:200px;border:2px dashed var(--border);border-radius:var(--rl);background:none;color:var(--text3);font-family:inherit;font-size:12px;font-weight:700;padding:14px;cursor:pointer;transition:all .15s;}
.knl:hover{border-color:var(--teal);color:var(--teal);background:var(--teal-l);}
.kempty{font-size:11px;color:var(--text3);text-align:center;padding:14px 6px;}

/* STAT / KPI */
.sgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:20px;}
@media(max-width:1100px){.sgrid{grid-template-columns:repeat(2,1fr);}}
@media(max-width:500px){.sgrid{grid-template-columns:1fr 1fr;gap:8px;}}
.sc{background:var(--white);border:1px solid var(--border);border-radius:var(--rl);padding:16px 18px;box-shadow:var(--sh);transition:all .15s;}
.sc:hover{box-shadow:var(--shm);transform:translateY(-1px);}
.scl{font-size:10px;font-weight:700;color:var(--text3);text-transform:uppercase;letter-spacing:.7px;margin-bottom:6px;}
.scv{font-size:20px;font-weight:800;letter-spacing:-.5px;color:var(--text);}
.scv.tl{color:var(--teal);}.scv.yw{color:var(--yellow);}.scv.rd{color:var(--red);}
.scs{font-size:11px;color:var(--text3);margin-top:4px;}
.kgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:20px;}
@media(max-width:1100px){.kgrid{grid-template-columns:repeat(2,1fr);}}
@media(max-width:500px){.kgrid{grid-template-columns:1fr 1fr;gap:8px;}}
.kpc{background:var(--white);border:1px solid var(--border);border-radius:var(--rl);padding:16px 18px;box-shadow:var(--sh);cursor:pointer;transition:all .15s;}
.kpc:hover{box-shadow:var(--shm);transform:translateY(-1px);}
.ki{width:36px;height:36px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:17px;margin-bottom:10px;}
.kpl{font-size:10px;font-weight:700;color:var(--text3);text-transform:uppercase;letter-spacing:.7px;margin-bottom:4px;}
.kv{font-size:17px;font-weight:800;letter-spacing:-.3px;}
.kh{font-size:11px;color:var(--text3);margin-top:4px;}
.mn{display:flex;align-items:center;gap:7px;}
.mb2{width:28px;height:28px;border-radius:7px;border:1.5px solid var(--border);background:none;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:14px;color:var(--text2);transition:all .12s;}
.mb2:hover{border-color:var(--teal);color:var(--teal);}
.ml{font-size:14px;font-weight:700;color:var(--text);min-width:130px;text-align:center;}

/* BADGES */
.bdg{display:inline-flex;align-items:center;padding:3px 9px;border-radius:20px;font-size:11px;font-weight:700;white-space:nowrap;}
.bp{background:var(--yellow-bg);color:var(--yellow);}
.br{background:var(--green-bg);color:var(--green);}
.ba{background:var(--red-bg);color:var(--red);}
.bi{background:var(--purple-bg);color:var(--purple);}
.bc{background:var(--gray-bg);color:var(--gray);}
.bdg.ok{background:var(--green-bg);color:var(--green);}
.bdg.wr{background:var(--red-bg);color:var(--red);}
.bdg.nt{background:var(--gray-bg);color:var(--gray);}

.aw{border-left:3px solid var(--red);padding-left:14px;margin-bottom:20px;}
.at{font-size:13px;font-weight:700;color:var(--red);display:flex;align-items:center;gap:6px;margin-bottom:10px;}
.lr{padding:12px 16px;display:flex;align-items:center;gap:11px;border-bottom:1px solid var(--border2);transition:background .1s;}
.lr:last-child{border-bottom:none;}
.lr:hover{background:#FAFEFE;}
.av{width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:700;color:#fff;flex-shrink:0;}
.rn{font-size:13px;font-weight:700;color:var(--text);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:200px;}
.rm{font-size:11px;color:var(--text3);margin-top:2px;}
.rr{margin-left:auto;text-align:right;flex-shrink:0;}
.rv{font-size:14px;font-weight:800;color:var(--text);}
.rv.rd{color:var(--red);}
.dh{background:var(--red-bg);color:var(--red);font-size:10px;font-weight:700;padding:2px 6px;border-radius:7px;margin-left:4px;}
.dw{background:var(--yellow-bg);color:var(--yellow);font-size:10px;font-weight:700;padding:2px 6px;border-radius:7px;margin-left:4px;}
.dn{background:var(--gray-bg);color:var(--gray);font-size:10px;font-weight:700;padding:2px 6px;border-radius:7px;margin-left:4px;}

.fchips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px;}
.fchip{background:var(--white);border:1.5px solid var(--border);color:var(--text2);padding:5px 13px;border-radius:20px;font-size:12px;font-weight:600;cursor:pointer;transition:all .15s;font-family:inherit;}
.fchip:hover{border-color:var(--teal);color:var(--teal);}
.fchip.a{background:var(--teal);border-color:var(--teal);color:#fff;}
.fchip.ra.a{background:var(--red);border-color:var(--red);}
.fchip.ga.a{background:var(--green);border-color:var(--green);}
.sr{display:flex;gap:8px;margin-bottom:12px;}
.si{flex:1;background:var(--white);border:1.5px solid var(--border);border-radius:10px;padding:9px 13px;font-size:13px;font-family:inherit;color:var(--text);transition:border .15s;}
.si:focus{outline:none;border-color:var(--teal);box-shadow:0 0 0 3px rgba(10,147,150,.1);}
.ss{background:var(--white);border:1.5px solid var(--border);border-radius:10px;padding:9px 11px;font-size:12px;font-family:inherit;color:var(--text2);cursor:pointer;}
.ss:focus{outline:none;border-color:var(--teal);}

/* CALENDARIO */
.ch{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;}
.cl{display:flex;gap:12px;margin-bottom:10px;flex-wrap:wrap;}
.cli2{display:flex;align-items:center;gap:5px;font-size:11px;color:var(--text3);}
.cdo{width:8px;height:8px;border-radius:2px;}
.cg{display:grid;grid-template-columns:repeat(7,1fr);gap:3px;}
.chd{font-size:9px;font-weight:700;color:var(--text3);text-align:center;padding:3px 0;text-transform:uppercase;}
.cc{min-height:50px;border:1.5px solid var(--border2);border-radius:9px;padding:6px;background:var(--white);transition:all .12s;}
.cc.em{background:transparent;border-color:transparent;}
.cc.hp{cursor:pointer;}
.cc.hp:hover{border-color:var(--teal);box-shadow:0 0 0 2px rgba(10,147,150,.12);}
.cc.td{border-color:var(--teal);background:var(--teal-l);}
.cc.cr{background:#FFF5F5;border-color:#FECACA;}
.cc.cg2{background:#F0FFF8;border-color:#99E6C8;}
.cc.cy{background:#FFFBF0;border-color:#FDE68A;}
.cd{font-size:11px;font-weight:700;color:var(--text2);}
.cn{font-size:10px;color:var(--text3);margin-top:1px;}

/* CLIENTE CARD (recebimentos) */
.ccard{background:var(--white);border:1px solid var(--border);border-radius:var(--rl);overflow:hidden;margin-bottom:8px;box-shadow:var(--sh);}
.cch{padding:13px 16px;display:flex;align-items:center;gap:11px;cursor:pointer;transition:background .1s;}
.cch:hover{background:#FAFEFE;}
.cci{flex:1;min-width:0;}
.ccn{font-size:14px;font-weight:700;color:var(--text);}
.ccm{font-size:11px;color:var(--text3);display:flex;gap:7px;flex-wrap:wrap;margin-top:2px;}
.ccv{font-size:15px;font-weight:800;color:var(--text);margin-right:6px;white-space:nowrap;}
.chv{font-size:11px;color:var(--text3);transition:transform .2s;flex-shrink:0;}
.chv.o{transform:rotate(180deg);}
.ccb{display:none;padding:0 16px 12px;}
.ccb.o{display:block;}
.ccl{display:flex;gap:7px;margin-bottom:10px;flex-wrap:wrap;}
.cl2{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:700;padding:5px 10px;border-radius:20px;text-decoration:none;border:none;cursor:pointer;font-family:inherit;}
.lwa{background:#E0F5EE;color:#0A7A5C;}
.ltr{background:#EDF2FC;color:#1D4ED8;}
.lcr{background:var(--teal-l);color:var(--teal);}
.pi{display:flex;align-items:center;gap:9px;padding:8px 0;border-bottom:1px solid var(--border2);}
.pi:last-child{border-bottom:none;}
.pin{font-size:11px;font-weight:700;color:var(--text3);min-width:28px;}
.pii{flex:1;}
.pid{font-size:12px;color:var(--text2);font-weight:600;}
.piv{font-size:11px;color:var(--text3);margin-top:1px;}
.pir{display:flex;align-items:center;gap:5px;flex-shrink:0;}
.piac{display:flex;gap:2px;}
.bic{background:none;border:none;cursor:pointer;padding:6px;border-radius:7px;font-size:15px;transition:background .1s;line-height:1;}
.bic:hover{background:var(--teal-l);}
.bg{color:var(--green);}.bd{color:var(--red);}.bp2{color:var(--purple);}
.remr{text-align:right;margin-top:6px;}
.brem{background:none;border:none;color:var(--red);font-size:11px;font-weight:700;cursor:pointer;font-family:inherit;}

/* FORM */
.fs{background:var(--white);border:1px solid var(--border);border-radius:var(--rl);padding:20px;margin-bottom:14px;box-shadow:var(--sh);}
.fst{font-size:11px;font-weight:700;color:var(--text3);text-transform:uppercase;letter-spacing:.9px;margin-bottom:14px;}
.fg{display:grid;grid-template-columns:1fr 1fr;gap:13px;}
@media(max-width:520px){.fg{grid-template-columns:1fr;}}
.ff{grid-column:1/-1;}
.fld{display:flex;flex-direction:column;gap:5px;}
.fld label{font-size:12px;font-weight:700;color:var(--text3);text-transform:uppercase;letter-spacing:.6px;}
.fld input,.fld select,.fld textarea{background:#F3FAFA;border:1.5px solid var(--border);border-radius:9px;padding:11px 14px;color:var(--text);font-size:15px;font-family:inherit;width:100%;transition:border .15s;}
.fld input:focus,.fld select:focus,.fld textarea:focus{outline:none;border-color:var(--teal);box-shadow:0 0 0 3px rgba(10,147,150,.1);}
.fld textarea{min-height:68px;resize:vertical;}
.fhint{font-size:10px;color:var(--text3);line-height:1.4;}
.tg{display:grid;grid-template-columns:1fr 1fr;gap:9px;}
.to{border:2px solid var(--border);border-radius:11px;padding:13px 15px;cursor:pointer;transition:all .15s;}
.to.s{border-color:var(--teal);background:var(--teal-l);}
.tot{font-size:13px;font-weight:700;color:var(--text);}
.to.s .tot{color:var(--teal);}
.tos{font-size:11px;color:var(--text3);margin-top:2px;}
.cb{background:linear-gradient(135deg,#E6F7F7,#EEF9F9);border:1px solid var(--teal-m);border-radius:10px;padding:13px 15px;margin-top:5px;}
.cr2{display:flex;justify-content:space-between;font-size:13px;padding:3px 0;color:var(--text2);}
.cr2.tot{font-weight:800;border-top:1px solid var(--teal-m);margin-top:5px;padding-top:8px;font-size:15px;color:var(--teal);}
.pfc{border:1.5px solid var(--border);border-radius:11px;padding:15px;margin-bottom:8px;transition:border .15s;}
.pfc:hover{border-color:var(--teal);}
.pfn{width:28px;height:28px;border-radius:50%;background:linear-gradient(135deg,#0A9396,#00B4D8);color:#fff;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;margin-bottom:10px;}
.ti{background:var(--teal-l);color:var(--teal);font-size:10px;font-weight:700;padding:2px 7px;border-radius:7px;margin-left:6px;}
.te{background:var(--yellow-bg);color:var(--yellow);font-size:10px;font-weight:700;padding:2px 7px;border-radius:7px;margin-left:6px;}
.hr{border:none;border-top:1px solid var(--border2);margin:14px 0;}
.etp{display:flex;flex-wrap:wrap;gap:6px;}
.ett{font-size:11px;font-weight:800;padding:5px 11px;border-radius:7px;cursor:pointer;color:#fff;opacity:.32;transition:opacity .13s;text-transform:uppercase;}
.ett.on{opacity:1;}
.sri{padding:10px 14px;cursor:pointer;border-bottom:1px solid var(--border2);display:flex;align-items:center;gap:9px;transition:background .1s;}
.sri:last-child{border-bottom:none;}
.sri:hover{background:var(--teal-l);}
.csel{background:var(--teal-l);border:1.5px solid var(--teal-m);border-radius:10px;padding:12px 14px;display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;}

/* BOTOES */
.btn{padding:12px 22px;border-radius:11px;font-weight:700;font-size:14.5px;cursor:pointer;font-family:inherit;transition:all .15s;border:none;}
.btnp{background:linear-gradient(135deg,#0A9396,#00B4D8);color:#fff;box-shadow:0 4px 12px rgba(10,147,150,.22);}
.btnp:hover{transform:translateY(-1px);box-shadow:0 6px 18px rgba(10,147,150,.32);}
.btns{background:var(--white);color:var(--text);border:1.5px solid var(--border);}
.btns:hover{border-color:var(--teal);color:var(--teal);}
.btnd{background:none;border:none;color:var(--red);font-size:12px;font-weight:700;cursor:pointer;font-family:inherit;}
.btnd:hover{text-decoration:underline;}
.bbk{background:none;border:none;color:var(--text2);font-size:13px;font-weight:600;cursor:pointer;font-family:inherit;display:flex;align-items:center;gap:5px;padding:4px 0;}
.brow{display:flex;gap:9px;justify-content:flex-end;flex-wrap:wrap;align-items:center;}
.bnew{background:linear-gradient(135deg,#0A9396,#00B4D8);color:#fff;border:none;padding:9px 16px;border-radius:10px;font-weight:700;font-size:13px;cursor:pointer;font-family:inherit;box-shadow:0 4px 12px rgba(10,147,150,.22);display:flex;align-items:center;gap:5px;transition:all .15s;}
.bnew:hover{transform:translateY(-1px);box-shadow:0 6px 18px rgba(10,147,150,.32);}
.bmini{background:var(--white);border:1.5px solid var(--border);border-radius:8px;padding:5px 11px;font-size:11px;font-weight:700;font-family:inherit;color:var(--text2);cursor:pointer;}
.bmini:hover{border-color:var(--teal);color:var(--teal);}

/* MODAL */
.mo{position:fixed;inset:0;background:rgba(0,0,0,.42);z-index:500;display:flex;align-items:center;justify-content:center;padding:20px;}
.mo.h{display:none;}
.mb{background:var(--white);border-radius:var(--rx);padding:26px;width:100%;max-width:470px;max-height:88vh;overflow-y:auto;box-shadow:var(--shl);}
.mb.mb-wide{max-width:680px;}
.mbt{font-size:17px;font-weight:800;color:var(--text);margin-bottom:3px;letter-spacing:-.3px;}
.mbs{font-size:13px;color:var(--text3);margin-bottom:20px;}
.mbc{float:right;background:none;border:none;font-size:26px;cursor:pointer;color:var(--text3);line-height:1;}
.mctit{font-size:27px;font-weight:800;color:var(--text);border:none;border-bottom:1.5px solid transparent;background:none;width:100%;padding:4px 0 8px;margin-bottom:4px;font-family:inherit;}
.mctit:focus{outline:none;border-bottom-color:var(--teal);}
.mvsug{display:flex;flex-direction:column;gap:6px;margin-bottom:16px;}
.mvs{background:#F3FAFA;border:1.5px solid var(--border);border-radius:10px;padding:10px 13px;font-size:13px;font-weight:700;color:var(--text2);cursor:pointer;font-family:inherit;text-align:left;transition:all .13s;}
.mvs:hover{border-color:var(--teal);color:var(--teal);background:var(--teal-l);}
.mvsl{font-size:10px;font-weight:700;color:var(--text3);text-transform:uppercase;letter-spacing:.8px;margin-bottom:7px;}

/* TABELA */
.tbl{width:100%;border-collapse:collapse;background:var(--white);border:1px solid var(--border);border-radius:var(--rl);overflow:hidden;box-shadow:var(--sh);}
.tbl th{text-align:left;font-size:10px;font-weight:700;color:var(--text3);text-transform:uppercase;letter-spacing:.7px;background:var(--bg);padding:10px 13px;}
.tbl td{font-size:13px;color:var(--text);padding:10px 13px;border-top:1px solid var(--border2);}
.inp-mini{background:#F3FAFA;border:1.5px solid var(--border);border-radius:8px;padding:6px 9px;font-size:12px;font-family:inherit;width:70px;color:var(--text);}
.inp-cor{width:44px;height:32px;padding:2px;border:1.5px solid var(--border);border-radius:8px;background:#fff;cursor:pointer;}
.alertbar{background:var(--red-bg);color:var(--red);border:1px solid #F5C6C0;padding:11px 15px;border-radius:11px;margin-bottom:16px;font-size:12px;font-weight:700;}

#toast{position:fixed;bottom:calc(26px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%) translateY(120px);background:var(--text);color:#fff;padding:11px 20px;border-radius:22px;font-size:13px;font-weight:700;z-index:9999;transition:transform .3s cubic-bezier(.34,1.56,.64,1);white-space:nowrap;box-shadow:0 8px 28px rgba(0,0,0,.18);}
#toast.v{transform:translateX(-50%) translateY(0);}
#toast.ok{background:#0A7A5C;}
#toast.er{background:#C0392B;}
#toast.in{background:#0A9396;}
.emp{text-align:center;padding:44px 20px;color:var(--text3);}
.empi{font-size:38px;margin-bottom:10px;}
.empt{font-size:15px;font-weight:700;color:var(--text2);margin-bottom:5px;}

/* NOTIFICACOES */
.nbtn{position:relative;background:var(--white);border:1.5px solid var(--border);width:34px;height:34px;border-radius:50%;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:15px;color:var(--text2);flex-shrink:0;transition:all .12s;}
.nbtn:hover{border-color:var(--teal);color:var(--teal);background:var(--teal-l);}
.nbtn.h{display:none;}
.nbadge{position:absolute;top:-4px;right:-4px;background:var(--red);color:#fff;font-size:9px;font-weight:800;min-width:15px;height:15px;border-radius:8px;display:none;align-items:center;justify-content:center;padding:0 3px;line-height:1;}
.nbadge.v{display:flex;}
.notifitem{padding:11px 13px;border-radius:10px;cursor:pointer;transition:background .1s;display:flex;gap:9px;align-items:flex-start;margin-bottom:4px;}
.notifitem:hover{background:var(--teal-l);}
.notifitem.unread{background:#F3FAFA;}
.notifitem .ni-txt{font-size:12.5px;color:var(--text2);line-height:1.4;}
.notifitem .ni-time{font-size:10px;color:var(--text3);margin-top:3px;}
.notifdot{width:7px;height:7px;border-radius:50%;background:var(--teal);flex-shrink:0;margin-top:5px;}

/* ATIVIDADE / COMENTARIOS */
.actbox{margin-top:8px;}
.actinput-wrap{position:relative;margin-bottom:18px;}
.actinput{background:#F3FAFA;border:1.5px solid var(--border);border-radius:12px;padding:12px 15px;font-size:15px;font-family:inherit;width:100%;min-height:62px;resize:vertical;color:var(--text);}
.actinput:focus{outline:none;border-color:var(--teal);}
.actsend{margin-top:9px;}
.mentiondrop{position:absolute;left:0;right:0;bottom:100%;margin-bottom:4px;background:var(--white);border:1.5px solid var(--border);border-radius:10px;box-shadow:var(--shm);max-height:150px;overflow-y:auto;z-index:20;}
.mentiondrop .sri{padding:8px 12px;font-size:12.5px;}
.actfeed{display:flex;flex-direction:column;gap:12px;}
.acti{display:flex;gap:11px;}
.acti .av{width:32px;height:32px;font-size:12.5px;flex-shrink:0;}
.acti-body{flex:1;min-width:0;}
.acti-c .acti-bubble{background:#F3FAFA;border-radius:12px;border-top-left-radius:4px;padding:11px 14px;font-size:14.5px;color:var(--text);line-height:1.5;white-space:pre-wrap;word-break:break-word;}
.acti-head{display:flex;align-items:baseline;gap:8px;margin-bottom:4px;}
.acti-nome{font-size:13.5px;font-weight:700;color:var(--text);}
.acti-time{font-size:11px;color:var(--text3);}
.acti-a{font-size:13px;color:var(--text3);font-style:italic;padding-top:4px;}
.acti-a .acti-head{margin-bottom:0;display:inline;}
.mention-tag{color:var(--teal);font-weight:700;}

/* ANEXOS */
.anexolist{display:flex;flex-direction:column;gap:9px;margin-bottom:12px;}
.anexoitem{display:flex;align-items:center;gap:11px;padding:11px 14px;border:1.5px solid var(--border);border-radius:11px;background:#F3FAFA;}
.anexoicone{width:36px;height:36px;border-radius:9px;background:var(--teal-l);color:var(--teal);display:flex;align-items:center;justify-content:center;font-size:16px;flex-shrink:0;}
.anexonome{font-size:14px;font-weight:700;color:var(--text);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.anexometa{font-size:11.5px;color:var(--text3);}
.anexoacoes{margin-left:auto;display:flex;gap:3px;flex-shrink:0;}
.anexoupload{border:2px dashed var(--border);border-radius:12px;padding:18px;text-align:center;cursor:pointer;transition:all .15s;}
.anexoupload:hover{border-color:var(--teal);background:var(--teal-l);}
.anexoupload input{display:none;}
.anexoicone{overflow:hidden;}
.anexoicone img{width:100%;height:100%;object-fit:cover;}
.anexonome{cursor:pointer;}
.anexonome:hover{color:var(--teal);text-decoration:underline;}

/* CARD MODAL — layout Trello (cabeçalho fixo + colunas) */
.mb.mb-card{max-width:1120px;padding:0;}
.mchead-sticky{position:sticky;top:0;z-index:6;background:var(--white);display:none;align-items:center;gap:12px;padding:14px 30px;border-bottom:1px solid var(--border);border-radius:var(--rx) var(--rx) 0 0;}
.mchead-sticky.v{display:flex;}
.mchs-nome{font-size:16px;font-weight:800;color:var(--text);flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.mchs-lista{font-size:12px;font-weight:700;color:var(--text2);background:var(--bg);padding:6px 13px;border-radius:9px;white-space:nowrap;flex-shrink:0;border:1.5px solid transparent;cursor:pointer;font-family:inherit;}
.mchs-lista:hover{border-color:var(--teal);color:var(--teal);}
.mchs-acts{display:flex;gap:8px;flex-shrink:0;}
.mchs-acts button{background:var(--bg);border:1.5px solid var(--border);color:var(--text2);font-size:12.5px;font-weight:700;padding:8px 14px;border-radius:9px;cursor:pointer;font-family:inherit;white-space:nowrap;}
.mchs-acts button:hover{border-color:var(--teal);color:var(--teal);}
.mcinner{padding:34px;}
.mccols2{display:grid;grid-template-columns:1fr 372px;gap:28px;align-items:start;}
@media(max-width:760px){.mccols2{grid-template-columns:1fr;}}
.mcright{background:var(--bg);border-radius:14px;padding:16px;}
.mcrsec{font-size:12px;font-weight:700;color:var(--text3);text-transform:uppercase;letter-spacing:.8px;margin-bottom:12px;}

/* ABAS DO PAINEL DIREITO DO CARD */
.mctabs{display:flex;gap:5px;background:var(--white);border:1.5px solid var(--border);border-radius:12px;padding:5px;margin-bottom:16px;}
.mctab{flex:1;background:none;border:none;font-family:inherit;font-size:13px;font-weight:700;color:var(--text3);padding:10px 4px;border-radius:9px;cursor:pointer;white-space:nowrap;display:flex;align-items:center;justify-content:center;gap:5px;}
.mctab:hover{color:var(--teal);}
.mctab.a{background:var(--teal-l);color:var(--teal);}
.mctab-n{background:var(--teal);color:#fff;font-size:10.5px;font-weight:800;border-radius:8px;padding:2px 6px;}
.mctab-n.h{display:none;}
.mcpane.h{display:none;}

/* CHAT WHATSAPP DENTRO DO CARD */
.chathead{display:flex;align-items:center;gap:9px;flex-wrap:wrap;margin-bottom:12px;}
.chatbadge{font-size:11.5px;font-weight:800;text-transform:uppercase;letter-spacing:.5px;padding:5px 11px;border-radius:8px;background:var(--teal-l);color:var(--teal);}
.chatbadge.of{background:#E7F0FF;color:#1D4ED8;}
.chatbadge.nd{background:#F3F4F6;color:#6B7280;}
.chatpausa{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--text2);font-weight:700;margin-left:auto;cursor:pointer;user-select:none;}
.chatjanela{font-size:12.5px;font-weight:700;padding:10px 13px;border-radius:10px;margin-bottom:12px;line-height:1.45;}
.chatjanela.ok{background:#E8F6EC;color:#116932;}
.chatjanela.warn{background:#FEF3C7;color:#8A5A00;}
.chatjanela.off{background:#FDE8E8;color:#9B1C1C;}
.chatfeed{display:flex;flex-direction:column;gap:9px;max-height:420px;overflow-y:auto;padding:5px 3px;}
.chatb{max-width:88%;padding:11px 15px;border-radius:14px;font-size:15px;line-height:1.48;white-space:pre-wrap;word-break:break-word;}
.chatb-in{align-self:flex-start;background:var(--white);border:1.5px solid var(--border);border-bottom-left-radius:4px;color:var(--text);}
.chatb-out{align-self:flex-end;background:var(--teal);color:#fff;border-bottom-right-radius:4px;}
.chatb-bot{align-self:flex-end;background:#0E7490;color:#fff;border-bottom-right-radius:4px;}
.chatb-meta{font-size:11px;opacity:.75;margin-top:5px;display:block;}
.chatb-mid{font-size:13.5px;font-weight:700;opacity:.9;display:block;margin-bottom:4px;}
.chatdia{align-self:center;font-size:11px;font-weight:700;color:var(--text3);background:var(--white);border:1px solid var(--border);border-radius:20px;padding:3px 12px;margin:5px 0;}
.chatsend{margin-top:14px;}
.chatsend textarea{width:100%;background:var(--white);border:1.5px solid var(--border);border-radius:12px;padding:12px 15px;font-size:15px;font-family:inherit;resize:vertical;min-height:58px;color:var(--text);}
.chatsend textarea:focus{outline:none;border-color:var(--teal);}
.chataviso{font-size:11.5px;color:var(--text3);line-height:1.45;margin-top:8px;}

/* CAIXA DE ENTRADA GERAL */
.inbwrap{display:grid;grid-template-columns:300px 1fr 280px;height:calc(100vh - 122px);background:var(--white);border:1.5px solid var(--border);border-radius:16px;overflow:hidden;}
@media(max-width:980px){.inbwrap{grid-template-columns:260px 1fr;}.inb-panel{display:none;}}
@media(max-width:700px){.inbwrap{grid-template-columns:1fr;height:auto;}.inb-list{max-height:340px;}.inb-panel{display:none;}}
.inb-list{border-right:1.5px solid var(--border);display:flex;flex-direction:column;min-width:0;}
.inb-search{padding:14px;border-bottom:1.5px solid var(--border);flex-shrink:0;}
.inb-search input{width:100%;background:var(--bg);border:1.5px solid var(--border);border-radius:10px;padding:9px 13px;font-size:13.5px;font-family:inherit;color:var(--text);}
.inb-search input:focus{outline:none;border-color:var(--teal);}
.inb-items{flex:1;overflow-y:auto;}
.inb-item{display:flex;align-items:center;gap:11px;padding:13px 15px;cursor:pointer;border-bottom:1px solid var(--border2);transition:background .1s;}
.inb-item:hover{background:var(--bg);}
.inb-item.a{background:var(--teal-l);}
.inb-item .av{width:38px;height:38px;font-size:14px;flex-shrink:0;}
.inb-item-body{flex:1;min-width:0;}
.inb-item-nome{font-size:13.5px;font-weight:700;color:var(--text);display:flex;align-items:center;gap:6px;}
.inb-item-prev{font-size:12px;color:var(--text3);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin-top:2px;}
.inb-item-time{font-size:10.5px;color:var(--text3);flex-shrink:0;white-space:nowrap;}
.inb-lead-tag{font-size:9px;font-weight:800;text-transform:uppercase;background:#F3F4F6;color:#6B7280;padding:2px 6px;border-radius:6px;}
.inb-chat{display:flex;flex-direction:column;min-width:0;}
.inb-chat-head{display:flex;align-items:center;gap:12px;padding:16px 22px;border-bottom:1.5px solid var(--border);flex-shrink:0;}
.inb-chat-head .av{width:36px;height:36px;font-size:14px;}
.inb-chat-nome{font-size:15.5px;font-weight:800;color:var(--text);}
.inb-chat-body{flex:1;overflow-y:auto;padding:20px 22px;}
.inb-chat-body .chatfeed{max-height:none;}
.inb-chat-send{padding:16px 22px;border-top:1.5px solid var(--border);flex-shrink:0;}
.inb-panel{padding:20px;overflow-y:auto;}
.inb-panel-title{font-size:11px;font-weight:700;color:var(--text3);text-transform:uppercase;letter-spacing:.8px;margin-bottom:12px;}
.inb-panel-chips{display:flex;flex-wrap:wrap;gap:7px;}
.inb-cta{display:block;text-align:center;margin-top:14px;font-size:12.5px;font-weight:700;color:var(--teal);cursor:pointer;text-decoration:none;}

/* AUTOMAÇÕES POR LISTA */
.filatabs{display:flex;gap:22px;border-bottom:1.5px solid var(--border);margin:18px 0 16px;}
.filatab{background:none;border:none;font-family:inherit;font-size:14px;font-weight:700;color:var(--text3);cursor:pointer;padding:0 0 11px;border-bottom:2.5px solid transparent;margin-bottom:-1.5px;display:flex;align-items:center;gap:7px;}
.filatab.on{color:var(--text);border-bottom-color:var(--teal);}
.filatab-n{font-size:11px;font-weight:700;background:var(--bg);color:var(--text3);padding:1px 8px;border-radius:8px;}
.filatab-n.alerta{background:var(--yellow-bg);color:var(--yellow);}
.filacard{border:1.5px solid var(--border);border-radius:14px;background:var(--white);padding:15px 17px;margin-bottom:11px;}
.filahead{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:6px;}
.filanome{font-size:15px;font-weight:700;color:var(--text);}
.filameta{font-size:12px;color:var(--text3);margin-top:2px;}
.filapill{font-size:11px;font-weight:700;padding:3px 10px;border-radius:7px;white-space:nowrap;flex-shrink:0;}
.filapill.green{background:var(--green-bg);color:var(--green);}
.filapill.yellow{background:var(--yellow-bg);color:var(--yellow);}
.filapill.red{background:var(--red-bg);color:var(--red);}
.filabox{background:var(--bg);border-radius:10px;padding:10px 12px;margin-top:9px;}
.filaboxl{font-size:10px;font-weight:700;color:var(--text3);text-transform:uppercase;letter-spacing:.8px;margin-bottom:4px;}
.filamsg{border-left:2.5px solid var(--teal-m);padding-left:12px;}
.filabalao{margin:0 0 6px;font-size:14px;line-height:1.55;color:var(--text);}
.filabalao:last-child{margin-bottom:0;}
.filaacoes{display:flex;gap:8px;flex-wrap:wrap;margin-top:13px;}
.autoitem{display:flex;align-items:center;gap:16px;padding:14px 17px;border:1.5px solid var(--border);border-radius:12px;margin-bottom:9px;background:var(--white);flex-wrap:wrap;}

  if(!iso)return'';

function moneyToFloat(v){if(!v)return 0;return parseFloat(String(v).replace(/\./g,'').replace(',','.'))||0;}
function m2f(el){return el?moneyToFloat(el.value):0;}
function floatToMoney(v){v=parseFloat(v)||0;return v>0?v.toFixed(2).replace('.',',').replace(/\B(?=(\d{3})+(?!\d))/g,'.'):'';}
function moneyMask(el){
  let d=(el.value||'').replace(/\D/g,'');
  if(!d){el.value='';return;}
  while(d.length<3)d='0'+d;
  const c=d.slice(-2);
  let r=d.slice(0,-2).replace(/^0+/,'')||'0';
  r=r.replace(/\B(?=(\d{3})+(?!\d))/g,'.');
  el.value=r+','+c;
}
function cpfMask(el){
  let d=(el.value||'').replace(/\D/g,'').slice(0,11);
  if(d.length>9)d=d.replace(/(\d{3})(\d{3})(\d{3})(\d{1,2})/,'$1.$2.$3-$4');
  else if(d.length>6)d=d.replace(/(\d{3})(\d{3})(\d{1,3})/,'$1.$2.$3');
  else if(d.length>3)d=d.replace(/(\d{3})(\d{1,3})/,'$1.$2');
  el.value=d;
}
// mascara de dinheiro delegada: so formata no input, nunca redesenha o DOM

// ============================================================
// LOGS DO SISTEMA
//
// Ate a versao 25 do motor todo erro morria no console da Edge
// Function. Esta tela existe para que a pergunta "por que isso nao
// saiu?" tenha resposta em um clique, e nao em uma noite.
//
// Motor, webhook e CRM na MESMA lista, de proposito: erro de webhook
// costuma ser causa de erro de motor tres minutos depois.
// ============================================================

let LOGS_CACHE=[];
let LOGS_ABERTO=null;
let LOGS_PAGINA=0;
let LOGS_TIMER=null;
let LOGS_NOMES={};
let LOGS_PULSO=null;   // ultimo sinal de vida do motor, independente dos filtros
const LOGS_POR_PAGINA=60;

let LOGS_F={nivel:'tudo',origem:'',modulo:'',busca:'',periodo:'24h',de:'',ate:'',auto:true};

// Periodo: a retencao e de 14 dias (limpeza automatica as 4h), entao
// nao existe opcao maior que isso. "Personalizado" abre duas datas.
const LOGS_PERIODOS={
  '1h':{rotulo:'Última hora',horas:1},
  'hoje':{rotulo:'Hoje',horas:null},
  '24h':{rotulo:'Últimas 24h',horas:24},
  '7d':{rotulo:'7 dias',horas:24*7},
  '14d':{rotulo:'Tudo (14 dias)',horas:24*14},
  'custom':{rotulo:'Personalizado…',horas:null}
};

function logsDesdeAte(){
  const f=LOGS_F;
  if(f.periodo==='custom'){
    const de=f.de?new Date(f.de+'T00:00:00'):null;
    const ate=f.ate?new Date(f.ate+'T23:59:59'):null;
    return{de,ate};
  }
  if(f.periodo==='hoje'){
    const d=new Date();d.setHours(0,0,0,0);
    return{de:d,ate:null};
  }
  const h=LOGS_PERIODOS[f.periodo]?LOGS_PERIODOS[f.periodo].horas:24;
  return{de:new Date(Date.now()-h*3600000),ate:null};
}

async function pageLogs(){
  const pc=$('pc');marcarNav('logs');
  if(U.nivel!=='proprietario'){pc.innerHTML='<div class="emp"><div class="empt">Tela restrita a proprietários</div></div>';return;}
  pc.innerHTML='<div class="emp">Carregando...</div>';
  LOGS_PAGINA=0;LOGS_ABERTO=null;
  await logsCarregar(true);
  logsLigarAuto();
}

function logsLigarAuto(){
  clearInterval(LOGS_TIMER);
  if(!LOGS_F.auto)return;
  // 20s: rapido o bastante para acompanhar um teste ao vivo, devagar o
  // bastante para nao brigar com a leitura.
  LOGS_TIMER=setInterval(()=>{
    if(location.hash!=='#/logs'){clearInterval(LOGS_TIMER);return;}
    logsCarregar(false);
  },20000);
}

async function logsCarregar(mostrarCarregando){
  const f=LOGS_F;
  const{de,ate}=logsDesdeAte();

  let q=sb.from('crm_logs')
    .select('id,criado_em,nivel,modulo,mensagem,detalhe,cliente_id,origem')
    .order('criado_em',{ascending:false})
    .limit(LOGS_POR_PAGINA*(LOGS_PAGINA+1));

  if(de)q=q.gte('criado_em',de.toISOString());
  if(ate)q=q.lte('criado_em',ate.toISOString());
  if(f.nivel!=='tudo')q=q.eq('nivel',f.nivel);
  if(f.origem)q=q.eq('origem',f.origem);
  if(f.modulo)q=q.eq('modulo',f.modulo);
  if(f.busca.trim())q=q.or('mensagem.ilike.%'+f.busca.trim()+'%,detalhe.ilike.%'+f.busca.trim()+'%');

  const{data,error}=await q;
  if(error){
    $('pc').innerHTML='<div class="emp"><div class="empt">Erro ao carregar os logs</div><div class="emps">'+esc(error.message)+'</div></div>';
    return;
  }
  LOGS_CACHE=data||[];

  // O pulso e consultado FORA dos filtros de proposito: a pergunta
  // "o motor esta rodando?" nao pode depender de qual periodo ou nivel
  // voce escolheu olhar.
  const{data:pulso}=await sb.from('crm_logs')
    .select('criado_em,mensagem')
    .eq('modulo','pulso')
    .order('criado_em',{ascending:false})
    .limit(1);
  LOGS_PULSO=(pulso&&pulso.length)?pulso[0]:null;

  // O log guarda so o uuid. O nome vem de crm_clientes na hora de
  // exibir — e a diferenca entre "8f2c…a91d" e "Josuelson".
  const ids=[...new Set(LOGS_CACHE.map(l=>l.cliente_id).filter(x=>x&&!LOGS_NOMES[x]))];
  if(ids.length){
    const{data:cli}=await sb.from('crm_clientes').select('id,nome_completo').in('id',ids.slice(0,200));
    (cli||[]).forEach(c=>{LOGS_NOMES[c.id]=c.nome_completo||'sem nome';});
  }
  renderLogs();
}

function logsContar(nivel){
  const desde=Date.now()-24*3600000;
  return LOGS_CACHE.filter(l=>l.nivel===nivel&&new Date(l.criado_em).getTime()>=desde).length;
}

function renderLogs(){
  const f=LOGS_F;
  const ultimoErro=LOGS_CACHE.find(l=>l.nivel==='erro');
  const modulos=[...new Set(LOGS_CACHE.map(l=>l.modulo))].sort();

  let h='<div class="pgh"><div><div class="pgt">Logs do sistema</div>'+
    '<div class="pgs">'+logsSinal()+'</div></div>'+
    '<div style="display:flex;gap:8px">'+
    '<button class="btn btns" style="padding:9px 15px;font-size:13px" onclick="logsCopiar()">Copiar visível</button>'+
    '<button class="btn btnp" style="padding:9px 15px;font-size:13px" onclick="logsCarregar(true)">↻ Atualizar</button>'+
    '</div></div>';

  h+='<div class="lgcards">'+
    '<div class="lgcard"><div class="lgcardn" style="color:var(--red)">'+logsContar('erro')+'</div><div class="lgcardl">Erros · 24h</div></div>'+
    '<div class="lgcard"><div class="lgcardn" style="color:var(--yellow)">'+logsContar('aviso')+'</div><div class="lgcardl">Avisos · 24h</div></div>'+
    '<div class="lgcard"><div class="lgcardn" style="color:var(--gray)">'+LOGS_CACHE.length+'</div><div class="lgcardl">No período</div></div>'+
    '<div class="lgcard"><div class="lgcardn" style="color:var(--green);font-size:19px">'+(ultimoErro?logsHora(ultimoErro.criado_em):'—')+'</div><div class="lgcardl">Último erro</div></div>'+
    '</div>';

  // ---- filtros
  h+='<div class="lgfiltros">';
  ['tudo','erro','aviso','info'].forEach(n=>{
    const rot={tudo:'Tudo',erro:'Erros',aviso:'Avisos',info:'Info'}[n];
    h+='<button class="lgchip'+(f.nivel===n?' a':'')+'" onclick="logsFiltrar(\'nivel\',\''+n+'\')">'+rot+'</button>';
  });
  h+='<div class="lgsep"></div>';

  h+='<select class="lgsel" onchange="logsFiltrar(\'periodo\',this.value)">';
  Object.keys(LOGS_PERIODOS).forEach(k=>{
    h+='<option value="'+k+'"'+(f.periodo===k?' selected':'')+'>'+LOGS_PERIODOS[k].rotulo+'</option>';
  });
  h+='</select>';

  if(f.periodo==='custom'){
    h+='<input type="date" class="lgdata" value="'+escA(f.de)+'" onchange="logsFiltrar(\'de\',this.value)"/>'+
       '<span style="color:var(--text3);font-size:12px">até</span>'+
       '<input type="date" class="lgdata" value="'+escA(f.ate)+'" onchange="logsFiltrar(\'ate\',this.value)"/>';
  }

  h+='<div class="lgsep"></div>';
  h+='<select class="lgsel" onchange="logsFiltrar(\'origem\',this.value)">'+
     '<option value="">Toda origem</option>'+
     ['motor','webhook','crm'].map(o=>'<option value="'+o+'"'+(f.origem===o?' selected':'')+'>'+o+'</option>').join('')+
     '</select>';
  h+='<select class="lgsel" onchange="logsFiltrar(\'modulo\',this.value)">'+
     '<option value="">Todo módulo</option>'+
     modulos.map(m=>'<option value="'+escA(m)+'"'+(f.modulo===m?' selected':'')+'>'+esc(m)+'</option>').join('')+
     '</select>';
  h+='<input type="text" class="lgbusca" id="lgbusca" placeholder="Buscar no texto…" value="'+escA(f.busca)+'" onkeydown="if(event.key===\'Enter\')logsFiltrar(\'busca\',this.value)"/>';
  h+='<label class="lgauto"><input type="checkbox" '+(f.auto?'checked':'')+' onchange="logsFiltrar(\'auto\',this.checked)"/> Atualizar sozinho</label>';
  h+='</div>';

  // ---- lista
  if(LOGS_CACHE.length===0){
    // Vazio NAO quer dizer parado. Com o trafego desligado, uma rodada
    // sem fila e sem cliente esperando nao produz log nenhum — e isso e
    // o funcionamento normal. Quem responde "esta rodando?" e o pulso.
    h+='<div class="lglista"><div class="emp"><div class="empt">Nada aconteceu neste período</div>'+
       '<div class="emps">Silêncio aqui é normal quando não há fila nem cliente esperando. '+
       (LOGS_PULSO?'O motor está dando sinal de vida — veja acima.':'Não há sinal de vida do motor na última hora: vale conferir se ele está publicado e se o cron está rodando.')+
       '</div></div></div>';
  }else{
    h+='<div class="lglista">';
    LOGS_CACHE.forEach(l=>{
      const nome=l.cliente_id?(LOGS_NOMES[l.cliente_id]||'ver card'):null;
      const aberto=LOGS_ABERTO===l.id;
      const temDet=!!(l.detalhe&&String(l.detalhe).trim());
      h+='<div class="lglinha" onclick="logsAbrir(\''+l.id+'\')">'+
         '<div class="lghora">'+logsHora(l.criado_em)+'</div>'+
         '<div class="lgniv '+esc(l.nivel)+'">'+esc(l.nivel)+'</div>'+
         '<div class="lgcorpo"><div class="lgmsg">'+esc(l.mensagem)+'</div>'+
         '<div class="lgmeta"><span class="lgmod">'+esc(l.modulo)+'</span>'+
         '<span class="lgorig">'+esc(l.origem)+'</span>'+
         (nome?'<span class="lgcli" onclick="event.stopPropagation();abrirCardCliente(\''+l.cliente_id+'\')">'+esc(nome)+'</span>':'')+
         (temDet&&!aberto?'<span>· clique para ver o detalhe</span>':'')+
         '</div></div>'+
         '<div class="lgseta">'+(temDet?(aberto?'▾':'▸'):'')+'</div>'+
         '</div>';
      if(aberto&&temDet)h+='<div class="lgdet">'+esc(l.detalhe)+'</div>';
    });
    const cheio=LOGS_CACHE.length>=LOGS_POR_PAGINA*(LOGS_PAGINA+1);
    h+='<div class="lgrod">mostrando '+LOGS_CACHE.length+' registro'+(LOGS_CACHE.length===1?'':'s')+
       (cheio?' · <span class="lgmais" onclick="logsMais()">carregar mais</span>':'')+'</div>';
    h+='</div>';
  }

  $('pc').innerHTML=h;
}

/**
 * A linha de estado do topo. Responde, sem clique nenhum, as duas
 * perguntas que a tela existia para responder e nao respondia:
 * o motor esta vivo, e qual versao esta publicada.
 */
function logsSinal(){
  const base='Motor, webhook e CRM na mesma linha do tempo · guarda 14 dias';
  if(!LOGS_PULSO)return base+' · <b style="color:var(--red)">sem sinal do motor</b>';
  const min=Math.round((Date.now()-new Date(LOGS_PULSO.criado_em).getTime())/60000);
  const versao=(String(LOGS_PULSO.mensagem).match(/versao\s*([0-9]+)/i)||[])[1];
  // O pulso sai de hora em hora, entao mais de 70 minutos calado ja e
  // sinal de que alguma coisa parou.
  const vivo=min<=70;
  const quando=min<1?'agora':(min<60?('há '+min+' min'):('há '+Math.round(min/60)+'h'));
  return base+' · <b style="color:'+(vivo?'var(--green)':'var(--red)')+'">motor '+(vivo?'vivo':'calado')+' '+quando+
    (versao?' · versão '+versao:'')+'</b>';
}

function logsHora(iso){
  const d=new Date(iso);
  const hoje=new Date();
  const p=n=>String(n).padStart(2,'0');
  const hm=p(d.getHours())+':'+p(d.getMinutes());
  const mesmoDia=d.toDateString()===hoje.toDateString();
  return mesmoDia?hm:(p(d.getDate())+'/'+p(d.getMonth()+1)+' '+hm);
}

function logsFiltrar(campo,valor){
  LOGS_F[campo]=valor;
  LOGS_PAGINA=0;
  if(campo==='auto'){logsLigarAuto();renderLogs();return;}
  // Trocar para personalizado sem datas ainda nao deve consultar nada.
  if(campo==='periodo'&&valor==='custom'&&!LOGS_F.de){renderLogs();return;}
  logsCarregar(false);
}

function logsMais(){LOGS_PAGINA++;logsCarregar(false);}

function logsAbrir(id){
  LOGS_ABERTO=(LOGS_ABERTO===id)?null:id;
  renderLogs();
}

/**
 * Copia o que esta na tela como texto puro.
 *
 * Existe para voce me mandar erro por texto em vez de print: print de
 * log foi como a apikey do WhatsGW vazou.
 */
function logsCopiar(){
  const txt=LOGS_CACHE.map(l=>{
    const base='['+logsHora(l.criado_em)+'] '+l.nivel.toUpperCase()+' '+l.origem+'/'+l.modulo+' — '+l.mensagem;
    return l.detalhe?base+'\n    '+String(l.detalhe).replace(/\n/g,'\n    '):base;
  }).join('\n');
  navigator.clipboard.writeText(txt)
    .then(()=>toast(LOGS_CACHE.length+' linhas copiadas','ok'))
    .catch(()=>toast('Não consegui copiar','erro'));
}

async function registrarAtividade(clienteId,descricao,usuarioId,extra){
  if(!clienteId)return;
  const reg={cliente_id:clienteId,usuario_id:usuarioId===undefined?U.id:usuarioId,descricao};
  if(extra&&typeof extra==='object')Object.assign(reg,extra);
  if(!reg.tipo)reg.tipo=(descricao||'').startsWith('anexou')?'anexo':((descricao||'').startsWith('criou')?'criacao':'outro');
  await sb.from('crm_atividades').insert(reg);
}
async function carregarAtividade(clienteId){
  const[{data:coms},{data:ativs}]=await Promise.all([
    sb.from('crm_comentarios').select('*').eq('cliente_id',clienteId).order('criado_em',{ascending:false}),
    sb.from('crm_atividades').select('*').eq('cliente_id',clienteId).order('criado_em',{ascending:false})
  ]);
  const itens=[
    ...(coms||[]).map(c=>({tipo:'c',data:c.criado_em,payload:c})),
    ...(ativs||[]).map(a=>({tipo:'a',data:a.criado_em,payload:a}))
  ].sort((x,y)=>new Date(y.data)-new Date(x.data));
  return itens;
}
function nomeUsuario(id){
  if(!id)return'Sistema';
  const u=USUARIOS.find(x=>x.id===id);
  return u?u.nome:'Usuário';
}
function renderMencoesTexto(t){
  return esc(t).replace(/@([^\s@][^@]{0,40}?)(?=\s|$)/g,(m,nome)=>{
    const ok=USUARIOS.some(u=>u.nome.toLowerCase()===nome.trim().toLowerCase());
    return ok?`<span class="mention-tag">@${nome}</span>`:m;
  });
}
async function renderAtividadeFeed(clienteId){
  const cont=$('mc-atividade-feed');
  if(!cont)return;
  const itens=await carregarAtividade(clienteId);
  if(!itens.length){cont.innerHTML='<div class="fhint" style="text-align:center;padding:14px 0">Nenhuma atividade ainda.</div>';return;}
  cont.innerHTML=itens.map(it=>{
    if(it.tipo==='c'){
      const c=it.payload,nm=nomeUsuario(c.autor_usuario_id);
      return`<div class="acti acti-c">
        <div class="av" style="background:${avC(nm)}">${avL(nm)}</div>
        <div class="acti-body">
          <div class="acti-head"><span class="acti-nome">${esc(nm)}</span><span class="acti-time">${tempoRel(c.criado_em)}</span></div>
          <div class="acti-bubble">${renderMencoesTexto(c.texto)}</div>
        </div></div>`;
    }else{
      const a=it.payload,nm=nomeUsuario(a.usuario_id);
      return`<div class="acti acti-a">
        <div class="av" style="background:${a.usuario_id?avC(nm):'#7FA8A8'};width:22px;height:22px;font-size:9px;margin-top:2px">${avL(nm)}</div>
        <div class="acti-body"><span class="acti-head"><span class="acti-nome" style="font-weight:700">${esc(nm)}</span> ${esc(a.descricao)} · <span class="acti-time">${tempoRel(a.criado_em)}</span></span></div></div>`;
    }
  }).join('');
}
function actInputHandler(el){
  const v=el.value;
  const cursor=el.selectionStart;
  const antes=v.slice(0,cursor);
  const m=antes.match(/@([^\s@]{0,25})$/);
  const drop=$('mc-mention-drop');
  if(!m){if(drop)drop.remove();return;}
  const termo=m[1].toLowerCase();
  const opts=USUARIOS.filter(u=>u.nome.toLowerCase().includes(termo)&&u.id!==U.id);
  if(!opts.length){if(drop)drop.remove();return;}
  const html=opts.map(u=>`<div class="sri" onmousedown="event.preventDefault();selecionarMencao('${u.id}','${escA(u.nome)}')">
    <div class="av" style="width:22px;height:22px;font-size:10px;background:${avC(u.nome)}">${avL(u.nome)}</div>${esc(u.nome)}</div>`).join('');
  let d=$('mc-mention-drop');
  if(!d){d=document.createElement('div');d.id='mc-mention-drop';d.className='mentiondrop';el.parentElement.appendChild(d);}
  d.innerHTML=html;
}
function selecionarMencao(id,nome){
  const el=$('mc-comentario-input');
  const v=el.value,cursor=el.selectionStart;
  const antes=v.slice(0,cursor).replace(/@[^\s@]{0,25}$/,'@'+nome+' ');
  el.value=antes+v.slice(cursor);
  const d=$('mc-mention-drop');if(d)d.remove();
  if(!mcMencoes.find(x=>x.id===id))mcMencoes.push({id,nome});
  el.focus();
}
async function enviarComentario(clienteId){
  const el=$('mc-comentario-input'),texto=el.value.trim();
  if(!texto){toast('Escreva um comentário','er');return;}
  const btn=$('mc-comentario-btn');btn.disabled=true;btn.textContent='Enviando...';
  const{data,error}=await sb.from('crm_comentarios').insert({cliente_id:clienteId,autor_usuario_id:U.id,texto}).select('id').single();
  btn.disabled=false;btn.textContent='Comentar';
  if(error){toast('Erro ao comentar','er');return;}
  const nomesNoTexto=USUARIOS.filter(u=>texto.toLowerCase().includes('@'+u.nome.toLowerCase())&&u.id!==U.id);
  const alvos=[...mcMencoes.filter(m=>m.id!==U.id),...nomesNoTexto.map(u=>({id:u.id,nome:u.nome}))];
  const idsUnicos=[...new Set(alvos.map(a=>a.id))];
  if(idsUnicos.length){
    const{data:cli}=await sb.from('crm_clientes').select('nome_completo').eq('id',clienteId).single();
    const rows=idsUnicos.map(uid=>({usuario_id:uid,cliente_id:clienteId,comentario_id:data.id,
      texto:`${U.nome} mencionou você no card de ${cli?cli.nome_completo:'um cliente'}`}));
    await sb.from('crm_notificacoes').insert(rows);
  }
  el.value='';mcMencoes=[];
  renderAtividadeFeed(clienteId);
}

function anexoExt(nome){return(nome||'').split('.').pop().toLowerCase();}
function anexoEhImagem(nome){return['png','jpg','jpeg','gif','webp'].includes(anexoExt(nome));}

    <div class="anexoitem">

      </div>
      <div class="anexoacoes">
        <button class="bic bg" title="Baixar" onclick="baixarAnexo('${escA(a.caminho_storage)}','${escA(a.nome_arquivo)}')">⬇</button>
        <button class="bic bd" title="Excluir" onclick="excluirAnexo('${a.id}','${escA(a.caminho_storage)}','${clienteId}')">✕</button>
      </div>
    </div>`).join('');
  data.filter(a=>anexoEhImagem(a.nome_arquivo)).forEach(async a=>{

    const el=$('anexothumb-'+a.id);
    if(s&&el)el.innerHTML=`<img src="${escA(s.signedUrl)}" alt=""/>`;

async function visualizarAnexo(caminho,nome){
  const{data,error}=await sb.storage.from(ANEXO_BUCKET).createSignedUrl(caminho,180);
  if(error||!data){toast('Não foi possível abrir o arquivo','er');return;}
  const url=data.signedUrl,ext=anexoExt(nome);
  let corpo;
  if(anexoEhImagem(nome))corpo=`<img src="${escA(url)}" style="width:100%;border-radius:12px;display:block"/>`;
  else if(ext==='pdf')corpo=`<iframe src="${escA(url)}" style="width:100%;height:72vh;border:none;border-radius:10px"></iframe>`;
  else corpo=`<div class="emp"><div class="empi">📄</div><div class="empt">Pré-visualização não disponível para este tipo de arquivo</div><a href="${escA(url)}" target="_blank" class="btn btnp" style="display:inline-block;margin-top:8px;text-decoration:none">Abrir / baixar arquivo</a></div>`;
  mcPreviewAberto=true;
  abrirModal(`<button class="mbc" onclick="fecharInteligente()">×</button><div class="mbt">${esc(nome)}</div><div class="mbs">&nbsp;</div>${corpo}`,true);
}
async function uploadAnexo(input,clienteId){
  const files=[...input.files];
  if(!files.length)return;
  for(const f of files){
    const caminho=`${clienteId}/${Date.now()}_${f.name.replace(/[^\w.\-]/g,'_')}`;
    const{error:eu}=await sb.storage.from(ANEXO_BUCKET).upload(caminho,f);
    if(eu){toast('Erro ao enviar '+f.name+': '+eu.message,'er');continue;}
    await sb.from('crm_anexos').insert({cliente_id:clienteId,usuario_id:U.id,nome_arquivo:f.name,caminho_storage:caminho,tamanho_bytes:f.size});
  }
  toast('Anexo(s) enviado(s)','ok');
  input.value='';
  if(typeof mcAba==='function'&&$('mcpane-anexos'))mcAba('anexos');
  carregarAnexos(clienteId);
  registrarAtividade(clienteId,`anexou ${files.length>1?files.length+' arquivos':'um arquivo'}`);
}
async function baixarAnexo(caminho,nome){
  const{data,error}=await sb.storage.from(ANEXO_BUCKET).createSignedUrl(caminho,60);
  if(error||!data){toast('Erro ao gerar link','er');return;}
  window.open(data.signedUrl,'_blank');
}
async function excluirAnexo(id,caminho,clienteId){
  if(!confirm('Excluir este anexo?'))return;
  await sb.storage.from(ANEXO_BUCKET).remove([caminho]);
  await sb.from('crm_anexos').delete().eq('id',id);
  toast('Anexo excluído','in');
  carregarAnexos(clienteId);
}

async function pageQuadro(q){
  const pc=$('pc');marcarNav(q);
  if(!QUADROS[q]||!QPERM.includes(q)){pc.innerHTML='<div class="emp"><div class="empt">Você não tem acesso a este quadro</div></div>';return;}
  pc.innerHTML=`<div class="pgh"><div><div class="pgt">${QUADROS[q].rotulo}</div><div class="pgs">Carregando...</div></div></div>`;
  if(q==='financeiro'){
    _cacheListasFin=null;
    await sb.rpc('arquivar_finalizados_antigos');
    await loadFin(true);
    await varrerAtrasos();
  }
  const[{data:listas},{data:clientes,error}]=await Promise.all([
    sb.from('crm_listas').select('*').eq('quadro',q).eq('arquivada',false).order('ordem'),
    sb.from('crm_clientes').select('id,nome_completo,lista_id,posicao,telefone_principal,data_nascimento_bebe,data_entrega,data_desbloqueio_inss,valor_beneficio_esperado,valor_honorarios,crm_clientes_etiquetas(etiqueta_id)').eq('quadro',q).is('arquivado_em',null).order('posicao')
  ]);
  if(error){pc.innerHTML=`<div class="emp"><div class="empt">Erro ao carregar</div>${esc(error.message)}</div>`;return;}
  const L=listas||[],C=clientes||[];

  // quantos cards arquivados existem em cada lista deste quadro
  const ARQ={};let ARQTOTAL=0;
  {
    // count exato por lista: o select comum para em 1000 linhas e mentiria o total
    const{count:tot}=await sb.from('crm_clientes')
      .select('id',{count:'exact',head:true}).eq('quadro',q).not('arquivado_em','is',null);
    ARQTOTAL=tot||0;
    if(ARQTOTAL){
      const contagens=await Promise.all(L.map(l=>
        sb.from('crm_clientes').select('id',{count:'exact',head:true})
          .eq('lista_id',l.id).not('arquivado_em','is',null)
      ));
      L.forEach((l,i)=>{const n=contagens[i]?contagens[i].count||0:0;if(n)ARQ[l.id]=n;});
    }
  }

  if(q==='financeiro'&&C.length){
    const ids=C.map(c=>c.id);
    const{data:parc}=await sb.from('pm_parcelas').select('crm_cliente_id,status,data_vencimento').in('crm_cliente_id',ids).neq('status','cancelado');
    const porCliente={};
    (parc||[]).forEach(p=>{
      if(!porCliente[p.crm_cliente_id])porCliente[p.crm_cliente_id]={total:0,recebidas:0,proxima:null,atraso:0,inad:0};
      const r=porCliente[p.crm_cliente_id];
      r.total++;
      if(p.status==='recebido')r.recebidas++;
      else if(p.status==='inadimplente')r.inad++;
      else{
        if(!r.proxima||p.data_vencimento<r.proxima)r.proxima=p.data_vencimento;
        const da=diasAtrasoParcela(p);
        if(da>r.atraso)r.atraso=da;
      }
    });
    C.forEach(c=>{c.finResumo=porCliente[c.id]||null;});
  }

  if(C.length){
    const ids=C.map(c=>c.id);
    const{data:anx}=await sb.from('crm_anexos').select('cliente_id').in('cliente_id',ids);
    const anxCont={};
    (anx||[]).forEach(a=>{anxCont[a.cliente_id]=(anxCont[a.cliente_id]||0)+1;});
    C.forEach(c=>{c.anexosCount=anxCont[c.id]||0;});
  }

  const porLista={};L.forEach(l=>porLista[l.id]=[]);
  const orfaos=[];
  C.forEach(c=>{if(porLista[c.lista_id])porLista[c.lista_id].push(c);else orfaos.push(c);});
  let kb=L.map(l=>listaHtml(l,porLista[l.id],false,ARQ[l.id]||0)).join('');
  if(orfaos.length)kb+=listaHtml({id:'__sem__',nome:'Sem lista',cor:'#5A7070'},orfaos,true,0);
  kb+=`<button class="knl" onclick="modalNovaLista('${q}')">+ nova lista</button>`;
  pc.innerHTML=`<div class="pgh">
      <div><div class="pgt">${QUADROS[q].rotulo}</div><div class="pgs">${C.length.toLocaleString('pt-BR')} ${C.length===1?'ativo':'ativos'}${ARQTOTAL?` · <span class="pgs-arq">${ARQTOTAL.toLocaleString('pt-BR')} arquivado${ARQTOTAL===1?'':'s'}</span>`:''} neste quadro</div></div>
      <button class="bnew" onclick="location.hash='#/cliente/novo'">+ Novo cliente</button>
    </div><div class="kb" id="kb">${kb}</div>`;
  ligarDragDrop();
}

function cardHtml(c){
  const chips=(c.crm_clientes_etiquetas||[]).map(e=>{
    const t=ETQ.find(x=>x.id===e.etiqueta_id);
    return t?`<span class="chip" style="background:${escA(t.cor)}">${esc(t.nome)}</span>`:'';

  const meta=[];
  if(c.telefone_principal)meta.push(esc(c.telefone_principal));
  if(c.data_nascimento_bebe)meta.push('DN '+fD(c.data_nascimento_bebe));
  if(c.anexosCount)meta.push(`<span class="kc-anexo">${clipeSvg()}${c.anexosCount}</span>`);
  let finHtml='';
  if(c.finResumo){
    const f=c.finResumo;

function clipeSvg(){return'<svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-1px;margin-right:2px"><path d="m21.44 11.05-9.19 9.19a6 6 0 0 1-8.49-8.49l8.57-8.57A4 4 0 1 1 18 8.84l-8.59 8.57a2 2 0 0 1-2.83-2.83l8.49-8.48"/></svg>';}
function entregaHtml(d){
  if(!d)return'';
  const dias=dVenc(d);
  let cls='ent-ok',txt=fD(d);
  if(dias<0){cls='ent-late';txt=fD(d)+' · atrasado';}
  else if(dias===0){cls='ent-soon';txt='entrega hoje';}
  else if(dias<=3){cls='ent-soon';txt=fD(d)+' · em '+dias+'d';}
  return`<div class="kcm"><span class="ent ${cls}">◷ ${txt}</span></div>`;
}
function bloqueioHtml(d){
  if(!d)return'';
  const dias=dVenc(d);
  let cls='ent-ok',txt='desbloqueia '+fD(d);
  if(dias<=0){cls='ent-late';txt=dias===0?'desbloqueado hoje':'desbloqueado há '+Math.abs(dias)+'d';}
  else if(dias<=3){cls='ent-soon';txt='desbloqueia em '+dias+'d';}
  return`<div class="kcm"><span class="ent ${cls}">🔒 ${txt}</span></div>`;
}
function bloqueioBadgeHtml(d){

  const dias=dVenc(d);

  else if(dias<=3){cls='ent-soon';txt='Desbloqueia em '+fD(d)+' · faltam '+dias+'d';}

function ligarDragDrop(){
  document.querySelectorAll('.kc').forEach(card=>{
    card.addEventListener('dragstart',e=>{
      dragCardId=card.getAttribute('data-card');
      const kl=card.closest('.kl');
      dragOrigLista=kl?kl.getAttribute('data-lista'):null;
      card.classList.add('dragging');e.dataTransfer.effectAllowed='move';
    });
    card.addEventListener('dragend',()=>{card.classList.remove('dragging');document.querySelectorAll('.kl').forEach(l=>l.classList.remove('dragover'));});
  });
  document.querySelectorAll('.klb').forEach(body=>{
    body.addEventListener('dragover',e=>{
      e.preventDefault();body.closest('.kl').classList.add('dragover');
      const arr=document.querySelector('.dragging');if(!arr)return;
      const dep=cardDepoisDe(body,e.clientY);
      if(dep==null)body.appendChild(arr);else body.insertBefore(arr,dep);
    });
    body.addEventListener('dragleave',e=>{if(!body.contains(e.relatedTarget))body.closest('.kl').classList.remove('dragover');});
    body.addEventListener('drop',async e=>{
      e.preventDefault();body.closest('.kl').classList.remove('dragover');
      const lid=body.getAttribute('data-drop');
      if(lid==='__sem__')return;
      const cid=dragCardId,origLista=dragOrigLista;
      await salvarOrdemLista(lid,body);
      if(cid&&origLista&&origLista!==lid)await registrarMovimentoLista(cid,origLista,lid);
    });
  });
}
function cardDepoisDe(cont,y){
  const cards=[...cont.querySelectorAll('.kc:not(.dragging)')];
  return cards.reduce((mais,card)=>{
    const box=card.getBoundingClientRect();
    const off=y-box.top-box.height/2;
    if(off<0&&off>mais.off)return{off:off,el:card};
    return mais;
  },{off:Number.NEGATIVE_INFINITY,el:null}).el;
}

function posicionarFlutuante(el,botao,largura){
  if(!botao)return;
  const r=botao.getBoundingClientRect();
  let left=r.left;
  if(left+largura>window.innerWidth-12)left=window.innerWidth-largura-12;
  if(left<12)left=12;
  let top=r.bottom+6;
  const maxTop=window.innerHeight-40;
  if(top>maxTop)top=maxTop;
  el.style.left=left+'px';
  el.style.top=top+'px';
}

async function mvpConfirmar(listaIdArg,posArg){
  const id=mcClienteId;
  const quadro=$('mvp-quadro').value;
  const listaId=listaIdArg||$('mvp-lista').value;
  const pos=listaIdArg!==undefined&&posArg!==undefined?posArg:(parseInt($('mvp-pos').value,10)||0);
  if(!listaId){toast('Escolha uma lista','er');return;}

  // O LINK DIGITADO E NAO SALVO.
  //
  // Este balao move o card e depois chama abrirCardCliente(), que
  // recarrega tudo do banco. Ate 15/08/2026 isso jogava fora o que
  // estivesse digitado no cartao sem ter passado pelo Salvar — e o
  // campo mais caro de perder e o link do contrato: o card chegava em
  // "Contrato enviado" sem link, o motor ficava esperando quieto e a
  // cliente nao recebia nada. Aconteceu de verdade.
  //
  // Agora o link vai junto no mesmo update do movimento.
  const campoLink=$('mc-link-contrato');
  const linkDigitado=campoLink?campoLink.value.trim():'';

  if(listaId===LISTA_CONTRATO_ENVIADO&&!linkDigitado){
    if(!confirm('Este card esta indo para "Contrato enviado" sem o link do contrato.\n\nA Samara nao vai mandar nada ate o link ser preenchido — o card fica parado.\n\nMover assim mesmo?'))return;
  }

  const{data:atualCli}=await sb.from('crm_clientes').select('lista_id,quadro').eq('id',id).single();
  const origListaId=atualCli?atualCli.lista_id:null;
  const{data:naLista}=await sb.from('crm_clientes').select('id,posicao').eq('lista_id',listaId).neq('id',id).order('posicao');
  const ord=(naLista||[]).map(x=>x.id);
  ord.splice(pos,0,id);
  const res=await Promise.all(ord.map((cid,i)=>{
    const p={lista_id:listaId,posicao:i,atualizado_em:new Date().toISOString()};
    if(cid===id){
      p.quadro=quadro;
      // So grava quando ha algo digitado. Campo vazio nao apaga o link
      // que ja estiver salvo no banco — para apagar de proposito, use o
      // botao Salvar do cartao.
      if(linkDigitado)p.link_contrato=linkDigitado;
    }
    return sb.from('crm_clientes').update(p).eq('id',cid);
  }));
  if(res.find(r=>r.error)){toast('Não foi possível mover','er');return;}
  toast('Cartão movido','ok');
  if(origListaId&&origListaId!==listaId)await registrarMovimentoLista(id,origListaId,listaId);
  finCarregado=false;
  fecharMoverPopover();
  abrirCardCliente(id);
}

async function moverPara(clienteId,quadro,listaId,pos){

  const origListaId=atualCli?atualCli.lista_id:null;

    if(id===clienteId)p.quadro=quadro;

/* O que a Samara apurou na triagem mora em crm_clientes.samara_dados,
   um JSON. Ate aqui isso so aparecia na Fila de Automacoes — o card, que
   e onde voce olha para decidir, nao mostrava nada. O efeito era achar
   que a DPP nao tinha sido coletada quando ela estava gravada o tempo
   todo.

   A ordem dos campos e a ordem das perguntas da triagem, entao da para
   ler de cima para baixo e ver onde a conversa parou. */
const TRIAGEM_ROTULOS=[
  ['contribuiu','Contribuiu ao INSS'],
  ['gravida','Grávida'],
  ['dn','Nascimento do bebê'],
  ['dpp','DPP (prevista)'],
  ['ds','Saída do emprego'],
  ['ds_registrada','Era registrado'],
  ['seguro_desemprego','Seguro-desemprego'],
  ['desemprego_involuntario','Emprega Brasil / SINE'],
  ['data_desemprego_involuntario','Cadastro em'],
  ['empregada_no_parto','Empregada no parto'],
  ['licenca_empregador','Licença pelo empregador'],
  ['pedido_negado','Pedido já negado'],
  ['adocao','Adoção']
];
function mcTriagemHtml(dados){
  const d=dados||{};
  const conhecidas=TRIAGEM_ROTULOS.filter(([k])=>{
    const v=d[k];return v!==null&&v!==undefined&&String(v).trim()!=='';
  });
  // Chave que a Samara gravou e nao esta na lista acima: mostra assim
  // mesmo, com o nome cru. Melhor feio que escondido.
  const sobrando=Object.keys(d).filter(k=>!TRIAGEM_ROTULOS.some(([r])=>r===k)&&String(d[k]??'').trim()!=='');
  if(!conhecidas.length&&!sobrando.length){
    return `<div class="mcsens" style="background:var(--bg2,#f6f7f8);border:1.5px dashed var(--border);border-radius:12px;padding:13px 14px;margin-bottom:13px">
      <div style="font-size:12px;font-weight:700;color:var(--text2);margin-bottom:6px">🔎 Triagem</div>
      <div class="fhint">A Samara ainda não coletou nada desta cliente.</div>
    </div>`;
  }
  const linha=(rot,val)=>`<div style="display:flex;justify-content:space-between;gap:10px;padding:3px 0;font-size:13px">
      <span style="color:var(--text3)">${esc(rot)}</span><b>${esc(String(val))}</b></div>`;
  return `<div class="mcsens" style="background:var(--bg2,#f6f7f8);border:1.5px solid var(--border);border-radius:12px;padding:13px 14px;margin-bottom:13px">
    <div style="font-size:12px;font-weight:700;color:var(--text2);margin-bottom:8px">🔎 Triagem — o que a Samara coletou</div>
    ${conhecidas.map(([k,rot])=>linha(rot,d[k])).join('')}
    ${sobrando.map(k=>linha(k,d[k])).join('')}
    <div class="fhint" style="margin-top:7px">Coletado na conversa. Para corrigir, fale com a cliente ou ajuste em <code>samara_dados</code>.</div>
  </div>`;
}

  ['anexos','coment','chat'].forEach(n=>{

function chatHoraMsg(m){
  const d=new Date(m.enviada_em||m.criado_em);
  return d.toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'});
}
function chatDiaMsg(m){
  const d=new Date(m.enviada_em||m.criado_em),h=new Date(),o=new Date(Date.now()-86400000);
  const ig=(a,b)=>a.toDateString()===b.toDateString();
  if(ig(d,h))return'Hoje';
  if(ig(d,o))return'Ontem';
  return d.toLocaleDateString('pt-BR');
}
/* O base64 da midia chega dentro de crm_mensagens.texto e destroi a
   leitura da conversa: um audio de 10 segundos vira uma parede de 40 mil
   caracteres e empurra o resto do papo para fora da tela.

   Aqui so escondemos. A correcao de origem (nao gravar o base64 no
   texto) e outra briga — esta funcao continua valendo depois dela,
   porque as 31 mensagens que ja estao no banco nao se consertam
   sozinhas.

   Como reconhecer: base64 nao tem espaco e so usa o alfabeto dele.
   Qualquer frase de gente tem espaco nos primeiros caracteres, e URL
   tem dois-pontos — que nao esta no alfabeto. */
function pareceBase64(t){
  const s=String(t||'').trim();
  if(s.length<200)return false;
  if(/\s/.test(s.slice(0,200)))return false;
  return /^[A-Za-z0-9+/=_-]+$/.test(s.slice(0,400));
}
function rotuloMidia(m){
  const ic={imagem:'🖼',audio:'🎤',video:'🎬',documento:'📄',figurinha:'🩹',localizacao:'📍'};
  const nome={imagem:'imagem',audio:'áudio',video:'vídeo',documento:'documento',figurinha:'figurinha',localizacao:'localização'};
  const t=m&&m.tipo&&m.tipo!=='texto'?m.tipo:null;
  if(t)return (ic[t]||'📎')+' '+(m.midia_nome||nome[t]||t);
  return '📎 mídia';
}
function chatCorpoMsg(m){
  let html='';
  const ehMidia=m.tipo&&m.tipo!=='texto';
  if(ehMidia){
    html+=`<span class="chatb-mid">${esc(rotuloMidia(m))}</span>`;
  }
  const cru=m.texto||'';
  if(cru&&!pareceBase64(cru))html+=esc(cru).replace(/\n/g,'<br>');
  else if(cru&&pareceBase64(cru)&&!ehMidia)html+=`<span class="chatb-mid">${esc(rotuloMidia(m))}</span>`;
  else if(!cru&&!ehMidia)html+='<span style="opacity:.6">(mensagem sem texto)</span>';
  return html;
}
function chatJanelaHtml(msgs,canal){
  if(canal!=='meta_oficial')return'';
  const ultima=[...msgs].reverse().find(m=>m.direcao==='entrada');
  if(!ultima)return'<div class="chatjanela off">⛔ Janela de 24h fechada — nenhuma mensagem recebida da cliente. No canal oficial só dá pra iniciar com um template aprovado pela Meta.</div>';
  const passou=(Date.now()-new Date(ultima.enviada_em||ultima.criado_em).getTime())/3600000;
  const resta=24-passou;
  if(resta<=0)return'<div class="chatjanela off">⛔ Janela de 24h fechada — a última mensagem da cliente foi há '+Math.floor(passou)+'h. Só dá pra retomar com um template aprovado pela Meta.</div>';
  if(resta<=4)return'<div class="chatjanela warn">⚠ Janela de 24h fechando — faltam '+(resta<1?Math.round(resta*60)+' min':Math.floor(resta)+'h')+' para responder livremente.</div>';
  return'<div class="chatjanela ok">✔ Janela de 24h aberta — faltam '+Math.floor(resta)+'h para responder livremente.</div>';
}
async function carregarChat(clienteId,silencioso){
  const feed=$('mc-chat-feed');
  if(!feed||!clienteId)return;
  const{data,error}=await sb.from('crm_mensagens').select('*').eq('cliente_id',clienteId).order('criado_em',{ascending:true}).limit(300);
  if(error){if(!silencioso)feed.innerHTML='<div class="fhint" style="text-align:center;padding:14px 0">Erro ao carregar a conversa: '+esc(error.message)+'</div>';return;}
  const msgs=data||[];
  const assinatura=msgs.length+'|'+(msgs.length?(msgs[msgs.length-1].id||''):'');
  const jan=$('mc-chat-janela');
  if(jan)jan.innerHTML=chatJanelaHtml(msgs,mcChatCanal);
  const av=$('mc-chat-aviso');
  if(av)av.innerHTML=mcChatCanal?'O envio real ainda não está ligado. A mensagem fica registrada aqui na conversa e sai de verdade quando a API de envio do canal for conectada.':'Defina o <b>Canal WhatsApp</b> desta cliente na coluna ao lado para o chat saber por onde a conversa acontece.';
  if(silencioso&&assinatura===mcChatAssinatura)return;
  mcChatAssinatura=assinatura;
  if(!msgs.length){feed.innerHTML='<div class="fhint" style="text-align:center;padding:20px 0">Nenhuma mensagem ainda.<br>A conversa aparece aqui a partir do dia em que o webhook estiver ligado.</div>';return;}
  let html='',diaAnt='';
  msgs.forEach(m=>{
    const dia=chatDiaMsg(m);
    if(dia!==diaAnt){html+=`<div class="chatdia">${esc(dia)}</div>`;diaAnt=dia;}
    const cls=m.direcao==='entrada'?'chatb-in':(m.autor_tipo==='bot'?'chatb-bot':'chatb-out');
    const autor=m.direcao==='entrada'?'':(m.autor_tipo==='bot'?'Samara · ':(nomeUsuario(m.usuario_id)?nomeUsuario(m.usuario_id)+' · ':''));
    const pend=m.status==='pendente_envio'?' · ⏳ não enviada':'';
    html+=`<div class="chatb ${cls}">${chatCorpoMsg(m)}<span class="chatb-meta">${esc(autor)}${chatHoraMsg(m)}${pend}</span></div>`;
  });
  feed.innerHTML=html;
  feed.scrollTop=feed.scrollHeight;
}
async function enviarMensagemChat(clienteId){
  const inp=$('mc-chat-input');
  if(!inp)return;
  const txt=(inp.value||'').trim();
  if(!txt){toast('Escreva a mensagem primeiro','er');return;}
  if(!mcChatCanal){toast('Defina o Canal WhatsApp da cliente antes de enviar','er');return;}
  const btn=$('mc-chat-btn');
  if(btn){btn.disabled=true;btn.textContent='Registrando...';}
  const{error}=await sb.from('crm_mensagens').insert({
    cliente_id:clienteId,
    telefone_bruto:mcChatTel||null,
    canal:mcChatCanal,
    direcao:'saida',
    autor_tipo:'humano',
    usuario_id:U.id,
    tipo:'texto',
    texto:txt,
    status:'pendente_envio',
    enviada_em:new Date().toISOString()
  });
  if(btn){btn.disabled=false;btn.textContent='Enviar';}
  if(error){toast('Erro ao registrar: '+error.message,'er');return;}
  inp.value='';
  mcChatAssinatura='';
  carregarChat(clienteId);
  toast('Mensagem registrada na conversa (envio real ainda não ligado)','in');
}

function globalBuscaInput(valor){

  if(termo.length<2){

    return;
  }
  alvo.innerHTML='<div class="fhint" style="text-align:center;padding:14px 0">Buscando...</div>';
  gbTimer=setTimeout(()=>executarBuscaGlobal(termo),300);
}
async function executarBuscaGlobal(termo){
  const alvo=$('gb-resultados');
  if(!alvo)return;
  const escQ=v=>String(v).replace(/"/g,'\\"');
  const digits=termo.replace(/\D/g,'');
  const conds=[
    `nome_completo.ilike."%${escQ(termo)}%"`,
    `telefone_principal.ilike."%${escQ(termo)}%"`,
    `cpf.ilike."%${escQ(termo)}%"`,
    `observacoes.ilike."%${escQ(termo)}%"`,
    `trello_url.ilike."%${escQ(termo)}%"`
  ];
  if(digits.length>=3)conds.push(`telefone_chave.ilike."%${digits}%"`);
  const{data,error}=await sb.from('crm_clientes')
    .select('id,nome_completo,telefone_principal,quadro,arquivado_em')
    .or(conds.join(','))
    .order('nome_completo')
    .limit(25);
  if(!$('gb-resultados')||$('gb-input')&&$('gb-input').value.trim()!==termo)return;
  if(error){alvo.innerHTML='<div class="fhint" style="text-align:center;padding:14px 0">Erro ao buscar: '+esc(error.message)+'</div>';return;}
  if(!data||!data.length){alvo.innerHTML='<div class="fhint" style="text-align:center;padding:14px 0">Nada encontrado</div>';return;}
  alvo.innerHTML=data.map(c=>`
    <div class="gb-item" onclick="abrirCardCliente('${c.id}')">
      <div class="gb-nome">${esc(c.nome_completo)}${c.arquivado_em?'<span class="gb-arq">Arquivado</span>':''}</div>
      <div class="gb-meta">${QUADROS[c.quadro]?QUADROS[c.quadro].rotulo:(c.quadro||'—')}${c.telefone_principal?' · '+esc(c.telefone_principal):''}</div>
    </div>`).join('');
}
