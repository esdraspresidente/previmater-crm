<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PreviMater CRM</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon192.png">
<link rel="apple-touch-icon" href="icon192.png">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root {
    --bg-page: #F5F1E8;
    --bg-card: #FFFFFF;
    --bg-column: #EFEBDF;
    --text-primary: #1E2A2A;
    --text-secondary: #6B6A63;
    --border: #D8D3C4;
    --primary: #12302E;
    --primary-dark: #0B211F;
    --amber: #D98E3D;
    --sage: #6B8F5C;
    --sage-bg: #E7EFDF;
    --sage-text: #3F5A33;
    --brick: #B5533D;
    --brick-bg: #F6E2DC;
    --brick-text: #7C3520;
    --gray: #7C7A6E;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: 'Inter', sans-serif;
    background: var(--bg-page);
    color: var(--text-primary);
    min-height: 100vh;
  }
  #app { min-height: 100vh; }

  /* ---------- login ---------- */
  .login-wrap {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 1.5rem;
  }
  .login-card {
    background: var(--bg-card);
    border: 0.5px solid var(--border);
    border-radius: 12px;
    padding: 2rem 1.75rem;
    width: 100%;
    max-width: 360px;
  }
  .login-card h1 {
    font-size: 20px;
    font-weight: 700;
    color: var(--primary);
    margin: 0 0 1.5rem;
  }
  .field { margin-bottom: 1rem; }
  .field label {
    display: block;
    font-size: 13px;
    font-weight: 600;
    color: var(--text-secondary);
    margin-bottom: 6px;
  }
  .field input {
    width: 100%;
    height: 40px;
    padding: 0 12px;
    border-radius: 8px;
    border: 0.5px solid var(--border);
    background: #FFFFFF;
    font-family: inherit;
    font-size: 14px;
    color: var(--text-primary);
  }
  .field input:focus { outline: none; border-color: var(--primary); }
  .btn-primary {
    width: 100%;
    height: 42px;
    border: none;
    border-radius: 8px;
    background: var(--primary);
    color: var(--bg-page);
    font-family: inherit;
    font-size: 14px;
    font-weight: 700;
    cursor: pointer;
    margin-top: 4px;
  }
  .btn-primary:hover { background: var(--primary-dark); }
  .btn-primary:disabled { opacity: 0.6; cursor: default; }
  .error-msg {
    font-size: 13px;
    color: var(--brick-text);
    background: var(--brick-bg);
    padding: 8px 10px;
    border-radius: 8px;
    margin-bottom: 1rem;
  }

  /* ---------- topbar ---------- */
  .topbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 12px 20px;
    border-bottom: 0.5px solid var(--border);
    flex-wrap: wrap;
    gap: 10px;
  }
  .topbar .brand { font-size: 18px; font-weight: 700; color: var(--primary); }
  .topbar .who {
    display: flex;
    align-items: center;
    gap: 12px;
    font-size: 13px;
    color: var(--text-secondary);
  }
  .btn-ghost {
    border: 0.5px solid var(--border);
    background: transparent;
    border-radius: 6px;
    padding: 6px 12px;
    font-family: inherit;
    font-size: 13px;
    font-weight: 600;
    color: var(--text-primary);
    cursor: pointer;
  }
  .btn-ghost:hover { background: var(--bg-column); }

  /* ---------- abas de quadro ---------- */
  .quadro-tabs {
    display: flex;
    gap: 4px;
    padding: 0 20px;
    border-bottom: 0.5px solid var(--border);
    overflow-x: auto;
  }
  .quadro-tab {
    padding: 10px 16px;
    font-size: 13px;
    font-weight: 700;
    color: var(--text-secondary);
    cursor: pointer;
    border-bottom: 3px solid transparent;
    white-space: nowrap;
  }
  .quadro-tab:hover { color: var(--primary); }
  .quadro-tab.ativo {
    color: var(--primary);
    border-bottom-color: var(--primary);
  }

  /* ---------- kanban ---------- */
  .kanban-wrap { padding: 20px; }
  .kanban-board {
    display: flex;
    gap: 12px;
    overflow-x: auto;
    align-items: flex-start;
    padding-bottom: 12px;
  }
  .kanban-col { min-width: 230px; flex: 0 0 230px; }
  .col-header {
    background: var(--bg-column);
    padding: 8px 10px;
    font-size: 13px;
    font-weight: 700;
    color: var(--text-primary);
    margin-bottom: 8px;
    letter-spacing: 0.2px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 6px;
  }
  .col-count { font-weight: 400; color: var(--text-secondary); font-size: 12px; }
  .col-arquivar {
    border: none;
    background: transparent;
    color: var(--text-secondary);
    cursor: pointer;
    font-size: 15px;
    line-height: 1;
    padding: 0 2px;
  }
  .col-arquivar:hover { color: var(--brick-text); }
  .client-card {
    background: var(--bg-card);
    border: 0.5px solid var(--border);
    border-radius: 12px;
    padding: 10px 12px;
    margin-bottom: 8px;
    cursor: pointer;
  }
  .client-card:hover { border-color: var(--primary); }
  .client-card .nome { font-size: 14px; font-weight: 700; color: var(--text-primary); }
  .client-card .meta { font-size: 12px; color: var(--text-secondary); margin-top: 2px; }
  .card-etiquetas { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 6px; }
  .etiqueta-chip {
    font-size: 10px;
    font-weight: 700;
    color: #FFFFFF;
    padding: 2px 7px;
    border-radius: 5px;
    letter-spacing: 0.2px;
  }
  .empty-col { font-size: 12px; color: var(--text-secondary); padding: 6px 2px; }
  .loading-msg, .error-box {
    padding: 40px 20px;
    text-align: center;
    color: var(--text-secondary);
    font-size: 14px;
  }
  .add-col-btn {
    min-width: 180px;
    flex: 0 0 180px;
    border: 1px dashed var(--border);
    border-radius: 12px;
    background: transparent;
    color: var(--text-secondary);
    font-family: inherit;
    font-size: 13px;
    font-weight: 600;
    padding: 12px;
    cursor: pointer;
  }
  .add-col-btn:hover { border-color: var(--primary); color: var(--primary); }

  /* ---------- formularios ---------- */
  .form-wrap { padding: 20px; max-width: 660px; }
  .form-back {
    display: inline-block;
    font-size: 13px;
    font-weight: 600;
    color: var(--text-secondary);
    text-decoration: none;
    margin-bottom: 14px;
    cursor: pointer;
  }
  .form-back:hover { color: var(--primary); }
  .form-card {
    background: var(--bg-card);
    border: 0.5px solid var(--border);
    border-radius: 12px;
    padding: 24px;
  }
  .form-card h2 { font-size: 18px; font-weight: 700; color: var(--primary); margin: 0 0 20px; }
  .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
  .field select, .field textarea {
    width: 100%;
    padding: 8px 12px;
    border-radius: 8px;
    border: 0.5px solid var(--border);
    background: #FFFFFF;
    font-family: inherit;
    font-size: 14px;
    color: var(--text-primary);
  }
  .field select { height: 40px; }
  .field textarea { resize: vertical; min-height: 70px; }
  .field select:focus, .field textarea:focus { outline: none; border-color: var(--primary); }
  .etiqueta-picker { display: flex; flex-wrap: wrap; gap: 6px; }
  .etiqueta-toggle {
    font-size: 12px;
    font-weight: 700;
    padding: 5px 11px;
    border-radius: 6px;
    cursor: pointer;
    border: 1.5px solid transparent;
    opacity: 0.4;
    color: #FFFFFF;
  }
  .etiqueta-toggle.marcada { opacity: 1; }
  .form-actions {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-top: 20px;
  }
  .form-actions-right { display: flex; gap: 10px; }
  .btn-secondary {
    border: 0.5px solid var(--border);
    background: transparent;
    border-radius: 8px;
    padding: 0 18px;
    height: 42px;
    font-family: inherit;
    font-size: 14px;
    font-weight: 600;
    color: var(--text-primary);
    cursor: pointer;
  }
  .btn-secondary:hover { background: var(--bg-column); }
  .btn-danger-text {
    border: none;
    background: transparent;
    font-family: inherit;
    font-size: 13px;
    font-weight: 600;
    color: var(--brick-text);
    cursor: pointer;
    padding: 0;
  }
  .btn-danger-text:hover { text-decoration: underline; }
  .form-save-msg { font-size: 13px; padding: 8px 10px; border-radius: 8px; margin-bottom: 14px; }
  .form-save-msg.ok { background: var(--sage-bg); color: var(--sage-text); }
  .form-save-msg.err { background: var(--brick-bg); color: var(--brick-text); }

  /* ---------- tabelas (campanha, etiquetas) ---------- */
  .campanha-wrap { padding: 20px; }
  .alert-banner {
    background: var(--brick-bg);
    color: var(--brick-text);
    padding: 10px 14px;
    border-radius: 8px;
    margin-bottom: 16px;
    font-size: 13px;
    font-weight: 600;
  }
  .section-title { font-size: 15px; font-weight: 700; color: var(--primary); margin: 24px 0 10px; }
  .section-title:first-child { margin-top: 0; }
  .previmater-table {
    width: 100%;
    border-collapse: collapse;
    background: var(--bg-card);
    border: 0.5px solid var(--border);
    border-radius: 12px;
    overflow: hidden;
  }
  .previmater-table th {
    text-align: left;
    font-size: 12px;
    font-weight: 700;
    color: var(--text-secondary);
    background: var(--bg-column);
    padding: 8px 12px;
  }
  .previmater-table td {
    font-size: 13px;
    color: var(--text-primary);
    padding: 8px 12px;
    border-top: 0.5px solid var(--border);
  }
  .badge { display: inline-block; padding: 2px 8px; border-radius: 6px; font-size: 11px; font-weight: 600; }
  .badge.ok { background: var(--sage-bg); color: var(--sage-text); }
  .badge.alerta { background: var(--brick-bg); color: var(--brick-text); }
  .badge.neutro { background: var(--bg-column); color: var(--text-secondary); }
  .teto-input {
    width: 64px;
    padding: 4px 6px;
    border-radius: 6px;
    border: 0.5px solid var(--border);
    font-family: inherit;
    font-size: 13px;
  }
  .btn-mini {
    border: 0.5px solid var(--border);
    background: transparent;
    border-radius: 6px;
    padding: 4px 10px;
    font-family: inherit;
    font-size: 12px;
    font-weight: 600;
    color: var(--text-primary);
    cursor: pointer;
    margin-left: 6px;
  }
  .btn-mini:hover { background: var(--bg-column); }
  .add-instancia-form {
    background: var(--bg-card);
    border: 0.5px solid var(--border);
    border-radius: 12px;
    padding: 16px;
    margin-bottom: 16px;
    display: grid;
    grid-template-columns: 2fr 1fr 1fr auto;
    gap: 10px;
    align-items: end;
  }
  .add-instancia-form .field { margin-bottom: 0; }
  .cor-input { width: 46px; height: 34px; padding: 2px; border-radius: 6px; border: 0.5px solid var(--border); }

  @media (max-width: 640px) {
    .form-row { grid-template-columns: 1fr; }
    .add-instancia-form { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>
<div id="app"></div>

<script>
  // ------------------------------------------------------------
  // CONFIGURACAO SUPABASE
  // ------------------------------------------------------------
  const SUPABASE_URL = 'https://ggyngtqknonwnohbzkyj.supabase.co';
  const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImdneW5ndHFrbm9ud25vaGJ6a3lqIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzg5ODA4NzcsImV4cCI6MjA5NDU1Njg3N30.0zYn_V9gBtRNWivAHfps6u68akb0mTc7Ix8ZD38OD0I';
  const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  // ------------------------------------------------------------
  // ESTADO
  // ------------------------------------------------------------
  let currentUser = null;      // { id, nome, nivel, email }
  let currentSession = null;
  let quadrosPermitidos = [];  // ex: ['comercial','incubadora','operacional','financeiro']
  let etiquetasCache = [];     // [{id, nome, cor}]

  const QUADROS = {
    comercial: {
      rotulo: 'Comercial',
      fases: [
        { chave: 'Lead novo',             cor: 'var(--gray)' },
        { chave: 'Em triagem',            cor: 'var(--amber)' },
        { chave: 'Aguardando documentos', cor: 'var(--amber)' },
        { chave: 'Contrato enviado',      cor: 'var(--sage)' },
        { chave: 'Contrato assinado',     cor: 'var(--primary)' }
      ]
    },
    incubadora: { rotulo: 'Incubadora', fases: null }, // colunas = meses, vem do banco
    operacional: {
      rotulo: 'Operacional',
      fases: [
        { chave: 'Beneficio Protocolado', cor: 'var(--gray)',    rotulo: 'Benefício protocolado' },
        { chave: 'Em Analise',            cor: 'var(--amber)',   rotulo: 'Em análise' },
        { chave: 'Exigencia',             cor: 'var(--amber)',   rotulo: 'Exigência' },
        { chave: 'Exigencia Cumprida',    cor: 'var(--sage)',    rotulo: 'Exigência cumprida' },
        { chave: 'Beneficio Negado',      cor: 'var(--brick)',   rotulo: 'Benefício negado' },
        { chave: 'Beneficio Concedido',   cor: 'var(--sage)',    rotulo: 'Benefício concedido' }
      ]
    },
    financeiro: {
      rotulo: 'Financeiro',
      fases: [
        { chave: 'Aguardando pagamento INSS', cor: 'var(--gray)' },
        { chave: 'Beneficio recebido',        cor: 'var(--amber)',  rotulo: 'Benefício recebido' },
        { chave: 'Honorarios a receber',      cor: 'var(--amber)',  rotulo: 'Honorários a receber' },
        { chave: 'Pago-Encerrado',            cor: 'var(--sage)',   rotulo: 'Pago / encerrado' }
      ]
    }
  };

  const MESES_NOME = ['Janeiro','Fevereiro','Março','Abril','Maio','Junho',
                      'Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];

  function rotuloFase(f) { return f.rotulo || f.chave; }

  // ------------------------------------------------------------
  // ROTEAMENTO POR HASH
  // ------------------------------------------------------------
  function getRoute() { return location.hash.slice(1) || '/'; }

  window.addEventListener('hashchange', render);
  window.addEventListener('DOMContentLoaded', init);

  async function init() {
    const { data } = await sb.auth.getSession();
    currentSession = data.session;
    if (currentSession) await carregarUsuarioAtual();
    render();
  }

  async function carregarUsuarioAtual() {
    const { data, error } = await sb
      .from('crm_usuarios')
      .select('id, nome, nivel, email')
      .eq('auth_user_id', currentSession.user.id)
      .single();
    if (error || !data) return;
    currentUser = data;

    const { data: perms } = await sb
      .from('crm_permissoes_quadro')
      .select('quadro')
      .eq('usuario_id', currentUser.id);
    quadrosPermitidos = (perms || []).map(p => p.quadro);

    const { data: etqs } = await sb.from('crm_etiquetas').select('*').order('nome');
    etiquetasCache = etqs || [];
  }

  // ------------------------------------------------------------
  // RENDER PRINCIPAL
  // ------------------------------------------------------------
  function render() {
    const app = document.getElementById('app');
    if (!currentSession || !currentUser) {
      app.innerHTML = telaLogin();
      ligarEventosLogin();
      return;
    }
    const rota = getRoute();

    if (rota === '/') {
      const primeiro = quadrosPermitidos[0] || 'comercial';
      location.hash = '#/quadro/' + primeiro;
      return;
    }

    const matchQuadro = rota.match(/^\/quadro\/(.+)$/);
    if (matchQuadro) { renderQuadro(matchQuadro[1]); return; }

    if (rota === '/cliente/novo') { renderFormCliente(null); return; }

    const matchCliente = rota.match(/^\/cliente\/(.+)$/);
    if (matchCliente) { renderFormCliente(matchCliente[1]); return; }

    if (rota === '/etiquetas') { renderEtiquetas(); return; }
    if (rota === '/campanha') { renderCampanha(); return; }

    app.innerHTML = topbarHtml({}) + '<div class="loading-msg">Tela não encontrada.</div>';
    ligarEventosTopbar();
  }

  // ------------------------------------------------------------
  // LOGIN
  // ------------------------------------------------------------
  function telaLogin() {
    return `
      <div class="login-wrap">
        <div class="login-card">
          <h1>PreviMater CRM</h1>
          <div id="login-error"></div>
          <div class="field">
            <label for="login-email">E-mail</label>
            <input id="login-email" type="email" autocomplete="username">
          </div>
          <div class="field">
            <label for="login-senha">Senha</label>
            <input id="login-senha" type="password" autocomplete="current-password">
          </div>
          <button class="btn-primary" id="btn-entrar">Entrar</button>
        </div>
      </div>
    `;
  }

  function ligarEventosLogin() {
    const btn = document.getElementById('btn-entrar');
    const email = document.getElementById('login-email');
    const senha = document.getElementById('login-senha');
    btn.addEventListener('click', () => fazerLogin(email.value, senha.value));
    senha.addEventListener('keydown', e => { if (e.key === 'Enter') fazerLogin(email.value, senha.value); });
  }

  async function fazerLogin(email, senha) {
    const btn = document.getElementById('btn-entrar');
    const errBox = document.getElementById('login-error');
    errBox.innerHTML = '';
    if (!email || !senha) {
      errBox.innerHTML = '<div class="error-msg">Preencha e-mail e senha.</div>';
      return;
    }
    btn.disabled = true;
    btn.textContent = 'Entrando...';
    const { data, error } = await sb.auth.signInWithPassword({ email, password: senha });
    if (error) {
      btn.disabled = false;
      btn.textContent = 'Entrar';
      errBox.innerHTML = '<div class="error-msg">E-mail ou senha incorretos.</div>';
      return;
    }
    currentSession = data.session;
    await carregarUsuarioAtual();
    if (!currentUser) {
      errBox.innerHTML = '<div class="error-msg">Login certo, mas este usuário não está cadastrado no CRM.</div>';
      btn.disabled = false;
      btn.textContent = 'Entrar';
      await sb.auth.signOut();
      currentSession = null;
      return;
    }
    location.hash = '#/';
    render();
  }

  async function fazerLogout() {
    await sb.auth.signOut();
    currentSession = null;
    currentUser = null;
    quadrosPermitidos = [];
    etiquetasCache = [];
    location.hash = '#/';
    render();
  }

  // ------------------------------------------------------------
  // TOPBAR + ABAS DE QUADRO
  // ------------------------------------------------------------
  function topbarHtml(opcoes) {
    opcoes = opcoes || {};
    const abas = quadrosPermitidos
      .filter(q => QUADROS[q])
      .map(q => `<div class="quadro-tab ${opcoes.quadroAtivo === q ? 'ativo' : ''}" onclick="location.hash='#/quadro/${q}'">${QUADROS[q].rotulo}</div>`)
      .join('');

    const extras = [];
    extras.push(`<div class="quadro-tab ${opcoes.quadroAtivo === 'etiquetas' ? 'ativo' : ''}" onclick="location.hash='#/etiquetas'">Etiquetas</div>`);
    if (currentUser.nivel === 'proprietario') {
      extras.push(`<div class="quadro-tab ${opcoes.quadroAtivo === 'campanha' ? 'ativo' : ''}" onclick="location.hash='#/campanha'">Campanha</div>`);
    }

    return `
      <div class="topbar">
        <div class="brand">PreviMater CRM</div>
        <div class="who">
          ${opcoes.novoCliente ? '<button class="btn-ghost" id="btn-novo-cliente">+ novo cliente</button>' : ''}
          <span>${escapeHtml(currentUser.nome)} · ${currentUser.nivel === 'proprietario' ? 'proprietário' : 'administrativo'}</span>
          <button class="btn-ghost" id="btn-sair">Sair</button>
        </div>
      </div>
      <div class="quadro-tabs">${abas}${extras.join('')}</div>
    `;
  }

  function ligarEventosTopbar() {
    const btnSair = document.getElementById('btn-sair');
    if (btnSair) btnSair.addEventListener('click', fazerLogout);
    const btnNovo = document.getElementById('btn-novo-cliente');
    if (btnNovo) btnNovo.addEventListener('click', () => { location.hash = '#/cliente/novo'; });
  }

  // ------------------------------------------------------------
  // QUADRO (kanban)
  // ------------------------------------------------------------
  async function renderQuadro(quadro) {
    const app = document.getElementById('app');

    if (!QUADROS[quadro]) {
      app.innerHTML = topbarHtml({}) + '<div class="error-box">Quadro não encontrado.</div>';
      ligarEventosTopbar();
      return;
    }
    if (!quadrosPermitidos.includes(quadro)) {
      app.innerHTML = topbarHtml({}) + '<div class="error-box">Você não tem acesso a este quadro.</div>';
      ligarEventosTopbar();
      return;
    }

    const topo = topbarHtml({ novoCliente: true, quadroAtivo: quadro });
    app.innerHTML = topo + '<div class="loading-msg">Carregando...</div>';
    ligarEventosTopbar();

    const { data: clientes, error } = await sb
      .from('crm_clientes')
      .select('id, nome_completo, quadro, fase_kanban, data_nascimento_bebe, valor_beneficio_esperado, crm_clientes_etiquetas(etiqueta_id)')
      .eq('quadro', quadro)
      .order('criado_em', { ascending: false });

    if (error) {
      app.innerHTML = topo + `<div class="error-box">Não foi possível carregar.<br>${escapeHtml(error.message)}</div>`;
      ligarEventosTopbar();
      return;
    }

    const lista = clientes || [];
    const boardHtml = quadro === 'incubadora'
      ? await montarBoardIncubadora(lista)
      : montarBoardFases(quadro, lista);

    app.innerHTML = topo + `<div class="kanban-wrap"><div class="kanban-board">${boardHtml}</div></div>`;
    ligarEventosTopbar();
    ligarEventosBoard();
  }

  function montarBoardFases(quadro, clientes) {
    const fases = QUADROS[quadro].fases;
    const porFase = {};
    fases.forEach(f => porFase[f.chave] = []);
    clientes.forEach(c => { if (porFase[c.fase_kanban]) porFase[c.fase_kanban].push(c); });

    return fases.map(f => `
      <div class="kanban-col">
        <div class="col-header" style="border-top: 4px solid ${f.cor};">
          <span>${rotuloFase(f)} <span class="col-count">(${porFase[f.chave].length})</span></span>
        </div>
        ${porFase[f.chave].length === 0
          ? '<div class="empty-col">Nenhum cliente</div>'
          : porFase[f.chave].map(cartaoClienteHtml).join('')}
      </div>
    `).join('');
  }

  async function montarBoardIncubadora(clientes) {
    const { data: colunas } = await sb
      .from('crm_incubadora_colunas')
      .select('*')
      .eq('arquivada', false)
      .order('ano')
      .order('mes');

    const listaColunas = colunas || [];

    if (listaColunas.length === 0) {
      return `<button class="add-col-btn" id="btn-nova-coluna-mes">+ criar primeiro mês</button>`;
    }

    const porColuna = {};
    listaColunas.forEach(col => porColuna[col.id] = []);
    const semColuna = [];

    clientes.forEach(c => {
      if (!c.data_nascimento_bebe) { semColuna.push(c); return; }
      const [ano, mes] = c.data_nascimento_bebe.split('-').map(Number);
      const col = listaColunas.find(x => x.ano === ano && x.mes === mes);
      if (col) porColuna[col.id].push(c);
      else semColuna.push(c);
    });

    let html = listaColunas.map(col => `
      <div class="kanban-col">
        <div class="col-header" style="border-top: 4px solid var(--amber);">
          <span>${escapeHtml(col.rotulo)} <span class="col-count">(${porColuna[col.id].length})</span></span>
          <button class="col-arquivar" data-arquivar-coluna="${col.id}" title="Arquivar este mês">&times;</button>
        </div>
        ${porColuna[col.id].length === 0
          ? '<div class="empty-col">Nenhum cliente</div>'
          : porColuna[col.id].map(cartaoClienteHtml).join('')}
      </div>
    `).join('');

    if (semColuna.length > 0) {
      html += `
        <div class="kanban-col">
          <div class="col-header" style="border-top: 4px solid var(--gray);">
            <span>Sem mês definido <span class="col-count">(${semColuna.length})</span></span>
          </div>
          ${semColuna.map(cartaoClienteHtml).join('')}
        </div>
      `;
    }

    html += `<button class="add-col-btn" id="btn-nova-coluna-mes">+ novo mês</button>`;
    return html;
  }

  function cartaoClienteHtml(c) {
    const valor = c.valor_beneficio_esperado
      ? Number(c.valor_beneficio_esperado).toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' })
      : '';
    const idsEtiquetas = (c.crm_clientes_etiquetas || []).map(e => e.etiqueta_id);
    const chips = idsEtiquetas.map(id => {
      const et = etiquetasCache.find(x => x.id === id);
      if (!et) return '';
      return `<span class="etiqueta-chip" style="background:${escapeAttr(et.cor)};">${escapeHtml(et.nome)}</span>`;
    }).join('');

    return `
      <div class="client-card" onclick="location.hash='#/cliente/${c.id}'">
        <div class="nome">${escapeHtml(c.nome_completo)}</div>
        ${valor ? `<div class="meta">${valor}</div>` : ''}
        ${chips ? `<div class="card-etiquetas">${chips}</div>` : ''}
      </div>
    `;
  }

  function ligarEventosBoard() {
    const btnNovaCol = document.getElementById('btn-nova-coluna-mes');
    if (btnNovaCol) btnNovaCol.addEventListener('click', criarColunaMes);

    document.querySelectorAll('[data-arquivar-coluna]').forEach(btn => {
      btn.addEventListener('click', e => {
        e.stopPropagation();
        arquivarColunaMes(btn.getAttribute('data-arquivar-coluna'));
      });
    });
  }

  async function criarColunaMes() {
    const entrada = prompt('Qual mês criar? Digite no formato MM/AAAA (ex: 03/2026)');
    if (!entrada) return;
    const partes = entrada.trim().split('/');
    const mes = parseInt(partes[0], 10);
    const ano = parseInt(partes[1], 10);
    if (isNaN(mes) || isNaN(ano) || mes < 1 || mes > 12 || ano < 2000) {
      alert('Formato inválido. Use MM/AAAA, por exemplo 03/2026.');
      return;
    }
    const rotulo = MESES_NOME[mes - 1] + '/' + ano;
    const { error } = await sb.from('crm_incubadora_colunas')
      .upsert({ rotulo, ano, mes, arquivada: false }, { onConflict: 'ano,mes' });
    if (error) { alert('Não foi possível criar: ' + error.message); return; }
    renderQuadro('incubadora');
  }

  async function arquivarColunaMes(colunaId) {
    if (!confirm('Arquivar este mês? Os clientes continuam cadastrados, só a coluna some do quadro.')) return;
    const { error } = await sb.from('crm_incubadora_colunas').update({ arquivada: true }).eq('id', colunaId);
    if (error) { alert('Não foi possível arquivar: ' + error.message); return; }
    renderQuadro('incubadora');
  }

  // ------------------------------------------------------------
  // UTILITARIOS
  // ------------------------------------------------------------
  function escapeHtml(str) {
    const div = document.createElement('div');
    div.textContent = str === null || str === undefined ? '' : str;
    return div.innerHTML;
  }

  function escapeAttr(str) {
    if (!str) return '';
    return String(str).replace(/"/g, '&quot;');
  }

  function formatarMoedaInput(el) {
    let digits = el.value.replace(/\D/g, '');
    if (!digits) digits = '0';
    const valor = parseInt(digits, 10) / 100;
    el.value = valor.toLocaleString('pt-BR', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  }

  function moneyToFloat(str) {
    if (!str) return null;
    const limpo = str.replace(/\./g, '').replace(',', '.');
    const val = parseFloat(limpo);
    return isNaN(val) ? null : val;
  }

  function moneyParaInput(valor) {
    if (valor === null || valor === undefined) return '';
    return Number(valor).toLocaleString('pt-BR', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  }

  function preencherFasesDoQuadro(quadro, faseSelecionada) {
    const selFase = document.getElementById('f-fase');
    const cfg = QUADROS[quadro];

    if (quadro === 'incubadora') {
      selFase.innerHTML = '<option value="Incubadora">Definido pelo mês do nascimento</option>';
      selFase.disabled = true;
      return;
    }

    selFase.disabled = false;
    selFase.innerHTML = cfg.fases.map(f =>
      `<option value="${escapeAttr(f.chave)}" ${faseSelecionada === f.chave ? 'selected' : ''}>${rotuloFase(f)}</option>`
    ).join('');
  }

  function ligarEventosForm(clienteExistente) {
    const selQuadro = document.getElementById('f-quadro');
    preencherFasesDoQuadro(selQuadro.value, clienteExistente && clienteExistente.fase_kanban);
    selQuadro.addEventListener('change', () => preencherFasesDoQuadro(selQuadro.value, null));

    document.getElementById('f-valor-beneficio').addEventListener('input', e => formatarMoedaInput(e.target));
    document.getElementById('f-valor-honorarios').addEventListener('input', e => formatarMoedaInput(e.target));

    document.querySelectorAll('#etiqueta-picker .etiqueta-toggle').forEach(chip => {
      chip.addEventListener('click', () => chip.classList.toggle('marcada'));
    });

    document.getElementById('btn-cancelar-form').addEventListener('click', () => history.back());
    document.getElementById('btn-salvar-cliente').addEventListener('click', () => salvarCliente(clienteExistente));

    const btnExcluir = document.getElementById('btn-excluir-cliente');
    if (btnExcluir) btnExcluir.addEventListener('click', () => excluirCliente(clienteExistente.id));
  }

  async function salvarCliente(clienteExistente) {
    const msgBox = document.getElementById('form-msg');
    const btn = document.getElementById('btn-salvar-cliente');
    msgBox.innerHTML = '';

    const nome = document.getElementById('f-nome').value.trim();
    if (!nome) {
      msgBox.innerHTML = '<div class="form-save-msg err">Preencha o nome completo.</div>';
      return;
    }

    const quadro = document.getElementById('f-quadro').value;
    const payload = {
      nome_completo: nome,
      cpf: document.getElementById('f-cpf').value.trim() || null,
      telefone_principal: document.getElementById('f-telefone').value.trim() || null,
      canal_whatsapp: document.getElementById('f-canal').value || null,
      quadro: quadro,
      fase_kanban: document.getElementById('f-fase').value,
      data_nascimento_bebe: document.getElementById('f-dn-bebe').value || null,
      data_saida_emprego: document.getElementById('f-ds').value || null,
      valor_beneficio_esperado: moneyToFloat(document.getElementById('f-valor-beneficio').value),
      valor_honorarios: moneyToFloat(document.getElementById('f-valor-honorarios').value),
      data_desbloqueio_inss: document.getElementById('f-desbloqueio').value || null,
      observacoes: document.getElementById('f-obs').value.trim() || null,
      atualizado_em: new Date().toISOString()
    };

    const etiquetasMarcadas = Array.from(
      document.querySelectorAll('#etiqueta-picker .etiqueta-toggle.marcada')
    ).map(el => el.getAttribute('data-etiqueta-id'));

    btn.disabled = true;
    btn.textContent = 'Salvando...';

    let clienteId, error;
    if (clienteExistente) {
      clienteId = clienteExistente.id;
      ({ error } = await sb.from('crm_clientes').update(payload).eq('id', clienteId));
    } else {
      const resp = await sb.from('crm_clientes').insert(payload).select('id').single();
      error = resp.error;
      if (resp.data) clienteId = resp.data.id;
    }

    if (error) {
      msgBox.innerHTML = `<div class="form-save-msg err">Não foi possível salvar: ${escapeHtml(error.message)}</div>`;
      btn.disabled = false;
      btn.textContent = clienteExistente ? 'Salvar alterações' : 'Criar cliente';
      return;
    }

    // atualiza etiquetas: apaga as antigas e grava as marcadas
    await sb.from('crm_clientes_etiquetas').delete().eq('cliente_id', clienteId);
    if (etiquetasMarcadas.length > 0) {
      await sb.from('crm_clientes_etiquetas').insert(
        etiquetasMarcadas.map(eid => ({ cliente_id: clienteId, etiqueta_id: eid }))
      );
    }

    location.hash = '#/quadro/' + quadro;
    render();
  }

  async function excluirCliente(clienteId) {
    if (!confirm('Tem certeza que quer excluir este cliente? Essa ação não pode ser desfeita.')) return;
    const { error } = await sb.from('crm_clientes').delete().eq('id', clienteId);
    if (error) { alert('Não foi possível excluir: ' + error.message); return; }
    location.hash = '#/';
    render();
  }

        <td><input type="color" class="cor-input et-cor" value="${escapeAttr(et.cor)}"></td>

        <td>
          <button class="btn-mini btn-salvar-etiqueta">Salvar</button>
          <button class="btn-mini btn-excluir-etiqueta">Excluir</button>
        </td>
      </tr>
    `).join('');

    app.innerHTML = topo + `
      <div class="campanha-wrap">
        <div class="section-title">Etiquetas</div>

        <div class="add-instancia-form">
          <div class="field">
            <label for="ne-nome">Nome da etiqueta</label>
            <input id="ne-nome" type="text" placeholder="Ex: Tem direito">
          </div>
          <div class="field">
            <label for="ne-cor">Cor</label>
            <input id="ne-cor" type="color" class="cor-input" value="#6B8F5C">
          </div>
          <div></div>
          <button class="btn-primary" style="width:auto; padding:0 16px; height:40px;" id="btn-criar-etiqueta">Criar</button>
        </div>

        ${etiquetasCache.length === 0
          ? '<div class="loading-msg">Nenhuma etiqueta criada ainda.</div>'
          : `<table class="previmater-table">
               <thead><tr><th>Nome</th><th>Cor</th><th>Como aparece</th><th></th></tr></thead>
               <tbody>${linhas}</tbody>
             </table>`}
      </div>
    `;

    ligarEventosTopbar();
    document.getElementById('btn-criar-etiqueta').addEventListener('click', criarEtiqueta);
    document.querySelectorAll('tr[data-etiqueta-id]').forEach(linha => {
      const id = linha.getAttribute('data-etiqueta-id');
      linha.querySelector('.btn-salvar-etiqueta').addEventListener('click', () => {
        salvarEtiqueta(id, linha.querySelector('.et-nome').value, linha.querySelector('.et-cor').value);
      });
      linha.querySelector('.btn-excluir-etiqueta').addEventListener('click', () => excluirEtiqueta(id));
    });

  async function criarEtiqueta() {
    const nome = document.getElementById('ne-nome').value.trim();
    const cor = document.getElementById('ne-cor').value;
    if (!nome) { alert('Digite o nome da etiqueta.'); return; }
    const { error } = await sb.from('crm_etiquetas').insert({ nome, cor });
    if (error) { alert('Não foi possível criar: ' + error.message); return; }
    renderEtiquetas();
  }

  async function salvarEtiqueta(id, nome, cor) {
    if (!nome.trim()) { alert('O nome não pode ficar vazio.'); return; }
    const { error } = await sb.from('crm_etiquetas').update({ nome: nome.trim(), cor }).eq('id', id);
    if (error) { alert('Não foi possível salvar: ' + error.message); return; }
    renderEtiquetas();
  }

  async function excluirEtiqueta(id) {
    if (!confirm('Excluir esta etiqueta? Ela será removida de todos os clientes que a tiverem.')) return;
    const { error } = await sb.from('crm_etiquetas').delete().eq('id', id);
    if (error) { alert('Não foi possível excluir: ' + error.message); return; }
    renderEtiquetas();
  }

  const NOMES_CANAL_INSTANCIA = { meta_oficial: 'Meta oficial', evolution: 'Evolution', whatsgw: 'WhatsGW' };

  async function renderCampanha() {
    const app = document.getElementById('app');
    const topo = topbarHtml({ quadroAtivo: 'campanha' });

    if (currentUser.nivel !== 'proprietario') {
      app.innerHTML = topo + '<div class="error-box">Essa tela é restrita a proprietários.</div>';
      ligarEventosTopbar();
      return;
    }

    app.innerHTML = topo + '<div class="loading-msg">Carregando painel da campanha...</div>';
    ligarEventosTopbar();

    const [{ data: instancias, error: erroInstancias }, { data: disparos }] = await Promise.all([
      sb.from('crm_instancias_whatsapp').select('*').order('numero_telefone'),
      sb.from('crm_campanha_disparos').select('*').order('criado_em', { ascending: false }).limit(30)
    ]);

    if (erroInstancias) {
      app.innerHTML = topo + `<div class="error-box">Não foi possível carregar os números.<br>${escapeHtml(erroInstancias.message)}</div>`;
      ligarEventosTopbar();
      return;
    }

    const listaInstancias = instancias || [];
    const listaDisparos = disparos || [];

    const degradados = listaInstancias.filter(i => i.status === 'degradado' || (i.taxa_entrega !== null && i.taxa_entrega < 80));
    const banner = degradados.length > 0
      ? `<div class="alert-banner">Atenção: ${degradados.length === 1
          ? 'o número ' + escapeHtml(degradados[0].numero_telefone) + ' está'
          : degradados.length + ' números estão'} com taxa de entrega baixa ou degradado(s). Considere pausar ou reduzir o teto diário.</div>`
      : '';

    app.innerHTML = topo + `
      <div class="campanha-wrap">
        ${banner}
        <div class="section-title">Números / instâncias</div>
        <button class="btn-ghost" id="btn-toggle-add-instancia" style="margin-bottom:12px;">+ novo número</button>
        <div id="add-instancia-container"></div>
        ${listaInstancias.length === 0
          ? '<div class="loading-msg">Nenhum número cadastrado ainda.</div>'
          : tabelaInstanciasHtml(listaInstancias)}
        <div class="section-title">Últimos disparos</div>
        ${listaDisparos.length === 0
          ? '<div class="loading-msg">Nenhum disparo registrado ainda.</div>'
          : tabelaDisparosHtml(listaDisparos, listaInstancias)}
      </div>
    `;

    ligarEventosTopbar();
    document.getElementById('btn-toggle-add-instancia').addEventListener('click', mostrarFormNovaInstancia);
    ligarEventosTabelaInstancias();
  }

  function tabelaInstanciasHtml(lista) {
    const linhas = lista.map(i => {
      const taxaTxt = (i.taxa_entrega !== null && i.taxa_entrega !== undefined) ? `${Number(i.taxa_entrega).toFixed(0)}%` : '—';
      const taxaClasse = (i.taxa_entrega === null || i.taxa_entrega === undefined) ? 'neutro' : (i.taxa_entrega < 80 ? 'alerta' : 'ok');
      const statusClasse = i.status === 'ativo' ? 'ok' : (i.status === 'degradado' ? 'alerta' : 'neutro');
      return `
        <tr data-instancia-id="${i.id}">
          <td>${escapeHtml(i.numero_telefone)}</td>
          <td>${NOMES_CANAL_INSTANCIA[i.canal] || escapeHtml(i.canal)}</td>
          <td>
            <input type="number" min="0" class="teto-input teto-input-linha" value="${i.teto_diario_atual}">
            <button class="btn-mini btn-salvar-teto">Salvar</button>
          </td>
          <td>${i.disparos_hoje} / ${i.teto_diario_atual}</td>
          <td><span class="badge ${taxaClasse}">${taxaTxt}</span></td>
          <td><span class="badge ${statusClasse}">${escapeHtml(i.status)}</span></td>
        </tr>
      `;
    }).join('');

    return `
      <table class="previmater-table">
        <thead><tr>
          <th>Número</th><th>Canal</th><th>Teto diário</th>
          <th>Disparos hoje</th><th>Taxa entrega</th><th>Status</th>
        </tr></thead>
        <tbody>${linhas}</tbody>
      </table>
    `;
  }

  function tabelaDisparosHtml(disparos, instancias) {
    const mapa = {};
    instancias.forEach(i => { mapa[i.id] = i.numero_telefone; });
    const classeStatus = {
      agendado: 'neutro', enviado: 'neutro', entregue: 'ok',
      lido: 'ok', respondido: 'ok', falhou: 'alerta'
    };

    const linhas = disparos.map(d => `
      <tr>
        <td>${escapeHtml(d.contato_nome) || '—'}</td>
        <td>${escapeHtml(d.contato_telefone)}</td>
        <td>${escapeHtml(mapa[d.instancia_id]) || '—'}</td>
        <td>${d.data_hora_agendada ? new Date(d.data_hora_agendada).toLocaleString('pt-BR') : '—'}</td>
        <td><span class="badge ${classeStatus[d.status] || 'neutro'}">${escapeHtml(d.status)}</span></td>
      </tr>
    `).join('');

    return `
      <table class="previmater-table">
        <thead><tr>
          <th>Contato</th><th>Telefone</th><th>Número usado</th>
          <th>Agendado para</th><th>Status</th>
        </tr></thead>
        <tbody>${linhas}</tbody>
      </table>
    `;
  }

  function ligarEventosTabelaInstancias() {
    document.querySelectorAll('tr[data-instancia-id]').forEach(linha => {
      const id = linha.getAttribute('data-instancia-id');
      linha.querySelector('.btn-salvar-teto').addEventListener('click', () => {
        salvarTetoInstancia(id, linha.querySelector('.teto-input-linha'));
      });
    });
  }

  async function salvarTetoInstancia(instanciaId, inputEl) {
    const novoTeto = parseInt(inputEl.value, 10);
    if (isNaN(novoTeto) || novoTeto < 0) { alert('Digite um número válido pro teto diário.'); return; }
    const { error } = await sb.from('crm_instancias_whatsapp')
      .update({ teto_diario_atual: novoTeto, atualizado_em: new Date().toISOString() })
      .eq('id', instanciaId);
    if (error) { alert('Não foi possível salvar: ' + error.message); return; }
    renderCampanha();
  }

  function mostrarFormNovaInstancia() {
    const container = document.getElementById('add-instancia-container');
    container.innerHTML = `
      <div class="add-instancia-form">
        <div class="field">
          <label for="ni-numero">Número (com DDD)</label>
          <input id="ni-numero" type="text" placeholder="41999999999">
        </div>
        <div class="field">
          <label for="ni-canal">Canal</label>
          <select id="ni-canal">
            <option value="whatsgw">WhatsGW</option>
            <option value="evolution">Evolution</option>
            <option value="meta_oficial">Meta oficial</option>
          </select>
        </div>
        <div class="field">
          <label for="ni-teto">Teto diário inicial</label>
          <input id="ni-teto" type="number" min="0" value="20">
        </div>
        <button class="btn-primary" style="width:auto; padding:0 16px; height:40px;" id="btn-criar-instancia">Adicionar</button>
      </div>
    `;
    document.getElementById('btn-criar-instancia').addEventListener('click', criarInstancia);
  }

  async function criarInstancia() {
    const numero = document.getElementById('ni-numero').value.trim();
    const canal = document.getElementById('ni-canal').value;
    const teto = parseInt(document.getElementById('ni-teto').value, 10) || 0;
    if (!numero) { alert('Digite o número de telefone.'); return; }

    const { error } = await sb.from('crm_instancias_whatsapp').insert({
      numero_telefone: numero, canal, teto_diario_atual: teto, disparos_hoje: 0, status: 'ativo'
    });
    if (error) { alert('Não foi possível adicionar: ' + error.message); return; }
    renderCampanha();
  }
</script>
</body>
</html>
