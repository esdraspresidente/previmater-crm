function mcLidoRestaurar(chave) {

/* Mascara de CPF em versao PURA — recebe texto e devolve texto. O
   cpfMask() de cima escreve dentro de um elemento, e aqui o valor
   precisa ser formatado antes de o elemento existir, na hora de montar
   o HTML do bloco. Mesma regra de corte, para os dois nao divergirem. */
function mcCpfFmt(v) {
  let d = String(v ?? '').replace(/\D/g, '').slice(0, 11);
  if (d.length > 9) d = d.replace(/(\d{3})(\d{3})(\d{3})(\d{1,2})/, '$1.$2.$3-$4');
  else if (d.length > 6) d = d.replace(/(\d{3})(\d{3})(\d{1,3})/, '$1.$2.$3');
  else if (d.length > 3) d = d.replace(/(\d{3})(\d{1,3})/, '$1.$2');
  return d;
}
/* Digito verificador do CPF. Repetido aqui de proposito: o frontend so
   tinha mascara, e mascara aceita 111.111.111-11. */
function mcCpfDV(d) {
  if (!/^\d{11}$/.test(d) || /^(\d)\1{10}$/.test(d)) return false;
  for (let t = 9; t < 11; t++) {
    let soma = 0;
    for (let i = 0; i < t; i++) soma += parseInt(d[i], 10) * ((t + 1) - i);
    let dig = (soma * 10) % 11;
    if (dig === 10) dig = 0;
    if (dig !== parseInt(d[t], 10)) return false;
  }
  return true;
}

function mcLidosParaCamposVazios() {

    ['endereco_cidade', 'Cidade', 'mc-endereco-cidade'],

     eles estao certos. Exigir um clique em "usar" antes, campo por
     campo, era pedir a mesma decisao duas vezes — e como o quadro
     amarelo some depois do carimbo, quem esquecesse um campo perdia o
     valor para sempre.

     A LISTA E MONTADA ANTES DO confirm E APLICADA DEPOIS. Assim o aviso
     diz exatamente o que vai ser escrito, e cancelar nao deixa a tela
     mexida pelas costas. */ const aplicar = mcLidosParaCamposVazios();
  const vaiEntrar = new Set(aplicar.map(f => f[2]));
  const falta = [
    ['Nome completo', 'mc-nome'],
    ['CPF', 'mc-cpf'],
    ['Endereço completo', 'mc-endereco'],
    ['Telefone', 'mc-tel']
  ].filter(([, id2]) => {
    if (vaiEntrar.has(id2)) return false; // vai ser preenchido daqui a pouco
    const el = $(id2);
    return !el || !String(el.value || '').trim();
  }).map(x => x[0]);
  /* O texto mudou junto com o comportamento: antes ele mandava "preencha
     e clique em Salvar" porque este botao nao gravava nada. Agora grava,
     entao o que esta na tela ja vai junto — o que falta e o que esta
     vazio de verdade, e e isso que o aviso tem que dizer. */ const aviso = falta.length
    ? '\n\nATENÇÃO: ' + (falta.length === 1 ? 'falta ' : 'faltam ') + falta.join(', ') +
      '. O motor só gera o contrato com nome, CPF, endereço completo e telefone preenchidos — ' +
      'sem isso nada é gerado e nada avisa. O que já está preenchido na tela vai ser gravado agora; ' +
      'o resto pode entrar depois, e o contrato sai sozinho na rodada seguinte.'
    : '';
  /* O QUE VAI ENTRAR APARECE NO AVISO, com o valor inteiro. E a ultima
     tela em que esses valores existem lado a lado com o documento, e
     "gravei 3 campos" nao deixa ninguem conferir nada. */ const entrando = aplicar.length
    ? '\n\nVAI GRAVAR do que o leitor achou (só onde o cadastro está vazio):\n' +
      aplicar.map(f => '  • ' + f[1] + ': ' + String(($('mc-lido-' + f[0]) ? $('mc-lido-' + f[0]).value : mcLidos[f[0]]) || '').trim()).join('\n')
    : '';
  if (!confirm('Confirmar que os dados do contrato foram conferidos contra os documentos?\n\nDepois disso o contrato pode ser gerado e este aviso some.' + entrando + aviso)) return;
  /* Preenche os inputs SO AGORA, depois do OK. O patch abaixo continua
     lendo os campos da tela — um caminho de escrita so, como sempre. */ aplicar.forEach(f => mcUsarLido(f[0], f[2], true));
  /* CARIMBAR SEM GRAVAR APAGAVA O TRABALHO — caso da Suellen, 02/09.

     O botao gravava so o carimbo e chamava abrirCardCliente(), que
     rebusca a ficha no banco e remonta o cartao. Tudo que estivesse nos
     campos e ainda nao tivesse sido salvo morria ali. Quem clica em
     "usar" no CPF lido e depois neste botao — que e o azul, o primeiro,
     a esquerda, a ordem natural de clique — via a tela dizer "falta o
     CPF" trinta segundos depois de confirmar que o CPF estava certo.

     ENTAO ELE GRAVA OS QUATRO CAMPOS DO CONTRATO junto com o carimbo,
     num UPDATE so. Nao e um segundo caminho de escrita: sao os MESMOS
     inputs do Salvar, lidos no mesmo instante, escritos numa vez so —
     e o carimbo sem os campos e que era meia gravacao.

     vCampo() e nao $().value, pela mesma razao de sempre: com a secao
     escondida por etapa o input nem existe, e undefined some do JSON em
     vez de gravar null por cima do que ja estava la.

     O NOME SO ENTRA SE TIVER TEXTO. Ele e obrigatorio na ficha, entao
     null ali seria pior que nao mexer — e quem chegou neste botao ja
     tem nome, porque o cartao nao abre sem ele. */ const patch = {
    contrato_dados_conferido_em: new Date().toISOString(),
    contrato_dados_conferido_por: U ? U.id : null,
    cpf: vCampo('mc-cpf'),
    endereco_completo: vCampo('mc-endereco'),
    endereco_cidade: vCampo('mc-endereco-cidade'),
    endereco_uf: vCampo('mc-endereco-uf'),
    telefone_principal: vCampo('mc-tel')
  };
  const nomeNaTela = $('mc-nome') ? $('mc-nome').value.trim() : '';
  if (nomeNaTela) patch.nome_completo = nomeNaTela;
  const { error } = await sb.from('crm_clientes').update(patch).eq('id', id);
  if (error) { toast('Erro ao marcar: ' + error.message, 'er'); return; }
  toast(aplicar.length
    ? 'Conferido. ' + aplicar.length + (aplicar.length === 1 ? ' campo gravado' : ' campos gravados') + ' do que o leitor achou.'
    : 'Marcado como conferido.');
  abrirCardCliente(id);
}
async function salvarCardCliente(id){
  const nome=$('mc-nome').value.trim();
  if(!nome){toast('Preencha o nome','er');return;}
  const quadro=$('mc-quadro').value,listaId=$('mc-lista').value||null;
  const linkContrato=$('mc-link-contrato')?$('mc-link-contrato').value.trim():'';

  // A lista "Contrato enviado" e o gatilho: o motor so manda o contrato
  // para a cliente quando o card chega la COM link. Sem link, o card
  // fica parado e ninguem avisa — entao o aviso e aqui.
  if(listaId===LISTA_CONTRATO_ENVIADO&&!linkContrato){
    if(!confirm('Este card esta indo para "Contrato enviado" sem o link do contrato.\n\nA Samara nao vai mandar nada ate o link ser preenchido — o card fica parado.\n\nMover assim mesmo?'))return;
  }

  const payload={
    nome_completo:nome,
    telefone_principal:$('mc-tel').value.trim()||null,
    cpf:vCampo('mc-cpf'),
    senha_inss:vCampo('mc-senha-inss'),
    link_contrato:linkContrato||null,
    /* vCampo e nao $().value: com a secao Contrato escondida os inputs
       nem existem, e undefined some do JSON em vez de gravar null por
       cima de um endereco que ja estava la. */
    endereco_completo:vCampo('mc-endereco'),
    endereco_cidade:vCampo('mc-endereco-cidade'),
    endereco_uf:vCampo('mc-endereco-uf'),
    referencia1_nome:vCampo('mc-ref1-nome'),
    referencia1_telefone:vCampo('mc-ref1-tel'),
    referencia2_nome:vCampo('mc-ref2-nome'),
    referencia2_telefone:vCampo('mc-ref2-tel'),
    canal_ativo:$('mc-canal').value||'whatsgw',
    origem:$('mc-origem').value||null,
    /* SAO DUAS COLUNAS E ELAS SAO INDEPENDENTES. O nome sempre vale — e
       o que entra na mensagem que a Samara manda para a indicada. O
       vinculo com o card de quem indicou e opcional: quem indicou por
       ligacao ou pessoalmente pode nao ter card, e exigir card travaria
       o cadastro justamente na hora de andar. Sem nome, as duas vao a
       null juntas: id apontando para alguem com o nome apagado seria
       rastro sem texto, e o card nao sairia de Chamar indicada. */
    indicado_por_nome:$('mc-indicanome').value.trim()||null,
    indicado_por:($('mc-indicanome').value.trim()?($('mc-indicaid').value||null):null),
    trello_url:$('mc-trello').value.trim()||null,
    quadro:quadro,
    lista_id:listaId,
    data_entrega:$('mc-entrega').value||null,
    data_nascimento_bebe:$('mc-dn').value||null,
    data_saida_emprego:$('mc-ds').value||null,
    data_desbloqueio_inss:$('mc-bloqueio').value||null,
    /* vCampo e nao $().value: com a secao escondida o input nem existe,
       e undefined some do JSON em vez de gravar null por cima de uma
       guia que ja estava marcada. Mesma armadilha do CPF. */
    gps_vencimento:vCampo('mc-gps-venc'),
    /* So digitos: o campo aceita espaco para dar para conferir na tela,
       mas o que vai para a cliente e para o banco e a sequencia crua —
       e ela que se cola no aplicativo do banco. */
    gps_linha_digitavel:(function(){
      const v=vCampo('mc-gps-linha');
      if(v===undefined)return undefined;
      return (String(v||'').replace(/\D/g,''))||null;
    })(),
    documento_pendente:$('mc-docpend').value.trim()||null,
    valor_beneficio_esperado:m2f($('mc-vb'))||null,
    valor_honorarios:m2f($('mc-vh'))||null,
    observacoes:$('mc-obs').value.trim()||null,
    atualizado_em:new Date().toISOString()
  };
  /* MOTIVO SO VIAJA QUANDO O DESTINO E DESCARTADO.
     Fora dali o campo esta escondido, mas continua no DOM com o valor
     antigo — mandar isso gravaria motivo de descarte em cliente que
     acabou de ser requalificada. Quando o destino NAO e Descartado a
     chave nem entra no payload; quem limpa e o registrarMovimentoLista,
     que ja zera motivo e data ao sair da lista. */
  {
    const selL=$('mc-lista');
    const nomeDestino=selL?((selL.options[selL.selectedIndex]||{}).text||'').trim():'';
    if(nomeDestino==='Descartado') payload.motivo_descarte=vCampo('mc-motivo');
    // Mesma regra do descarte: so viaja quando o destino e a lista dele.
    if(nomeDestino==='Contrato Cancelado') payload.cancelamento_motivo=vCampo('mc-cancel-motivo');
  }
  const etqSel=mcEtqSelAtual.slice();
  // Sao dois botoes Salvar (topo e rodape) e a mesma funcao atende os
  // dois. Mexer so no de baixo deixaria o de cima dizendo "Salvar"
  // enquanto o gravamento acontece — e o clique repetido gravaria duas
  // vezes.
  const btns=['mc-btn-salvar','mc-btn-salvar-topo'].map(x=>$(x)).filter(Boolean);
  const btnEstado=(txt,off)=>btns.forEach(b=>{b.disabled=off;b.textContent=txt;});
  btnEstado('Salvando...',true);
  const{error}=await sb.from('crm_clientes').update(payload).eq('id',id);
  if(error){toast('Erro ao salvar: '+error.message,'er');btnEstado('Salvar',false);return;}
  await sb.from('crm_clientes_etiquetas').delete().eq('cliente_id',id);
  if(etqSel.length)await sb.from('crm_clientes_etiquetas').insert(etqSel.map(e=>({cliente_id:id,etiqueta_id:e})));
  finCarregado=false;

  if(mcOriginal){
    if(mcOriginal.lista_id!==listaId&&mcOriginal.lista_id){
      await registrarMovimentoLista(id,mcOriginal.lista_id,listaId);
    }else if(mcOriginal.nome_completo!==nome){
      registrarAtividade(id,`renomeou o cartão de "${mcOriginal.nome_completo}" para "${nome}"`);
    }
  }

  /* O CARTAO FICA ABERTO.
     Ate aqui o Salvar fechava o modal, o que obrigava a reabrir o cartao
     para conferir o que acabou de ser gravado — e reabrir custa uma
     consulta e a aba escolhida. Repintamos so o topo (nome, quadro e
     lista, que sao o que o Salvar pode ter mudado ali) e o quadro atras;
     o resto da tela ja esta com os valores certos, porque foram eles que
     acabaram de ser enviados. */
  mcOriginal={nome_completo:nome,quadro:quadro,lista_id:listaId};
  btnEstado('Salvar',false);
  toast('Cliente atualizado','ok');
  refrescarRotaAtual();
  const{data:cAt}=await sb.from('crm_clientes')
    .select('id,nome_completo,quadro,lista_id,lista_desde,arquivado_em').eq('id',id).single();
  if(mcClienteId!==id)return; // trocou de cartao enquanto gravava
  const hn=document.querySelector('#mchead-sticky .mchs-nome');
  if(hn)hn.textContent=nome;
  if(cAt)await mcPintarTrilha(cAt);
  mcSnapshot=mcFotoCampos();
}

let VA_LISTA=null,VA_PAGINA=0,VA_ITENS=[],VA_TOTAL=0,VA_FIM=false;
const VA_PAGE=50;

async function verArquivadosDaLista(listaId){
  VA_LISTA=listaId;VA_PAGINA=0;VA_ITENS=[];VA_FIM=false;VA_TOTAL=0;
  const{data:l}=await sb.from('crm_listas').select('nome,quadro').eq('id',listaId).single();
  abrirModal(`<div class="mbt">Cards arquivados</div>
    <div class="mbs">${l?esc(l.nome):''}${l&&QUADROS[l.quadro]?' · '+QUADROS[l.quadro].rotulo:''}</div>
    <div id="va-lista" style="max-height:56vh;overflow-y:auto;margin-top:10px">
      <div class="fhint" style="text-align:center;padding:20px 0">Carregando...</div>
    </div>
    <div id="va-mais" style="text-align:center;margin-top:12px"></div>`);
  await vaCarregar();
}

async function vaCarregar(){
  const de=VA_PAGINA*VA_PAGE;
  const{data,error,count}=await sb.from('crm_clientes')
    .select('id,nome_completo,telefone_principal,arquivado_em,criado_em',{count:'exact'})
    .eq('lista_id',VA_LISTA).not('arquivado_em','is',null)
    .order('criado_em',{ascending:false}).range(de,de+VA_PAGE-1);
  const box=$('va-lista');if(!box)return;
  if(error){box.innerHTML=`<div class="fhint" style="text-align:center;padding:18px 0">Erro: ${esc(error.message)}</div>`;return;}
  if(count!==null&&count!==undefined)VA_TOTAL=count;
  const lote=data||[];
  VA_ITENS=VA_ITENS.concat(lote);
  if(lote.length<VA_PAGE)VA_FIM=true;
  vaRender();
}

function vaRender(){
  const box=$('va-lista');if(!box)return;
  if(!VA_ITENS.length){
    box.innerHTML='<div class="fhint" style="text-align:center;padding:22px 0">Nenhum card arquivado nesta lista.</div>';
    const m0=$('va-mais');if(m0)m0.innerHTML='';return;
  }
  let h=`<div class="fhint" style="margin-bottom:9px">${VA_TOTAL.toLocaleString('pt-BR')} ${VA_TOTAL===1?'card arquivado':'cards arquivados'}</div>`;
  VA_ITENS.forEach(c=>{
    const d=c.criado_em?new Date(c.criado_em).toLocaleDateString('pt-BR'):'';
    h+=`<div class="va-row">
      <div class="va-info" onclick="fecharModal();abrirCardCliente('${c.id}')">
        <div class="va-nm">${esc(c.nome_completo||'Sem nome')}</div>
        <div class="va-sb">${esc(c.telefone_principal||'')}${d?' · '+d:''}</div>
      </div>
      <button class="btn btns" style="padding:4px 10px;font-size:11px;flex-shrink:0" onclick="vaReativar('${c.id}')">Reativar</button>
    </div>`;
  });
  box.innerHTML=h;
  const mais=$('va-mais');
  if(mais)mais.innerHTML=VA_FIM?'':`<button class="btn btns" onclick="VA_PAGINA++;vaCarregar()">Carregar mais</button>`;
}

async function vaReativar(id){
  const{error}=await sb.from('crm_clientes').update({arquivado_em:null}).eq('id',id);
  if(error){toast('Erro ao reativar','er');return;}
  toast('Card reativado','ok');
  VA_ITENS=VA_ITENS.filter(x=>x.id!==id);
  VA_TOTAL=Math.max(0,VA_TOTAL-1);
  vaRender();
}

// ============================================================
// QUEM INDICOU
//
// Dois campos num so: o NOME sempre vale (e o que entra na mensagem que
// a Samara manda para a indicada), e o VINCULO com o card da indicadora
// e opcional. Quem indicou pelo seu outro telefone, por ligacao ou
// pessoalmente pode simplesmente nao ter card — travar o campo em "so
// aceita card existente" deixaria voce parado justamente na hora de
// andar.
//
// Com vinculo da para pagar os R$200 depois, porque existe rastro de
// quem indicou quem. Sem vinculo, e so o nome no texto.
//
// A BUSCA VAI AO BANCO, nao filtra em memoria. Sao 37 mil clientes e o
// PostgREST corta em 1000 linhas sem avisar — filtrar no navegador
// acharia so quem estivesse no primeiro pedaco, e calado.
// ============================================================
let INDTIMER=null;
/* O MESMO CAMPO EM DUAS TELAS — 26/08/2026.

   Ate aqui estas quatro funcoes falavam com id fixo (f-indicanome,
   indsug, indhint), porque so existia um lugar no sistema com o campo
   Indicada por: o formulario de cliente. Ele agora existe tambem no
   cartao, e o cartao passou a ser o unico caminho para editar cliente
   (a rota do formulario cru morreu).

   O PREFIXO VIAJA POR ARGUMENTO, e nao por variavel global. Global
   seria mais curto e estaria errado: o cartao pode abrir POR CIMA do
   formulario pelo link "abrir o card de quem indicou", e ai a ultima
   tela aberta sobrescreveria o prefixo da outra — a busca de uma
   escreveria no campo da outra, calada. */
function indId(p,q){return $((p||'f')+'-'+q);}
function buscarIndicadora(v,p){
  p=p||'f';
  const t=(v||'').trim();
  if(INDTIMER)clearTimeout(INDTIMER);
  // Digitou por cima do que estava escolhido: o vinculo morre. Manter o
  // id antigo com nome novo apontaria para a pessoa errada.
  const cx=indId(p,'indicaid');
  if(cx&&cx.getAttribute('data-nome')&&cx.getAttribute('data-nome')!==t)cx.value='';
  atualizarHintIndicadora(p);
  if(t.length<3){fecharSugIndicadora(p);return;}
  INDTIMER=setTimeout(async()=>{
    const busca=t.replace(/[%,()]/g,'');
    const{data}=await sb.from('crm_clientes').select('id,nome_completo,telefone_principal').ilike('nome_completo','%'+busca+'%').order('nome_completo').limit(8);
    const cx2=indId(p,'indsug');if(!cx2)return;
    /* Ninguem indica a si mesma. No cartao quem responde e o
       mcClienteId; no formulario o id vive na rota, porque cliente nova
       ainda nao tem id nenhum. */
    const atual=(p==='mc')?(mcClienteId||''):((location.hash.match(/cliente\/([^?&]+)/)||[])[1]||'');
    const achados=(data||[]).filter(x=>x.id!==atual);
    if(!achados.length){
      cx2.innerHTML='<div style="cursor:default;color:var(--text3)">Ninguém com esse nome na base — vale como texto livre.</div>';
      cx2.classList.add('on');return;
    }
    cx2.innerHTML=achados.map(x=>`<div onmousedown="escolherIndicadora('${x.id}',this.getAttribute('data-n'),'${p}')" data-n="${escA(x.nome_completo)}">${esc(x.nome_completo)}<span class="indsub">${esc(x.telefone_principal||'sem telefone')}</span></div>`).join('');
    cx2.classList.add('on');
  },350);
}
function escolherIndicadora(id,nome,p){
  p=p||'f';
  indId(p,'indicanome').value=nome;
  const cx=indId(p,'indicaid');cx.value=id;cx.setAttribute('data-nome',nome);
  fecharSugIndicadora(p);atualizarHintIndicadora(p);
}
function fecharSugIndicadora(p){const c=indId(p||'f','indsug');if(c)c.classList.remove('on');}
function atualizarHintIndicadora(p){
  p=p||'f';
  const h=indId(p,'indhint');if(!h)return;
  const nome=(indId(p,'indicanome')||{}).value||'',id=(indId(p,'indicaid')||{}).value||'';
  if(!nome.trim()){h.innerHTML='Obrigatório para o card sair da lista <b>Chamar indicada</b>: é este nome que a Samara usa no primeiro contato.';return;}
  h.innerHTML=id?'<span class="indvinc">✓ vinculada ao card dela</span> — a indicação fica registrada para o pagamento dos R$200.':'Sem vínculo com card: o nome entra na mensagem, mas não gera rastro para o pagamento.';
}
/* NUMERO REPETIDO — 04/09/2026, caso da Bianca.

   O banco tem uniq_crm_clientes_telefone_chave, e quem batia nele via
   "duplicate key value violates unique constraint" na cara. Erro de
   Postgres cru nao diz o que fazer, e principalmente NAO DIZ QUEM ja
   esta com o numero: o cartao da Bianca era de 2024, estava arquivado
   desde 13/08 na lista Descartado, e cartao arquivado nao aparece em
   busca de quadro nenhuma. Ou seja: a informacao que resolvia estava
   escondida das duas maneiras possiveis.

   PROCURA PELOS 8 ULTIMOS DIGITOS, e nao pela chave montada aqui. A
   normalizacao do telefone_chave e do banco (tira o 55, tira o nono
   digito) e repetir essa regra no frontend criaria uma segunda versao
   dela para divergir depois. O sufixo acha o mesmo numero escrito de
   qualquer jeito — com DDI, sem DDI, com 9, sem 9.

   INCLUI ARQUIVADO de proposito: e justamente o caso que a busca comum
   nao mostra, e o unico que a pessoa nao tem como descobrir sozinha. */
async function clienteMesmoTelefone(tel,exceto){
  const d=String(tel||'').replace(/\D/g,'');
  if(d.length<8)return null;
  const{data}=await sb.from('crm_clientes')
    .select('id,nome_completo,quadro,arquivado_em,telefone_principal')
    .ilike('telefone_chave','%'+d.slice(-8)).limit(5);
  const achados=(data||[]).filter(x=>x.id!==exceto);
  return achados.length?achados[0]:null;
}
function avisoNumeroRepetido(ex){
  return 'Este telefone já é da cliente '+(ex.nome_completo||'sem nome')+
    (ex.arquivado_em?' — cartão ARQUIVADO em '+new Date(ex.arquivado_em).toLocaleDateString('pt-BR')+', por isso ele não aparece nas buscas do quadro':' (quadro '+(ex.quadro||'?')+')')+
    '.\n\nNão dá para ter dois cartões com o mesmo número. Abrir o cartão dela agora?';
}
async function salvarCliente(id){
  const btn=$('btn-salvar'),nome=$('f-nome').value.trim();
  if(!nome){toast('Preencha o nome completo','er');return;}
  const quadro=$('f-quadro').value;
  const payload={
    nome_completo:nome,
    cpf:$('f-cpf').value.trim()||null,
    telefone_principal:$('f-tel').value.trim()||null,
    canal_ativo:$('f-canal').value||'whatsgw',
    origem:$('f-origem').value||null,
    trello_url:$('f-trello').value.trim()||null,
    quadro:quadro,
    lista_id:$('f-lista').value||null,
    data_nascimento_bebe:$('f-dn').value||null,
    data_saida_emprego:$('f-ds').value||null,
    data_entrega:$('f-entrega').value||null,
    data_desbloqueio_inss:$('f-bloqueio').value||null,
    documento_pendente:$('f-docpend').value.trim()||null,
    valor_beneficio_esperado:m2f($('f-vb'))||null,
    valor_honorarios:m2f($('f-vh'))||null,
    observacoes:$('f-obs').value.trim()||null,
    indicado_por_nome:$('f-indicanome')?($('f-indicanome').value.trim()||null):undefined,
    indicado_por:$('f-indicaid')?($('f-indicaid').value||null):undefined,
    atualizado_em:new Date().toISOString()
  };
  Object.keys(payload).forEach(k=>{if(payload[k]===undefined)delete payload[k];});
  const etqSel=[...document.querySelectorAll('#etp .ett.on')].map(e=>e.getAttribute('data-etq'));
  btn.disabled=true;btn.textContent='Salvando...';
  /* Pergunta antes de tentar: assim o aviso vem com nome e com saida, em
     vez de a pessoa descobrir pelo erro do banco. */
  if(payload.telefone_principal){
    const ex=await clienteMesmoTelefone(payload.telefone_principal,id);
    if(ex){
      btn.disabled=false;btn.textContent=id?'Salvar alterações':'Criar cliente';
      if(confirm(avisoNumeroRepetido(ex)))abrirCardCliente(ex.id);
      return;
    }
  }
  let cid=id,error,ehNovo=!id;
  if(id){({error}=await sb.from('crm_clientes').update(payload).eq('id',id));}
  else{const r=await sb.from('crm_clientes').insert(payload).select('id').single();error=r.error;if(r.data)cid=r.data.id;}
  if(error){
    btn.disabled=false;btn.textContent=id?'Salvar alterações':'Criar cliente';
    /* Rede de seguranca: a checagem acima nao cobre a corrida (dois
       cadastros no mesmo minuto) nem numero escrito de forma que o
       sufixo nao pegue. Aqui o banco ja recusou — traduzir. */
    if(error.code==='23505'&&String(error.message).includes('telefone_chave')){
      const ex=await clienteMesmoTelefone(payload.telefone_principal,id);
      if(ex&&confirm(avisoNumeroRepetido(ex)))abrirCardCliente(ex.id);
      else if(!ex)toast('Este telefone já está em outro cartão. Não dá para ter dois cartões com o mesmo número.','er');
      return;
    }
    toast('Erro ao salvar: '+error.message,'er');
    return;
  }
  await sb.from('crm_clientes_etiquetas').delete().eq('cliente_id',cid);
  if(etqSel.length)await sb.from('crm_clientes_etiquetas').insert(etqSel.map(e=>({cliente_id:cid,etiqueta_id:e})));
  finCarregado=false;
  if(ehNovo)registrarAtividade(cid,'criou o cadastro deste cartão');
  toast(id?'Cliente atualizado':'Cliente criado','ok');
  location.hash='#/quadro/'+quadro;
}
async function excluirCliente(id){
  if(!confirm('Excluir esta cliente? Essa ação não pode ser desfeita.'))return;
  const{error}=await sb.from('crm_clientes').delete().eq('id',id);
  if(error){toast('Erro ao excluir','er');return;}
  finCarregado=false;toast('Cliente excluída','ok');location.hash='#/';
}

// DASHBOARD
//
// Ate aqui esta tela era um resumo de recebimentos. Virou a visao geral
// da operacao: onde as clientes estao, o que andou no periodo, o que
// precisa de voce e o dinheiro.
//
// Tudo vem de UMA chamada a crm_dashboard(). A conta e feita no banco de
// proposito: sao 37 mil clientes e o PostgREST corta em 1000 linhas sem
// avisar. Somar no navegador daria um numero errado e silencioso — foi
// exatamente assim que o seletor de Recebimentos quebrou.
//
// As linhas por tras de cada numero saem em outra chamada
// (crm_dashboard_cards), e so quando voce clica. Se viessem junto, cada
// abertura carregaria os 659 cartoes da base de reativacao a toa.
// ============================================================
let DASH=null;
let DASH_PER='dia';
const DASH_PERIODOS=[['dia','Dia'],['semana','Semana'],['quinzena','Quinzena'],['mes','Mês']];
const DASH_ROTULO_PER={dia:'hoje',semana:'esta semana',quinzena:'nos últimos 15 dias',mes:'neste mês'};

async function pageDash(){
  const pc=$('pc');marcarNav('dashboard');
  if(U.nivel!=='proprietario'){pc.innerHTML='<div class="emp"><div class="empt">Tela restrita a proprietários</div></div>';return;}
  pc.innerHTML='<div class="emp">Carregando...</div>';
  await dashCarregar();
}
/* TROCAR O PERIODO NAO RECARREGA O DASHBOARD INTEIRO — 04/09/2026.

   O clique em Dia/Semana/Quinzena/Mes chamava dashCarregar(), que refaz
   a RPC crm_dashboard: 42 subconsultas, serie de 14 dias sobre
   crm_mensagens, vw_cards_parados, pm_parcelas mes a mes, funil, feed —
   e mais a consulta do placar da reativacao logo em seguida. Medido em
   04/09: 320 ms so de execucao no banco, fora rede e o JSON inteiro
   voltando. NADA disso muda com o periodo: o unico bloco que muda e o
   movimento. A RPC crm_dashboard_movimento devolve so ele.

   E O BOTAO RESPONDE ANTES DA RESPOSTA. Sem isso a tela ficava
   identica ate os numeros chegarem, e clique sem retorno parece erro —
   a pessoa clica de novo. Agora o segmento marca na hora e os numeros
   antigos esmaecem enquanto os novos nao chegam. */
async function dashTrocarPeriodo(p){
  if(DASH_PER===p)return;
  DASH_PER=p;
  dashPintar();                       // o botao selecionado muda no mesmo instante
  const bloco=document.querySelector('.dsh-mvg');
  if(bloco)bloco.style.opacity='.4';
  const{data,error}=await sb.rpc('crm_dashboard_movimento',{p_periodo:p});
  /* Clicou em outro periodo enquanto este voltava: a resposta velha nao
     pode sobrescrever a escolha nova. */
  if(DASH_PER!==p)return;
  if(error){
    if(bloco)bloco.style.opacity='';
    toast('Não consegui trocar o período: '+error.message,'er');
    return;
  }
  DASH.movimento=data.movimento;
  DASH.periodo=data.periodo;
  DASH.movimento_desde=data.movimento_desde;
  dashPintar();
}
async function dashCarregar(){
  const{data,error}=await sb.rpc('crm_dashboard',{p_periodo:DASH_PER});
  if(error){
    $('pc').innerHTML='<div class="emp"><div class="empt">Não consegui montar o dashboard</div><div class="emps">'+esc(error.message)+'</div></div>';
    return;
  }
  DASH=data;
  dashPintar();
  dashReativacao();
}

const dshK=v=>{const n=Number(v)||0;return n>=1000?'R$ '+(n/1000).toFixed(1).replace('.',',')+'k':'R$ '+n.toFixed(0);};
function dshSaudacao(){

/* PLACAR DA REATIVACAO — carregado a parte, de proposito.
   O resto do dashboard vem da RPC crm_dashboard, que e compartilhada.
   Mexer nela para caber uma campanha temporaria mistura o permanente
   com o passageiro; a view vw_reativacao_placar resolve numa linha e

      </div>

        <div class="dsh-et ${alc?'on':'vazio'}"><div class="bola">${alc}</div><div class="nm">Alcançadas</div><div class="vl">receberam a 1ª</div></div>
        <div class="dsh-et ${resp?'gold':'vazio'}"><div class="bola">${resp}</div><div class="nm">Responderam</div><div class="vl">${pct}% de quem recebeu</div></div>
        <div class="dsh-et ${Number(data.descartadas)?'frio':'vazio'}"><div class="bola">${data.descartadas}</div><div class="nm">Descartadas</div><div class="vl">saíram do funil</div></div>
        <div class="dsh-et ${Number(data.com_problema)?'frio':'vazio'}"><div class="bola">${data.com_problema}</div><div class="nm">Não saíram</div><div class="vl">erro ou vencida</div></div>
      </div>
      ${mot?`<div class="dsh-chips" style="margin-top:10px">${mot}</div>`:''}`;
    cx.style.display='';
  }catch(_){cx.style.display='none';}
}

function dashPintar(){
  const d=DASH;if(!d)return;
  const din=d.dinheiro||{},al=d.alertas||{},es=d.esteira||{},mo=d.motor||{};

  /* Pulso do motor. Ele bate a cada poucos minutos; passando de 15 sem
     sinal, alguma coisa parou e voce precisa saber antes da cliente. */
  const pulsoMin=mo.ultimo_pulso?Math.floor((Date.now()-new Date(mo.ultimo_pulso).getTime())/60000):null;
  const motorVivo=pulsoMin!==null&&pulsoMin<15;
  const chipMotor=pulsoMin===null
    ?`<div class="dsh-chip"><span class="dsh-dot off"></span>Motor <b>sem sinal</b></div>`
    :`<div class="dsh-chip"><span class="dsh-dot ${motorVivo?'':'off'}"></span>Motor ${motorVivo?'vivo':'parado'} <b>há ${pulsoMin} min</b></div>`;

  const falta=Math.max(0,(Number(din.mes_previsto)||0)-(Number(din.mes_recebido)||0));
  const pct=Number(din.mes_previsto)>0?Math.min(100,Math.round((Number(din.mes_recebido)/Number(din.mes_previsto))*100)):0;
  const difContratos=(Number(din.contratos_mes)||0)-(Number(din.contratos_ant)||0);

/* O CRM so grava movimento de cartao desde 17/08/2026 — antes disso o
   historico do Trello virou comentario. Sem este aviso, "mes" pareceria
   um mes fraco em vez de um registro que ainda nao existe. */
function dashNotaMovimento(d){
  const base='Contando '+DASH_ROTULO_PER[DASH_PER]+'.';
  if(!d.movimento_desde)return base;
  const desde=new Date(d.movimento_desde);
  const inicio=new Date(d.periodo&&d.periodo.de?d.periodo.de:Date.now());

  return base+' O CRM só registra movimento de cartão desde '+desde.toLocaleDateString('pt-BR')+
    ' — período maior que isso ainda mostra os mesmos dias.';
}

function dashGrafMeses(serie){
  if(!serie.length)return'<div class="emp"><div class="empt">Sem histórico</div></div>';
  const W=640,H=190,pb=26,pt=16,pl=6,pr=6;
  const tot=s=>(Number(s.recebido)||0)+(Number(s.previsto)||0)+(Number(s.inadimplente)||0);
  const max=Math.max(...serie.map(tot),1)*1.12;
  const bw=(W-pl-pr)/serie.length,bar=Math.min(38,bw*.56);
  const y=v=>H-pb-(v/max)*(H-pb-pt);
  const mesAtual=new Date().toISOString().slice(0,7);
  let g='';
  [0,.5,1].forEach(f=>{const yy=y(max*f);g+=`<line x1="${pl}" x2="${W-pr}" y1="${yy}" y2="${yy}" stroke="#E8F4F4" stroke-width="1"/>`;});
  serie.forEach((s,i)=>{
    const cx=pl+bw*i+bw/2,x=cx-bar/2;
    const rec=Number(s.recebido)||0,pre=Number(s.previsto)||0,ina=Number(s.inadimplente)||0;
    let acc=0;
    [[rec,'#0A9396'],[pre,'#94D2BD'],[ina,'#C0392B']].forEach(([v,c])=>{
      if(v<=0)return;acc+=v;
      g+=`<rect x="${x}" y="${y(acc)}" width="${bar}" height="${H-pb-y(v)}" rx="4" fill="${c}"/>`;
    });
    const t=tot(s);
    if(t>0)g+=`<text x="${cx}" y="${y(t)-6}" text-anchor="middle" font-size="9.5" font-weight="700" fill="#7FA8A8">${(t/1000).toFixed(1).replace('.',',')}k</text>`;
    const atual=s.m===mesAtual;
    g+=`<text x="${cx}" y="${H-9}" text-anchor="middle" font-size="10.5" font-weight="${atual?800:700}" fill="${atual?'#0D2B2B':'#7FA8A8'}">${MESES[parseInt(s.m.slice(5,7),10)-1].slice(0,3).toLowerCase()}</text>`;
  });
  return`<svg class="dsh-gr" viewBox="0 0 ${W} ${H}" preserveAspectRatio="xMidYMid meet">${g}</svg>`;
}

/* Par de barras por dia: recebidas de um lado, enviadas do outro, com a
   parte da Samara empilhada dentro das enviadas. Da para ver de relance
   quando ela assumiu e quando a conversa voltou para a mao. */
function dashGrafMsgs(serie){
  if(!serie.length)return'<div class="emp"><div class="empt">Sem mensagens</div></div>';
  const W=640,H=170,pb=24,pt=12,pl=4,pr=4;
  const max=Math.max(...serie.map(s=>Math.max(Number(s.entrada)||0,(Number(s.bot)||0)+(Number(s.humano)||0))),1)*1.15;
  const gw=(W-pl-pr)/serie.length,bar=Math.min(11,gw*.3);
  const y=v=>H-pb-(v/max)*(H-pb-pt);
  let g='';
  [0,.5,1].forEach(f=>{const yy=y(max*f);g+=`<line x1="${pl}" x2="${W-pr}" y1="${yy}" y2="${yy}" stroke="#E8F4F4" stroke-width="1"/>`;});
  serie.forEach((s,i)=>{
    const cx=pl+gw*i+gw/2;
    const ent=Number(s.entrada)||0,bot=Number(s.bot)||0,hum=Number(s.humano)||0,env=bot+hum;
    if(ent)g+=`<rect x="${cx-bar-1.5}" y="${y(ent)}" width="${bar}" height="${H-pb-y(ent)}" rx="3" fill="#00B4D8"/>`;
    if(env){
      g+=`<rect x="${cx+1.5}" y="${y(env)}" width="${bar}" height="${H-pb-y(env)}" rx="3" fill="#E87CA0"/>`;
      if(bot)g+=`<rect x="${cx+1.5}" y="${y(bot)}" width="${bar}" height="${H-pb-y(bot)}" rx="3" fill="#0A9396"/>`;
    }
    g+=`<text x="${cx}" y="${H-8}" text-anchor="middle" font-size="9.5" font-weight="700" fill="#7FA8A8">${String(s.d).slice(8,10)}</text>`;
  });
  return`<svg class="dsh-gr" viewBox="0 0 ${W} ${H}" preserveAspectRatio="xMidYMid meet">${g}</svg>`;
}

function dashPctSamara(serie){
  let bot=0,hum=0;
  serie.forEach(s=>{bot+=Number(s.bot)||0;hum+=Number(s.humano)||0;});
  return bot+hum>0?Math.round(bot/(bot+hum)*100):0;
}

// ============================================================
// PAINEL: OS CARTOES POR TRAS DO NUMERO
//
// Toda contagem da tela abre aqui e responde tres coisas: quem, onde a
// cliente esta AGORA e por que ela entrou nesta conta.
//
// "Onde esta agora" nao e enfeite. Nos recortes de evento (concedidos na
// semana, descartados no dia) ela ja pode ter andado desde entao: ver que
// uma concedida ontem ja esta no Financeiro, ou que continua parada em
// Em analise, e a informacao que faltava.
// ============================================================
let DWR_REC=null,DWR_LINHAS=[],DWR_TOTAL=0,DWR_OFFSET=0,DWR_CARREGANDO=false;
const DWR_PAGINA=50;

async function dwrAbrir(recorte,titulo,sub){
  DWR_REC={recorte,titulo,sub};
  DWR_LINHAS=[];DWR_TOTAL=0;DWR_OFFSET=0;
  $('dwrf').value='';
  $('dwrt').textContent=titulo;
  $('dwrc').textContent=sub||'';
  $('dwrb').innerHTML='<div class="emp">Carregando...</div>';
  $('dwrv').classList.add('on');
  $('dwr').classList.add('on');
  await dwrBuscar();
}
function dwrFechar(){
  $('dwrv').classList.remove('on');
  $('dwr').classList.remove('on');
}
async function dwrBuscar(){
  if(!DWR_REC||DWR_CARREGANDO)return;
  /* OS PARADOS VEM DA VIEW, e nao da crm_dashboard_cards.
     A view ja responde exatamente esta pergunta, com o prazo por lista
     dentro dela. Ensinar o mesmo recorte a RPC criaria duas definicoes de
     "parado" — e no dia em que o prazo mudasse, a faixa do dashboard e a
     gaveta que ela abre passariam a discordar uma da outra.
     O periodo do topo do dashboard NAO se aplica aqui, e nem faria
     sentido: parado e um estado de agora, nao um evento da semana. */
  if(DWR_REC.recorte==='parados'||DWR_REC.recorte==='parados_direito'){
    DWR_CARREGANDO=true;
    let q=sb.from('vw_cards_parados')
      .select('cliente_id,nome,telefone,quadro,lista,cor,dias_parado,veredito,valor')
      .order('dias_parado',{ascending:false}).limit(300);
    if(DWR_REC.recorte==='parados_direito')q=q.in('veredito',['TEM_DIREITO','CAMINHO_CONTRIBUICAO']);
    /* O `is.null` no OR NAO e zelo: `veredito NOT IN (...)` devolve NULL
       para quem tem a coluna vazia, e NULL nao passa no WHERE. Como 93
       dos 98 parados ainda estao sem veredito (a varredura do motor so
       carimba quem tem triagem da Samara, e cartao herdado do Trello nao
       tem), sem esta linha a faixa diria 93 e a gaveta abriria vazia. */
    else q=q.or('veredito.is.null,veredito.not.in.(TEM_DIREITO,CAMINHO_CONTRIBUICAO)');
    const{data:pl,error:pe}=await q;
    DWR_CARREGANDO=false;
    if(pe){$('dwrb').innerHTML='<div class="emp"><div class="empt">Erro ao carregar a lista</div><div class="emps">'+esc(pe.message)+'</div></div>';return;}
    DWR_LINHAS=(pl||[]).map(x=>({
      cliente_id:x.cliente_id,nome:x.nome,telefone:x.telefone,
      quadro:x.quadro,lista:x.lista,cor:x.cor,valor:x.valor,
      contexto:'parada há '+x.dias_parado+' dia(s)'+(x.veredito?' · '+x.veredito.replace(/_/g,' ').toLowerCase():'')
    }));
    DWR_TOTAL=DWR_LINHAS.length;
    DWR_OFFSET=DWR_LINHAS.length;
    dwrPintar();
    return;
  }
  DWR_CARREGANDO=true;
  const{data,error}=await sb.rpc('crm_dashboard_cards',{
    p_recorte:DWR_REC.recorte,p_periodo:DASH_PER,p_offset:DWR_OFFSET,p_limit:DWR_PAGINA
  });
  DWR_CARREGANDO=false;
  if(error){$('dwrb').innerHTML='<div class="emp"><div class="empt">Erro ao carregar a lista</div><div class="emps">'+esc(error.message)+'</div></div>';return;}
  const linhas=data||[];
  DWR_TOTAL=linhas.length?Number(linhas[0].total)||0:DWR_TOTAL;
  DWR_LINHAS=DWR_LINHAS.concat(linhas);
  DWR_OFFSET+=linhas.length;
  dwrPintar();
}
function dwrPintar(){
  if(!DWR_REC)return;
  const busca=($('dwrf').value||'').trim().toLowerCase();
  const vis=DWR_LINHAS.filter(l=>!busca
    ||String(l.nome||'').toLowerCase().includes(busca)
    ||String(l.telefone||'').includes(busca));
  $('dwrc').textContent=(DWR_REC.sub?DWR_REC.sub+' · ':'')
    +DWR_TOTAL+(DWR_TOTAL===1?' cliente':' clientes')
    +(DWR_LINHAS.length<DWR_TOTAL?' · '+DWR_LINHAS.length+' carregadas':'');
  let h=vis.length?vis.map(l=>`
    <div class="dwr-row" onclick="abrirCardCliente('${l.cliente_id}')">
      <div class="av" style="background:${avC(l.nome)}">${avL(l.nome)}</div>
      <div style="flex:1;min-width:0">
        <div class="nm">${esc(l.nome||'Sem nome')}</div>
        <div class="tel">${esc(l.telefone||'sem telefone')}</div>

      <div class="sc"><div class="scl" style="color:var(--yellow)">A receber</div><div class="scv yw">${R(aRec)}</div></div>
      <div class="sc"><div class="scl" style="color:var(--red)">Atrasado</div><div class="scv rd">${R(atr)}</div></div>
      <div class="sc"><div class="scl" style="color:var(--red)">Inadimplente</div><div class="scv rd">${R(inad)}</div><div class="scs">fora da previsão</div></div>
    </div>
    <div class="st">Visão geral</div>

      <div class="kpc"><div class="ki" style="background:var(--rose-l)">💸</div><div class="kpl">Comissões pagas</div><div class="kv" style="color:var(--rose)">${R(com)}</div><div class="kh">Total de indicações</div></div>

      <button style="background:none;border:none;font-size:11px;color:var(--teal);font-weight:700;cursor:pointer" onclick="location.hash='#/recebimentos'">Ver todos →</button></div>

      return`<div class="lr" ${pCli(p)?`style="cursor:pointer" onclick="abrirCardCliente('${pCli(p)}')"`:''}><div class="av" style="background:${avC(p.cliente_nome)}">${avL(p.cliente_nome)}</div>

function renderChips(){
  const c={todos:0,previstos:0,atrasados:0,recebidos:0,inadimplentes:0,cancelados:0};
  PARC.forEach(p=>{c.todos++;const s=stD(p);
    if(s==='previsto')c.previstos++;else if(s==='atrasado')c.atrasados++;
    else if(s==='recebido')c.recebidos++;else if(s==='inadimplente')c.inadimplentes++;
    else if(s==='cancelado')c.cancelados++;});
  $('rchips').innerHTML=[{k:'todos',l:'Todos',x:''},{k:'previstos',l:'Previstos',x:''},{k:'atrasados',l:'Atrasados',x:'ra'},{k:'recebidos',l:'Recebidos',x:'ga'},{k:'inadimplentes',l:'Inadimplentes',x:''},{k:'cancelados',l:'Cancelados',x:''}]
    .map(x=>`<button class="fchip ${x.x}${rfiltro===x.k?' a':''}" onclick="setFiltro('${x.k}')">${x.l} (${c[x.k]})</button>`).join('');
}
function renderCal(){
  $('calmes').textContent=fMes(calMes);
  const ano=calMes.getFullYear(),mes=calMes.getMonth();
  const dias=new Date(ano,mes+1,0).getDate(),prim=new Date(ano,mes,1).getDay();
  const ms=`${ano}-${String(mes+1).padStart(2,'0')}`,mapa={};
  // Cancelada NAO entra no calendario, pela mesma razao que ja nao entra
  // na lista de Recebimentos (ver rfiltro): parcela cancelada nao vai ser
  // cobrada nem recebida, entao ocupar um dia da agenda so gera susto.
  // Ate 24/08 o calendario nao filtrava status nenhum e a parcela ficava
  // ali para sempre, sem nada no sistema capaz de tirar.
  PARC.filter(p=>p.data_vencimento&&p.data_vencimento.startsWith(ms)&&p.status!=='cancelado').forEach(p=>{
    const d=parseInt(p.data_vencimento.split('-')[2]);
    if(!mapa[d])mapa[d]={n:0,atr:false,rec:false,prev:false};
    mapa[d].n++;const s=stD(p);
    if(s==='atrasado'||s==='inadimplente')mapa[d].atr=true;
    else if(s==='recebido')mapa[d].rec=true;
    else if(s==='previsto')mapa[d].prev=true;
  });
  const tISO=fISO(today());
  let h='<div class="cg">';
  ['Dom','Seg','Ter','Qua','Qui','Sex','Sab'].forEach(d=>h+=`<div class="chd">${d}</div>`);
  for(let i=0;i<prim;i++)h+='<div class="cc em"></div>';
  for(let d=1;d<=dias;d++){
    const iso=`${ms}-${String(d).padStart(2,'0')}`,m=mapa[d];
    let cls='cc';if(iso===tISO)cls+=' td';
    if(m){cls+=' hp';if(m.atr)cls+=' cr';else if(m.rec&&!m.prev)cls+=' cg2';else if(m.prev)cls+=' cy';}
    h+=`<div class="${cls}" ${m?`onclick="abreMDia('${iso}')"`:''}><div class="cd">${d}</div>${m?`<div class="cn">${m.n}</div>`:''}</div>`;
  }
  $('calgrid').innerHTML=h+'</div>';
}
function renderLista(){
  const busca=($('rbusca')&&$('rbusca').value||'').toLowerCase();
  const ord=($('rordem')&&$('rordem').value)||'proximo';
  const mapa={};
  PARC.forEach(p=>{
    if(p.status==='cancelado'&&rfiltro!=='cancelados')return;
    const s=stD(p);
    if(rfiltro==='previstos'&&s!=='previsto')return;
    if(rfiltro==='atrasados'&&s!=='atrasado')return;
    if(rfiltro==='recebidos'&&s!=='recebido')return;
    if(rfiltro==='inadimplentes'&&s!=='inadimplente')return;
    if(rfiltro==='cancelados'&&s!=='cancelado')return;
    const cid=pCli(p)||p.cliente_nome;
    if(!mapa[cid])mapa[cid]={nm:p.cliente_nome,cid:pCli(p),ps:[],prox:null,proxVal:0,tot:0};
    mapa[cid].ps.push(p);mapa[cid].tot+=parseFloat(p.valor_honorario||0);
    if(s==='previsto'||s==='atrasado'){if(!mapa[cid].prox||p.data_vencimento<mapa[cid].prox){mapa[cid].prox=p.data_vencimento;mapa[cid].proxVal=parseFloat(p.valor_honorario||0);}}
  });
  let lista=Object.values(mapa).filter(c=>!busca||(c.nm||'').toLowerCase().includes(busca));
  if(ord==='proximo')lista.sort((a,b)=>{if(!a.prox&&!b.prox)return(a.nm||'').localeCompare(b.nm||'');if(!a.prox)return 1;if(!b.prox)return-1;return a.prox.localeCompare(b.prox);});
  else if(ord==='nome')lista.sort((a,b)=>(a.nm||'').localeCompare(b.nm||''));
  else lista.sort((a,b)=>b.tot-a.tot);
  if(!lista.length){$('rlista').innerHTML=`<div class="emp"><div class="empi">📂</div><div class="empt">Nenhum resultado</div></div>`;return;}
  $('rlista').innerHTML=lista.map(c=>{
    const cli=CLI.find(x=>x.id==c.cid);
    const ind=(REC.find(r=>(r.crm_cliente_id||r.cliente_id)==c.cid&&r.indicador_nome)||{}).indicador_nome;
    const wa=cli&&cli.whatsapp?`<a class="cl2 lwa" href="https://wa.me/55${cli.whatsapp.replace(/\D/g,'')}" target="_blank">💬 WhatsApp</a>`:'';
    const tr=cli&&cli.trello_url?`<a class="cl2 ltr" href="${escA(cli.trello_url)}" target="_blank">📋 Trello</a>`:'';
    const fc=c.cid?`<button class="cl2 lcr" onclick="abrirCardCliente('${c.cid}')">◈ Abrir card</button>`:'';
    const key=`cc_${String(c.cid||c.nm).replace(/\W/g,'_')}`;
    const rid=c.ps[0]&&c.ps[0].recebimento_id;
    const ph=c.ps.map(p=>{
      const s=stD(p);
      const vc=p.valor_cliente&&parseFloat(p.valor_cliente)>0?`<span style="color:var(--green);font-weight:600"> · Cliente: ${R(p.valor_cliente)}</span>`:'';
      const ac=(s!=='recebido'&&s!=='cancelado')?`
        <button class="bic bg" title="Recebido" onclick="abreMRec('${p.id}')">✓</button>
        ${s==='atrasado'?`<button class="bic bp2" title="Inadimplente" onclick="marcaInad('${p.id}')">⚑</button>`:''}
        <button class="bic" style="color:var(--gray)" title="Cancelar" onclick="cancelaP('${p.id}')">✕</button>`
        :(s==='recebido'?`<span style="font-size:10px;color:var(--text3)">${p.data_pagamento?fD(p.data_pagamento):''}</span>`:'');
      return`<div class="pi"><div class="pin">${p.num_parcela}/${p.total_parcelas}</div>
        <div class="pii"><div class="pid">${fD(p.data_vencimento)}</div><div class="piv">${R(p.valor_honorario)}${vc}</div></div>
        <div class="pir">${bdg(s)}<div class="piac">${ac}</div><button class="bic" title="Editar" onclick="abreMEP('${p.id}')">✎</button></div></div>`;
    }).join('');
    return`<div class="ccard"><div class="cch" onclick="togCC('${key}')">
      <div class="av" style="background:${avC(c.nm)};width:38px;height:38px">${avL(c.nm)}</div>
      <div class="cci"><div class="ccn">${esc(c.nm)}</div><div class="ccm">${c.ps.length} parcela(s)${c.prox?` · <span style="color:var(--teal);font-weight:600">📅 ${fD(c.prox)}</span>`:''}${ind?` · Ind: ${esc(ind)}`:''}</div></div>
      <div class="ccv">${c.prox?R(c.proxVal):R(c.tot)}</div><div class="chv" id="chv_${key}">▼</div></div>
      <div class="ccb" id="${key}"><div class="ccl">${wa}${tr}${fc}</div>${ph}
      ${rid?`<div class="remr"><button class="brem" onclick="removeRec('${rid}')">🗑 Remover recebimento</button></div>`:''}</div></div>`;
  }).join('');
}
function togCC(k){const b=$(k),ch=$('chv_'+k);if(!b)return;const o=b.classList.toggle('o');if(ch)ch.classList.toggle('o',o);}

/* INADIMPLENCIA SO EXISTE DEPOIS DO VENCIMENTO — 24/08/2026.
   Antes esta funcao carimbava 'inadimplente' em TODAS as parcelas em
   aberto do cliente, inclusive nas que ainda nem tinham vencido. A Sara
   Francine ficou com a 3/3 de 21/09 marcada como inadimplente em agosto:
   uma divida que ainda nao existia, plantada na agenda para sempre,
   porque nada no sistema reclassifica parcela.
   Agora separa:
     ja vencida  -> 'inadimplente'. E divida de verdade e PRECISA continuar
                    aparecendo; sumir da tela seria esquecer de cobrar.
     a vencer    -> 'cancelado'. A cobrança dela morreu junto com o
                    contrato, e cancelada some do calendario e da lista.
   Nos dois casos o valor sai da previsao de faturamento, que era o ponto
   do botao desde o inicio. */
async function marcaInad(pid){
  const p=PARC.find(x=>String(x.id)===String(pid));
  if(!p)return;
  const cid=pCli(p);
  const emAberto=(PARC||[]).filter(x=>pCli(x)===cid&&x.status!=='recebido'&&x.status!=='cancelado'&&x.status!=='inadimplente');
  const hoje=fISO(today());
  // Parcela sem data cai em 'vencida' de proposito: na duvida a divida
  // aparece, porque o erro de esquecer de cobrar custa mais que o susto.
  const vencidas=emAberto.filter(x=>String(x.data_vencimento||'')<=hoje);
  const futuras=emAberto.filter(x=>String(x.data_vencimento||'')>hoje);
  const soma=l=>l.reduce((s,x)=>s+parseFloat(x.valor_honorario||0),0);
  const total=soma(emAberto);
  if(!emAberto.length){toast('Nao ha parcela em aberto para este cliente.','er');return;}
  /* Nenhuma venceu: nao ha inadimplencia para declarar. Deixar passar
     cancelaria o contrato inteiro por um botao que diz outra coisa, e o
     cartao nem iria para a lista Inadimplente — sincronizarFinanceiroCliente
     ignora canceladas e sairia sem mover nada. */
  if(!vencidas.length){
    alert('Nenhuma parcela deste cliente venceu ainda.\n\nNao da para declarar inadimplencia de divida que ainda nao existe. Se a cobranca acabou, cancele as parcelas uma a uma.');
    return;
  }
  const msg='Marcar '+(p.cliente_nome||'este cliente')+' como INADIMPLENTE?\n\n'
    +vencidas.length+' ja vencida(s) - '+R(soma(vencidas))+'\n   viram inadimplentes e CONTINUAM na cobranca\n\n'
    +(futuras.length?futuras.length+' ainda a vencer - '+R(soma(futuras))+'\n   sao canceladas e somem da agenda\n\n':'')
    +'Os '+R(total)+' saem da previsao de faturamento e o cartao vai para a lista Inadimplente.';
  if(!confirm(msg))return;
  if(vencidas.length){
    const{error}=await sb.from('pm_parcelas').update({status:'inadimplente'}).in('id',vencidas.map(x=>x.id));
    if(error){toast('Erro ao marcar as vencidas.','er');return;}
  }
  if(futuras.length){
    const{error}=await sb.from('pm_parcelas').update({status:'cancelado'}).in('id',futuras.map(x=>x.id));
    if(error){toast('Vencidas marcadas, mas houve erro ao cancelar as futuras.','er');}
  }
  fecharModal();
  toast(vencidas.length+' inadimplente(s)'+(futuras.length?' e '+futuras.length+' cancelada(s)':'')+'.','in');
  await loadFin(true);
  if(cid){
    await registrarAtividade(cid,'marcou como inadimplente - '+vencidas.length+' parcela(s) vencida(s)'
      +(futuras.length?', '+futuras.length+' a vencer cancelada(s)':'')+', '+R(total)+' removido(s) da previsao',undefined);
    await sincronizarFinanceiroCliente(cid,true);
  }
  recarregarFin();
}

// ---------- MOVIMENTO AUTOMATICO NO QUADRO FINANCEIRO ----------
const DIAS_AVISO_ATRASO=5;
const LISTAS_FIN={
  pagamento:['Em pagamento INSS','Em pagamento','Em pagamento cliente'],
  encerrado:['Pago / encerrado','Pago/encerrado','Finalizado','Pago'],
  inadimplente:['Inadimplente','Inadimplentes']
};
let _cacheListasFin=null;
async function listasFinanceiro(){
  if(_cacheListasFin)return _cacheListasFin;
  const{data}=await sb.from('crm_listas').select('id,nome').eq('quadro','financeiro').eq('arquivada',false);
  _cacheListasFin=data||[];
  return _cacheListasFin;
}
const _norm=s=>String(s||'').toLowerCase().replace(/\s+/g,' ').trim();
async function acharListaFin(chave){
  const listas=await listasFinanceiro();
  for(const cand of (LISTAS_FIN[chave]||[])){
    const achou=listas.find(l=>_norm(l.nome)===_norm(cand));
    if(achou)return achou;
  }
  return null;
}
function diasAtrasoParcela(p){
  if(!p||!p.data_vencimento)return 0;
  if(p.status==='recebido'||p.status==='cancelado')return 0;
  const d=-dVenc(p.data_vencimento);
  return d>0?d:0;
}
async function moverClienteFinanceiro(crmClienteId,chaveLista,logar){
  if(!crmClienteId)return;
  const lista=await acharListaFin(chaveLista);
  if(!lista){toast('Lista do Financeiro nao encontrada: '+chaveLista,'er');return;}
  const{data:clienteAtual}=await sb.from('crm_clientes').select('lista_id').eq('id',crmClienteId).single();
  if(clienteAtual&&clienteAtual.lista_id===lista.id)return;
  const{count}=await sb.from('crm_clientes').select('id',{count:'exact',head:true}).eq('lista_id',lista.id);
  await sb.from('crm_clientes').update({
    quadro:'financeiro',lista_id:lista.id,posicao:(count||0),atualizado_em:new Date().toISOString()
  }).eq('id',crmClienteId);
  if(logar)await registrarAtividade(crmClienteId,'moveu automaticamente o cartao para "'+lista.nome+'" (Financeiro)',null);
}
async function sincronizarFinanceiroCliente(crmClienteId,logar){
  if(!crmClienteId)return;
  const{data:parcelas}=await sb.from('pm_parcelas')
    .select('status').eq('crm_cliente_id',crmClienteId).neq('status','cancelado');
  if(!parcelas||!parcelas.length)return;
  if(parcelas.some(p=>p.status==='inadimplente')){
    await moverClienteFinanceiro(crmClienteId,'inadimplente',logar);return;
  }
  const todasRecebidas=parcelas.every(p=>p.status==='recebido');
  await moverClienteFinanceiro(crmClienteId,todasRecebidas?'encerrado':'pagamento',logar);
}
async function checarFinalizacaoCliente(crmClienteId){
  await sincronizarFinanceiroCliente(crmClienteId,true);
}
/* VARREDURA DE CONSISTENCIA DO FINANCEIRO.
   sincronizarFinanceiroCliente() so roda quando alguem mexe numa parcela por
   esta tela. Mudanca feita por fora — SQL direto, outro app, importacao — nao
   move o cartao, e ele fica parado numa lista que contradiz as parcelas. Foi
   assim que uma cliente ficou marcada como inadimplente com duas parcelas
   ainda esperando pagamento.
   Esta funcao le o que ja esta em memoria e so escreve nos divergentes.

   Corrige APENAS quem ja esta no quadro Financeiro. Cartao em outro quadro
   (Comercial, por exemplo) que tenha parcela cadastrada e apenas contado no
   relato, nunca movido: arrastar cartao entre quadros em lote atropelaria o
   trabalho de quem esta com ele em maos, e nao ha desfazer. */
async function varrerConsistenciaFinanceiro(){
  if(!Array.isArray(PARC)||!PARC.length)return null;

  /* PARC vem de loadFin com select sem limite. O PostgREST corta em 1000
     linhas sem avisar, entao a partir dai a varredura estaria decidindo com
     base em meia base — melhor nao rodar do que corrigir pela metade. */
  if(PARC.length>=1000){
    console.warn('Varredura ignorada: PARC pode estar truncado em 1000 linhas.');
    return null;
  }

  const esperadoPorCliente={};
  PARC.forEach(p=>{
    if(p.status==='cancelado')return;
    const cid=pCli(p);if(!cid)return;
    if(!esperadoPorCliente[cid])esperadoPorCliente[cid]={inad:false,todasRecebidas:true};
    if(p.status==='inadimplente')esperadoPorCliente[cid].inad=true;
    if(p.status!=='recebido')esperadoPorCliente[cid].todasRecebidas=false;
  });
  const ids=Object.keys(esperadoPorCliente);
  if(!ids.length)return null;

  const listas=await listasFinanceiro();
  const chavePorListaId={};
  for(const chave of Object.keys(LISTAS_FIN)){
    for(const cand of LISTAS_FIN[chave]){
      const achou=listas.find(l=>_norm(l.nome)===_norm(cand));
      if(achou&&!chavePorListaId[achou.id])chavePorListaId[achou.id]=chave;
    }
  }

  const{data:clientes}=await sb.from('crm_clientes')
    .select('id,nome_completo,quadro,lista_id').in('id',ids);
  if(!clientes)return null;

  const divergentes=[];let foraDoFinanceiro=0;
  clientes.forEach(c=>{
    const e=esperadoPorCliente[c.id];if(!e)return;
    const chaveEsperada=e.inad?'inadimplente':(e.todasRecebidas?'encerrado':'pagamento');
    if(c.quadro!=='financeiro'){foraDoFinanceiro++;return;}
    if(chavePorListaId[c.lista_id]===chaveEsperada)return;
    divergentes.push({id:c.id,nome:c.nome_completo,chave:chaveEsperada});
  });

  for(const d of divergentes)await moverClienteFinanceiro(d.id,d.chave,true);

  return{conferidos:clientes.length,corrigidos:divergentes.length,
         foraDoFinanceiro:foraDoFinanceiro,nomes:divergentes.map(d=>d.nome)};
}
async function notificarAtraso(clienteId,nome,dias){
  if(!U)return;
  await sb.from('crm_notificacoes').insert({
    usuario_id:U.id,cliente_id:clienteId,lida:false,
    texto:(nome||'Cliente')+' - parcela vencida ha '+dias+' dia'+(dias===1?'':'s')
  });
}
async function varrerAtrasos(){
  if(!U)return;
  const atrasadas=(PARC||[]).filter(p=>
    (p.status==='previsto'||!p.status)&&diasAtrasoParcela(p)>=DIAS_AVISO_ATRASO);
  if(!atrasadas.length)return;
  const porCliente={};
  atrasadas.forEach(p=>{
    const cid=pCli(p);if(!cid)return;
    const d=diasAtrasoParcela(p);
    if(!porCliente[cid]||d>porCliente[cid].dias)porCliente[cid]={dias:d,nome:p.cliente_nome};
  });
  const ids=Object.keys(porCliente);
  if(!ids.length)return;
  const{data:jaAvisados}=await sb.from('crm_notificacoes')
    .select('cliente_id').eq('usuario_id',U.id).in('cliente_id',ids)
    .gte('criado_em',new Date(Date.now()-7*864e5).toISOString());
  const setAvisados=new Set((jaAvisados||[]).map(n=>n.cliente_id));
  let novos=0;
  for(const cid of ids){
    if(setAvisados.has(cid))continue;
    await notificarAtraso(cid,porCliente[cid].nome,porCliente[cid].dias);
    novos++;
  }
  if(novos)await carregarNotificacoes();
}

let _buscaCliTimer=null;

async function buscaCliAgora(){
  const q=($('fbcli').value||'').trim(),res=$('fbres');
  if(q.length<2){res.style.display='none';return;}
  const digitos=q.replace(/\D/g,'');
  const porTelefone=digitos.length>=4&&digitos.length>=q.replace(/\s/g,'').length-2;
  const consulta=porTelefone
    ? sb.from('crm_clientes').select('id,nome_completo,telefone_principal').ilike('telefone_principal','%'+digitos+'%').limit(8)
    : sb.from('crm_clientes').select('id,nome_completo,telefone_principal').ilike('nome_completo','%'+q+'%').order('nome_completo').limit(8);
  const{data}=await consulta;
  const f=(data||[]).map(c=>({id:c.id,nome:c.nome_completo,whatsapp:c.telefone_principal}));
  mesclarCli(f);
  if(!f.length){
    res.style.display='block';
    res.innerHTML='<div class="fhint" style="padding:10px">Nenhuma cliente encontrada com esse nome ou telefone.</div>';
    return;
  }
  res.style.display='block';
  res.innerHTML=f.map(c=>`<div class="sri" onclick="selCli('${c.id}')">
    <div class="av" style="background:${avC(c.nome)};width:30px;height:30px;font-size:12px">${avL(c.nome)}</div>
    <div><div style="font-size:13px;font-weight:700">${esc(c.nome)}</div><div style="font-size:11px;color:var(--text3)">${esc(c.whatsapp)||''}</div></div></div>`).join('');
}

function recalc(){
  const vc=m2f($('fvc')),fp=parseFloat($('ffp').value)||30,fd=m2f($('ffd'));
  const br=vc*(fp/100),liq=Math.max(0,br-fd);

function geraParcs(){
  const n=parseInt($('fnp').value)||1,hoje=fISO(today());
  if(!fParcs.length||fParcs.length!==n){
    const old=fParcs;fParcs=[];
    for(let i=0;i<n;i++){
      let dt;
      if(old[0]&&old[0].data){dt=new Date(old[0].data+'T12:00:00');dt.setMonth(dt.getMonth()+i);}
      else{dt=new Date(hoje+'T12:00:00');dt.setMonth(dt.getMonth()+i);}
      fParcs.push({data:fISO(dt),cli:(old[i]&&old[i].cli)||(i>0&&i<n-1?1500:0),fd:(old[i]&&old[i].fd)||0});
    }
  }
  recalcParcs();
}
/* HONORARIOS PROGRESSIVOS — contrato vigente desde 17/08/2026.
   O total continua limitado a 30% do liquido, igual ao modelo antigo. O que
   muda e o ritmo: o primeiro deposito define quanto entra de cara, por faixa,
   e os seguintes sao R$ 500 ate quitar.

   Por que o 3o recebimento absorve o saldo: o contrato exige quitacao ate ele.
   A alternativa seria manter R$ 500 e cobrar o resto avulso 5 dias depois do
   3o deposito — uma cobranca caindo num dia em que a cliente nao recebeu nada,
   que e o desenho mais provavel de virar inadimplencia. */
const FAIXAS_PROG=[{ate:1000,paga:500},{ate:1500,paga:800},{ate:2000,paga:1200},{ate:2999.99,paga:1500}];
const PARCELA_PROG=500;
function honorariosProgressivos(valores,pctTeto,descontoGlobal){
  const total=valores.reduce((s,v)=>s+(parseFloat(v)||0),0);
  let saldo=Math.round((total*(pctTeto/100)-(parseFloat(descontoGlobal)||0))*100)/100;
  if(saldo<0)saldo=0;
  return valores.map((v,i)=>{
    v=parseFloat(v)||0;
    if(saldo<=0)return 0;
    let paga;
    if(i===0){
      if(v>=3000)paga=saldo;
      else{const f=FAIXAS_PROG.find(f=>v<=f.ate);paga=f?f.paga:PARCELA_PROG;}
    }else if(i===2)paga=saldo;      /* quitacao obrigatoria ate o 3o */
    else paga=PARCELA_PROG;
    /* Nunca cobrar mais do que ela recebeu naquele mes, nem furar o teto. */
    paga=Math.min(paga,saldo,v);
    paga=Math.round(paga*100)/100;
    saldo=Math.round((saldo-paga)*100)/100;
    return paga;
  });
}
function setModelo(v){
  fModelo=v;
  const h=$('fmodhint');
  if(h)h.textContent=v==='progressivo'
    ? 'Faixa pelo 1º depósito, R$ 500 nos seguintes, quitação até o 3º. Teto de 30%.'
    : '30% de cada parcela até o fim, como nos contratos anteriores a 17/08/2026.';
  recalcParcs();
}
function recalcParcs(){
  const n=fParcs.length,vcTotal=m2f($('fvc')),fp=parseFloat($('ffp').value)||30;
  if(n>1){
    const soma=fParcs.slice(0,n-1).reduce((s,p)=>s+(parseFloat(p.cli)||0),0);
    fParcs[n-1].cli=Math.max(0,vcTotal-soma);
  }else if(n===1)fParcs[0].cli=vcTotal;
  /* DESCONTO GLOBAL (Promo 500) — sai do FINAL, nunca da primeira parcela.
     Ele reduz o total devido, e as parcelas sao consumidas do comeco para
     tras: os primeiros recebimentos mantem o valor de tabela e o desconto
     come o rabo do parcelamento. Antes este campo so aparecia no resumo e
     nao entrava no calculo — a tela mostrava liquido de R$ 1.300 e logo
     abaixo parcelas somando R$ 1.800, na mesma pagina.
     E separado do desconto por parcela (p.fd), que continua servindo para
     ajuste pontual de uma parcela especifica. */
  const descGlobal=m2f($('ffd'))||0;
  if(fModelo==='progressivo'){
    const hons=honorariosProgressivos(fParcs.map(p=>p.cli),fp,descGlobal);
    fParcs.forEach((p,i)=>{
      const fd=parseFloat(p.fd)||0;
      p.hon=Math.max(0,hons[i]-fd);
    });
  }else{
    /* No percentual o desconto tambem sai do fim: percorre de tras para
       frente abatendo o que ainda falta, para que as primeiras parcelas
       fiquem intactas. */
    let restante=descGlobal;
    const brutos=fParcs.map(p=>Math.max(0,(parseFloat(p.cli)||0)*(fp/100)));
    for(let i=brutos.length-1;i>=0&&restante>0;i--){
      const abate=Math.min(brutos[i],restante);
      brutos[i]=Math.round((brutos[i]-abate)*100)/100;
      restante=Math.round((restante-abate)*100)/100;
    }
    fParcs.forEach((p,i)=>{
      const fd=parseFloat(p.fd)||0;
      p.hon=Math.max(0,brutos[i]-fd);
    });
  }
  renderParcsForm();
}
function renderParcsForm(){
  const n=fParcs.length,cont=$('parcsform');
  if(!cont)return;
  const fp=parseFloat($('ffp').value)||30;
  cont.innerHTML=fParcs.map((p,i)=>`<div class="pfc">
    <div style="display:flex;align-items:center;gap:8px;margin-bottom:12px;flex-wrap:wrap">
      <div class="pfn">${i+1}</div><div style="font-size:13px;font-weight:700">Parcela ${i+1}/${n}</div>
      ${i===0?`<span class="ti">Valor do INSS</span>`:`<span class="te">Estimativa</span>`}</div>
    <div class="fg">
      <div class="fld"><label>Data de vencimento</label><input type="date" id="fpd${i}" value="${p.data}" onchange="upP(${i},'d',this.value)"/></div>
      <div class="fld"><label>Valor que a cliente recebe (R$)</label>
        <input type="text" id="fpc${i}" value="${floatToMoney(p.cli)}" placeholder="Quanto o INSS paga" data-money="" inputmode="decimal" onchange="upP(${i},'c',this.value)" ${(i===n-1&&n>1)?'disabled style="opacity:.6"':''}/>
        ${(i===n-1&&n>1)?`<span class="fhint">Calculado automaticamente (resto do total)</span>`:''}</div>
      <div class="fld"><label>Desconto honorário (R$)</label>
        <input type="text" id="fpfd${i}" value="${floatToMoney(p.fd)}" placeholder="0,00" data-money="" inputmode="decimal" onchange="upP(${i},'fd',this.value)"/></div>
      <div class="fld"><label>Valor honorário (R$)</label>
        <input type="text" id="fph${i}" data-money="" inputmode="decimal" value="${floatToMoney(p.hon)}" onchange="upP(${i},'h',this.value)"/>
        <span class="fhint">${fModelo==='progressivo'?(i===0?'faixa do 1º depósito':(i===2?'quita o saldo':'parcela fixa'))+' (teto '+fp+'%)':fp+'% do valor da cliente'}${p.fd?` − ${R(p.fd)}`:''}</span></div>
    </div></div>`).join('');
}
function upP(i,c,v){
  if(c==='d'){
    fParcs[i].data=v;
    if(i===0){
      const base=new Date(v+'T12:00:00');
      for(let j=1;j<fParcs.length;j++){
        const dt=new Date(base);dt.setMonth(dt.getMonth()+j);
        fParcs[j].data=fISO(dt);
        const el=$('fpd'+j);if(el)el.value=fParcs[j].data;
      }
    }
    return;
  }
  if(c==='h'){fParcs[i].hon=moneyToFloat(v);return;}
  if(c==='fd'){fParcs[i].fd=moneyToFloat(v);recalcParcs();return;}
  if(c==='c'){
    fParcs[i].cli=moneyToFloat(v);
    if(i===1)for(let j=2;j<fParcs.length-1;j++)fParcs[j].cli=fParcs[1].cli;
    recalcParcs();
  }
}
async function submitRec(){
  if(!fCliId){toast('Selecione uma cliente.','er');return;}
  const vc=m2f($('fvc'));
  if(!vc){toast('Informe o valor da cliente.','er');return;}
  const cli=CLI.find(c=>String(c.id)===String(fCliId));
  if(!cli){toast('Cliente não encontrada.','er');return;}
  const fp=parseFloat($('ffp').value)||30,fd=m2f($('ffd'));
  const feeBr=vc*(fp/100),feeLiq=Math.max(0,feeBr-fd);
  const temInd=$('find').checked;
  const indNm=temInd?$('findnm').value.trim():'';
  const indVl=temInd?m2f($('findvl')):0;
  const n=parseInt($('fnp').value)||1;
  const btn=$('fsubmit');btn.textContent='Salvando...';btn.disabled=true;

  const rid=Date.now();
  const rd={id:rid,crm_cliente_id:fCliId,cliente_nome:cli.nome,valor_cliente:vc,num_parcelas:n,
    fee_percent:fp,fee_bruto:feeBr,fee_desconto:fd,fee_liquido:feeLiq,modelo_honorarios:fModelo,
    indicador_nome:indNm||null,indicador_comissao_tipo:temInd?'fixed':null,
    indicador_comissao_valor:indVl,indicador_comissao_total:indVl,
    sobra_liquida:Math.max(0,feeLiq-indVl),metodo_pagamento:'PIX',notas:$('fnotas').value||null};

  const{error:er}=await sb.from('pm_recebimentos').insert(rd);
  if(er){btn.disabled=false;btn.textContent='Salvar recebimento';toast('Erro ao salvar: '+er.message,'er');return;}

  const base=Date.now()+1;
  const linhas=fParcs.map((p,i)=>({id:base+i,recebimento_id:rid,crm_cliente_id:fCliId,cliente_nome:cli.nome,
    num_parcela:i+1,total_parcelas:n,valor_honorario:p.hon,valor_cliente:p.cli||0,
    data_vencimento:p.data,status:'previsto'}));
  const{error:ep}=await sb.from('pm_parcelas').insert(linhas);
  btn.disabled=false;btn.textContent='Salvar recebimento';
  if(ep){toast('Recebimento salvo, mas houve erro nas parcelas: '+ep.message,'er');return;}

  toast('Recebimento salvo!','ok');
  await loadFin(true);
  await moverClienteFinanceiro(fCliId,'pagamento',true);
  location.hash='#/recebimentos';
}

let FILA_ABA='aprovar';
let FILA_CACHE=[];
/* COMO A LISTA VEM AGRUPADA. Abre em 'seq' porque a pergunta que se faz
   ao chegar aqui e "o que tem de cada sequencia e em que passo", nao "o
   que sai hoje" — para essa continua existindo o 'dia', a um clique. */
let FILA_AGRUP='seq';
/* A ultima mensagem de cada conversa, para saber se o contexto da
   automacao ainda vale. So cobre os ultimos 3 dias: fora disso nao ha
   dado, e ai NAO se mostra aviso nenhum em vez de mostrar um errado. */
let FILA_ULTIMA=new Map();
/* FASE MINIMIZADA. Mesmo armazenamento das seções do menu: sobrevive ao
   F5, que é o ponto — recolher tudo toda vez que a tela recarrega seria
   trabalho repetido, não atalho. */
function seqFechada(k){try{return localStorage.getItem('kl_seq_'+k)==='1';}catch(_){return false;}}
function seqAlternar(k){
  try{if(seqFechada(k))localStorage.removeItem('kl_seq_'+k);else localStorage.setItem('kl_seq_'+k,'1');}catch(_){}
  renderFila();
}
/* Recolher/abrir todas de uma vez. Sem isto, deixar a tela no estado de
   visão geral custaria um clique por sequência — e são até 26. */
function seqTodas(fechar){
  try{
    (FILA_GRUPOS||[]).forEach(k=>{
      if(fechar)localStorage.setItem('kl_seq_'+k,'1');else localStorage.removeItem('kl_seq_'+k);
    });
  }catch(_){}
  renderFila();
}
let FILA_GRUPOS=[];
let FILA_SEL=new Set();          // vencidas marcadas para reenvio em lote
// Mapas de apoio do cartao da fila: qual sequencia, qual passo, qual braco.
// Carregados junto com a fila em vez de virem por join aninhado, porque
// a crm_cadencia tem a coluna texto e um join traria o texto de todos os
// passos junto — sao duas tabelas de dezenas de linhas, o custo e zero.
let FILA_SEQ={};                 // sequencia_id -> {codigo, nome}
let FILA_CAD={};                 // cadencia_id  -> {ordem, braco}
let FILA_NPASSOS={};             // sequencia_id -> quantos passos distintos
let FILA_BRACOS={};let FILA_ORDENS={};              // "sequencia_id|ordem" -> quantos bracos
let FILA_SEMRESP=[];             // conversas em que a cliente falou por ultimo
let FILA_MUDAS=[];               // conversas em que NOS falamos por ultimo e nada ficou agendado
/* REATIVACAO NAO E AUTOMACAO DE FUNIL — aba propria, 02/09/2026.

   As quatro sequencias reativacao_* sao disparo em massa sobre base
   parada (os 659 cards da lista Reativacao Trello), e nao a esteira de
   quem esta em atendimento. Misturadas nas abas Aprovar/Agendadas/
   Vencidas elas dominam a contagem pelo volume: 44 reativacoes ao lado
   de 3 automacoes de cliente fazem o numero da aba parar de significar
   "trabalho esperando por voce".

   O CRITERIO E O CODIGO DA SEQUENCIA, nao a lista do card nem o nome.
   Card de reativacao anda pelo funil assim que a mulher responde — ele
   sai da lista Reativacao Trello e continua sendo reativacao. Quem
   nasce reativacao morre reativacao, e e o codigo que diz isso. */
function ehReativacao(a){
  const s=FILA_SEQ[a.sequencia_id];
  return !!s && String(s.codigo||'').indexOf('reativacao')===0;
}
/* O telefone vem do banco em formatos diferentes: uns ja formatados, uns
   so digitos com 55 na frente. Lido as pressas, 5579999451651 e uma
   parede de numeros e da para ler o DDD errado. */
function foneLegivel(bruto){
  const d=String(bruto||'').replace(/\D/g,'');
  if(d.length<10)return String(bruto||'').trim();
  const sp=(d.startsWith('55')&&d.length>=12)?d.slice(2):d;
  const ddd=sp.slice(0,2),r=sp.slice(2);
  if(r.length===9)return '('+ddd+') '+r.slice(0,5)+'-'+r.slice(5);
  if(r.length===8)return '('+ddd+') '+r.slice(0,4)+'-'+r.slice(4);
  return sp;
}

}

    // O select anterior pedia `texto` inteiro e cortava em 120 caracteres
    // aqui no navegador: baixava 5.188 kB para usar 26 kB. Como a midia
    // chega em base64 dentro do `texto` (item 115), cada audio de cliente

    // maior consumidor isolado de egress da operacao.

    // O `ultimaDe` fica: custa nada e nao depende da view continuar assim.
    //
    // Enquanto o 115 nao subir a midia para o bucket, NENHUMA tela pode

    sb.from('crm_listas').select('id,nome'),
    sb.from('vw_inbox_lista').select('cliente_id,criado_em,direcao,previa')
      .not('cliente_id','is',null)
      .gte('criado_em', new Date(Date.now()-3*24*3600000).toISOString())
      .order('criado_em',{ascending:false}).limit(1000)
  ]);

  if(error){pc.innerHTML='<div class="emp"><div class="empt">Erro ao carregar</div><div class="emps">'+esc(error.message)+'</div></div>';return;}
  FILA_CACHE=data||[];
  FILA_SEQ={};FILA_CAD={};FILA_NPASSOS={};
  (seqs||[]).forEach(x=>{FILA_SEQ[x.id]={codigo:x.codigo,nome:x.nome,etapa:x.etapa};});
  const ordensPorSeq={};
  (cads||[]).forEach(x=>{
    FILA_CAD[x.id]={ordem:x.ordem,braco:x.braco};
    // Passo e a ORDEM, nao a linha: a triagem1 tem quatro linhas na ordem
    // 2 (os bracos A/B/C/D do teste) e continua sendo uma sequencia de
    // tres passos. Contar linha diria "passo 2 de 6" e seria mentira.
    (ordensPorSeq[x.sequencia_id]=ordensPorSeq[x.sequencia_id]||new Set()).add(x.ordem);
  });
  Object.keys(ordensPorSeq).forEach(k=>{FILA_NPASSOS[k]=ordensPorSeq[k].size;});
  /* As ordens REAIS, nao 1..n: se uma sequencia tem os passos 1, 3 e 4,
     a regua tem que mostrar 1, 3 e 4. Inventar o 2 mostraria um passo
     que nao existe e faria parecer que alguem esta parado nele. */
  FILA_ORDENS={};
  Object.keys(ordensPorSeq).forEach(k=>{FILA_ORDENS[k]=[...ordensPorSeq[k]].sort((a,b)=>a-b);});
  FILA_BRACOS={};
  (cads||[]).forEach(x=>{const k=x.sequencia_id+'|'+x.ordem;FILA_BRACOS[k]=(FILA_BRACOS[k]||0)+1;});
  // SEM RESPOSTA: o criterio e um so — a ultima mensagem da conversa e
  // dela. Se a ultima e nossa, alguem respondeu, e nao importa quem nem
  // por qual caminho. Assim a lista nao depende de saber POR QUE travou,
  // e continua funcionando para bloqueios que ainda nao existem.
  const ultimaDe=new Map();
  (msgs||[]).forEach(m=>{if(!ultimaDe.has(m.cliente_id))ultimaDe.set(m.cliente_id,m);});
  FILA_ULTIMA=ultimaDe;
  const mapaListas={};
  (listas||[]).forEach(l=>{mapaListas[l.id]=l.nome;});
  const espIds=[];
  ultimaDe.forEach((m,id)=>{if(m.direcao==='entrada')espIds.push(id);});
  FILA_SEMRESP=[];
  if(espIds.length){
    const{data:cliEsp}=await sb.from('crm_clientes')
      .select('id,nome_completo,telefone_principal,samara_pausada,alerta_ignorado_em,lista_id')
      .in('id',espIds).is('arquivado_em',null).limit(1000);
    (cliEsp||[]).forEach(c=>{
      const m=ultimaDe.get(c.id);
      const min=Math.floor((Date.now()-new Date(m.criado_em).getTime())/60000);
      // AS DUAS APARECEM, EM GRUPOS SEPARADOS — 23/08.
      //
      // Na primeira versao a conversa pausada foi tirada daqui para o
      // aviso do WhatsApp nao virar ruido. Deu no pior dos dois mundos:
      // ela sumiu da TELA junto, e sobraram leads pagas esquecidas ha uma
      // semana sem aparecer em lugar nenhum.
      //
      // A separacao certa nao e tela x tela, e TELA x WHATSAPP. Aqui
      // aparece tudo, agrupado, porque esta e a tela para onde se vem
      // procurar. O aviso do WhatsApp, que interrompe, continua so com o
      // que a Samara deveria ter respondido — o motor decide isso sozinho
      // e nao depende desta tela.
      //
      // O prazo e outro porque a natureza e outra: robo que nao responde
      // em 15 min esta quebrado; gente que nao responde em 15 min esta
      // almocando. Pausada so entra depois de 4 horas.
      if(min < (c.samara_pausada?240:15))return;
      // Dispensada na mao continua fora ATE ELA ESCREVER DE NOVO: a
      // dispensa vale para aquela mensagem, nao para a pessoa.
      if(c.alerta_ignorado_em && new Date(c.alerta_ignorado_em) > new Date(m.criado_em))return;
      FILA_SEMRESP.push({id:c.id,nome:c.nome_completo||'(sem nome)',
        fone:foneLegivel(c.telefone_principal),pausada:!!c.samara_pausada,min:min,
        lista:mapaListas[c.lista_id]||'',
        texto:String(m.previa||'').replace(/\s+/g,' ').slice(0,120)});
    });
    FILA_SEMRESP.sort((a,b)=>b.min-a.min);
  }
  /* CONVERSA MUDA DOS DOIS LADOS — 02/09/2026.

     A Sem resposta enxerga um caso só: a última mensagem é DELA. O caso
     inverso não aparecia em tela nenhuma — a última mensagem é NOSSA, e
     depois dela não ficou nada agendado. Do ponto de vista do sistema
     está tudo certo: não há erro, não há linha travada, a fila está
     limpa. E a conversa morreu ali.

     Foi o que aconteceu com a Aline (a Samara respondeu "Perfeito,
     anotei aqui" e nunca fez a terceira pergunta) e com a Tatiane ("deixa
     eu confirmar direitinho" e nada depois). Em 14 dias, 29 conversas
     terminaram assim — 15 delas depois de uma fala da Samara, sem
     nenhuma sequência atrás.

     O CRITÉRIO É "SEM NADA AGENDADO", e não o texto da mensagem. Tentar
     adivinhar se a última fala tinha pergunta é chute; o que importa é
     se existe alguma coisa marcada para acontecer depois dela. Se existe,
     a conversa não morreu — ela está esperando. As pendentes vêm do
     FILA_CACHE, que é a fila inteira desta tela.

     FICA FORA quem já tem desfecho: descartada, arquivada e as listas de
     fim de linha. Cadência que terminou porque a lead sumiu também
     aparece aqui, e isso é de propósito — a diferença entre "a cadência
     acabou" e "a Samara parou no meio" é o que você vê no texto, não
     algo que a tela deva decidir sozinha. */
  const temFila=new Set((FILA_CACHE||[]).map(a=>a.cliente_id).filter(Boolean));
  const nossasIds=[];
  ultimaDe.forEach((m,id)=>{if(m.direcao!=='entrada'&&!temFila.has(id))nossasIds.push(id);});
  FILA_MUDAS=[];
  if(nossasIds.length){
    const{data:cliMudas}=await sb.from('crm_clientes')
      .select('id,nome_completo,telefone_principal,lista_id,veredito,samara_pausada')
      .in('id',nossasIds).is('arquivado_em',null).is('descartado_em',null).limit(1000);
    (cliMudas||[]).forEach(c=>{
      const m=ultimaDe.get(c.id);
      const min=Math.floor((Date.now()-new Date(m.criado_em).getTime())/60000);
      /* 2 HORAS, e não 15 minutos como a Sem resposta. Lá o relógio conta
         contra um robô que devia ter respondido; aqui a última palavra
         é nossa, e o normal é a cliente demorar para voltar. Antes de
         duas horas isto seria uma lista de conversas em andamento. */
      if(min<120)return;
      FILA_MUDAS.push({id:c.id,nome:c.nome_completo||'(sem nome)',
        fone:foneLegivel(c.telefone_principal),min:min,pausada:!!c.samara_pausada,
        lista:mapaListas[c.lista_id]||'',veredito:c.veredito||'',
        texto:String(m.previa||'').replace(/\s+/g,' ').slice(0,120)});
    });
    FILA_MUDAS.sort((a,b)=>b.min-a.min);
  }
  FILA_FREIOS={motor_ligado:'sim',samara_ligada:'sim'};
  (vars||[]).forEach(v=>{FILA_FREIOS[v.chave]=(v.valor_texto||'sim').toLowerCase();});
  FILA_SEL.clear();
  renderFila();
  filaMarcarVista();
}
