/* ABA RITMO — item 196, 25/08/2026.

   Existe para uma decisao so: quando baixar o intervalo entre sequencias.
   A trava do motor le `intervalo_sequencia_min` de crm_variaveis, entao o
   numero muda pela tela de variaveis sem publicar nada — mas so vale a
   pena mudar olhando o quanto a fila esta encostando no teto.

   A JANELA E O TETO. 9h-18h de segunda a sexta (9 horas) e 10h-14h no
   sabado (4 horas); domingo nao envia. Teto = horas da janela dividido
   pelo intervalo. A 5 min sao 108 num dia util; a 10 min seriam 54, que
   em 24/08 teria sido menos da metade do que a operacao mandou.

   CONTA NO BANCO, NAO EM MEMORIA. Sao consultas de contagem (head:true),
   uma por dia: nao trazem linha nenhuma para o navegador. Baixar os
   registros e contar aqui esbarraria no teto de 1.000 linhas do PostgREST
   assim que o volume crescer — e crescer e exatamente o que esta
   acontecendo. Tambem e o que segura o egress, que estourou a cota em
   25/08 por tela pedindo linha demais.

   RESSALVA DA COLUNA. crm_automacoes nao tem "vencida_em": as vencidas
   sao agrupadas por data_hora_agendada, ou seja, pelo dia em que a
   mensagem DEVERIA ter saido. Para esta leitura serve — a linha vence
   poucas horas depois — mas nao e a hora exata do vencimento. */
let FILA_RITMO=null;

function janelaHoras(d){ const w=d.getDay(); if(w===0) return 0; if(w===6) return 4; return 9; }

async function carregarRitmo(){
  const dias=[];
  for(let i=6;i>=0;i--){
    const d=new Date(); d.setHours(0,0,0,0); d.setDate(d.getDate()-i);
    const fim=new Date(d); fim.setDate(fim.getDate()+1);
    dias.push({d:d,ini:d.toISOString(),fim:fim.toISOString()});
  }
  try{
    const linhas=await Promise.all(dias.map(async x=>{
      const[env,ven]=await Promise.all([
        sb.from('crm_automacoes').select('id',{count:'exact',head:true})
          .eq('tipo_automacao','sequencia').eq('status','enviado')
          .gte('enviado_em',x.ini).lt('enviado_em',x.fim),
        sb.from('crm_automacoes').select('id',{count:'exact',head:true})
          .eq('tipo_automacao','sequencia').eq('status','vencida')
          .gte('data_hora_agendada',x.ini).lt('data_hora_agendada',x.fim)
      ]);
      return{d:x.d,enviadas:env.count||0,vencidas:ven.count||0};
    }));
    FILA_RITMO=linhas;
  }catch(e){ FILA_RITMO=[]; }
  if(FILA_ABA==='ritmo') renderFila();
}

async function ritmoTrocarIntervalo(v){
  const{error}=await sb.from('crm_variaveis').update({valor_texto:String(v)}).eq('chave','intervalo_sequencia_min');
  if(error){toast('Erro: '+error.message,'er');return;}
  FILA_FREIOS.intervalo_sequencia_min=String(v);
  toast(v===0?'Trava desligada. As sequências voltam a sair sem espaçamento.'
             :'Intervalo em '+v+' min. Vale na próxima rodada.', v===0?'er':'ok');
  renderFila();
}

function ritmoHTML(){
  const min=parseInt(String(FILA_FREIOS.intervalo_sequencia_min||'5').replace(/[^0-9]/g,''),10)||5;
  const opcoes=[0,3,5,7,10,15];
  const btns=opcoes.map(v=>{
    const on=(v===min);
    const rot=v===0?'desligado':v+' min';
    const teto=v===0?'sem teto':Math.floor(9*60/v)+'/dia';
    return '<button class="'+(on?'btn btnp':'btnd')+'" style="padding:7px 12px;font-size:12px" '+
      'onclick="ritmoTrocarIntervalo('+v+')">'+rot+'<div style="font-size:10px;opacity:.75;font-weight:400">'+teto+'</div></button>';
  }).join('');
  let h='<div class="filabox" style="margin-bottom:12px"><div class="filaboxl">Intervalo entre sequências</div>'+
    '<div style="display:flex;gap:8px;flex-wrap:wrap;margin:4px 0 10px">'+btns+'</div>'+
    '<div class="fhint">Vale na rodada seguinte — nada é publicado. O rodapé de cada botão é o teto de um dia útil (9h de janela ÷ intervalo); '+
    'no sábado a janela é de 4h e no domingo não sai nada.<br><br>'+
    '<b>Você não precisa vir aqui todo dia.</b> Quando o dia passar de '+
    (parseInt(String(FILA_FREIOS.ritmo_alerta_pct||'80').replace(/[^0-9]/g,''),10)||80)+
    '% do teto, ou qualquer sequência vencer, o motor te manda um aviso no WhatsApp — uma vez por dia. '+
    'Esta tela é para decidir depois do aviso, não para vigiar.<br><br>'+
    'Ele avisa e não mexe sozinho de propósito: baixar o intervalo é afrouxar a proteção contra banimento do número, '+
    'e essa decisão é sua. Se um dia nem o menor intervalo couber, o caminho deixa de ser esse número — é ampliar a janela ou o número oficial da API.</div></div>';
  if(!FILA_RITMO) return h+'<div class="emp">Contando...</div>';
  if(!FILA_RITMO.length) return h+'<div class="emp"><div class="empt">Não consegui contar</div><div class="emps">Tente atualizar a tela.</div></div>';
  h+='<table class="tbl"><thead><tr><th>Dia</th><th>Enviadas</th><th>Teto</th><th>Uso</th><th>Venceram</th></tr></thead><tbody>';
  FILA_RITMO.forEach(r=>{
    const horas=janelaHoras(r.d);
    const teto=Math.floor(horas*60/min);
    const pct=teto>0?Math.round(r.enviadas*100/teto):0;
    const cor=teto===0?'':(pct>=90?'red':(pct>=70?'yellow':'green'));
    const dia=r.d.toLocaleDateString('pt-BR',{weekday:'short',day:'2-digit',month:'2-digit'});
    h+='<tr><td>'+esc(dia)+'</td><td><b>'+r.enviadas+'</b></td><td>'+(teto||'—')+'</td>'+
       '<td>'+(teto?'<span class="filapill '+cor+'">'+pct+'%</span>':'—')+'</td>'+
       '<td>'+(r.vencidas?'<span class="filapill red">'+r.vencidas+'</span>':'0')+'</td></tr>';
  });
  h+='</tbody></table>';
  return h;
}

function renderFila(){
  const pc=$('pc');
  /* AS QUATRO ABAS DE SEMPRE PASSAM A EXCLUIR REATIVACAO. Elas nao
     somem: vao todas para a aba Reativações, com qualquer status. Se
     ficassem nos dois lugares, a soma das abas deixaria de bater com a
     fila e nao daria para saber se algo foi tratado duas vezes. */
  const funil=FILA_CACHE.filter(a=>!ehReativacao(a));
  const reativ=FILA_CACHE.filter(ehReativacao);
  const aprovar=funil.filter(a=>a.status==='aguardando_aprovacao');
  const agendadas=funil.filter(a=>a.status==='agendado'||a.status==='pausado');
  const comErro=funil.filter(a=>a.status==='erro');
  const vencidas=funil.filter(a=>a.status==='vencida');

  const aba=(id,rot,n,destaque)=>`<button class="filatab ${FILA_ABA===id?'on':''}" onclick="FILA_ABA='${id}';renderFila()">${rot}${n?`<span class="filatab-n ${destaque?'alerta':''}">${n}</span>`:''}</button>`;

  let h='<div class="pgh"><div><div class="pgt">Fila de automações</div><div class="pgs">Tudo que a Samara programou para enviar</div></div>';
  h+=`<button class="btn btns" onclick="pageFila()">↻ Atualizar</button></div>`;

  h+=`<div style="display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px">`+
     freioBotao('samara_ligada','Samara (IA)','Respondendo','Parada',
       'Para de responder. As sequências de texto fixo continuam saindo.')+
     freioBotao('motor_ligado','Motor de envio','Enviando','Parado',
       'Para tudo. Nenhuma mensagem sai — nem da Samara, nem sequência.')+
     `</div>`;

  h+='<div class="filatabs">'+
     aba('semresp','Sem resposta',FILA_SEMRESP.length,FILA_SEMRESP.length>0)+
     aba('mudas','Paradas',FILA_MUDAS.length,FILA_MUDAS.length>0)+
     aba('aprovar','Aprovar',aprovar.length,true)+
     aba('agendadas','Agendadas',agendadas.length,false)+
     aba('vencidas','Vencidas',vencidas.length,vencidas.length>0)+
     aba('erro','Com erro',comErro.length,comErro.length>0)+
     aba('reativ','Reativações',reativ.length,false)+
     aba('ritmo','Ritmo',0,false)+
     '</div>';

  // A aba Ritmo tambem nao lista automacoes: ela conta as que JA sairam.
  // Sai antes dos filtros pelo mesmo motivo que a Sem resposta.
  if(FILA_ABA==='ritmo'){ h+=ritmoHTML(); pc.innerHTML=h; if(!FILA_RITMO) carregarRitmo(); return; }

  /* A aba Paradas, como a Sem resposta, lista PESSOAS e não linhas de
     fila — sai antes dos filtros pelo mesmo motivo. */
  if(FILA_ABA==='mudas'){
    if(!FILA_MUDAS.length){
      h+='<div class="emp"><div class="empt">Nenhuma conversa parada</div>'+
         '<div class="emps">Toda conversa dos últimos 3 dias tem alguma coisa agendada atrás dela.</div></div>';
    }else{
      h+='<div class="filabox" style="margin-bottom:12px"><div class="filaboxl">O que é esta lista</div>'+
         '<div class="fhint"><b>A última mensagem foi nossa e não sobrou nada agendado.</b> Não há erro, não há linha travada, '+
         'a fila está limpa — e por isso mesmo estas conversas não apareciam em tela nenhuma. A Samara só volta a falar quando a cliente escreve, '+
         'então enquanto ela não escrever, ninguém volta.<br><br>'+
         'Aparece a partir de <b>2h</b> de silêncio (a Sem resposta usa 15 min, porque lá quem devia responder era o robô). '+
         'Sai daqui sozinho assim que a cliente escrever ou assim que qualquer sequência for agendada para ela.<br><br>'+
         'Leia o texto da última mensagem: se ela termina numa pergunta, a cliente é que sumiu. Se termina em '+
         '"anotei aqui" ou "já te retorno", a Samara parou no meio e a conversa precisa de você.</div></div>';
      h+=cartoesMudas(FILA_MUDAS);
    }
    pc.innerHTML=h;
    return;

  // A aba Sem resposta sai antes do resto: ela nao lista automacoes, ela
  // lista PESSOAS esperando. Os filtros e o agrupamento por dia abaixo
  // sao todos escritos para linha de fila e nao servem aqui.
  if(FILA_ABA==='semresp'){
    const trav=FILA_SEMRESP.filter(c=>!c.pausada);
    const maos=FILA_SEMRESP.filter(c=>c.pausada);
    if(!FILA_SEMRESP.length){
      h+='<div class="emp"><div class="empt">Ninguém esperando resposta</div>'+
         '<div class="emps">Toda conversa dos últimos 3 dias teve resposta.</div></div>';
    }else{
      h+='<div class="filabox" style="margin-bottom:12px"><div class="filaboxl">O que é esta lista</div>'+
         '<div class="fhint">A última mensagem da conversa é da cliente e ninguém respondeu. '+
         'Sai daqui sozinho assim que qualquer mensagem for enviada para ela — pela Samara, por você ou pela Naiarha.<br><br>'+
         '<b>A Samara travou:</b> aparece com 15 min. É falha de sistema, e o alerta do WhatsApp cobra você por ela.<br>'+
         '<b>Assumidas na mão:</b> aparece com 4h. A Samara está pausada nessas, então <u>nenhum robô vai responder</u> — ou você responde, ou devolve para a Samara. Não entram no alerta do WhatsApp para não virar ruído.</div></div>';
      const bloco=(titulo,arr,vazio)=>{
        let x='<div class="filaboxl" style="margin:16px 0 8px">'+titulo+' ('+arr.length+')</div>';
        if(!arr.length)return x+'<div class="fhint" style="margin-bottom:8px">'+vazio+'</div>';
        return x+cartoesSemResp(arr);
      };
      h+=bloco('🔴 A Samara travou',trav,'Nenhuma. Tudo que era da Samara foi respondido.');
      h+=bloco('🟡 Assumidas na mão, paradas há mais de 4h',maos,'Nenhuma parada.');
    }
    pc.innerHTML=h;
    return;
  }


  /* ABA REATIVAÇÕES. Mostra TODOS os status de uma vez, ao contrario das
     outras quatro. O que se pergunta aqui nao e "o que precisa de
     aprovação" — e "como esta indo o disparo da base do Trello", e essa
     resposta e a lista inteira: o que ja saiu esperando, o que venceu e
     o que falhou, junto. O status de cada linha continua aparecendo na
     etiqueta do proprio cartão. */
  const lista=FILA_ABA==='reativ'?reativ
    :(FILA_ABA==='aprovar'?aprovar:(FILA_ABA==='erro'?comErro:(FILA_ABA==='vencidas'?vencidas:agendadas)));

  if(FILA_ABA==='reativ'){
    h+='<div class="filabox" style="margin-bottom:12px"><div class="filaboxl">O que é esta aba</div>'+
       '<div class="fhint">Só as sequências de <b>reativação</b> — o resgate da base parada que veio do Trello. '+
       'Elas <u>não aparecem mais</u> nas abas Aprovar, Agendadas, Vencidas e Com erro: são disparo em massa sobre base fria, '+
       'não a esteira de quem está em atendimento, e misturadas faziam o número daquelas abas deixar de significar trabalho seu.<br><br>'+
       'Aqui aparecem <b>todos os status juntos</b> (agendada, vencida, com erro, esperando aprovação) — a etiqueta de cada linha diz qual é. '+
       'O ritmo do disparo continua sendo o da aba Ritmo, que é o mesmo para tudo que sai pelo número.</div></div>';
  }

  /* O reenvio em lote vale nas duas abas que mostram vencida: a Vencidas
     do funil e a de Reativações. A conta de quantas ha e feita sobre a
     aba aberta, senao "selecionar todas" na Reativações contaria as
     vencidas do funil, que nem estao na tela. */
  const vencidasDaAba=(FILA_ABA==='reativ'?reativ.filter(a=>a.status==='vencida'):vencidas);
  if((FILA_ABA==='vencidas'||FILA_ABA==='reativ')&&vencidasDaAba.length){
    const n=FILA_SEL.size;
    const min=Math.max(0,Math.round((n-1)*2));
    h+=`<div class="filabox" style="display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:12px">
      <div style="flex:1;min-width:190px">
        <div class="filaboxl">Reenvio em lote</div>
        <div class="fhint">Elas voltam para a fila e saem no ritmo normal, com ~2 min entre clientes.${n?` As ${n} selecionadas levam cerca de ${min} min para escoar.`:''}</div>
      </div>
      <button class="btn btns" style="padding:8px 14px;font-size:12px" onclick="filaSelTodas()">${n===vencidasDaAba.length?'Desmarcar todas':'Selecionar todas'}</button>
      <button class="btn btnp" style="padding:8px 14px;font-size:12px" ${n?'':'disabled'} onclick="filaEnviarSelecionadas()">Enviar selecionadas (${n})</button>
    </div>`;
  }

  h+=filtrosFilaHtml(lista);
  h+=`<div class="filaagr">
        <button class="${FILA_AGRUP==='seq'?'on':''}" onclick="FILA_AGRUP='seq';renderFila()">Por sequência</button>
        <button class="${FILA_AGRUP==='dia'?'on':''}" onclick="FILA_AGRUP='dia';renderFila()">Por dia</button>
        ${FILA_AGRUP==='seq'?`<button style="margin-left:auto" onclick="seqTodas(true)">Recolher todas</button>
        <button onclick="seqTodas(false)">Abrir todas</button>`:''}
      </div>`;
  const filtrada=filtrarFila(lista);

  if(lista.length===0){
    const vazio={aprovar:'Nada esperando aprovação',agendadas:'Nenhum envio agendado',vencidas:'Nada vencido',erro:'Nenhuma falha de envio',reativ:'Nenhuma reativação na fila'}[FILA_ABA];
    h+=`<div class="emp"><div class="empt">${vazio}</div></div>`;
  }else if(filtrada.length===0){
    h+=`<div class="emp"><div class="empt">Nada com esses filtros</div>
        <div class="emps">Existem ${lista.length} nesta aba — só não batem com o que você filtrou.</div></div>`;
  }else{
    h+=(FILA_AGRUP==='seq'?agruparPorSequencia(filtrada):agruparPorDia(filtrada));
  }
  pc.innerHTML=h;
}

/* A barra de filtros. Os três recortes que a operação pede: QUANDO sai,
   DE ONDE veio e DE QUEM é. */
function filtrosFilaHtml(lista){
  const op=(v,r,sel)=>`<option value="${v}" ${sel===v?'selected':''}>${r}</option>`;
  return`<div class="filafiltros">
    <select onchange="FILA_F.periodo=this.value;renderFila()">
      ${op('todos','Todos os dias',FILA_F.periodo)}
      ${op('atrasadas','Atrasadas',FILA_F.periodo)}
      ${op('hoje','Hoje',FILA_F.periodo)}
      ${op('amanha','Amanhã',FILA_F.periodo)}
      ${op('7dias','Próximos 7 dias',FILA_F.periodo)}
    </select>
    <select onchange="FILA_F.origem=this.value;renderFila()">
      ${op('todas','Toda origem',FILA_F.origem)}
      ${op('samara','Samara',FILA_F.origem)}
      ${op('sequencia','Sequência',FILA_F.origem)}
      ${op('aviso_esdras','Aviso para você',FILA_F.origem)}
      ${op('abertura','Abertura',FILA_F.origem)}
    </select>
    ${(()=>{
      /* Filtro por sequencia. So aparece quando ha mais de uma na aba:
         com uma so, o select seria um botao que nao faz nada.

         AS OPCOES SAEM DA LISTA, nao de FILA_SEQ inteiro. FILA_SEQ tem
         toda sequencia cadastrada, inclusive as que nao tem nada
         agendado; oferecer todas faria o usuario filtrar por uma e
         receber tela vazia sem entender por que. */
      const ids=[...new Set(lista.map(a=>a.sequencia_id).filter(Boolean))];
      if(ids.length<2 && FILA_F.sequencia==='todas') return '';
      const nomeDe=id=>((FILA_SEQ[id]||{}).nome)||((FILA_SEQ[id]||{}).codigo)||'Sequência';
      ids.sort((x,y)=>nomeDe(x).localeCompare(nomeDe(y),'pt-BR'));
      return `<select onchange="FILA_F.sequencia=this.value;renderFila()">
        ${op('todas','Toda sequência',FILA_F.sequencia)}
        ${ids.map(id=>op(id,esc(nomeDe(id)),FILA_F.sequencia)).join('')}
      </select>`;
    })()}
    <input type="text" placeholder="Buscar cliente..." value="${escA(FILA_F.busca)}"
      oninput="FILA_F.busca=this.value;clearTimeout(window._fbt);window._fbt=setTimeout(renderFila,250)"/>
    ${(FILA_F.periodo!=='todos'||FILA_F.origem!=='todas'||FILA_F.sequencia!=='todas'||FILA_F.busca)
      ?`<button class="btn btns" style="padding:7px 12px;font-size:12px" onclick="FILA_F={periodo:'todos',origem:'todas',sequencia:'todas',busca:''};renderFila()">Limpar</button>`
      :''}
    <div class="fhint" style="margin-left:auto">${lista.length} nesta aba</div>
  </div>`;
}

/* Meia-noite local de uma data — a fronteira do dia. Tudo aqui é
   comparado em dia de calendário, não em 24 horas corridas: "amanhã" é
   o dia amanhã, não daqui a um dia. */
function inicioDoDia(d){const x=new Date(d);x.setHours(0,0,0,0);return x;}

function filtrarFila(lista){
  const hoje=inicioDoDia(new Date()).getTime();
  const dia=86400000;
  const busca=(FILA_F.busca||'').trim().toLowerCase();

  return lista.filter(a=>{
    if(FILA_F.origem!=='todas'&&(a.tipo_automacao||'')!==FILA_F.origem)return false;

    /* Sequencia. Item sem sequencia_id (Samara, aviso, abertura) sai
       fora quando o filtro esta ligado: perguntar "so a reativacao" e
       receber resposta da Samara junto seria ignorar a pergunta. */
    if(FILA_F.sequencia!=='todas'&&(a.sequencia_id||'')!==FILA_F.sequencia)return false;

    if(busca){
      const c=a.crm_clientes||{};
      const alvo=((c.nome_completo||'')+' '+(c.telefone_principal||'')).toLowerCase();
      if(!alvo.includes(busca))return false;
    }

    if(FILA_F.periodo!=='todos'){
      if(!a.data_hora_agendada)return false;
      const d=inicioDoDia(new Date(a.data_hora_agendada)).getTime();
      if(FILA_F.periodo==='atrasadas'&&!(new Date(a.data_hora_agendada)<new Date()))return false;
      if(FILA_F.periodo==='hoje'&&d!==hoje)return false;
      if(FILA_F.periodo==='amanha'&&d!==hoje+dia)return false;
      if(FILA_F.periodo==='7dias'&&(d<hoje||d>hoje+7*dia))return false;
    }
    return true;
  });
}

/* O rótulo do dia. Hoje e Amanhã por nome, o resto por data com o dia
   da semana — "ter, 18/08" diz mais que "18/08" quando se está
   decidindo o que vai sair antes do fim de semana. */
function rotuloDoDia(ts){
  const hoje=inicioDoDia(new Date()).getTime();
  const d=inicioDoDia(new Date(ts)).getTime();
  const dia=86400000;
  if(d===hoje)return{txt:'Hoje',cls:'hoje'};
  if(d===hoje+dia)return{txt:'Amanhã',cls:''};
  if(d===hoje-dia)return{txt:'Ontem',cls:'atrasado'};
  const f=new Date(ts).toLocaleDateString('pt-BR',{weekday:'short',day:'2-digit',month:'2-digit'});
  return{txt:f.replace('.',''),cls:d<hoje?'atrasado':''};
}

/* A COR DE CADA ETAPA DO FUNIL. Escolhida por etapa e nao por sequencia
   porque sao 7 contra 26: a partir de uma duzia de cores ninguem
   distingue mais nada e elas param de informar. Sequencia sem etapa cai
   no cinza, que e o certo — nao ha funil para representar. */
const CORES_ETAPA={1:['var(--purple)','var(--purple-bg)'],2:['var(--green)','var(--green-bg)'],
  3:['var(--yellow)','var(--yellow-bg)'],4:['var(--teal)','var(--teal-l)'],
  5:['var(--rose)','var(--rose-l)'],6:['var(--teal2)','var(--teal-l)'],
  7:['var(--red)','var(--red-bg)']};
function corDaEtapa(e){return CORES_ETAPA[e]||['var(--gray)','var(--gray-bg)'];}

/* AGRUPA PELO QUE A PESSOA E, NAO POR QUANDO SAI.
   Agrupar so por dia embolava as 26 sequencias na mesma pilha: para
   saber quantas estao esperando documentacao era preciso ler cartao por
   cartao. Aqui cada sequencia vira um bloco com a regua de passos, e a
   regua mostra ONDE a fila empilhou — hoje 14 das 15 de triagem estao no
   passo 3, que e o que se despede e descarta a lead. Isso e invisivel
   numa lista ordenada por data. */
function agruparPorSequencia(lista){
  const grupos=new Map();
  lista.forEach(a=>{
    const chave=a.sequencia_id||('t:'+a.tipo_automacao);
    if(!grupos.has(chave))grupos.set(chave,[]);
    grupos.get(chave).push(a);
  });
  const rotuloSolto={samara:'Samara (IA)',abertura:'Abertura',aviso_esdras:'Aviso para você',
    aviso_indicacao:'Aviso de indicação'};
  const blocos=[...grupos.entries()].map(([chave,itens])=>{
    const seq=FILA_SEQ[chave];
    const etapa=seq?seq.etapa:null;
    return{chave:chave,itens:itens,etapa:etapa,
      nome:seq?(seq.nome||seq.codigo):(rotuloSolto[String(chave).slice(2)]||'Outros')};
  });
  // Ordena pelo funil: etapa 1 primeiro. O que nao tem etapa (Samara,
  // abertura, avisos) vai para o fim — nao e sequencia e nao compete
  // pela atencao com o funil.
  blocos.sort((a,b)=>(a.etapa||99)-(b.etapa||99)||a.nome.localeCompare(b.nome));

  FILA_GRUPOS=blocos.map(g=>g.chave);
  let h='';
  blocos.forEach(g=>{
    const[cor,bg]=corDaEtapa(g.etapa);
    const porOrdem={};
    g.itens.forEach(a=>{
      const cad=FILA_CAD[a.cadencia_id];
      const p=cad?cad.ordem:a.ordem;
      if(p)porOrdem[p]=(porOrdem[p]||0)+1;
    });
    const ordens=FILA_ORDENS[g.chave]||[];
    let regua='';
    if(ordens.length>1){
      regua='<div class="seqgp">'+ordens.map(o=>{
        const n=porOrdem[o]||0;
        return`<span class="seqgpi ${n?'tem':''}">p${o} · ${n}</span>`;
      }).join('')+'</div>';
    }
    // Quantas deste grupo perderam o contexto. Vale a pena no cabecalho
    // porque e o motivo de abrir o bloco: se nenhuma perdeu, nao ha o
    // que revisar aqui.
    const venc=g.itens.filter(contextoVencido).length;
    const fech=seqFechada(g.chave);
    /* A REGUA E O AVISO FICAM VISIVEIS COM O BLOCO FECHADO — de
       proposito. Fechado é a visão geral: se sumisse o "14 no passo 3" e
       o "3 com o contexto vencido", recolher esconderia justamente o que
       diz se vale a pena abrir, e a tela voltaria a ser uma lista de
       nomes de sequência. */
    h+=`<div class="seqg ${fech?'fech':''}" style="--sc:${cor};--sbg:${bg}">
          <div class="seqgt" onclick="seqAlternar('${esc(g.chave)}')">
          <span class="seqgc">▼</span>
          <span class="seqgn">${esc(g.nome)}</span>
          <span class="seqge">${g.itens.length}${g.etapa?' · etapa '+g.etapa:''}</span></div>
          ${regua}
          ${venc?`<div class="seqvenc">${venc} com o contexto vencido</div>`:''}
        </div>`;
    h+=`<div class="seqbody ${fech?'fech':''}">`+
       g.itens.slice().sort((a,b)=>new Date(a.data_hora_agendada||0)-new Date(b.data_hora_agendada||0))
        .map(cardFila).join('')+`</div>`;
  });
  return h;
}

/* A CLIENTE FALOU DEPOIS QUE ISTO FOI PROGRAMADO.
   A sequencia e montada num momento e sai noutro. Se ela escreveu no
   meio, o texto agendado responde a uma conversa que ja andou — e o
   pedido de documento que ela ja mandou sai assim mesmo.
   So vale para sequencia: a mensagem da Samara nasce JUNTO com a fala da
   cliente, entao "responder depois" ali e o funcionamento normal.
   Fora dos 3 dias que a tela carrega nao ha dado, e sem dado nao se
   inventa aviso. */
function contextoVencido(a){
  if(a.tipo_automacao!=='sequencia')return false;
  const m=FILA_ULTIMA.get(a.cliente_id);
  if(!m||m.direcao!=='entrada')return false;
  return new Date(m.criado_em)>new Date(a.criado_em);
}

function agruparPorDia(lista){
  const grupos=new Map();       // Map preserva a ordem de inserção
  const semData=[];

  lista.forEach(a=>{
    if(!a.data_hora_agendada){semData.push(a);return;}
    const chave=inicioDoDia(new Date(a.data_hora_agendada)).getTime();
    if(!grupos.has(chave))grupos.set(chave,[]);
    grupos.get(chave).push(a);
  });

  let h='';
  [...grupos.keys()].sort((a,b)=>a-b).forEach(k=>{
    const r=rotuloDoDia(k);
    const itens=grupos.get(k);
    h+=`<div class="filadia">
          <div class="filadiat ${r.cls}">${r.txt}</div>
          <div class="filadian">${itens.length}</div>
          <div class="filadiln"></div>
        </div>`;
    h+=itens.map(cardFila).join('');
  });

  if(semData.length){
    h+=`<div class="filadia"><div class="filadiat">Sem data</div>
        <div class="filadian">${semData.length}</div><div class="filadiln"></div></div>`;
    h+=semData.map(cardFila).join('');
  }
  return h;
}

function filaSelTodas(){
  /* Respeita o filtro: "selecionar todas" tem que significar as que
     estão na tela. Marcar em silêncio o que está escondido é reenviar
     mensagem sem ver para quem. */
  /* E respeita a ABA: na Reativações so as reativacoes estao na tela, na
     Vencidas so as do funil. Marcar o que a aba nao mostra e reenviar
     mensagem sem ver para quem — o mesmo motivo do filtro acima. */
  const v=filtrarFila(FILA_CACHE.filter(a=>a.status==='vencida'&&(FILA_ABA==='reativ'?ehReativacao(a):!ehReativacao(a))));
  if(FILA_SEL.size===v.length)FILA_SEL.clear();
  else v.forEach(a=>FILA_SEL.add(a.id));
  renderFila();
}

/* ENVIAR AGORA — 24/08/2026.

   Antes este botao so devolvia a linha para a fila com data de agora.
   So que a fila anda a uma mensagem por minuto (ainda sem trava de
   intervalo) e a validade de uma samara e de 15 minutos: a mensagem
   que voce acabou de liberar podia vencer OUTRA VEZ antes de o motor
   alcancar ela. Foi o que aconteceu com a Bianca em 22/08 — aprovada
   as 10:43, morta por atraso de 57 min, e a despedida so saiu as 13:15
   por uma segunda linha que a Samara escreveu do zero.

   Agora o clique pede a entrega direto ao motor, que envia na hora e
   sem passar de novo pela validade — quem clicou aqui ja sabe que
   esta atrasada e decidiu mandar assim mesmo.

   AQUI FALHA E ERRO DE VERDADE, diferente do botao Enviar do chat.
   La, se a chamada nao completa, a linha continua em pendente_envio e
   o motor entrega na rodada seguinte, entao "na fila" e verdade. Uma
   linha vencida nao e recolhida por rodada nenhuma — o motor so pega
   status 'agendado'. Se a chamada nao completar, nada sai depois, e
   dizer que esta na fila seria mentira.

   O botao de LOTE (filaConfirmarLote) continua devolvendo para a fila,
   de proposito: N entregas imediatas em sequencia sairiam em segundos
   uma da outra e derrubam o numero nao oficial. Uma mensagem sozinha
   nao derruba; vinte derrubam. */
async function filaEnviarAgora(id){
  const r=await enviarVencidaPeloMotor(id);
  if(r&&r.ok)toast('Enviada','ok');
  else if(r&&r.situacao==='espere')toast(r.motivo,'in');
  else if(r&&r.situacao==='nao_vencida')toast('Essa mensagem já não estava esperando — pode ser que já tenha saído.','in');
  else toast('Não saiu: '+((r&&r.motivo)||'o motor não respondeu')+'. A mensagem continua aqui.','er');
  await filaRecarregar();
}

    motivo_cancelamento:null,
    data_hora_agendada:new Date().toISOString()
  }).in('id',ids);
  if(error){toast('Erro: '+error.message,'er');return;}
  toast(ids.length+' de volta para a fila','ok');
  FILA_SEL.clear();
  await pageFila();
}

/* DESTRAVAR: as tres coisas de uma vez, de proposito.
   Na hora do aperto ninguem quer escolher entre tres alavancas — e o
   diagnostico de QUAL delas travou custa mais caro do que aplicar as
   tres. Cancelar sequencia pendente tambem e seguro: se a lead seguir
   sem responder, o motor reagenda pelo fluxo normal. */
/* O cartão da aba Paradas. Irmão do cartoesSemResp, com duas colunas a
   mais — a lista e o veredito — porque aqui a pergunta não é "quem está
   esperando", é "onde essa conversa parou". Um card em Lead novo sem
   veredito parou na triagem; um TEM_DIREITO em Aguardando documentos
   parou na documentação, e são coisas diferentes de retomar. */
function cartoesMudas(arr){
  return arr.map(c=>{
    const horas=c.min>=60?Math.floor(c.min/60)+'h'+String(c.min%60).padStart(2,'0'):c.min+' min';
    const etq=[c.lista?'<span class="filapill">'+esc(c.lista)+'</span>':'',
               c.veredito?'<span class="filapill yellow">'+esc(c.veredito)+'</span>':'',
               c.pausada?'<span class="filapill yellow">Samara pausada</span>':''].join('');
    return`<div class="filacard">
      <div class="filahead">
        <div style="flex:1;min-width:0">
          <div style="font-weight:700">${esc(c.nome)}</div>
          <div class="fhint">${foneLink(c.fone)} · calada há ${horas}</div>
        </div>
        ${etq}
      </div>
      <p class="filabalao fhint">Última mensagem (nossa): ${esc(c.texto)}</p>
      <div class="brow" style="margin-top:8px;gap:8px">
        <button class="btn btns" style="padding:8px 15px;font-size:12px" onclick="abrirCardCliente('${c.id}')">Abrir cartão →</button>
      </div>
    </div>`;
  }).join('');
}

function cartoesSemResp(arr){
  return arr.map(c=>{
    const horas=c.min>=60?Math.floor(c.min/60)+'h'+String(c.min%60).padStart(2,'0'):c.min+' min';
    const pill=c.pausada
      ?'<span class="filapill yellow">Você ou a Naiarha</span>'
      :'<span class="filapill red">Samara travou</span>';
    /* Em conversa pausada, despausar E a solucao — destravar sem devolver
       para a Samara deixaria a mulher esperando do mesmo jeito. Por isso
       o mesmo botao muda de nome conforme o grupo. */
    const rot=c.pausada?'↩️ Devolver para a Samara':'🔓 Destravar e responder';
    return `<div class="filacard">
      <div class="filahead">
        <div style="min-width:0">
          <div class="filanome">${esc(c.nome)}</div>
          <div class="filameta">${foneLink(c.fone)}${c.lista?' · '+esc(c.lista):''} · esperando há ${horas}</div>
        </div>
        ${pill}
      </div>
      <div class="filaboxl" style="margin:10px 0 5px">Última mensagem dela</div>

      <div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:10px">
        <button class="btn btnp" style="padding:8px 15px;font-size:12px" onclick="destravarConversa('${c.id}')">${rot}</button>
        <button class="btn btns" style="padding:8px 15px;font-size:12px" onclick="abrirCardCliente('${c.id}')">Abrir cartão →</button>
        <button class="btn btns" style="padding:8px 15px;font-size:12px;margin-left:auto" onclick="dispensarAlerta('${c.id}')">Cancelar alerta</button>
      </div>
    </div>`;
  }).join('');

/* CANCELAR ALERTA: tira da lista sem mandar mensagem nenhuma.
   Para o caso de eu ter posto ali coisa que nao e problema — conversa que
   ja acabou, mae que so mandou um emoji de agradecimento, teste seu.
   A dispensa vale para AQUELA MENSAGEM, nao para a pessoa: se ela
   escrever de novo, volta para a lista. Silenciar alguem para sempre e
   como o alerta some sem ninguem perceber, que e o problema original. */
async function dispensarAlerta(clienteId){
  if(!confirm('Tirar esta conversa da lista?\n\nNenhuma mensagem é enviada. Se a cliente escrever de novo, ela volta a aparecer.'))return;
  const{error}=await sb.from('crm_clientes')
    .update({alerta_ignorado_em:new Date().toISOString()}).eq('id',clienteId);
  if(error){toast('Erro: '+error.message,'er');return;}
  toast('Tirada da lista.','ok');
  await pageFila();
}

async function destravarConversa(clienteId){
  if(!confirm('Destravar esta conversa?\n\n• cancela sequência pendente que esteja bloqueando\n• religa a Samara nesta conversa\n• manda ela responder ignorando a janela de 30 min'))return;
  const{error:e1}=await sb.from('crm_automacoes')
    .update({status:'cancelado',motivo_cancelamento:'Cancelado pelo botão Destravar conversa.'})
    .eq('cliente_id',clienteId).eq('tipo_automacao','sequencia')
    .in('status',['agendado','aguardando_aprovacao']);
  if(e1){toast('Erro: '+e1.message,'er');return;}
  const{error:e2}=await sb.from('crm_clientes')
    .update({samara_pausada:false,samara_deve_continuar:true,
             samara_continuar_motivo:'destravado na mão',
             alerta_sem_resposta_em:null})
    .eq('id',clienteId);
  if(e2){toast('Erro: '+e2.message,'er');return;}
  toast('Destravada. A Samara responde na próxima rodada.','ok');
  await pageFila();
}

/* Um so lugar monta o link do WhatsApp, usado pela aba Sem resposta e
   pelos cartoes das outras abas. Numero invalido volta como texto
   simples em vez de virar link quebrado. */
function foneLink(bruto){
  const so=String(bruto||'').replace(/\D/g,'');
  if(so.length<10)return esc(bruto||'');
  return`<a href="https://wa.me/${so}" target="_blank" rel="noopener" onclick="event.stopPropagation()" style="color:inherit">${esc(bruto)}</a>`;
}

function motivoDaTrava(a){
  const f=a.flags||'';
  if(f.includes('[DESCARTAR_LEAD]'))return{txt:'Descartar lead',cor:'red'};
  if(f.includes('[ESCALAR_ESDRAS]'))return{txt:'Escalar Esdras',cor:'yellow'};
  return{txt:'Afirma direito',cor:'green'};
}

function cardFila(a){
  const c=a.crm_clientes||{};
  const nome=c.nome_completo||'(sem nome)';
  const quando=a.data_hora_agendada?tempoRel(a.data_hora_agendada):'';
  let origem=a.tipo_automacao==='samara'?'Samara':(a.tipo_automacao==='abertura'?'Abertura':(a.tipo_automacao==='aviso_esdras'?'Aviso para você':'Sequência'));

  // QUAL SEQUENCIA E QUAL PASSO. Antes o cartao dizia so "Sequência", e
  // aprovar as de cobranca era decidir no escuro: as tres tentativas da
  // triagem1 dizem coisas diferentes, e a terceira DESPEDE e descarta a
  // lead. Aprovar um passo 3 achando que era um passo 1 e perder a lead
  // com o proprio clique.
  //
  // O braco so aparece quando a sequencia esta em teste A/B. Passo com um
  // texto so nao tem braco para mostrar, e escrever "braço A" ali daria a
  // entender que existe um B em algum lugar.
  if(a.tipo_automacao==='sequencia'){
    const seq=FILA_SEQ[a.sequencia_id];
    const cad=FILA_CAD[a.cadencia_id];
    const nomeSeq=seq?(seq.nome||seq.codigo):'Sequência';
    const passo=cad?cad.ordem:a.ordem;
    const total=FILA_NPASSOS[a.sequencia_id];
    let rot=esc(nomeSeq);
    if(passo)rot+=' · passo '+passo+(total?' de '+total:'');
    if(cad&&cad.braco&&(FILA_BRACOS[a.sequencia_id+'|'+passo]||0)>1)rot+=' · braço '+esc(cad.braco);
    origem=rot;
  }

  let etiqueta='';
  if(a.status==='aguardando_aprovacao'){
    const m=motivoDaTrava(a);
    etiqueta=`<span class="filapill ${m.cor}">${m.txt}</span>`;
  }else if(a.status==='pausado'){
    etiqueta='<span class="filapill yellow">Pausada</span>';
  }else if(a.status==='erro'){
    etiqueta='<span class="filapill red">Falhou</span>';
  }else if(a.status==='vencida'){
    etiqueta='<span class="filapill yellow">Venceu</span>';
  }

  // O contexto vencido nao e um erro da automacao: ela esta certa, o
  // mundo e que mudou. Por isso e etiqueta amarela e nao vermelha — e
  // uma decisao sua, nao uma falha a consertar.
  if(contextoVencido(a))etiqueta+='<span class="filapill yellow">Ela falou depois</span>';

  const baloes=(a.texto_montado||'').split(' / ').map(b=>b.trim()).filter(Boolean);
  const corpo=baloes.length?baloes.map(b=>`<p class="filabalao">${esc(b)}</p>`).join(''):'<p class="filabalao fhint">(sem texto)</p>';

  let extra='';
  if(a.status==='vencida'){
    extra=`<div class="filabox"><div class="filaboxl">Por que não saiu sozinha</div><div style="font-size:13px">${esc(a.motivo_cancelamento||'Passou do prazo de validade.')}</div><div class="fhint" style="margin-top:4px">Nada foi perdido. Você decide se ainda faz sentido enviar.</div></div>`;
  }else if(a.status==='erro'&&a.erro){
    extra=`<div class="filabox"><div class="filaboxl">O que deu errado</div><div style="font-size:13px;color:var(--red)">${esc(a.erro)}</div>${a.tentativas?`<div class="fhint" style="margin-top:4px">${a.tentativas} tentativa(s)</div>`:''}</div>`;
  }else if(a.status==='aguardando_aprovacao'){
    const d=c.samara_dados||{};
    const chaves=Object.keys(d);
    if(chaves.length){
      extra=`<div class="filabox"><div class="filaboxl">O que a Samara já coletou</div>`+
        chaves.map(k=>`<div style="font-size:13px">${esc(k)}: <b>${esc(String(d[k]))}</b></div>`).join('')+`</div>`;
    }
  }

  // Aviso nao e mensagem para cliente nenhuma: e trabalho esperando por
  // voce. "Aprovar e enviar" num aviso e mentira — nada e enviado, o
  // clique so da ciencia e tira o item da fila. Editar e cancelar
  // tambem nao fazem sentido aqui.
  const ehAviso=a.tipo_automacao==='aviso_esdras';

  let acoes='';
  if(a.status==='aguardando_aprovacao'&&ehAviso){
    acoes=`<button class="btn btnp" style="padding:8px 15px;font-size:12px" onclick="filaAprovar('${a.id}')">✓ Ciente, é comigo</button>`;
  }else if(a.status==='aguardando_aprovacao'){
    acoes=`<button class="btn btnp" style="padding:8px 15px;font-size:12px" onclick="filaAprovar('${a.id}')">✓ Aprovar e enviar</button>
      <button class="btn btns" style="padding:8px 15px;font-size:12px" onclick="filaEditar('${a.id}')">✎ Editar</button>
      <button class="btn btns" style="padding:8px 15px;font-size:12px" onclick="filaCancelar('${a.id}')">✕ Cancelar</button>`;
  }else if(a.status==='agendado'){
    /* ENVIAR AGORA TAMBEM AQUI — v96 do motor, 26/08/2026.
       Ate a v95 a rota ?enviar_automacao= so aceitava status 'vencida',
       e a aba Agendadas so sabia adiar. Nao poder ANTECIPAR o que ja
       esta pronto era falta boba: a mensagem existe, o texto esta
       montado, so a hora nao chegou.
       Isso FURA a trava de intervalo do item 196 de proposito — clique
       do Esdras e decisao, nao ritmo. O que nao fura sao os 8 segundos
       entre duas mensagens para a MESMA cliente: aquilo e limitacao do
       WhatsGW, que embaralha a ordem dos baloes. */
    acoes=`<button class="btn btnp" style="padding:8px 15px;font-size:12px" onclick="filaEnviarAgora('${a.id}')">➤ Enviar agora</button>
      <button class="btn btns" style="padding:8px 15px;font-size:12px" onclick="filaPausar('${a.id}')">⏸ Pausar</button>
      <button class="btn btns" style="padding:8px 15px;font-size:12px" onclick="filaReagendar('${a.id}')">🕐 Reagendar</button>
      <button class="btn btns" style="padding:8px 15px;font-size:12px" onclick="filaEditar('${a.id}')">✎ Editar</button>
      <button class="btn btns" style="padding:8px 15px;font-size:12px" onclick="filaCancelar('${a.id}')">✕ Cancelar</button>`;
  }else if(a.status==='pausado'){
    acoes=`<button class="btn btnp" style="padding:8px 15px;font-size:12px" onclick="filaRetomar('${a.id}')">▶ Retomar</button>
      <button class="btn btns" style="padding:8px 15px;font-size:12px" onclick="filaCancelar('${a.id}')">✕ Cancelar</button>`;
  }else if(a.status==='vencida'){
    acoes=`<button class="btn btnp" style="padding:8px 15px;font-size:12px" onclick="filaEnviarAgora('${a.id}')">➤ Enviar agora</button>
      <button class="btn btns" style="padding:8px 15px;font-size:12px" onclick="filaReagendar('${a.id}')">🕐 Reagendar</button>
      <button class="btn btns" style="padding:8px 15px;font-size:12px" onclick="filaEditar('${a.id}')">✎ Editar</button>
      <button class="btn btns" style="padding:8px 15px;font-size:12px" onclick="filaCancelar('${a.id}')">✕ Descartar</button>`;
  }else{
    acoes=`<button class="btn btnp" style="padding:8px 15px;font-size:12px" onclick="filaRetomar('${a.id}')">↻ Tentar de novo</button>
      <button class="btn btns" style="padding:8px 15px;font-size:12px" onclick="filaCancelar('${a.id}')">✕ Cancelar</button>`;
  }

  /* ABRE O CARTAO, e nao mais a rota #/cliente/<id>. Aquela rota
     desenhava o formulario cru — outra tela, com outros campos e outro
     botao Salvar, para o mesmo cliente. Quem clicava aqui era jogado num
     lugar diferente do que ve no quadro e na aba Sem resposta, que ja
     abriam o cartao. Uma tela por cliente, sempre. */
  const verCard=a.cliente_id?`<button class="btn btns" style="padding:8px 15px;font-size:12px;margin-left:auto" onclick="abrirCardCliente('${a.cliente_id}')">Abrir cartão →</button>`:'';

  const marcador=a.status==='vencida'
    ? `<input type="checkbox" style="width:18px;height:18px;flex:none;margin-right:9px;accent-color:var(--pri)" ${FILA_SEL.has(a.id)?'checked':''} onchange="filaMarcar('${a.id}',this.checked)"/>`
    : '';

  /* O TELEFONE NA LINHA, E CLICAVEL — 26/08/2026.
     Ele ja vinha na consulta desta tela (o filtro de busca compara com
     ele), so nao era impresso: para ver o numero de quem estava com
     automacao era preciso abrir o cartao, um por um. Como o atendimento
     acontece no WhatsApp Web, o numero e link: um clique abre a conversa.
     A aba Sem resposta ja mostrava — as outras quatro passam por aqui. */
  const foneHtml=c.telefone_principal?' · '+foneLink(c.telefone_principal):'';

  return`<div class="filacard">
    <div class="filahead">
      ${marcador}
      <div style="min-width:0">
        <div class="filanome">${esc(nome)}</div>
        <div class="filameta">${origem} · ${esc(quando)}${foneHtml}</div>
      </div>
      ${etiqueta}
    </div>
    ${extra}
    <div class="filaboxl" style="margin:10px 0 5px">Mensagem</div>
    <div class="filamsg">${corpo}</div>
    <div class="filaacoes">${acoes}${verCard}</div>
  </div>`;
}

/* AS MESMAS ACOES, DOIS LUGARES — 26/08/2026.

   Estas funcoes nasceram na Fila e agora servem tambem o bloco de
   Sequencias dentro do cartao. Duplicar cada uma daria duas versoes da
   mesma decisao, que divergem no primeiro ajuste — e a decisao que o
   Esdras toma dentro do cartao tem que ser a mesma da Fila.

   O QUE MUDA E SO PARA ONDE VOLTAR. FILA_VOLTAR guarda o cliente quando
   a acao partiu do cartao; nulo quer dizer que partiu da Fila.

   E ele existe por um motivo chato: o cartao e os dialogos de Editar,
   Reagendar e Cancelar dividem o MESMO container de modal (#modalbox).
   Abrir o Reagendar por cima do cartao apaga o cartao. Entao, quando a
   acao vem de dentro, o dialogo assume a tela e o cartao e reaberto
   depois — ao salvar E ao desistir. Sem isso, cancelar um Reagendar
   deixaria o Esdras olhando para o quadro, sem entender por que o
   cartao fechou. */
let FILA_VOLTAR=null;

async function filaRecarregar(){
  if(FILA_VOLTAR){const id=FILA_VOLTAR;FILA_VOLTAR=null;await abrirCardCliente(id);return;}
  await pageFila();
}

/* Chamado pelos botoes dentro do cartao: marca de onde veio e dispara a
   mesma acao da Fila. */
function mcSeqAcao(fn,idAuto){
  FILA_VOLTAR=mcClienteId;
  window[fn](idAuto);
}

/* O "Voltar" dos dialogos. Fechar e so isso quando se veio da Fila; do
   cartao, precisa devolver o cartao. */
function filaFecharDialogo(){
  if(FILA_VOLTAR){const id=FILA_VOLTAR;FILA_VOLTAR=null;fecharModal();abrirCardCliente(id);return;}
  fecharModal();
}

/* Editar e Reagendar precisam do texto e da data atuais. Na Fila isso
   vem do FILA_CACHE; no cartao, do MC_AUTOS. Um lugar so procura nos
   dois, para as funcoes nao terem que saber onde estao. */
function filaAchar(id){
  return (typeof FILA_CACHE!=='undefined'?FILA_CACHE.find(x=>x.id===id):null)
      || (typeof MC_AUTOS!=='undefined'?MC_AUTOS.find(x=>x.id===id):null)
      || null;
}

async function filaAtualizar(id,campos,msg){
  const{error}=await sb.from('crm_automacoes').update(campos).eq('id',id);
  if(error){toast('Erro: '+error.message,'er');return false;}
  toast(msg,'ok');
  await filaRecarregar();
  return true;
}

async function filaAprovar(id){
  await filaAtualizar(id,{
    status:'agendado',aprovado:true,
    aprovado_por:U.id,aprovado_em:new Date().toISOString(),
    data_hora_agendada:new Date().toISOString()
  },'Aprovada — vai sair no próximo disparo');
}

async function filaPausar(id){
  await filaAtualizar(id,{status:'pausado'},'Pausada');
}

async function filaRetomar(id){
  await filaAtualizar(id,{status:'agendado',erro:null,tentativas:0},'De volta para a fila');
}

/* CANCELAR: ESTE PASSO OU A SEQUENCIA INTEIRA — 26/08/2026.

   O ✕ cancelava sempre UMA linha. Nas telas onde a linha fala em nome da
   sequencia ("Pedir Documentação · passo 1 de 4") isso engana: matar o
   passo 1 deixa os passos 2, 3 e 4 vivos e saindo nos proximos dias,
   sem nada na tela dizendo isso.

   NAO ESCOLHI POR ELE. Cancelar um passo solto e legitimo — a mensagem
   de quinta esta errada, as outras estao certas. So nao e o caso comum:
   quem desiste de cobrar documento desiste da cobranca inteira. Entao a
   pergunta e feita, com o numero de mensagens em cada opcao.

   SO PERGUNTA QUANDO HA O QUE PERGUNTAR: se aquele passo e o unico
   pendente da sequencia, as duas opcoes sao a mesma coisa, e oferecer as
   duas seria um clique a mais para nada.

   AS IRMAS VEM DO BANCO, nao do cache da tela. FILA_CACHE tem so a aba
   aberta e o MC_AUTOS so o cartao aberto — passo agendado para semana
   que vem pode nao estar em nenhum dos dois, e ficaria vivo depois de um
   "cancelar tudo". */ async function filaCancelar(id){
  const{data:a}=await sb.from('crm_automacoes')
    .select('id,cliente_id,sequencia_id,tipo_automacao,ordem').eq('id',id).single();
  let irmas=[],nomeSeq='';
  if(a&&a.tipo_automacao==='sequencia'&&a.sequencia_id&&a.cliente_id){
    const[{data:outras},{data:seq}]=await Promise.all([
      sb.from('crm_automacoes').select('id,ordem')
        .eq('cliente_id',a.cliente_id).eq('sequencia_id',a.sequencia_id)
        .in('status',['agendado','aguardando_aprovacao','pausado','vencida'])
        .neq('id',id),
      sb.from('crm_sequencias').select('nome').eq('id',a.sequencia_id).single()
    ]);
    irmas=outras||[];
    nomeSeq=(seq&&seq.nome)||'';
  }
  const n=irmas.length;
  abrirModal(`
    <div class="mbt">Cancelar envio</div>
    <div class="mbs">${n
      ? `Esta cliente tem <b>${n+1} mensagens</b> pendentes da sequência <b>${esc(nomeSeq)}</b>.`
      : 'Essa mensagem não será enviada. O motivo fica registrado.'}</div>
    <div class="fld ff" style="margin-bottom:16px"><label>Por que está cancelando?</label>
      <textarea id="fila-motivo" placeholder="Ex: cliente já respondeu por telefone"></textarea></div>
    ${n?`<div class="fhint" style="margin-bottom:14px">Cancelar só este passo deixa as outras ${n} saindo normalmente nos próximos dias.</div>`:''}
    <div class="brow" style="justify-content:flex-end;gap:9px;flex-wrap:wrap">
      <button class="btn btns" onclick="filaFecharDialogo()">Voltar</button>
      <button class="btnd" onclick="filaConfirmarCancelar('${id}')">${n?'Só este passo':'Cancelar envio'}</button>
      ${n?`<button class="btnd" onclick="filaConfirmarCancelar('${id}',true)">A sequência inteira (${n+1})</button>`:''}
    </div>`);
}

async function filaConfirmarCancelar(id,tudo){
  const motivo=$('fila-motivo').value.trim();
  if(!motivo){toast('O motivo é obrigatório','er');return;}
  if(!tudo){
    fecharModal();
    await filaAtualizar(id,{status:'cancelado',motivo_cancelamento:motivo},'Envio cancelado');
    return;
  }
  /* A sequencia inteira. Relemos a automacao para pegar cliente e
     sequencia na hora do clique: entre abrir o dialogo e confirmar, o
     motor pode ter enviado o passo que estava vencendo. */
  const{data:a}=await sb.from('crm_automacoes')
    .select('cliente_id,sequencia_id').eq('id',id).single();
  if(!a||!a.sequencia_id){toast('Não achei a sequência — recarregue a tela','er');return;}
  fecharModal();
  const{data:mortas,error}=await sb.from('crm_automacoes')

let CL_LISTAS={};
let CL_ITENS=[],CL_PAGINA=0,CL_FILTRO='todos',CL_BUSCA='',CL_BUSCATIMER=null,CL_FIM=false,CL_TOTAL=0,CL_CARREGANDO=false;
const CL_PAGE=50;

async function pageClientes(){
  const pc=$('pc');marcarNav('clientes');
  CL_ITENS=[];CL_PAGINA=0;CL_FIM=false;CL_BUSCA='';CL_FILTRO='todos';

    {k:'todos',r:'Todos'},
    {k:'ativos',r:'Ativos'},

    {k:'arquivados',r:'Arquivados'}
  ];
  pc.innerHTML=`<div class="pgh">

    </div>
    <div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px">
      <input type="text" id="cl-busca" placeholder="Nome, telefone ou CPF..." oninput="clBuscar(this.value)" style="flex:1;min-width:200px"/>

  const{data:ls}=await sb.from('crm_listas').select('id,nome');

function clFiltrar(k){
  CL_FILTRO=k;
  document.querySelectorAll('.cl-chip').forEach(b=>b.classList.toggle('on',b.getAttribute('data-f')===k));
  CL_ITENS=[];CL_PAGINA=0;CL_FIM=false;
  clCarregar(true);
}

function clBuscar(v){
  CL_BUSCA=(v||'').trim();
  if(CL_BUSCATIMER)clearTimeout(CL_BUSCATIMER);
  CL_BUSCATIMER=setTimeout(()=>{CL_ITENS=[];CL_PAGINA=0;CL_FIM=false;clCarregar(true);},350);
}

async function clCarregar(reset){
  if(CL_CARREGANDO)return;
  CL_CARREGANDO=true;
  if(reset)$('cl-lista').innerHTML='<div class="fhint" style="text-align:center;padding:26px 0">Carregando...</div>';
  let q=sb.from('crm_clientes')
    .select('id,nome_completo,telefone_principal,telefone_chave,cpf,quadro,lista_id,origem,arquivado_em,criado_em',{count:'exact'});

  if(CL_FILTRO==='sem_card')q=q.is('quadro',null).is('arquivado_em',null);
  else if(CL_FILTRO==='arquivados')q=q.not('arquivado_em','is',null);
  else if(CL_FILTRO==='ativos')q=q.is('arquivado_em',null);
  else if(CL_FILTRO.startsWith('q:'))q=q.eq('quadro',CL_FILTRO.slice(2)).is('arquivado_em',null);
  // 'todos' = todos mesmo, inclusive arquivados

  if(CL_BUSCA){
    /* Mesma regra da lupa: cada pedaco e uma condicao e todos precisam
       bater. Duas telas buscando de jeitos diferentes e a pessoa
       aprender que "achou numa e nao na outra" e normal. */
    const limpo=CL_BUSCA.replace(/[%,()]/g,'');
    const pedacos=limpo.trim().split(/\s+/).filter(t=>t.length>=2).slice(0,4);
    (pedacos.length?pedacos:[limpo]).forEach(t=>{
      const d=t.replace(/\D/g,'');
      const conds=[`nome_completo.ilike.%${t}%`,`telefone_principal.ilike.%${t}%`];
      if(d.length>=3){conds.push(`telefone_chave.ilike.%${d}%`);conds.push(`cpf.ilike.%${d}%`);}
      q=q.or(conds.join(','));
    });
  }

  const de=CL_PAGINA*CL_PAGE;
  const{data,error,count}=await q.order('criado_em',{ascending:false}).range(de,de+CL_PAGE-1);
  CL_CARREGANDO=false;
  if(error){$('cl-lista').innerHTML=`<div class="emp"><div class="empt">Erro ao carregar</div><div class="emps">${esc(error.message)}</div></div>`;return;}
  if(count!==null&&count!==undefined)CL_TOTAL=count;
  const lote=data||[];
  CL_ITENS=CL_ITENS.concat(lote);
  if(lote.length<CL_PAGE)CL_FIM=true;
  clRender();
}

function clRender(){
  const box=$('cl-lista');if(!box)return;
  const sub=$('cl-sub');
  if(sub)sub.textContent=CL_TOTAL.toLocaleString('pt-BR')+(CL_TOTAL===1?' contato':' contatos')+' — mais recentes primeiro';
  if(!CL_ITENS.length){
    box.innerHTML='<div class="emp"><div class="empi">◎</div><div class="empt">Nenhum contato encontrado</div><div class="emps">Ajuste a busca ou o filtro.</div></div>';
    $('cl-mais').innerHTML='';return;
  }
  const listaNome=CL_LISTAS||{};
  let h='<div class="cl-tbl">';
  h+='<div class="cl-hd"><span>Cliente</span><span>WhatsApp</span><span>Situação</span><span style="text-align:right">Entrada</span><span></span></div>';
  CL_ITENS.forEach(c=>{
    const arq=!!c.arquivado_em;
    const nome=c.nome_completo||'Sem nome';
    const ini=(c.nome_completo||'').trim().split(/\s+/).filter(Boolean).slice(0,2).map(x=>x[0]).join('').toUpperCase()||'—';
    let sit='',sub2='';
    if(arq){sit='<span class="cl-tag cl-arq">Arquivado</span>';sub2=c.quadro&&QUADROS[c.quadro]?QUADROS[c.quadro].rotulo:'';}
    else if(!c.quadro){sit='<span class="cl-tag cl-sem">Sem card</span>';}
    else{
      const ln=listaNome[c.lista_id]||'—';
      sit=`<span class="cl-tag cl-ok">${esc(ln)}</span>`;
      sub2=QUADROS[c.quadro]?QUADROS[c.quadro].rotulo:c.quadro;
    }
    const org=c.origem&&ORIGENS[c.origem]?ORIGENS[c.origem]:(c.origem||'');
    h+=`<div class="cl-row${arq?' cl-off':''}" onclick="clAbrir('${c.id}')">
      <div class="cl-nm"><div class="cl-av">${esc(ini)}</div>
        <div style="min-width:0"><div class="cl-n1">${esc(nome)}</div>${org?`<div class="cl-n2">${esc(org)}</div>`:''}</div></div>
      <div class="cl-fone">${esc(c.telefone_principal||'—')}</div>
      <div style="min-width:0">${sit}${sub2?`<div class="cl-n2" style="margin-top:3px">${esc(sub2)}</div>`:''}</div>
      <div class="cl-dt">${clData(c.criado_em)}</div>
      <div class="cl-delwrap"><button class="cl-del" title="Excluir contato" aria-label="Excluir ${escA(nome)}" onclick="event.stopPropagation();clExcluir('${c.id}','${escA(nome)}','${escA(c.telefone_chave||'')}')">✕</button></div>
    </div>`;
  });
  h+='</div>';
  box.innerHTML=h;
  $('cl-mais').innerHTML=CL_FIM?`<span class="fhint">Mostrando ${CL_ITENS.length.toLocaleString('pt-BR')} de ${CL_TOTAL.toLocaleString('pt-BR')}</span>`
    :`<button class="btn btns" onclick="clMais()">Carregar mais</button>`;
}

function clData(iso){
  if(!iso)return '—';
  const d=new Date(iso),hoje=new Date();
  const mesmoDia=d.toDateString()===hoje.toDateString();
  if(mesmoDia)return 'hoje '+d.toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'});
  const ontem=new Date(hoje.getTime()-86400000);
  if(d.toDateString()===ontem.toDateString())return 'ontem';
  if(d.getFullYear()===hoje.getFullYear())return d.toLocaleDateString('pt-BR',{day:'2-digit',month:'2-digit'});
  return d.toLocaleDateString('pt-BR',{month:'2-digit',year:'numeric'});
}

/* Altura da Caixa de Entrada, medida em vez de adivinhada.
 *
 * O CSS trazia height:calc(100vh - 122px) — 122 sendo um palpite do
 * tamanho do cabecalho da pagina. O cabecalho muda: o subtitulo quebra
 * em duas linhas numa janela estreita, o padding e outro no celular, e
 * a janela do navegador nem sempre tem a altura que a gente imagina.
 * Quando o palpite erra para menos, o cartao termina depois do fim da
 * tela e o rodape de envio fica cortado — e como nada rola por dentro,
 * a tela parece travada.
 *
 * Aqui a conta usa a posicao real do cartao no documento e o padding
 * real do container. Sem numero magico: se amanha o cabecalho crescer,
 * a conta se ajusta sozinha.
 */
function ibAjustarAltura(){
  const w=document.querySelector('.inbwrap');
  if(!w)return;
  const pc=$('pc');
  // rect.top + scrollY = distancia ate o topo do DOCUMENTO. So o rect
  // sozinho mudaria a cada rolagem e a altura ficaria pulando.
  const topo=w.getBoundingClientRect().top+(window.scrollY||0);
  const rodape=pc?(parseFloat(getComputedStyle(pc).paddingBottom)||0):0;
  const alt=Math.max(320,window.innerHeight-topo-rodape-8);
  w.style.height=alt+'px';
}
let ibAlturaLigada=false;
function ibLigarAjusteAltura(){
  ibAjustarAltura();
  if(ibAlturaLigada)return;
  ibAlturaLigada=true;
  // Um ouvinte so, para sempre: ele mesmo desiste quando a tela nao e
  // mais a Caixa de Entrada, entao nao ha o que desligar.
  window.addEventListener('resize',ibAjustarAltura);
  window.addEventListener('orientationchange',()=>setTimeout(ibAjustarAltura,250));
}
function ibIniciarListaPoll(){
  pararInboxPoll();
  ibListTimer=setInterval(()=>{if(location.hash.slice(1)!=='/inbox'){pararInboxPoll();return;}ibCarregarLista(true);},20000);
}
/* A LISTA DE CONVERSAS VEM DA VIEW, NAO DA TABELA.
   A versao anterior puxava as ultimas 500 mensagens com select('*') e
   agrupava por conversa aqui no navegador. Duas coisas davam errado nisso:
   o '*' trazia a coluna bruto (payload cru do WhatsApp) e o texto inteiro
   — e em mensagem de midia o texto guarda o arquivo em base64. Dava 12 MB
   por carga, a cada 20 segundos, para exibir uma linha de previa por
   conversa. Foram esses 12 MB que estouraram a cota de banda do Supabase.

   vw_inbox_lista ja devolve uma linha por conversa (a mais recente) com o
   texto cortado em 200 caracteres. Mesma tela, 12 KB no lugar de 12 MB.
   A view tem security_invoker, entao continua valendo a mesma regra de
   acesso da tabela — quem nao pode ler mensagem tambem nao le a view. */
async function ibCarregarLista(silencioso){
  const cont=$('ib-items');
  if(!cont)return;
  const{data,error}=await sb.from('vw_inbox_lista').select('*').order('criado_em',{ascending:false}).limit(200);
  if(error){if(!silencioso)cont.innerHTML='<div class="fhint" style="text-align:center;padding:20px 0">Erro ao carregar: '+esc(error.message)+'</div>';return;}
  /* A view entrega previa; o resto do codigo espera texto. Renomeia aqui
     para nao ter que mexer em ibPrevia e ibRenderLista. */
  const msgs=(data||[]).map(m=>({...m,texto:m.previa}));
  const porChave={},ordem=[];
  msgs.forEach(m=>{
    const chave=m.chave||(m.cliente_id?('c:'+m.cliente_id):('l:'+(m.telefone_chave||m.telefone_bruto||'sem-numero')));
    if(!porChave[chave]){porChave[chave]=m;ordem.push(chave);}
  });
  const idsClientes=[...new Set(msgs.filter(m=>m.cliente_id).map(m=>m.cliente_id))];
  let clientesMap={};
  if(idsClientes.length){
    const{data:cl}=await sb.from('crm_clientes').select('id,nome_completo,canal_ativo,canal_whatsapp,telefone_principal').in('id',idsClientes);
    (cl||[]).forEach(c=>clientesMap[c.id]=c);
  }
  IB_CONVS=ordem.map(chave=>{
    const ultima=porChave[chave];
    const cliente=ultima.cliente_id?clientesMap[ultima.cliente_id]:null;
    return{
      chave,clienteId:ultima.cliente_id||null,
      nome:cliente?cliente.nome_completo:(ultima.telefone_bruto||ultima.telefone_chave||'Contato desconhecido'),
      canal:cliente?canalDaConversa(cliente):ultima.canal,
      telefoneChave:ultima.telefone_chave||null,
      lead:!ultima.cliente_id,
      ultimaMsg:ultima
    };
  });
  ibRenderLista();
  if(ibSelId){
    const ainda=IB_CONVS.find(c=>c.chave===ibSelId);
    if(ainda)ibCarregarChat(ainda,true);
  }
}
function ibRenderLista(){
  const cont=$('ib-items');
  if(!cont)return;
  const termo=(ibFiltroTxt||'').toLowerCase();
  const lista=termo?IB_CONVS.filter(c=>(c.nome||'').toLowerCase().includes(termo)):IB_CONVS;
  if(!lista.length){cont.innerHTML='<div class="fhint" style="text-align:center;padding:20px 0">Nenhuma conversa ainda.</div>';return;}
  cont.innerHTML=lista.map(c=>{
    const m=c.ultimaMsg;
    let prev=ibPrevia(m);
    if(m.direcao==='saida')prev=(m.autor_tipo==='bot'?'Samara: ':'Você: ')+prev;
    return`<div class="inb-item ${c.chave===ibSelId?'a':''}" onclick="ibSelecionar('${escA(c.chave)}')">
      <div class="av" style="background:${avC(c.nome)}">${avL(c.nome)}</div>
      <div class="inb-item-body">
        <div class="inb-item-nome">${esc(c.nome)}${c.lead?'<span class="inb-lead-tag">novo contato</span>':''}</div>
        <div class="inb-item-prev">${esc(prev)}</div>
      </div>
      <div class="inb-item-time">${tempoRel(m.criado_em)}</div>
    </div>`;
  }).join('');
}
/* Uma linha de resumo para a lista de conversas.
   Decide pelo TIPO, nao por palpite sobre o conteudo: em mensagem de
   midia o campo texto guarda o arquivo inteiro em base64, nao legenda.
   A versao anterior chamava pareceBase64 primeiro e, quando ele errava,
   despejava a parede de caracteres no lugar do resumo. */
function ibPrevia(m){
  if(m.tipo&&m.tipo!=='texto')return rotuloMidia(m);
  const t=m.texto||'';
  if(!t)return '';
  return pareceBase64(t)?rotuloMidia(m):t;
}

function ibFiltrar(v){ibFiltroTxt=v;ibRenderLista();}
/* Volta da conversa para a lista no celular. Em tela grande as duas
   convivem, entao o botao nem aparece. */
function ibVoltarLista(){
  gravCancelar(); // senao o microfone continua aberto numa conversa que voce ja deixou
  const wrap=document.querySelector('.inbwrap');if(wrap)wrap.classList.remove('chat-aberto');
  const pnl=$('ib-panel');if(pnl)pnl.classList.remove('aberto');
  pararInboxChatPoll();
  ibSelId=null;ibChatAssinatura='';
  ibRenderLista();
}
/* Abre e fecha a gaveta de detalhes (etiquetas, cartao, exclusao).

function ibToggleDetalhes(){

/* Pinta a barra de estado da Samara no topo do chat.
   Motivo de existir: o botao de pausar morava so no painel lateral, que
   some abaixo de 980px. No celular nao havia como calar a Samara sem

/* CALA A FALA DELA, e so a fala dela.
   Resposta da Samara e abertura sao ELA falando com a cliente, e e
   disso que a pausa trata. aviso_esdras e aviso_indicacao ficam de
   fora de proposito: sao recados para VOCE, e cancelar um aviso seu
   porque voce calou a robo nao faz sentido nenhum. */
async function ibCalarFalaDaSamara(clienteId){
  const{data,error}=await sb.from('crm_automacoes')
    .update({status:'cancelado',motivo_cancelamento:'Samara pausada na conversa'})
    .eq('cliente_id',clienteId)
    .in('tipo_automacao',['samara','abertura'])
    .in('status',['agendado','aguardando_aprovacao','pausado'])
    .select('id');
  if(error){console.error('[pausa] erro ao cancelar a fala da Samara:',error.message);return 0;}
  return (data||[]).length;
}

/**
 * Liga e desliga a Samara nesta conversa.
 *
 * Esta e a pausa que cala ela de verdade. Nao confundir com pausar uma
 * automacao na Fila: aquilo segura UMA mensagem, isto para o
 * atendimento inteiro daquela cliente.
 *
 * PAUSAR A SAMARA NAO E DESISTIR DA CLIENTE — 02/09/2026.
 *
 * Ate aqui, pausar cancelava TUDO que estivesse agendado, e "tudo"
 * incluia a esteira de cobranca. Medido em 30 dias: 9 passos de
 * pedir_documentacao, de 3 clientes, morreram assim. A Patricia
 * escreveu "assim que chegar em casa te envio tudo certinho", a Samara
 * foi pausada, os 3 lembretes foram junto, e ninguem nunca mais cobrou
 * ela — o cartao segue em Aguardando documentos sem um documento. Sao
 * 3 de 28 clientes que chegaram na documentacao no periodo, perdidas
 * por efeito colateral de um botao que nao prometia isso.
 *
 * A COBRANCA VIROU PERGUNTA, e nao um padrao novo escolhido por mim.
 * Os dois casos existem de verdade: quem pausa para assumir a conversa
 * quer a cobranca viva, porque a cobranca nao e conversa; quem pausa
 * uma lead nova para atender na mao nao quer a triagem1 falando por
 * cima dele duas horas depois. Mesma solucao do ✕ da Fila (item 294):
 * a pergunta e feita, com o numero de mensagens em cada opcao, e SO
 * quando ha o que perguntar — sem cobranca pendente, pausa direto.
 *
 * A fala dela e cancelada nos dois caminhos, sem perguntar. E o que a
 * pausa significa.
 */
async function ibTogglePausa(clienteId,chave,pausar){
  if(!pausar)return ibAplicarPausa(clienteId,chave,false,false);

  /* As cobrancas vem do banco e nao do cache da tela: passo agendado
     para semana que vem pode nao estar em IB_CONVS nenhum, e o numero
     na pergunta tem que ser o numero de verdade. */
  const{data:seqs}=await sb.from('crm_automacoes').select('id')
    .eq('cliente_id',clienteId).eq('tipo_automacao','sequencia')
    .in('status',['agendado','aguardando_aprovacao','pausado','vencida']);
  const n=(seqs||[]).length;
  if(!n)return ibAplicarPausa(clienteId,chave,true,false);

  abrirModal(`
    <div class="mbt">Pausar a Samara</div>
    <div class="mbs">Ela para de responder esta cliente. Mas há <b>${n} mensagem(ns)</b> de cobrança agendada(s) — lembrete de documentação, de contrato ou de senha.</div>
    <div class="fhint" style="margin-bottom:14px">Cobrança não é a Samara conversando: é a esteira lembrando quem parou no meio. Cancelar junto costuma deixar a cliente sem lembrete nenhum e sem nada na tela dizendo isso.</div>
    <div class="brow" style="justify-content:flex-end;gap:9px;flex-wrap:wrap">
      <button class="btn btns" onclick="fecharModal()">Voltar</button>
      <button class="btnd" onclick="ibAplicarPausa('${clienteId}','${escA(chave)}',true,true)">Pausar e cancelar as ${n}</button>
      <button class="btn btnp" onclick="ibAplicarPausa('${clienteId}','${escA(chave)}',true,false)">Pausar só a Samara</button>
    </div>`);
}

async function ibAplicarPausa(clienteId,chave,pausar,matarCobranca){
  fecharModal();
  const{error}=await sb.from('crm_clientes')
    .update({samara_pausada:pausar,samara_deve_continuar:false})
    .eq('id',clienteId);
  if(error){toast('Não consegui alterar: '+error.message,'er');return;}

  let calada=0,cobrancas=0;
  if(pausar){
    calada=await ibCalarFalaDaSamara(clienteId);
    if(matarCobranca){
      /* Motivo proprio, diferente do da fala dela. Foi a leitura do
         motivo em crm_automacoes que mostrou o vazamento; se os dois
         casos gravarem a mesma frase, a proxima medicao nao consegue
         separar "calei a robo" de "desisti de cobrar". */
      const{data,error:e2}=await sb.from('crm_automacoes')
        .update({status:'cancelado',motivo_cancelamento:'Samara pausada na conversa — cobrança cancelada junto, na mão'})
        .eq('cliente_id',clienteId).eq('tipo_automacao','sequencia')
        .in('status',['agendado','aguardando_aprovacao','pausado','vencida'])
        .select('id');
      if(e2)console.error('[pausa] erro ao cancelar cobrança:',e2.message);
      else cobrancas=(data||[]).length;
    }
  }

  const detalhe=[calada?calada+' resposta(s) dela':'',cobrancas?cobrancas+' cobrança(s)':'']
    .filter(Boolean).join(' e ');
  registrarAtividade(clienteId,pausar
    ?'pausou a Samara nesta conversa'+(detalhe?' e cancelou '+detalhe:'')
      +(!matarCobranca?' (cobranças mantidas)':'')
    :'liberou a Samara para responder nesta conversa');

  toast(pausar
    ?'Samara pausada'+(cobrancas?' · '+cobrancas+' cobrança(s) cancelada(s)':' · cobranças mantidas')
    :'Samara liberada','ok');

  const conv=IB_CONVS.find(x=>x.chave===chave);
  if(conv)ibRenderPainel(conv);
}

/**
 * Exclusao completa, para testes.
 *
 * O banco NAO apaga em cascata: apagar so a linha de crm_clientes deixa
 * mensagem, automacao e atividade orfas — foi assim que apareceu aquela
 * automacao rodando para um contato que nao existia mais.
 * Por isso aqui a ordem e: filhos primeiro, cliente por ultimo.
 *
 * Serve tambem para contato que ainda nao virou cliente: nesse caso so
 * existem mensagens, e o resto e ignorado.
 */
/**
 * Apaga uma cliente e TUDO que pendura nela, na ordem certa.
 *
 * Existe uma vez so, de proposito. Antes o unico lugar que apagava
 * direito era a Caixa de Entrada; o botao de dentro do cartao apagava
 * so a linha da cliente e deixava automacao orfa disparando para um
 * card que nao existe mais. Dois jeitos diferentes de apagar a mesma
 * coisa e como isso acontece.
 *
 * Devolve a lista de falhas — vazia quando deu tudo certo.
 */
async function apagarClienteTudo(clienteId,telefoneChave){
  const erros=[];
  const tentar=async(rotulo,promessa)=>{
    const{error}=await promessa;
    if(error)erros.push(rotulo+': '+error.message);
  };

  // 1. Mensagens. Podem estar ligadas pelo cliente ou so pelo telefone.
  if(clienteId)await tentar('mensagens',sb.from('crm_mensagens').delete().eq('cliente_id',clienteId));
  if(telefoneChave)await tentar('mensagens do número',sb.from('crm_mensagens').delete().eq('telefone_chave',telefoneChave));

  // 2. Tudo que pendura na cliente.
  if(clienteId){
    await tentar('automações',sb.from('crm_automacoes').delete().eq('cliente_id',clienteId));
    await tentar('etiquetas',sb.from('crm_clientes_etiquetas').delete().eq('cliente_id',clienteId));
    await tentar('atividades',sb.from('crm_atividades').delete().eq('cliente_id',clienteId));
    await tentar('comentários',sb.from('crm_comentarios').delete().eq('cliente_id',clienteId));
    await tentar('anexos',sb.from('crm_anexos').delete().eq('cliente_id',clienteId));
    await tentar('notificações',sb.from('crm_notificacoes').delete().eq('cliente_id',clienteId));
    // 3. E so entao a cliente.
    await tentar('cliente',sb.from('crm_clientes').delete().eq('id',clienteId));
  }
  return erros;
}

  }

  const erros=await apagarClienteTudo(id,telefoneChave||null);

  if(erros.length){
    console.error('[excluir] falhas:',erros);
    toast('Apagado com pendências — veja o console','er');

  // Tira da tela sem recarregar a lista inteira: numa base de 37 mil
  // contatos, recarregar joga fora a rolagem e a busca.
  CL_ITENS=CL_ITENS.filter(x=>x.id!==id);
  if(CL_TOTAL>0)CL_TOTAL--;
  clRender();
}

async function ibCarregarChat(c,silencioso){
  const box=$('ib-chat');
  if(!box)return;
  if(!silencioso){
    box.innerHTML=`<div class="inb-chat-head">
        <button class="ib-voltar" onclick="ibVoltarLista()" title="Voltar para a lista">←</button>

        <div class="inb-chat-head-acoes"><button class="ib-detalhes" onclick="ibToggleDetalhes()" title="Detalhes do contato">⋯</button></div></div>
      <div class="ib-sambar" id="ib-sambar"></div>
      <div class="inb-chat-body"><div id="ib-chat-janela"></div><div class="chatfeed" id="ib-chat-feed"><div class="fhint" style="text-align:center;padding:20px 0">Carregando...</div></div></div>
      <div class="inb-chat-send">
        <div class="ib-grav" id="ib-grav"></div>
        <div id="ib-escrever">
          <textarea id="ib-chat-input" placeholder="Escreva uma mensagem... (Enter envia, Shift+Enter pula linha)" onkeydown="if(chatEnviarComEnter(event))ibEnviarMensagem()"></textarea>
          <div class="ib-send-linha">
            <button class="ib-mic" onclick="gravMicClique('inbox')" title="Gravar audio">🎤</button>
            <button class="btn btnp" id="ib-chat-btn" onclick="ibEnviarMensagem()">Enviar</button>
          </div>
        </div>
        <div class="chataviso" id="ib-chat-aviso"></div>
      </div>`;
  }
  const filtro=c.clienteId?{coluna:'cliente_id',valor:c.clienteId}:{coluna:'telefone_chave',valor:c.telefoneChave};
  if(!filtro.valor)return;
  const{data,error}=await sb.from('crm_mensagens').select(COLS_CHAT).eq(filtro.coluna,filtro.valor).order('criado_em',{ascending:false}).limit(40);
  const feed=$('ib-chat-feed');
  if(!feed)return;
  if(error){feed.innerHTML='<div class="fhint" style="text-align:center;padding:20px 0">Erro ao carregar a conversa: '+esc(error.message)+'</div>';return;}
  const msgs=(data||[]).slice().reverse();
  const assinatura=msgs.length+'|'+(msgs.length?(msgs[msgs.length-1].id||''):'');
  const jan=$('ib-chat-janela');
  if(jan)jan.innerHTML=chatJanelaHtml(msgs,c.canal);
  const av=$('ib-chat-aviso');
  if(av)av.innerHTML='A mensagem entra na fila e o motor entrega em até 1 minuto. O envio automático só funciona pelo WhatsGW.';
  if(silencioso&&assinatura===ibChatAssinatura)return;
  ibChatAssinatura=assinatura;
  if(!msgs.length){feed.innerHTML='<div class="fhint" style="text-align:center;padding:20px 0">Nenhuma mensagem ainda.</div>';return;}
  let html='',diaAnt='';
  msgs.forEach(m=>{
    const dia=chatDiaMsg(m);
    if(dia!==diaAnt){html+=`<div class="chatdia">${esc(dia)}</div>`;diaAnt=dia;}
    const cls=m.direcao==='entrada'?'chatb-in':(m.autor_tipo==='bot'?'chatb-bot':'chatb-out');
    const autor=m.direcao==='entrada'?'':(m.autor_tipo==='bot'?'Samara · ':(nomeUsuario(m.usuario_id)?nomeUsuario(m.usuario_id)+' · ':''));
    /* Situacao do envio. O motor troca o status desta linha: pendente_envio
       -> enviando -> enviado, ou erro_envio quando desistiu. O motivo da
       falha fica em bruto.envio.erro e aparece ao passar o mouse. */
    const pend=m.status==='pendente_envio'?' · ⏳ na fila':(m.status==='enviando'?' · ⏳ enviando':(m.status==='erro_envio'?' · ⚠ não saiu':''));
    const motivo=(m.status==='erro_envio'&&m.bruto&&m.bruto.envio&&m.bruto.envio.erro)?` title="${escA(m.bruto.envio.erro)}"`:'';
    html+=`<div class="chatb ${cls}"${motivo}>${chatCorpoMsg(m)}<span class="chatb-meta">${esc(autor)}${chatHoraMsg(m)}${pend}</span></div>`;
  });
  feed.innerHTML=html;
  chatCarregarMidias(feed);
  chatGrudarNoFim(feed);
}

/* ============================================================
   GRAVADOR DE AUDIO — serve a Caixa de Entrada e o chat do cartao
   ============================================================
   O MediaRecorder nativo do Chrome so entrega audio/webm. Testado em
   17/08/2026: o WhatsGW aceita webm e responde sucesso, o WhatsApp
   descarta sem avisar — a mensagem fica "enviada" no CRM e a cliente
   nunca recebe. So ogg/opus vira nota de voz. Dai o encoder wasm.

   O encoder e baixado SO no primeiro toque no microfone: sao algumas
   centenas de KB que ninguem deve pagar so por abrir a tela.

   POR QUE UM GRAVADOR SO PARA AS DUAS TELAS: elas guardam o destino em
   lugares diferentes (IB_CONVS na Caixa de Entrada, mcChat* no cartao).
   Duas copias do gravador seriam duas chances de corrigir uma e
   esquecer a outra. Aqui a tela so diz QUEM e o destino.
   ============================================================ */
const GRAV_OMR='https://cdn.jsdelivr.net/npm/opus-media-recorder@0.8.0/';
const GRAV_MAX_MS=5*60*1000; // 5 min: acima disso o arquivo se aproxima do limite de envio
let gravOmrPronto=null,gravador=null,gravStream=null,gravBlob=null,gravUrl=null,gravInicio=0,gravTimer=null,gravDurMs=0,gravDest=null;

/* Traduz "de qual tela veio" para tudo que o envio precisa saber. */
function gravMontarDestino(onde){
  if(onde==='card'){
    if(!mcClienteId)return null;
    return{onde:'card',canal:mcChatCanal,chave:mcChatChave,tel:mcChatTel,clienteId:mcClienteId,
      idBox:'mc-grav',idEscrever:'mc-escrever',
      recarregar:()=>{mcChatAssinatura='';carregarChat(mcClienteId);}};
  }
  const c=IB_CONVS.find(x=>x.chave===ibSelId);
  if(!c)return null;
  return{onde:'inbox',canal:c.canal,chave:c.telefoneChave,
    tel:c.ultimaMsg?c.ultimaMsg.telefone_bruto:null,clienteId:c.clienteId,
    idBox:'ib-grav',idEscrever:'ib-escrever',
    recarregar:()=>{ibChatAssinatura='';ibCarregarChat(c);}};
}

function gravCarregarEncoder(){
  if(gravOmrPronto)return gravOmrPronto;
  gravOmrPronto=(async()=>{
    if(!window.OpusMediaRecorder){
      await new Promise((ok,falha)=>{
        const sc=document.createElement('script');
        sc.src=GRAV_OMR+'OpusMediaRecorder.umd.js';
        sc.onload=ok;sc.onerror=()=>falha(new Error('nao consegui baixar o gravador'));
        document.head.appendChild(sc);
      });
    }
    /* O Worker TEM que vir do mesmo dominio: new Worker() apontando para
       outro site e bloqueado pelo navegador. Baixamos o codigo como
       texto e montamos um Worker a partir de um blob local. O .wasm
       continua vindo do CDN, que isso o fetch de dentro do worker faz. */
    const txt=await (await fetch(GRAV_OMR+'encoderWorker.umd.js')).text();
    const urlWorker=URL.createObjectURL(new Blob([txt],{type:'text/javascript'}));
    return{
      encoderWorkerFactory:()=>new Worker(urlWorker),
      OggOpusEncoderWasmPath:GRAV_OMR+'OggOpusEncoder.wasm',
      WebMOpusEncoderWasmPath:GRAV_OMR+'WebMOpusEncoder.wasm'
    };
  })().catch(e=>{gravOmrPronto=null;throw e;});
  return gravOmrPronto;
}

function gravTempo(ms){
  const t=Math.floor(ms/1000);
  return Math.floor(t/60)+':'+String(t%60).padStart(2,'0');
}

/* Desenha a area de gravacao e esconde a caixa de texto enquanto ela
   estiver ocupada — escrever e gravar ao mesmo tempo so gera duvida
   sobre o que o botao Enviar vai mandar. */
function gravPintar(estado){
  const alvos=gravDest?[gravDest]:[{idBox:'ib-grav',idEscrever:'ib-escrever'},{idBox:'mc-grav',idEscrever:'mc-escrever'}];
  alvos.forEach(d=>{
    const box=$(d.idBox),escrever=$(d.idEscrever);
    if(escrever)escrever.style.display=(estado==='gravando'||estado==='pronto')?'none':'';
    if(!box)return;
    if(estado==='carregando'){
      box.innerHTML='<span class="ib-grav-txt">Preparando o gravador...</span>';
    }else if(estado==='gravando'){
      box.innerHTML=`<span class="ib-grav-ponto"></span><span class="ib-grav-tempo" id="grav-tempo">0:00</span>
        <button class="pr" onclick="gravParar()">Parar</button>
        <button onclick="gravCancelar()">Cancelar</button>`;
    }else if(estado==='pronto'){
      box.innerHTML=`<audio controls src="${gravUrl}"></audio>
        <button class="pr" id="grav-env" onclick="gravEnviar()">Enviar áudio</button>
        <button onclick="gravCancelar()">Descartar</button>`;
    }else{
      box.innerHTML='';
    }
  });
}

/* Soltar o microfone e obrigatorio: sem isto o Android mantem a bolinha
   vermelha de "gravando" na barra de status depois que a gente parou. */
function gravSoltarMicrofone(){
  if(gravStream){gravStream.getTracks().forEach(t=>t.stop());gravStream=null;}
  if(gravTimer){clearInterval(gravTimer);gravTimer=null;}
}

async function gravMicClique(onde){
  const d=gravMontarDestino(onde);
  if(!d){toast('Abra uma conversa primeiro','er');return;}
  if(!d.canal){toast('Este contato nao tem canal de WhatsApp definido','er');return;}
  if(!d.chave){toast('Este contato nao tem telefone valido','er');return;}
  if(d.canal!=='whatsgw'){toast('Áudio só sai pelo WhatsGW — esta conversa é do canal oficial','er');return;}
  if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){toast('Este navegador nao grava audio','er');return;}
  gravDest=d;
  try{
    gravPintar('carregando');
    const opcoes=await gravCarregarEncoder();
    const stream=await navigator.mediaDevices.getUserMedia({audio:true});
    gravStream=stream;
    const pedacos=[];
    gravador=new OpusMediaRecorder(stream,{mimeType:'audio/ogg'},opcoes);
    gravador.ondataavailable=e=>{if(e.data&&e.data.size)pedacos.push(e.data);};
    gravador.onstop=()=>{
      gravDurMs=gravInicio?Date.now()-gravInicio:0;
      gravSoltarMicrofone();
      gravBlob=new Blob(pedacos,{type:'audio/ogg'});
      if(gravUrl)URL.revokeObjectURL(gravUrl);
      gravUrl=URL.createObjectURL(gravBlob);
      gravPintar('pronto');
    };
    gravador.onerror=e=>{gravCancelar();toast('Erro ao gravar: '+((e&&e.message)||e),'er');};
    gravador.start();
    gravInicio=Date.now();
    gravPintar('gravando');
    gravTimer=setInterval(()=>{
      const dec=Date.now()-gravInicio;
      const t=$('grav-tempo');if(t)t.textContent=gravTempo(dec);
      if(dec>=GRAV_MAX_MS){toast('Limite de 5 minutos — gravação encerrada','in');gravParar();}
    },400);
  }catch(e){
    gravSoltarMicrofone();gravPintar('');gravDest=null;
    const negado=e&&(e.name==='NotAllowedError'||e.name==='SecurityError');
    toast(negado?'Você precisa permitir o microfone para este site':'Nao consegui gravar: '+((e&&e.message)||e),'er');
  }
}

function gravParar(){
  if(gravador&&gravador.state!=='inactive'){gravador.stop();return;}
  gravSoltarMicrofone();gravPintar('');
}

function gravCancelar(){
  try{if(gravador&&gravador.state!=='inactive')gravador.stop();}catch(e){}
  gravSoltarMicrofone();
  gravador=null;gravBlob=null;
  if(gravUrl){URL.revokeObjectURL(gravUrl);gravUrl=null;}
  gravPintar('');
  gravDest=null;
}

/* Sobe o arquivo e enfileira. Quem entrega no WhatsApp e o motor, igual
   a qualquer outra mensagem: o CRM so cria a linha. */
async function gravEnviar(){
  const d=gravDest;
  if(!d||!gravBlob){toast('Nao ha audio gravado','er');return;}
  if(gravBlob.size>LIMITE_ENVIO_BYTES){
    toast('Áudio de '+(Math.round(gravBlob.size/104857.6)/10)+' MB — o limite de envio é 5 MB','er');return;
  }
  const bt=$('grav-env');if(bt){bt.disabled=true;bt.textContent='Enviando...';}
  const agora=new Date();
  const nome='audio-'+agora.toISOString().slice(0,19).replace(/[:T-]/g,'')+'.ogg';
  const caminho='audios/'+(d.clienteId||d.chave)+'/'+Date.now()+'.ogg';
  const{error:eu}=await sb.storage.from(ANEXO_BUCKET).upload(caminho,gravBlob,{contentType:'audio/ogg'});
  if(eu){if(bt){bt.disabled=false;bt.textContent='Enviar áudio';}toast('Erro ao subir o audio: '+eu.message,'er');return;}
  /* O mimetype vai com o codec junto, exatamente como no teste que
     chegou como nota de voz. Sem "codecs=opus" nao foi testado — e este
     e o campo que o WhatsGW repassa ao WhatsApp. */
  const{error}=await sb.from('crm_mensagens').insert({
    cliente_id:d.clienteId,
    telefone_chave:d.chave,
    telefone_bruto:d.tel||null,
    canal:d.canal,
    direcao:'saida',
    autor_tipo:'humano',
    usuario_id:U.id,
    tipo:'audio',
    midia_caminho:caminho,
    midia_nome:nome,
    midia_mime:'audio/ogg; codecs=opus',
    midia_tamanho:gravBlob.size,
    id_externo:'crm:'+Date.now()+':'+Math.random().toString(36).slice(2,8),
    status:'pendente_envio'
  });
  if(error){if(bt){bt.disabled=false;bt.textContent='Enviar áudio';}toast('Erro ao enfileirar: '+error.message,'er');return;}
  const dur=gravTempo(gravDurMs),recarregar=d.recarregar;
  if(d.clienteId)registrarAtividade(d.clienteId,'mandou um áudio de '+dur+' para a cliente');
  gravCancelar();
  if(recarregar)recarregar();
  toast('Áudio na fila — sai em até 1 minuto','ok');
}
