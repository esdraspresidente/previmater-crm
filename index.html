/* Quadro > lista, com ha quanto tempo o cartao parou ali. O tempo na
   lista e o que denuncia caso esquecido: "Lead novo" nao diz nada,
   "Lead novo ha 9 dias" diz tudo. */
async function mcPintarTrilha(c){
  const box=$('mc-trilha');
  if(!box)return;
  const quadro=c.quadro&&QUADROS[c.quadro]?QUADROS[c.quadro].rotulo:'Sem quadro';
  let lista='sem lista';
  if(c.lista_id){
    const{data}=await sb.from('crm_listas').select('nome').eq('id',c.lista_id).limit(1);
    if(data&&data[0])lista=data[0].nome;
  }
  if(!$('mc-trilha')||mcClienteId!==c.id)return; // o cartao ja foi fechado ou trocado
  let desde='';
  if(c.lista_desde){
    const dias=Math.floor((Date.now()-new Date(c.lista_desde).getTime())/86400000);
    desde=dias<=0?'entrou hoje nesta lista':(dias===1?'há 1 dia nesta lista':'há '+dias+' dias nesta lista');
  }
  const arq=c.arquivado_em?'<span class="mcdesde">· arquivado</span>':'';
  /* Antes isto fechava o cartao e ia para o quadro. Clicar em "onde o
     cartao esta" para ser expulso do cartao nao ajuda ninguem: quem
     clica ali quer MUDAR onde ele esta. Agora abre o mesmo balao do
     botao "⇄ Mover cartao". */
  box.innerHTML=`<button class="trilha mv-trigger" onclick="abrirMoverPopover(this)" title="Mover cartão">
      <span class="qd">${esc(quadro)}</span><span class="sep">›</span><span>${esc(lista)}</span></button>
    ${desde?`<span class="mcdesde">${esc(desde)}</span>`:''}${arq}`;
  // A pilula do cabecalho grudento diz a mesma coisa: repintada aqui
  // para nao ficar mostrando a lista antiga depois de um Salvar.
  const pill=document.querySelector('#mchead-sticky .mchs-lista');
  if(pill)pill.textContent=quadro+' · '+lista;
}

/* Todas as sequencias em que esta cliente esta inscrita.
   Uma linha por sequencia, nao por mensagem: a fila de automacoes ja
   mostra mensagem a mensagem, e aqui a pergunta e outra — "o que esta
   rodando para ela?". O que ja terminou fica escondido atras do botao,
   senao em duas semanas o bloco empurra o cartao inteiro para baixo. */
let mcSeqMostrarFim=false;
async function mcCarregarSequencias(clienteId){
  const box=$('mc-seqs');
  if(!box)return;
  mcSeqMostrarFim=false;
  /* texto_montado entra no select porque o Editar precisa dele. Nao ha
     risco de egress aqui: e texto curto de uma cliente so, nao a coluna
     bruto nem base64. */
  const{data:autos,error}=await sb.from('crm_automacoes')
    .select('id,sequencia_id,tipo_automacao,ordem,status,data_hora_agendada,enviado_em,motivo_cancelamento,criado_em,texto_montado')
    .eq('cliente_id',clienteId).order('criado_em',{ascending:true}).limit(500);
  if(!$('mc-seqs')||mcClienteId!==clienteId)return;
  if(error){box.innerHTML='<div class="seqbox"><div class="seqvazio">Erro ao carregar: '+esc(error.message)+'</div></div>';return;}
  const linhas=autos||[];
  if(!linhas.length){box.innerHTML='<div class="seqbox"><div class="seqvazio">Nenhuma sequência rodando para esta cliente.</div></div>';return;}
  const ids=[...new Set(linhas.filter(a=>a.sequencia_id).map(a=>a.sequencia_id))];
  let nomes={},totais={};
  if(ids.length){
    const[{data:seqs},{data:cads}]=await Promise.all([
      sb.from('crm_sequencias').select('id,nome').in('id',ids),
      sb.from('crm_cadencia').select('sequencia_id,ordem').in('sequencia_id',ids).limit(1000)
    ]);
    (seqs||[]).forEach(x=>{nomes[x.id]=x.nome;});
    (cads||[]).forEach(x=>{totais[x.sequencia_id]=Math.max(totais[x.sequencia_id]||0,x.ordem||0);});
  }
  MC_AUTOS=linhas;
  MC_SEQS=mcAgruparSequencias(linhas,nomes,totais);
  mcRenderSequencias();
}
let MC_SEQS=[];
/* As linhas cruas, para o filaAchar(): o cartao agrupa por sequencia,
   mas Editar e Reagendar agem sobre uma automacao especifica. */
let MC_AUTOS=[];

/* Uma sequencia pode ter varias automacoes ao mesmo tempo. O estado que
   vale e o mais urgente: o que espera voce vem antes do que esta
   agendado, que vem antes do que esta pausado. */
const SEQ_PESO={aguardando_aprovacao:5,erro:4,agendado:3,vencida:3,pausado:2};
function mcAgruparSequencias(linhas,nomes,totais){
  const grupos={};
  linhas.forEach(a=>{
    const chave=a.sequencia_id||('avulsa:'+(a.tipo_automacao||'?'));
    if(!grupos[chave]){
      grupos[chave]={
        nome:a.sequencia_id?(nomes[a.sequencia_id]||'Sequência sem nome'):(a.tipo_automacao||'Avulsa'),
        total:a.sequencia_id?(totais[a.sequencia_id]||0):0,
        peso:0,estado:'fim',ordem:a.ordem||0,quando:null,motivo:null,ultima:null,id:null
      };
    }
    const g=grupos[chave];
    if(a.enviado_em&&(!g.ultima||a.enviado_em>g.ultima))g.ultima=a.enviado_em;
    const peso=SEQ_PESO[a.status]||0;
    if(peso>g.peso){
      g.peso=peso;g.estado=a.status;g.ordem=a.ordem||g.ordem;
      g.quando=a.data_hora_agendada||null;g.motivo=a.motivo_cancelamento||null;
      /* QUAL automacao produziu este estado. Sem guardar o id, os botoes
         da linha nao teriam sobre o que agir: o cartao mostra UMA linha
         por sequencia, e uma sequencia pode ter varias automacoes ao
         mesmo tempo. Age-se sobre a que esta mandando no estado — a
         mesma que a linha esta descrevendo. */
      g.id=a.id;
    }
    if(!g.peso&&(a.ordem||0)>g.ordem)g.ordem=a.ordem||g.ordem;
  });
  const vivos=[],mortos=[];
  Object.values(grupos).forEach(g=>(g.peso?vivos:mortos).push(g));
  vivos.sort((a,b)=>b.peso-a.peso);
  return{vivos,mortos};
}

function mcQuandoTexto(iso){
  if(!iso)return '';
  const d=new Date(iso),hoje=new Date();
  const hora=d.toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'});
  if(d.toDateString()===hoje.toDateString())return 'hoje às '+hora;
  const amanha=new Date(hoje.getTime()+86400000);
  if(d.toDateString()===amanha.toDateString())return 'amanhã às '+hora;
  return d.toLocaleDateString('pt-BR')+' às '+hora;
}

function mcSeqLinha(g,viva){
  const passo=g.total?('passo '+(g.ordem||1)+' de '+g.total):(g.ordem?('passo '+g.ordem):'');
  let ic='ic-fim',sim='✓',sub='';
  if(g.estado==='aguardando_aprovacao'){ic='ic-esp';sim='⏳';sub='esperando sua aprovação';}
  else if(g.estado==='agendado'){ic='ic-and';sim='▶';sub=g.quando?('próxima '+mcQuandoTexto(g.quando)):'agendada';}
  else if(g.estado==='vencida'){ic='ic-esp';sim='⏳';sub='vencida — passou da hora e não saiu';}
  else if(g.estado==='pausado'){ic='ic-pau';sim='⏸';sub='pausada'+(g.motivo?' — '+g.motivo:'');}
  else if(g.estado==='erro'){ic='ic-err';sim='⚠';sub='falhou no envio';}
  else sub=g.ultima?('terminou '+mcQuandoTexto(g.ultima)):'encerrada';
  /* AS MESMAS DECISOES DA FILA, AQUI DENTRO — 26/08/2026.
     Antes este bloco era so leitura: dava para VER que a Pedir
     Documentacao estava no passo 4 de 4 e nao dava para fazer nada com
     isso sem sair do cartao, abrir a Fila e cacar a linha. Os botoes sao
     os mesmos porque a tabela e a mesma (crm_automacoes) — nao sao duas
     verdades, e a mesma verdade com dois lugares para clicar.
     So a linha VIVA ganha botoes: sequencia encerrada nao tem o que
     pausar nem reagendar. */
  const b=(fn,rot,cls)=>`<button class="btn ${cls||'btns'}" style="padding:6px 11px;font-size:11.5px" onclick="mcSeqAcao('${fn}','${g.id}')">${rot}</button>`;
  let bts='';
  if(viva&&g.id){
    if(g.estado==='aguardando_aprovacao')bts=b('filaAprovar','✓ Aprovar','btnp')+b('filaEditar','✎ Editar')+b('filaCancelar','✕ Cancelar');
    else if(g.estado==='agendado')bts=b('filaEnviarAgora','➤ Enviar agora','btnp')+b('filaPausar','⏸ Pausar')+b('filaReagendar','🕐 Reagendar')+b('filaEditar','✎ Editar')+b('filaCancelar','✕ Cancelar');
    else if(g.estado==='vencida')bts=b('filaEnviarAgora','➤ Enviar agora','btnp')+b('filaReagendar','🕐 Reagendar')+b('filaEditar','✎ Editar')+b('filaCancelar','✕ Descartar');
    else if(g.estado==='pausado')bts=b('filaRetomar','▶ Retomar','btnp')+b('filaCancelar','✕ Cancelar');
    else if(g.estado==='erro')bts=b('filaRetomar','↻ Tentar de novo','btnp')+b('filaCancelar','✕ Cancelar');
  }
  return`<div class="seqlinha${viva?' viva':''}">
    <div class="seqic ${ic}">${sim}</div>
    <div class="seqcorpo"><div class="seqnome${viva?'':' morta'}">${esc(g.nome)}</div>
      <div class="seqsub">${esc(sub)}</div>
      ${bts?`<div class="seqacoes">${bts}</div>`:''}</div>
    ${passo?`<div class="seqpasso">${esc(passo)}</div>`:''}
  </div>`;
}

function mcRenderSequencias(){
  const box=$('mc-seqs');
  if(!box)return;
  const{vivos,mortos}=MC_SEQS;
  let html='<div class="seqbox">';
  if(!vivos.length&&!mortos.length)html+='<div class="seqvazio">Nenhuma sequência rodando para esta cliente.</div>';
  if(!vivos.length&&mortos.length)html+='<div class="seqvazio">Nenhuma sequência rodando agora.</div>';
  vivos.forEach(g=>{html+=mcSeqLinha(g,true);});
  if(mcSeqMostrarFim)mortos.forEach(g=>{html+=mcSeqLinha(g,false);});
  if(mortos.length){
    html+=`<button class="seqverfim" onclick="mcSeqTogFim()">${mcSeqMostrarFim?'esconder as que já terminaram':'mostrar '+(mortos.length===1?'a que já terminou':'as '+mortos.length+' que já terminaram')}</button>`;
  }
  /* DISPARAR NA MAO — 26/08/2026, item 293.
     Até aqui toda sequência nascia de gatilho automático. Não havia como
     dizer "manda a promo_500 para esta aqui". */
  html+=`<button class="seqverfim" style="border-top:1px solid var(--border2)" onclick="mcAbrirDisparo()">＋ disparar uma sequência na mão</button>`;
  box.innerHTML=html+'</div>';
}
function mcSeqTogFim(){mcSeqMostrarFim=!mcSeqMostrarFim;mcRenderSequencias();}

/* ============================================================
   DISPARAR SEQUENCIA NA MAO
   ============================================================

   O CRM NAO CRIA A AUTOMACAO. Ele escreve o codigo em
   crm_clientes.sequencia_solicitada e o motor chama o agendarSequencia()
   de verdade na rodada seguinte, em ate 1 minuto.

   Fazer a linha aqui obrigaria esta tela a repetir janela de horario,
   unidade de atraso util, so_por_gatilho, sorteio de braco, mover_para e
   etiqueta — tudo que o motor ja sabe. Seriam duas verdades sobre
   cadencia, e elas divergiriam no primeiro ajuste. */
let MC_SEQ_LISTA=null;
/* Para quem e o disparo e para onde a tela volta depois. Guardados aqui
   porque o seletor serve DOIS lugares — o cartao e a Caixa de Entrada —
   e cada um volta para um lugar diferente. */
let DISP_ALVO=null,DISP_VOLTA_CARTAO=false;

/* Atalho do cartao: quem esta aberto e o alvo, e a volta e para ele. */
function mcAbrirDisparo(){return abrirDisparoSequencia(mcClienteId,true);}

async function abrirDisparoSequencia(clienteId,voltarParaCartao){
  const alvo=clienteId;
  if(!alvo)return;
  DISP_ALVO=alvo;DISP_VOLTA_CARTAO=!!voltarParaCartao;
  abrirModal('<div class="mbt">Disparar sequência</div><div class="mbs">Carregando...</div>');
  if(!MC_SEQ_LISTA){
    /* As sequencias ativas e o passo 1 de cada uma. A previa importa: os
       nomes nao dizem o que a mulher vai receber, e "fecha_auto" pode ser
       qualquer coisa na cabeca de quem clica as 23h. */
    const[{data:seqs,error:e1},{data:cads}]=await Promise.all([
      sb.from('crm_sequencias').select('id,codigo,nome,etapa,precisa_aprovacao').eq('ativa',true).order('etapa').order('codigo'),
      sb.from('crm_cadencia').select('sequencia_id,ordem,texto,ativa').eq('ordem',1).limit(1000)
    ]);
    if(e1){abrirModal('<div class="mbt">Disparar sequência</div><div class="mbs">Erro ao carregar: '+esc(e1.message)+'</div><div class="brow" style="justify-content:flex-end"><button class="btn btns" onclick="dispFechar()">Voltar</button></div>');return;}
    const p1={};(cads||[]).forEach(c=>{if(c.ativa!==false&&String(c.texto||'').trim())p1[c.sequencia_id]=c.texto;});
    MC_SEQ_LISTA=(seqs||[]).map(x=>({...x,previa:p1[x.id]||null}));
  }
  if(DISP_ALVO!==alvo)return; // trocaram de conversa enquanto carregava
  /* Quais ja estao rodando para ela: disparar de novo nao faz nada (o
     agendarSequencia recusa duplicata) e o clique pareceria quebrado.
     VEM DO BANCO e nao do MC_SEQS do cartao: na Caixa de Entrada aquele
     cache nao existe, e usar um cache de outra tela daria lista errada
     calada — que e pior do que uma consulta a mais. */
  const{data:vivas}=await sb.from('crm_automacoes')
    .select('sequencia_id').eq('cliente_id',alvo)
    .in('status',['agendado','aguardando_aprovacao','enviando','vencida','pausado']);
  const rodando=new Set((vivas||[]).map(v=>v.sequencia_id));
  const linhas=MC_SEQ_LISTA.map(x=>{
    const jaRoda=rodando.has(x.id);
    const semTexto=!x.previa;
    const trava=jaRoda||semTexto;
    const aviso=jaRoda?'<span style="color:var(--yellow);font-weight:800">já está rodando</span>'
              :(semTexto?'<span style="color:var(--text3)">sem texto ainda</span>'
              :(x.precisa_aprovacao?'<span style="color:var(--text3)">passa pela sua aprovação</span>':''));
    return`<button class="dispitem${trava?' off':''}" ${trava?'disabled':''} onclick="mcConfirmarDisparo('${esc(x.codigo)}','${escA(x.nome)}')">
      <div class="dispnome">${esc(x.nome)} <span class="dispcod">${esc(x.codigo)}</span></div>
      ${aviso?`<div class="dispav">${aviso}</div>`:''}
      ${x.previa?`<div class="disppre">${esc(String(x.previa).slice(0,160))}${String(x.previa).length>160?'…':''}</div>`:''}
    </button>`;
  }).join('');
  abrirModal(`
    <div class="mbt">Disparar sequência na mão</div>
    <div class="mbs">A mensagem entra na fila e o motor entrega em até 1 minuto, no ritmo de sempre.</div>
    <div class="fhint" style="margin-bottom:12px">Sequência de etapa mais adiantada <b>cancela o que estiver pendente das etapas anteriores</b> — é assim que o funil funciona, e vale também no disparo manual.</div>
    <div class="displista">${linhas||'<div class="seqvazio">Nenhuma sequência ativa.</div>'}</div>
    <div class="brow" style="justify-content:flex-end;gap:9px;margin-top:14px">
      <button class="btn btns" onclick="dispFechar()">Voltar</button>
    </div>`,true);
  if(DISP_VOLTA_CARTAO)FILA_VOLTAR=alvo;
}

/* Desistir do disparo. Do cartao devolve o cartao (o filaFecharDialogo
   ja sabe fazer isso); da Caixa de Entrada so fecha. */
function dispFechar(){
  DISP_ALVO=null;
  const eraCartao=DISP_VOLTA_CARTAO;
  DISP_VOLTA_CARTAO=false;
  if(eraCartao)filaFecharDialogo(); else fecharModal();
}

async function mcConfirmarDisparo(codigo,nome){
  const alvo=DISP_ALVO;
  if(!alvo)return;
  const{error}=await sb.from('crm_clientes').update({
    sequencia_solicitada:codigo,
    sequencia_solicitada_em:new Date().toISOString(),
    sequencia_solicitada_por:U.id
  }).eq('id',alvo);
  if(error){toast('Erro: '+error.message,'er');return;}
  registrarAtividade(alvo,'pediu para disparar a sequência '+nome);
  toast(nome+' na fila — sai em até 1 minuto','ok');
  FILA_VOLTAR=null;DISP_ALVO=null;
  fecharModal();
  /* Da Caixa de Entrada NAO abre o cartao: quem estava lendo a conversa
     quer continuar lendo a conversa. Abrir o cartao por cima seria
     mudar de tela sem ninguem ter pedido. */
  if(DISP_VOLTA_CARTAO)await abrirCardCliente(alvo);
  DISP_VOLTA_CARTAO=false;
}

async function ibEnviarMensagem(){
  const c=IB_CONVS.find(x=>x.chave===ibSelId);
  const inp=$('ib-chat-input');
  if(!c||!inp)return;
  const txt=(inp.value||'').trim();
  if(!txt){toast('Escreva a mensagem primeiro','er');return;}
  if(!c.canal){toast('Este contato não tem um canal de WhatsApp definido','er');return;}
  const btn=$('ib-chat-btn');
  if(btn){btn.disabled=true;btn.textContent='Registrando...';}
  /* Mesmo CHECK do chat do card: sem id_externo o banco recusa. */
  if(!c.telefoneChave){toast('Este contato nao tem telefone valido','er');if(btn){btn.disabled=false;btn.textContent='Enviar';}return;}
  const{data:nova,error}=await sb.from('crm_mensagens').insert({
    cliente_id:c.clienteId,
    telefone_chave:c.telefoneChave,
    telefone_bruto:c.ultimaMsg?c.ultimaMsg.telefone_bruto:null,
    canal:c.canal,
    direcao:'saida',
    autor_tipo:'humano',
    usuario_id:U.id,
    tipo:'texto',
    texto:txt,
    id_externo:'crm:'+Date.now()+':'+Math.random().toString(36).slice(2,8),
    status:'pendente_envio'
  }).select('id').single();
  if(error){
    if(btn){btn.disabled=false;btn.textContent='Enviar';}
    toast('Erro ao registrar: '+error.message,'er');
    return;
  }
  /* Mesma coisa do chat do card: esvazia a caixa, mostra na conversa,
     entrega, e so entao troca o aviso pelo estado real. */
  inp.value='';
  ibChatAssinatura='';
  ibCarregarChat(c);
  if(btn)btn.textContent='Enviando...';
  const env=await enviarJaPeloMotor(nova.id);
  if(btn){btn.disabled=false;btn.textContent='Enviar';}
  ibChatAssinatura='';
  ibCarregarChat(c);
  toast(env.ok?'Enviada':'Na fila — sai em até 1 minuto','ok');
}

// ============================================================
// CRIAR CLIENTE A PARTIR DE UM CONTATO NOVO (lead) NA CAIXA DE ENTRADA
// Regra: um contato (telefone) nunca pode virar dois cartões.
// ============================================================
function ibAbrirCriarCliente(chave){
  const c=IB_CONVS.find(x=>x.chave===chave);
  if(!c)return;
  const optQ=QPERM.map(q=>`<option value="${q}">${QUADROS[q].rotulo}</option>`).join('');
  pararInboxPoll();
  abrirModal(`
    <button class="mbc" onclick="ibCancelarCriarCliente()">×</button>
    <div class="mbt">Criar cliente a partir deste contato</div>
    <div class="mbs">O histórico de mensagens já trocadas com este número entra automaticamente no card, na aba Chat.</div>
    <div class="fld" style="margin-bottom:13px"><label>Nome completo</label><input type="text" id="ibc-nome" placeholder="Nome da cliente"/></div>
    <div class="fg" style="margin-bottom:13px">
      <div class="fld"><label>Quadro</label><select id="ibc-quadro" onchange="ibcTrocarQuadro()">${optQ}</select></div>
      <div class="fld"><label>Lista</label><select id="ibc-lista"><option value="">Carregando...</option></select></div>
    </div>
    <div class="fld" style="margin-bottom:20px"><label>Telefone</label><input type="text" id="ibc-tel" value="${escA(c.ultimaMsg.telefone_bruto||c.telefoneChave||'')}"/></div>
    <div class="brow" style="justify-content:flex-end;gap:9px">
      <button class="btn btns" onclick="ibCancelarCriarCliente()">Cancelar</button>
      <button class="btn btnp" id="ibc-btn-criar" onclick="ibConfirmarCriarCliente('${escA(chave)}')">Criar cliente</button>
    </div>`);
  ibcTrocarQuadro();
}
function ibCancelarCriarCliente(){
  fecharModal();
  if(location.hash.slice(1)==='/inbox')ibIniciarListaPoll();
}
async function ibcTrocarQuadro(){
  const sel=$('ibc-lista'),q=$('ibc-quadro');
  if(!sel||!q)return;
  const{data}=await sb.from('crm_listas').select('*').eq('quadro',q.value).eq('arquivada',false).order('ordem');
  sel.innerHTML=(data||[]).map(l=>`<option value="${l.id}">${esc(l.nome)}</option>`).join('')||'<option value="">Nenhuma lista neste quadro</option>';
}
async function ibConfirmarCriarCliente(chave){
  const c=IB_CONVS.find(x=>x.chave===chave);
  if(!c)return;
  const nome=($('ibc-nome').value||'').trim();
  const listaId=$('ibc-lista').value,quadro=$('ibc-quadro').value;
  const tel=($('ibc-tel').value||'').trim();
  if(!nome){toast('Digite o nome da cliente','er');return;}
  if(!listaId){toast('Escolha uma lista','er');return;}
  const btn=$('ibc-btn-criar');
  if(btn){btn.disabled=true;btn.textContent='Verificando...';}
  if(c.telefoneChave){
    const{data:existente}=await sb.from('crm_clientes').select('id,nome_completo').eq('telefone_chave',c.telefoneChave).limit(1);
    if(existente&&existente.length){
      if(btn){btn.disabled=false;btn.textContent='Criar cliente';}
      const ex=existente[0];
      if(confirm('Este número já é de uma cliente cadastrada: '+ex.nome_completo+'. Não é possível ter dois cartões para o mesmo contato. Abrir o cartão dela agora?')){
        fecharModal();abrirCardCliente(ex.id);
      }else if(location.hash.slice(1)==='/inbox')ibIniciarListaPoll();
      return;
    }
  }
  if(btn)btn.textContent='Criando...';
  const{data:novo,error}=await sb.from('crm_clientes').insert({nome_completo:nome,telefone_principal:tel||null,canal_ativo:c.canal||'whatsgw',quadro,lista_id:listaId}).select('id').single();
  if(error||!novo){if(btn){btn.disabled=false;btn.textContent='Criar cliente';}toast('Erro ao criar cliente: '+(error?error.message:''),'er');return;}
  let migradas=0;
  if(c.telefoneChave){
    const{data:atualizadas}=await sb.from('crm_mensagens').update({cliente_id:novo.id}).eq('telefone_chave',c.telefoneChave).is('cliente_id',null).select('id');
    migradas=(atualizadas||[]).length;
  }
  await registrarAtividade(novo.id,'card criado a partir de uma conversa de WhatsApp'+(migradas?' · '+migradas+' '+(migradas>1?'mensagens importadas':'mensagem importada')+' do histórico':''));
  toast('Cliente criada a partir da conversa','ok');
  fecharModal();
  abrirCardCliente(novo.id);
}
</script>

if('serviceWorker' in navigator){
  window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
}
</script>
