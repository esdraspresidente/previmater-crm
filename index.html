/* Copiar sem precisar revelar. A senha fica mascarada porque a tela do
   CRM é aberta ao lado de gente, mas quem vai protocolar precisa dela na
   área de transferência — e selecionar texto num campo password não
   funciona em todo navegador. */
async function mcCopiarSenha(btn){
  const inp=$('mc-senha-inss');
  const v=(inp&&inp.value||'').trim();
  if(!v){toast('Nenhuma senha salva neste card','er');return;}
  try{
    await navigator.clipboard.writeText(v);
  }catch(e){
    // clipboard bloqueado (http, permissão): cai no jeito antigo
    const era=inp.type; inp.type='text'; inp.select();
    try{document.execCommand('copy');}catch(_){ }
    inp.type=era; window.getSelection&&window.getSelection().removeAllRanges();
  }
  const antes=btn.textContent;
  btn.textContent='✅';
  setTimeout(()=>{btn.textContent=antes;},1200);
  toast('Senha copiada');
}

async function salvarCardCliente(id){
  const nome=$('mc-nome').value.trim();
  if(!nome){toast('Preencha o nome','er');return;}
  const quadro=$('mc-quadro').value,listaId=$('mc-lista').value||null;
  const linkContrato=$('mc-link-contrato')?$('mc-link-contrato').value.trim():'';

  // A lista "Contrato enviado" e o gatilho: o motor so manda o contrato
  // para a cliente quando o card chega la COM link. Sem link, o card
  // fica parado e ninguem avisa — entao o aviso e aqui.
  if(listaId===LISTA_CONTRATO_ENVIADO&&!linkContrato){
    if(!confirm('Este card esta indo para "Contrato enviado" sem o link do contrato.\n\nA Samara nao vai mandar nada ate o link ser preenchido — o card fica parado.\n\nMover assim mesmo?'))return;
  }

  const payload={
    nome_completo:nome,
    telefone_principal:$('mc-tel').value.trim()||null,
    cpf:$('mc-cpf').value.trim()||null,
    senha_inss:$('mc-senha-inss').value.trim()||null,
    link_contrato:linkContrato||null,
    referencia1_nome:$('mc-ref1-nome').value.trim()||null,
    referencia1_telefone:$('mc-ref1-tel').value.trim()||null,
    referencia2_nome:$('mc-ref2-nome').value.trim()||null,
    referencia2_telefone:$('mc-ref2-tel').value.trim()||null,
    canal_whatsapp:$('mc-canal').value||null,
    origem:$('mc-origem').value||null,
    trello_url:$('mc-trello').value.trim()||null,
    quadro:quadro,
    lista_id:listaId,
    data_entrega:$('mc-entrega').value||null,
    data_nascimento_bebe:$('mc-dn').value||null,
    data_saida_emprego:$('mc-ds').value||null,
    data_desbloqueio_inss:$('mc-bloqueio').value||null,
    documento_pendente:$('mc-docpend').value.trim()||null,
    valor_beneficio_esperado:m2f($('mc-vb'))||null,
    valor_honorarios:m2f($('mc-vh'))||null,
    observacoes:$('mc-obs').value.trim()||null,
    atualizado_em:new Date().toISOString()
  };
  const etqSel=mcEtqSelAtual.slice();
  const btn=$('mc-btn-salvar');btn.disabled=true;btn.textContent='Salvando...';
  const{error}=await sb.from('crm_clientes').update(payload).eq('id',id);
  if(error){toast('Erro ao salvar: '+error.message,'er');btn.disabled=false;btn.textContent='Salvar';return;}
  await sb.from('crm_clientes_etiquetas').delete().eq('cliente_id',id);
  if(etqSel.length)await sb.from('crm_clientes_etiquetas').insert(etqSel.map(e=>({cliente_id:id,etiqueta_id:e})));
  finCarregado=false;

  if(mcOriginal){
    if(mcOriginal.lista_id!==listaId&&mcOriginal.lista_id){
      await registrarMovimentoLista(id,mcOriginal.lista_id,listaId);
    }else if(mcOriginal.nome_completo!==nome){
      registrarAtividade(id,`renomeou o cartão de "${mcOriginal.nome_completo}" para "${nome}"`);
    }
  }

  fecharModal();toast('Cliente atualizado','ok');
  refrescarRotaAtual();
}

let VA_LISTA=null,VA_PAGINA=0,VA_ITENS=[],VA_TOTAL=0,VA_FIM=false;
const VA_PAGE=50;

async function verArquivadosDaLista(listaId){
  VA_LISTA=listaId;VA_PAGINA=0;VA_ITENS=[];VA_FIM=false;VA_TOTAL=0;
  const{data:l}=await sb.from('crm_listas').select('nome,quadro').eq('id',listaId).single();
  abrirModal(`<div class="mbt">Cards arquivados</div>
    <div class="mbs">${l?esc(l.nome):''}${l&&QUADROS[l.quadro]?' · '+QUADROS[l.quadro].rotulo:''}</div>
    <div id="va-lista" style="max-height:56vh;overflow-y:auto;margin-top:10px">
      <div class="fhint" style="text-align:center;padding:20px 0">Carregando...</div>
    </div>
    <div id="va-mais" style="text-align:center;margin-top:12px"></div>`);
  await vaCarregar();
}

async function vaCarregar(){
  const de=VA_PAGINA*VA_PAGE;
  const{data,error,count}=await sb.from('crm_clientes')
    .select('id,nome_completo,telefone_principal,arquivado_em,criado_em',{count:'exact'})
    .eq('lista_id',VA_LISTA).not('arquivado_em','is',null)
    .order('criado_em',{ascending:false}).range(de,de+VA_PAGE-1);
  const box=$('va-lista');if(!box)return;
  if(error){box.innerHTML=`<div class="fhint" style="text-align:center;padding:18px 0">Erro: ${esc(error.message)}</div>`;return;}
  if(count!==null&&count!==undefined)VA_TOTAL=count;
  const lote=data||[];
  VA_ITENS=VA_ITENS.concat(lote);
  if(lote.length<VA_PAGE)VA_FIM=true;
  vaRender();
}

function vaRender(){
  const box=$('va-lista');if(!box)return;
  if(!VA_ITENS.length){
    box.innerHTML='<div class="fhint" style="text-align:center;padding:22px 0">Nenhum card arquivado nesta lista.</div>';
    const m0=$('va-mais');if(m0)m0.innerHTML='';return;
  }
  let h=`<div class="fhint" style="margin-bottom:9px">${VA_TOTAL.toLocaleString('pt-BR')} ${VA_TOTAL===1?'card arquivado':'cards arquivados'}</div>`;
  VA_ITENS.forEach(c=>{
    const d=c.criado_em?new Date(c.criado_em).toLocaleDateString('pt-BR'):'';
    h+=`<div class="va-row">
      <div class="va-info" onclick="fecharModal();abrirCardCliente('${c.id}')">
        <div class="va-nm">${esc(c.nome_completo||'Sem nome')}</div>
        <div class="va-sb">${esc(c.telefone_principal||'')}${d?' · '+d:''}</div>
      </div>
      <button class="btn btns" style="padding:4px 10px;font-size:11px;flex-shrink:0" onclick="vaReativar('${c.id}')">Reativar</button>
    </div>`;
  });
  box.innerHTML=h;
  const mais=$('va-mais');
  if(mais)mais.innerHTML=VA_FIM?'':`<button class="btn btns" onclick="VA_PAGINA++;vaCarregar()">Carregar mais</button>`;
}

async function vaReativar(id){
  const{error}=await sb.from('crm_clientes').update({arquivado_em:null}).eq('id',id);

  toast('Card reativado','ok');

function recalcHonorariosCliente(){
  const vb=m2f($('f-vb'));
  if(vb>0)$('f-vh').value=floatToMoney(vb*PCT_HONORARIOS);

}
function renderCaixaCliente(){
  const vb=m2f($('f-vb')),vh=m2f($('f-vh')),box=$('cbox');
  if(!box)return;
  if(vb<=0&&vh<=0){box.style.display='none';return;}
  box.style.display='block';
  box.innerHTML=`<div class="cr2"><span>Benefício</span><span>${R(vb)}</span></div>
    <div class="cr2"><span>Honorários (30%)</span><span>${R(vh)}</span></div>
    <div class="cr2 tot"><span>Líquido da cliente</span><span>${R(vb-vh)}</span></div>`;
}
async function trocarQuadroForm(){
  const q=$('f-quadro').value;
  const{data:L}=await sb.from('crm_listas').select('*').eq('quadro',q).eq('arquivada',false).order('ordem');

async function salvarCliente(id){
  const btn=$('btn-salvar'),nome=$('f-nome').value.trim();
  if(!nome){toast('Preencha o nome completo','er');return;}
  const quadro=$('f-quadro').value;
  const payload={
    nome_completo:nome,
    cpf:$('f-cpf').value.trim()||null,
    telefone_principal:$('f-tel').value.trim()||null,
    canal_whatsapp:$('f-canal').value||null,
    origem:$('f-origem').value||null,
    trello_url:$('f-trello').value.trim()||null,
    quadro:quadro,
    lista_id:$('f-lista').value||null,
    data_nascimento_bebe:$('f-dn').value||null,
    data_saida_emprego:$('f-ds').value||null,
    data_entrega:$('f-entrega').value||null,
    data_desbloqueio_inss:$('f-bloqueio').value||null,
    documento_pendente:$('f-docpend').value.trim()||null,
    valor_beneficio_esperado:m2f($('f-vb'))||null,
    valor_honorarios:m2f($('f-vh'))||null,
    observacoes:$('f-obs').value.trim()||null,
    atualizado_em:new Date().toISOString()
  };
  const etqSel=[...document.querySelectorAll('#etp .ett.on')].map(e=>e.getAttribute('data-etq'));
  btn.disabled=true;btn.textContent='Salvando...';
  let cid=id,error,ehNovo=!id;
  if(id){({error}=await sb.from('crm_clientes').update(payload).eq('id',id));}
  else{const r=await sb.from('crm_clientes').insert(payload).select('id').single();error=r.error;if(r.data)cid=r.data.id;}
  if(error){toast('Erro ao salvar: '+error.message,'er');btn.disabled=false;btn.textContent=id?'Salvar alterações':'Criar cliente';return;}
  await sb.from('crm_clientes_etiquetas').delete().eq('cliente_id',cid);
  if(etqSel.length)await sb.from('crm_clientes_etiquetas').insert(etqSel.map(e=>({cliente_id:cid,etiqueta_id:e})));
  finCarregado=false;
  if(ehNovo)registrarAtividade(cid,'criou o cadastro deste cartão');
  toast(id?'Cliente atualizado':'Cliente criado','ok');
  location.hash='#/quadro/'+quadro;
}
async function excluirCliente(id){
  if(!confirm('Excluir esta cliente? Essa ação não pode ser desfeita.'))return;
  const{error}=await sb.from('crm_clientes').delete().eq('id',id);
  if(error){toast('Erro ao excluir','er');return;}
  finCarregado=false;toast('Cliente excluída','ok');location.hash='#/';
}

function setFiltro(f){rfiltro=f;renderChips();renderLista();}

function renderChips(){
  const c={todos:0,previstos:0,atrasados:0,recebidos:0,inadimplentes:0,cancelados:0};
  PARC.forEach(p=>{c.todos++;const s=stD(p);
    if(s==='previsto')c.previstos++;else if(s==='atrasado')c.atrasados++;
    else if(s==='recebido')c.recebidos++;else if(s==='inadimplente')c.inadimplentes++;
    else if(s==='cancelado')c.cancelados++;});
  $('rchips').innerHTML=[{k:'todos',l:'Todos',x:''},{k:'previstos',l:'Previstos',x:''},{k:'atrasados',l:'Atrasados',x:'ra'},{k:'recebidos',l:'Recebidos',x:'ga'},{k:'inadimplentes',l:'Inadimplentes',x:''},{k:'cancelados',l:'Cancelados',x:''}]
    .map(x=>`<button class="fchip ${x.x}${rfiltro===x.k?' a':''}" onclick="setFiltro('${x.k}')">${x.l} (${c[x.k]})</button>`).join('');
}
function renderCal(){
  $('calmes').textContent=fMes(calMes);
  const ano=calMes.getFullYear(),mes=calMes.getMonth();
  const dias=new Date(ano,mes+1,0).getDate(),prim=new Date(ano,mes,1).getDay();
  const ms=`${ano}-${String(mes+1).padStart(2,'0')}`,mapa={};
  PARC.filter(p=>p.data_vencimento&&p.data_vencimento.startsWith(ms)).forEach(p=>{
    const d=parseInt(p.data_vencimento.split('-')[2]);
    if(!mapa[d])mapa[d]={n:0,atr:false,rec:false,prev:false};
    mapa[d].n++;const s=stD(p);
    if(s==='atrasado'||s==='inadimplente')mapa[d].atr=true;
    else if(s==='recebido')mapa[d].rec=true;
    else if(s==='previsto')mapa[d].prev=true;
  });
  const tISO=fISO(today());
  let h='<div class="cg">';
  ['Dom','Seg','Ter','Qua','Qui','Sex','Sab'].forEach(d=>h+=`<div class="chd">${d}</div>`);
  for(let i=0;i<prim;i++)h+='<div class="cc em"></div>';
  for(let d=1;d<=dias;d++){
    const iso=`${ms}-${String(d).padStart(2,'0')}`,m=mapa[d];
    let cls='cc';if(iso===tISO)cls+=' td';
    if(m){cls+=' hp';if(m.atr)cls+=' cr';else if(m.rec&&!m.prev)cls+=' cg2';else if(m.prev)cls+=' cy';}
    h+=`<div class="${cls}" ${m?`onclick="abreMDia('${iso}')"`:''}><div class="cd">${d}</div>${m?`<div class="cn">${m.n}</div>`:''}</div>`;
  }
  $('calgrid').innerHTML=h+'</div>';
}
function renderLista(){
  const busca=($('rbusca')&&$('rbusca').value||'').toLowerCase();
  const ord=($('rordem')&&$('rordem').value)||'proximo';
  const mapa={};
  PARC.forEach(p=>{
    if(p.status==='cancelado'&&rfiltro!=='cancelados')return;
    const s=stD(p);
    if(rfiltro==='previstos'&&s!=='previsto')return;
    if(rfiltro==='atrasados'&&s!=='atrasado')return;
    if(rfiltro==='recebidos'&&s!=='recebido')return;
    if(rfiltro==='inadimplentes'&&s!=='inadimplente')return;
    if(rfiltro==='cancelados'&&s!=='cancelado')return;
    const cid=pCli(p)||p.cliente_nome;
    if(!mapa[cid])mapa[cid]={nm:p.cliente_nome,cid:pCli(p),ps:[],prox:null,proxVal:0,tot:0};
    mapa[cid].ps.push(p);mapa[cid].tot+=parseFloat(p.valor_honorario||0);
    if(s==='previsto'||s==='atrasado'){if(!mapa[cid].prox||p.data_vencimento<mapa[cid].prox){mapa[cid].prox=p.data_vencimento;mapa[cid].proxVal=parseFloat(p.valor_honorario||0);}}
  });
  let lista=Object.values(mapa).filter(c=>!busca||(c.nm||'').toLowerCase().includes(busca));
  if(ord==='proximo')lista.sort((a,b)=>{if(!a.prox&&!b.prox)return(a.nm||'').localeCompare(b.nm||'');if(!a.prox)return 1;if(!b.prox)return-1;return a.prox.localeCompare(b.prox);});
  else if(ord==='nome')lista.sort((a,b)=>(a.nm||'').localeCompare(b.nm||''));
  else lista.sort((a,b)=>b.tot-a.tot);
  if(!lista.length){$('rlista').innerHTML=`<div class="emp"><div class="empi">📂</div><div class="empt">Nenhum resultado</div></div>`;return;}
  $('rlista').innerHTML=lista.map(c=>{
    const cli=CLI.find(x=>x.id==c.cid);
    const ind=(REC.find(r=>(r.crm_cliente_id||r.cliente_id)==c.cid&&r.indicador_nome)||{}).indicador_nome;
    const wa=cli&&cli.whatsapp?`<a class="cl2 lwa" href="https://wa.me/55${cli.whatsapp.replace(/\D/g,'')}" target="_blank">💬 WhatsApp</a>`:'';
    const tr=cli&&cli.trello_url?`<a class="cl2 ltr" href="${escA(cli.trello_url)}" target="_blank">📋 Trello</a>`:'';
    const fc=c.cid?`<button class="cl2 lcr" onclick="abrirCardCliente('${c.cid}')">◈ Abrir card</button>`:'';
    const key=`cc_${String(c.cid||c.nm).replace(/\W/g,'_')}`;
    const rid=c.ps[0]&&c.ps[0].recebimento_id;
    const ph=c.ps.map(p=>{
      const s=stD(p);
      const vc=p.valor_cliente&&parseFloat(p.valor_cliente)>0?`<span style="color:var(--green);font-weight:600"> · Cliente: ${R(p.valor_cliente)}</span>`:'';
      const ac=(s!=='recebido'&&s!=='cancelado')?`
        <button class="bic bg" title="Recebido" onclick="abreMRec('${p.id}')">✓</button>
        ${s==='atrasado'?`<button class="bic bp2" title="Inadimplente" onclick="marcaInad('${p.id}')">⚑</button>`:''}
        <button class="bic" style="color:var(--gray)" title="Cancelar" onclick="cancelaP('${p.id}')">✕</button>`
        :(s==='recebido'?`<span style="font-size:10px;color:var(--text3)">${p.data_pagamento?fD(p.data_pagamento):''}</span>`:'');
      return`<div class="pi"><div class="pin">${p.num_parcela}/${p.total_parcelas}</div>
        <div class="pii"><div class="pid">${fD(p.data_vencimento)}</div><div class="piv">${R(p.valor_honorario)}${vc}</div></div>
        <div class="pir">${bdg(s)}<div class="piac">${ac}</div><button class="bic" title="Editar" onclick="abreMEP('${p.id}')">✎</button></div></div>`;
    }).join('');

// ---------- MOVIMENTO AUTOMATICO NO QUADRO FINANCEIRO ----------
const DIAS_AVISO_ATRASO=5;
const LISTAS_FIN={
  pagamento:['Em pagamento INSS','Em pagamento','Em pagamento cliente'],
  encerrado:['Pago / encerrado','Pago/encerrado','Finalizado','Pago'],
  inadimplente:['Inadimplente','Inadimplentes']
};
let _cacheListasFin=null;
async function listasFinanceiro(){
  if(_cacheListasFin)return _cacheListasFin;
  const{data}=await sb.from('crm_listas').select('id,nome').eq('quadro','financeiro').eq('arquivada',false);
  _cacheListasFin=data||[];
  return _cacheListasFin;
}
const _norm=s=>String(s||'').toLowerCase().replace(/\s+/g,' ').trim();
async function acharListaFin(chave){
  const listas=await listasFinanceiro();
  for(const cand of (LISTAS_FIN[chave]||[])){
    const achou=listas.find(l=>_norm(l.nome)===_norm(cand));
    if(achou)return achou;
  }
  return null;
}
function diasAtrasoParcela(p){
  if(!p||!p.data_vencimento)return 0;
  if(p.status==='recebido'||p.status==='cancelado')return 0;
  const d=-dVenc(p.data_vencimento);
  return d>0?d:0;
}
async function moverClienteFinanceiro(crmClienteId,chaveLista,logar){
  if(!crmClienteId)return;
  const lista=await acharListaFin(chaveLista);
  if(!lista){toast('Lista do Financeiro nao encontrada: '+chaveLista,'er');return;}
  const{data:clienteAtual}=await sb.from('crm_clientes').select('lista_id').eq('id',crmClienteId).single();
  if(clienteAtual&&clienteAtual.lista_id===lista.id)return;
  const{count}=await sb.from('crm_clientes').select('id',{count:'exact',head:true}).eq('lista_id',lista.id);
  await sb.from('crm_clientes').update({
    quadro:'financeiro',lista_id:lista.id,posicao:(count||0),atualizado_em:new Date().toISOString()
  }).eq('id',crmClienteId);
  if(logar)await registrarAtividade(crmClienteId,'moveu automaticamente o cartao para "'+lista.nome+'" (Financeiro)',null);
}
async function sincronizarFinanceiroCliente(crmClienteId,logar){
  if(!crmClienteId)return;
  const{data:parcelas}=await sb.from('pm_parcelas')
    .select('status').eq('crm_cliente_id',crmClienteId).neq('status','cancelado');
  if(!parcelas||!parcelas.length)return;
  if(parcelas.some(p=>p.status==='inadimplente')){
    await moverClienteFinanceiro(crmClienteId,'inadimplente',logar);return;
  }
  const todasRecebidas=parcelas.every(p=>p.status==='recebido');
  await moverClienteFinanceiro(crmClienteId,todasRecebidas?'encerrado':'pagamento',logar);
}
async function checarFinalizacaoCliente(crmClienteId){
  await sincronizarFinanceiroCliente(crmClienteId,true);
}
async function notificarAtraso(clienteId,nome,dias){
  if(!U)return;
  await sb.from('crm_notificacoes').insert({
    usuario_id:U.id,cliente_id:clienteId,lida:false,
    texto:(nome||'Cliente')+' - parcela vencida ha '+dias+' dia'+(dias===1?'':'s')
  });
}
async function varrerAtrasos(){
  if(!U)return;
  const atrasadas=(PARC||[]).filter(p=>
    (p.status==='previsto'||!p.status)&&diasAtrasoParcela(p)>=DIAS_AVISO_ATRASO);
  if(!atrasadas.length)return;
  const porCliente={};
  atrasadas.forEach(p=>{
    const cid=pCli(p);if(!cid)return;
    const d=diasAtrasoParcela(p);
    if(!porCliente[cid]||d>porCliente[cid].dias)porCliente[cid]={dias:d,nome:p.cliente_nome};
  });
  const ids=Object.keys(porCliente);
  if(!ids.length)return;
  const{data:jaAvisados}=await sb.from('crm_notificacoes')
    .select('cliente_id').eq('usuario_id',U.id).in('cliente_id',ids)
    .gte('criado_em',new Date(Date.now()-7*864e5).toISOString());
  const setAvisados=new Set((jaAvisados||[]).map(n=>n.cliente_id));
  let novos=0;
  for(const cid of ids){
    if(setAvisados.has(cid))continue;
    await notificarAtraso(cid,porCliente[cid].nome,porCliente[cid].dias);
    novos++;
  }
  if(novos)await carregarNotificacoes();
}

function togInd(){
  $('iarea').style.display=$('find').checked?'block':'none';
  if($('find').checked&&!$('findvl').value)$('findvl').value='200,00';
  recalc();
}
function recalc(){
  const vc=m2f($('fvc')),fp=parseFloat($('ffp').value)||30,fd=m2f($('ffd'));
  const br=vc*(fp/100),liq=Math.max(0,br-fd);
  $('cbruto').textContent=R(br);$('cdesc').textContent='- '+R(fd);$('cliq').textContent=R(liq);
  $('cliq-s').textContent=R(br);
  const ind=m2f($('findvl'));
  $('cliq2').textContent=R(liq);$('ccom').textContent='- '+R(ind);$('csob').textContent=R(Math.max(0,liq-ind));
  if(fParcs.length)recalcParcs();else geraParcs();
}
function geraParcs(){
  const n=parseInt($('fnp').value)||1,hoje=fISO(today());
  if(!fParcs.length||fParcs.length!==n){
    const old=fParcs;fParcs=[];
    for(let i=0;i<n;i++){
      let dt;
      if(old[0]&&old[0].data){dt=new Date(old[0].data+'T12:00:00');dt.setMonth(dt.getMonth()+i);}
      else{dt=new Date(hoje+'T12:00:00');dt.setMonth(dt.getMonth()+i);}
      fParcs.push({data:fISO(dt),cli:(old[i]&&old[i].cli)||(i>0&&i<n-1?1500:0),fd:(old[i]&&old[i].fd)||0});
    }
  }
  recalcParcs();
}
function recalcParcs(){
  const n=fParcs.length,vcTotal=m2f($('fvc')),fp=parseFloat($('ffp').value)||30;
  if(n>1){
    const soma=fParcs.slice(0,n-1).reduce((s,p)=>s+(parseFloat(p.cli)||0),0);
    fParcs[n-1].cli=Math.max(0,vcTotal-soma);
  }else if(n===1)fParcs[0].cli=vcTotal;
  fParcs.forEach(p=>{
    const cli=parseFloat(p.cli)||0,fd=parseFloat(p.fd)||0;
    p.hon=Math.max(0,cli*(fp/100)-fd);
  });
  renderParcsForm();
}
function renderParcsForm(){
  const n=fParcs.length,cont=$('parcsform');
  if(!cont)return;
  const fp=parseFloat($('ffp').value)||30;
  cont.innerHTML=fParcs.map((p,i)=>`<div class="pfc">
    <div style="display:flex;align-items:center;gap:8px;margin-bottom:12px;flex-wrap:wrap">
      <div class="pfn">${i+1}</div><div style="font-size:13px;font-weight:700">Parcela ${i+1}/${n}</div>
      ${i===0?`<span class="ti">Valor do INSS</span>`:`<span class="te">Estimativa</span>`}</div>
    <div class="fg">
      <div class="fld"><label>Data de vencimento</label><input type="date" id="fpd${i}" value="${p.data}" onchange="upP(${i},'d',this.value)"/></div>
      <div class="fld"><label>Valor que a cliente recebe (R$)</label>
        <input type="text" id="fpc${i}" value="${floatToMoney(p.cli)}" placeholder="Quanto o INSS paga" data-money="" inputmode="decimal" onchange="upP(${i},'c',this.value)" ${(i===n-1&&n>1)?'disabled style="opacity:.6"':''}/>
        ${(i===n-1&&n>1)?`<span class="fhint">Calculado automaticamente (resto do total)</span>`:''}</div>
      <div class="fld"><label>Desconto honorário (R$)</label>
        <input type="text" id="fpfd${i}" value="${floatToMoney(p.fd)}" placeholder="0,00" data-money="" inputmode="decimal" onchange="upP(${i},'fd',this.value)"/></div>
      <div class="fld"><label>Valor honorário (R$)</label>
        <input type="text" id="fph${i}" data-money="" inputmode="decimal" value="${floatToMoney(p.hon)}" onchange="upP(${i},'h',this.value)"/>
        <span class="fhint">${fp}% do valor da cliente${p.fd?` − ${R(p.fd)}`:''}</span></div>
    </div></div>`).join('');
}
function upP(i,c,v){
  if(c==='d'){
    fParcs[i].data=v;
    if(i===0){
      const base=new Date(v+'T12:00:00');
      for(let j=1;j<fParcs.length;j++){
        const dt=new Date(base);dt.setMonth(dt.getMonth()+j);
        fParcs[j].data=fISO(dt);
        const el=$('fpd'+j);if(el)el.value=fParcs[j].data;
      }
    }
    return;
  }
  if(c==='h'){fParcs[i].hon=moneyToFloat(v);return;}
  if(c==='fd'){fParcs[i].fd=moneyToFloat(v);recalcParcs();return;}
  if(c==='c'){
    fParcs[i].cli=moneyToFloat(v);
    if(i===1)for(let j=2;j<fParcs.length-1;j++)fParcs[j].cli=fParcs[1].cli;
    recalcParcs();
  }
}
async function submitRec(){
  if(!fCliId){toast('Selecione uma cliente.','er');return;}
  const vc=m2f($('fvc'));
  if(!vc){toast('Informe o valor da cliente.','er');return;}
  const cli=CLI.find(c=>String(c.id)===String(fCliId));
  if(!cli){toast('Cliente não encontrada.','er');return;}
  const fp=parseFloat($('ffp').value)||30,fd=m2f($('ffd'));
  const feeBr=vc*(fp/100),feeLiq=Math.max(0,feeBr-fd);
  const temInd=$('find').checked;
  const indNm=temInd?$('findnm').value.trim():'';
  const indVl=temInd?m2f($('findvl')):0;
  const n=parseInt($('fnp').value)||1;
  const btn=$('fsubmit');btn.textContent='Salvando...';btn.disabled=true;

  const rid=Date.now();
  const rd={id:rid,crm_cliente_id:fCliId,cliente_nome:cli.nome,valor_cliente:vc,num_parcelas:n,
    fee_percent:fp,fee_bruto:feeBr,fee_desconto:fd,fee_liquido:feeLiq,
    indicador_nome:indNm||null,indicador_comissao_tipo:temInd?'fixed':null,
    indicador_comissao_valor:indVl,indicador_comissao_total:indVl,
    sobra_liquida:Math.max(0,feeLiq-indVl),metodo_pagamento:'PIX',notas:$('fnotas').value||null};

  const{error:er}=await sb.from('pm_recebimentos').insert(rd);
  if(er){btn.disabled=false;btn.textContent='Salvar recebimento';toast('Erro ao salvar: '+er.message,'er');return;}

  const base=Date.now()+1;
  const linhas=fParcs.map((p,i)=>({id:base+i,recebimento_id:rid,crm_cliente_id:fCliId,cliente_nome:cli.nome,
    num_parcela:i+1,total_parcelas:n,valor_honorario:p.hon,valor_cliente:p.cli||0,
    data_vencimento:p.data,status:'previsto'}));
  const{error:ep}=await sb.from('pm_parcelas').insert(linhas);
  btn.disabled=false;btn.textContent='Salvar recebimento';
  if(ep){toast('Recebimento salvo, mas houve erro nas parcelas: '+ep.message,'er');return;}

  toast('Recebimento salvo!','ok');
  await loadFin(true);
  await moverClienteFinanceiro(fCliId,'pagamento',true);
  location.hash='#/recebimentos';
}

let FILA_ABA='aprovar';
let FILA_CACHE=[];
let FILA_SEL=new Set();          // vencidas marcadas para reenvio em lote
let FILA_FREIOS={motor_ligado:'sim',samara_ligada:'sim'};

function filaVoltarPara(status){
  if(status==='aguardando_aprovacao')return'aprovar';
  if(status==='erro')return'erro';
  if(status==='vencida')return'vencidas';
  return'agendadas';
}

function renderFila(){
  const pc=$('pc');
  const aprovar=FILA_CACHE.filter(a=>a.status==='aguardando_aprovacao');
  const agendadas=FILA_CACHE.filter(a=>a.status==='agendado'||a.status==='pausado');
  const comErro=FILA_CACHE.filter(a=>a.status==='erro');
  const vencidas=FILA_CACHE.filter(a=>a.status==='vencida');

  const aba=(id,rot,n,destaque)=>`<button class="filatab ${FILA_ABA===id?'on':''}" onclick="FILA_ABA='${id}';renderFila()">${rot}${n?`<span class="filatab-n ${destaque?'alerta':''}">${n}</span>`:''}</button>`;

     freioBotao('samara_ligada','Samara (IA)','Respondendo','Parada',

     `</div>`;

  h+='<div class="filatabs">'+
     aba('aprovar','Aprovar',aprovar.length,true)+
     aba('agendadas','Agendadas',agendadas.length,false)+
     aba('vencidas','Vencidas',vencidas.length,vencidas.length>0)+
     aba('erro','Com erro',comErro.length,comErro.length>0)+
     '</div>';

  const lista=FILA_ABA==='aprovar'?aprovar:(FILA_ABA==='erro'?comErro:(FILA_ABA==='vencidas'?vencidas:agendadas));

  if(FILA_ABA==='vencidas'&&vencidas.length){
    const n=FILA_SEL.size;
    const min=Math.max(0,Math.round((n-1)*2));
    h+=`<div class="filabox" style="display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:12px">
      <div style="flex:1;min-width:190px">
        <div class="filaboxl">Reenvio em lote</div>
        <div class="fhint">Elas voltam para a fila e saem no ritmo normal, com ~2 min entre clientes.${n?` As ${n} selecionadas levam cerca de ${min} min para escoar.`:''}</div>

      <button class="btn btns" style="padding:8px 14px;font-size:12px" onclick="filaSelTodas()">${n===vencidas.length?'Desmarcar todas':'Selecionar todas'}</button>

    </div>`;
  }

  if(lista.length===0){
    const vazio={aprovar:'Nada esperando aprovação',agendadas:'Nenhum envio agendado',vencidas:'Nada vencido',erro:'Nenhuma falha de envio'}[FILA_ABA];
    h+=`<div class="emp"><div class="empt">${vazio}</div></div>`;
  }else{
    h+=lista.map(cardFila).join('');
  }
  pc.innerHTML=h;
}

async function filaAlternarFreio(chave){
  const novo=FILA_FREIOS[chave]==='nao'?'sim':'nao';
  const{error}=await sb.from('crm_variaveis').update({valor_texto:novo}).eq('chave',chave);
  if(error){toast('Erro: '+error.message,'er');return;}
  FILA_FREIOS[chave]=novo;
  toast(novo==='nao'?'Parado. Vale a partir do próximo minuto.':'Religado. Volta no próximo minuto.',novo==='nao'?'er':'ok');
  renderFila();
}

function filaMarcar(id,marcado){

function motivoDaTrava(a){
  const f=a.flags||'';
  if(f.includes('[DESCARTAR_LEAD]'))return{txt:'Descartar lead',cor:'red'};
  if(f.includes('[ESCALAR_ESDRAS]'))return{txt:'Escalar Esdras',cor:'yellow'};
  return{txt:'Afirma direito',cor:'green'};
}

function cardFila(a){
  const c=a.crm_clientes||{};
  const nome=c.nome_completo||'(sem nome)';
  const quando=a.data_hora_agendada?tempoRel(a.data_hora_agendada):'';
  const origem=a.tipo_automacao==='samara'?'Samara':(a.tipo_automacao==='abertura'?'Abertura':(a.tipo_automacao==='aviso_esdras'?'Aviso para você':'Sequência'));

  let etiqueta='';
  if(a.status==='aguardando_aprovacao'){
    const m=motivoDaTrava(a);
    etiqueta=`<span class="filapill ${m.cor}">${m.txt}</span>`;
  }else if(a.status==='pausado'){
    etiqueta='<span class="filapill yellow">Pausada</span>';
  }else if(a.status==='erro'){
    etiqueta='<span class="filapill red">Falhou</span>';
  }else if(a.status==='vencida'){
    etiqueta='<span class="filapill yellow">Venceu</span>';
  }

  const baloes=(a.texto_montado||'').split(' / ').map(b=>b.trim()).filter(Boolean);
  const corpo=baloes.length?baloes.map(b=>`<p class="filabalao">${esc(b)}</p>`).join(''):'<p class="filabalao fhint">(sem texto)</p>';

  let extra='';
  if(a.status==='vencida'){
    extra=`<div class="filabox"><div class="filaboxl">Por que não saiu sozinha</div><div style="font-size:13px">${esc(a.motivo_cancelamento||'Passou do prazo de validade.')}</div><div class="fhint" style="margin-top:4px">Nada foi perdido. Você decide se ainda faz sentido enviar.</div></div>`;
  }else if(a.status==='erro'&&a.erro){
    extra=`<div class="filabox"><div class="filaboxl">O que deu errado</div><div style="font-size:13px;color:var(--red)">${esc(a.erro)}</div>${a.tentativas?`<div class="fhint" style="margin-top:4px">${a.tentativas} tentativa(s)</div>`:''}</div>`;
  }else if(a.status==='aguardando_aprovacao'){
    const d=c.samara_dados||{};
    const chaves=Object.keys(d);
    if(chaves.length){
      extra=`<div class="filabox"><div class="filaboxl">O que a Samara já coletou</div>`+
        chaves.map(k=>`<div style="font-size:13px">${esc(k)}: <b>${esc(String(d[k]))}</b></div>`).join('')+`</div>`;
    }
  }

  // Aviso nao e mensagem para cliente nenhuma: e trabalho esperando por
  // voce. "Aprovar e enviar" num aviso e mentira — nada e enviado, o
  // clique so da ciencia e tira o item da fila. Editar e cancelar
  // tambem nao fazem sentido aqui.
  const ehAviso=a.tipo_automacao==='aviso_esdras';

  let acoes='';
  if(a.status==='aguardando_aprovacao'&&ehAviso){
    acoes=`<button class="btn btnp" style="padding:8px 15px;font-size:12px" onclick="filaAprovar('${a.id}')">✓ Ciente, é comigo</button>`;
  }else if(a.status==='aguardando_aprovacao'){
    acoes=`<button class="btn btnp" style="padding:8px 15px;font-size:12px" onclick="filaAprovar('${a.id}')">✓ Aprovar e enviar</button>
      <button class="btn btns" style="padding:8px 15px;font-size:12px" onclick="filaEditar('${a.id}')">✎ Editar</button>
      <button class="btn btns" style="padding:8px 15px;font-size:12px" onclick="filaCancelar('${a.id}')">✕ Cancelar</button>`;
  }else if(a.status==='agendado'){
    acoes=`<button class="btn btns" style="padding:8px 15px;font-size:12px" onclick="filaPausar('${a.id}')">⏸ Pausar</button>
      <button class="btn btns" style="padding:8px 15px;font-size:12px" onclick="filaReagendar('${a.id}')">🕐 Reagendar</button>
      <button class="btn btns" style="padding:8px 15px;font-size:12px" onclick="filaEditar('${a.id}')">✎ Editar</button>
      <button class="btn btns" style="padding:8px 15px;font-size:12px" onclick="filaCancelar('${a.id}')">✕ Cancelar</button>`;
  }else if(a.status==='pausado'){
    acoes=`<button class="btn btnp" style="padding:8px 15px;font-size:12px" onclick="filaRetomar('${a.id}')">▶ Retomar</button>
      <button class="btn btns" style="padding:8px 15px;font-size:12px" onclick="filaCancelar('${a.id}')">✕ Cancelar</button>`;
  }else if(a.status==='vencida'){
    acoes=`<button class="btn btnp" style="padding:8px 15px;font-size:12px" onclick="filaEnviarAgora('${a.id}')">➤ Enviar agora</button>
      <button class="btn btns" style="padding:8px 15px;font-size:12px" onclick="filaReagendar('${a.id}')">🕐 Reagendar</button>
      <button class="btn btns" style="padding:8px 15px;font-size:12px" onclick="filaEditar('${a.id}')">✎ Editar</button>
      <button class="btn btns" style="padding:8px 15px;font-size:12px" onclick="filaCancelar('${a.id}')">✕ Descartar</button>`;
  }else{
    acoes=`<button class="btn btnp" style="padding:8px 15px;font-size:12px" onclick="filaRetomar('${a.id}')">↻ Tentar de novo</button>
      <button class="btn btns" style="padding:8px 15px;font-size:12px" onclick="filaCancelar('${a.id}')">✕ Cancelar</button>`;
  }

  const verCard=a.cliente_id?`<button class="btn btns" style="padding:8px 15px;font-size:12px;margin-left:auto" onclick="location.hash='#/cliente/${a.cliente_id}'">Abrir cartão →</button>`:'';

  const marcador=a.status==='vencida'
    ? `<input type="checkbox" style="width:18px;height:18px;flex:none;margin-right:9px;accent-color:var(--pri)" ${FILA_SEL.has(a.id)?'checked':''} onchange="filaMarcar('${a.id}',this.checked)"/>`
    : '';

  return`<div class="filacard">
    <div class="filahead">
      ${marcador}
      <div style="min-width:0">
        <div class="filanome">${esc(nome)}</div>
        <div class="filameta">${origem} · ${esc(quando)}</div>
      </div>
      ${etiqueta}
    </div>
    ${extra}
    <div class="filaboxl" style="margin:10px 0 5px">Mensagem</div>
    <div class="filamsg">${corpo}</div>
    <div class="filaacoes">${acoes}${verCard}</div>
  </div>`;
}

async function pageCampanha(){

  const[{data:inst,error},{data:disp}]=await Promise.all([

    ${alerta}
    <div class="fs"><div class="fst">Adicionar número</div>
      <div class="fg" style="align-items:end">
        <div class="fld"><label>Número (com DDD)</label><input type="text" id="ni-num" placeholder="41999999999"/></div>
        <div class="fld"><label>Canal</label><select id="ni-canal"><option value="whatsgw">WhatsGW</option><option value="evolution">Evolution</option><option value="meta_oficial">Meta oficial</option></select></div>
        <div class="fld"><label>Teto diário inicial</label><input type="number" id="ni-teto" min="0" value="20"/></div>
        <div class="fld"><button class="btn btnp" onclick="criarInstancia()" style="width:auto">Adicionar</button></div>
      </div></div>

async function criarInstancia(){

}

let CL_LISTAS={};
let CL_ITENS=[],CL_PAGINA=0,CL_FILTRO='todos',CL_BUSCA='',CL_BUSCATIMER=null,CL_FIM=false,CL_TOTAL=0,CL_CARREGANDO=false;
const CL_PAGE=50;

async function pageClientes(){
  const pc=$('pc');marcarNav('clientes');
  CL_ITENS=[];CL_PAGINA=0;CL_FIM=false;CL_BUSCA='';CL_FILTRO='todos';
  const chips=[
    {k:'todos',r:'Todos'},
    {k:'ativos',r:'Ativos'},
    {k:'sem_card',r:'Sem card'},
    ...QPERM.map(q=>({k:'q:'+q,r:QUADROS[q].rotulo})),
    {k:'arquivados',r:'Arquivados'}
  ];
  pc.innerHTML=`<div class="pgh">
      <div><div class="pgt">Contatos</div><div class="pgs" id="cl-sub">Carregando...</div></div>
      <button class="bnew" onclick="location.hash='#/cliente/novo'">+ Novo contato</button>
    </div>
    <div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px">
      <input type="text" id="cl-busca" placeholder="Nome, telefone ou CPF..." oninput="clBuscar(this.value)" style="flex:1;min-width:200px"/>
    </div>
    <div style="display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px" id="cl-chips">
      ${chips.map(c=>`<button class="btn btns cl-chip${c.k==='todos'?' on':''}" data-f="${c.k}" onclick="clFiltrar('${c.k}')" style="font-size:11px;padding:5px 11px">${esc(c.r)}</button>`).join('')}
    </div>
    <div id="cl-lista"><div class="fhint" style="text-align:center;padding:26px 0">Carregando...</div></div>
    <div id="cl-mais" style="text-align:center;margin:14px 0"></div>`;
  const{data:ls}=await sb.from('crm_listas').select('id,nome');
  CL_LISTAS={};(ls||[]).forEach(l=>CL_LISTAS[l.id]=l.nome);
  await clCarregar(true);
}

function clFiltrar(k){
  CL_FILTRO=k;
  document.querySelectorAll('.cl-chip').forEach(b=>b.classList.toggle('on',b.getAttribute('data-f')===k));
  CL_ITENS=[];CL_PAGINA=0;CL_FIM=false;
  clCarregar(true);
}

function clBuscar(v){
  CL_BUSCA=(v||'').trim();
  if(CL_BUSCATIMER)clearTimeout(CL_BUSCATIMER);
  CL_BUSCATIMER=setTimeout(()=>{CL_ITENS=[];CL_PAGINA=0;CL_FIM=false;clCarregar(true);},350);
}

async function clCarregar(reset){
  if(CL_CARREGANDO)return;
  CL_CARREGANDO=true;
  if(reset)$('cl-lista').innerHTML='<div class="fhint" style="text-align:center;padding:26px 0">Carregando...</div>';
  let q=sb.from('crm_clientes')
    .select('id,nome_completo,telefone_principal,telefone_chave,cpf,quadro,lista_id,origem,arquivado_em,criado_em',{count:'exact'});

  if(CL_FILTRO==='sem_card')q=q.is('quadro',null).is('arquivado_em',null);
  else if(CL_FILTRO==='arquivados')q=q.not('arquivado_em','is',null);
  else if(CL_FILTRO==='ativos')q=q.is('arquivado_em',null);
  else if(CL_FILTRO.startsWith('q:'))q=q.eq('quadro',CL_FILTRO.slice(2)).is('arquivado_em',null);
  // 'todos' = todos mesmo, inclusive arquivados

  if(CL_BUSCA){
    const t=CL_BUSCA.replace(/[%,()]/g,'');
    const digitos=t.replace(/\D/g,'');
    const conds=[`nome_completo.ilike.%${t}%`];
    if(digitos.length>=3){conds.push(`telefone_chave.ilike.%${digitos}%`);conds.push(`cpf.ilike.%${digitos}%`);}
    q=q.or(conds.join(','));
  }

  const de=CL_PAGINA*CL_PAGE;
  const{data,error,count}=await q.order('criado_em',{ascending:false}).range(de,de+CL_PAGE-1);
  CL_CARREGANDO=false;
  if(error){$('cl-lista').innerHTML=`<div class="emp"><div class="empt">Erro ao carregar</div><div class="emps">${esc(error.message)}</div></div>`;return;}
  if(count!==null&&count!==undefined)CL_TOTAL=count;
  const lote=data||[];
  CL_ITENS=CL_ITENS.concat(lote);
  if(lote.length<CL_PAGE)CL_FIM=true;
  clRender();
}

function clRender(){
  const box=$('cl-lista');if(!box)return;
  const sub=$('cl-sub');
  if(sub)sub.textContent=CL_TOTAL.toLocaleString('pt-BR')+(CL_TOTAL===1?' contato':' contatos')+' — mais recentes primeiro';
  if(!CL_ITENS.length){

function clData(iso){
  if(!iso)return '—';
  const d=new Date(iso),hoje=new Date();
  const mesmoDia=d.toDateString()===hoje.toDateString();
  if(mesmoDia)return 'hoje '+d.toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'});
  const ontem=new Date(hoje.getTime()-86400000);
  if(d.toDateString()===ontem.toDateString())return 'ontem';
  if(d.getFullYear()===hoje.getFullYear())return d.toLocaleDateString('pt-BR',{day:'2-digit',month:'2-digit'});
  return d.toLocaleDateString('pt-BR',{month:'2-digit',year:'numeric'});
}

async function ibCarregarLista(silencioso){
  const cont=$('ib-items');
  if(!cont)return;
  const{data,error}=await sb.from('crm_mensagens').select('*').order('criado_em',{ascending:false}).limit(500);
  if(error){if(!silencioso)cont.innerHTML='<div class="fhint" style="text-align:center;padding:20px 0">Erro ao carregar: '+esc(error.message)+'</div>';return;}
  const msgs=data||[];
  const porChave={},ordem=[];
  msgs.forEach(m=>{
    const chave=m.cliente_id?('c:'+m.cliente_id):('l:'+(m.telefone_chave||m.telefone_bruto||'sem-numero'));
    if(!porChave[chave]){porChave[chave]=m;ordem.push(chave);}
  });
  const idsClientes=[...new Set(msgs.filter(m=>m.cliente_id).map(m=>m.cliente_id))];
  let clientesMap={};
  if(idsClientes.length){
    const{data:cl}=await sb.from('crm_clientes').select('id,nome_completo,canal_whatsapp,telefone_principal').in('id',idsClientes);
    (cl||[]).forEach(c=>clientesMap[c.id]=c);
  }
  IB_CONVS=ordem.map(chave=>{
    const ultima=porChave[chave];
    const cliente=ultima.cliente_id?clientesMap[ultima.cliente_id]:null;
    return{
      chave,clienteId:ultima.cliente_id||null,
      nome:cliente?cliente.nome_completo:(ultima.telefone_bruto||ultima.telefone_chave||'Contato desconhecido'),
      canal:cliente?cliente.canal_whatsapp:ultima.canal,
      telefoneChave:ultima.telefone_chave||null,

    };

/**
 * Liga e desliga a Samara nesta conversa.
 *
 * Esta e a pausa que cala ela de verdade. Nao confundir com pausar uma
 * automacao na Fila: aquilo segura UMA mensagem, isto para o
 * atendimento inteiro daquela cliente.
 *
 * Ao pausar, tambem cancela o que estava agendado — senao a conversa
 * fica em silencio agora e volta a falar sozinha daqui a duas horas.
 */
async function ibTogglePausa(clienteId,chave,pausar){
  const{error}=await sb.from('crm_clientes')
    .update({samara_pausada:pausar,samara_deve_continuar:false})
    .eq('id',clienteId);
  if(error){toast('Não consegui alterar: '+error.message,'er');return;}

  let canceladas=0;
  if(pausar){
    const{data,error:e2}=await sb.from('crm_automacoes')
      .update({status:'cancelado',motivo_cancelamento:'Samara pausada na conversa'})
      .eq('cliente_id',clienteId)
      .in('status',['agendado','aguardando_aprovacao','pausado'])
      .select('id');
    if(e2)console.error('[pausa] erro ao cancelar agendadas:',e2.message);
    else canceladas=(data||[]).length;
  }

  registrarAtividade(clienteId,pausar
    ?'pausou a Samara nesta conversa'+(canceladas?' e cancelou '+canceladas+' envio(s) agendado(s)':'')
    :'liberou a Samara para responder nesta conversa');

  toast(pausar
    ?'Samara pausada'+(canceladas?' · '+canceladas+' envio(s) cancelado(s)':'')
    :'Samara liberada','ok');

  const conv=IB_CONVS.find(x=>x.chave===chave);
  if(conv)ibRenderPainel(conv);
}

/**
 * Exclusao completa, para testes.
 *
 * O banco NAO apaga em cascata: apagar so a linha de crm_clientes deixa
 * mensagem, automacao e atividade orfas — foi assim que apareceu aquela
 * automacao rodando para um contato que nao existia mais.
 * Por isso aqui a ordem e: filhos primeiro, cliente por ultimo.
 *
 * Serve tambem para contato que ainda nao virou cliente: nesse caso so
 * existem mensagens, e o resto e ignorado.
 */
/**
 * Apaga uma cliente e TUDO que pendura nela, na ordem certa.
 *
 * Existe uma vez so, de proposito. Antes o unico lugar que apagava
 * direito era a Caixa de Entrada; o botao de dentro do cartao apagava
 * so a linha da cliente e deixava automacao orfa disparando para um
 * card que nao existe mais. Dois jeitos diferentes de apagar a mesma
 * coisa e como isso acontece.
 *
 * Devolve a lista de falhas — vazia quando deu tudo certo.
 */
async function apagarClienteTudo(clienteId,telefoneChave){
  const erros=[];
  const tentar=async(rotulo,promessa)=>{
    const{error}=await promessa;
    if(error)erros.push(rotulo+': '+error.message);
  };

  // 1. Mensagens. Podem estar ligadas pelo cliente ou so pelo telefone.
  if(clienteId)await tentar('mensagens',sb.from('crm_mensagens').delete().eq('cliente_id',clienteId));
  if(telefoneChave)await tentar('mensagens do número',sb.from('crm_mensagens').delete().eq('telefone_chave',telefoneChave));

  // 2. Tudo que pendura na cliente.
  if(clienteId){
    await tentar('automações',sb.from('crm_automacoes').delete().eq('cliente_id',clienteId));
    await tentar('etiquetas',sb.from('crm_clientes_etiquetas').delete().eq('cliente_id',clienteId));
    await tentar('atividades',sb.from('crm_atividades').delete().eq('cliente_id',clienteId));
    await tentar('comentários',sb.from('crm_comentarios').delete().eq('cliente_id',clienteId));
    await tentar('anexos',sb.from('crm_anexos').delete().eq('cliente_id',clienteId));
    await tentar('notificações',sb.from('crm_notificacoes').delete().eq('cliente_id',clienteId));
    // 3. E so entao a cliente.
    await tentar('cliente',sb.from('crm_clientes').delete().eq('id',clienteId));
  }
  return erros;
}

/**
 * Excluir pela tela de Contatos.
 *
 * Mesma confirmacao de dois passos da Caixa de Entrada: um aviso do que
 * vai embora e depois digitar APAGAR. E a unica tela onde da para achar
 * um contato pelo telefone e apagar sem precisar abrir o cartao.
 */
async function clExcluir(id,nome,telefoneChave){
  if(!confirm(`Excluir ${nome}?\n\nVai apagar a cliente, o cartão, a conversa inteira e tudo que estiver agendado para ela.\n\nIsso NÃO pode ser desfeito.`))return;
  if((prompt('Para confirmar, digite APAGAR')||'').trim().toUpperCase()!=='APAGAR'){
    toast('Cancelado','er');return;
  }

  const erros=await apagarClienteTudo(id,telefoneChave||null);

  if(erros.length){
    console.error('[excluir] falhas:',erros);
    toast('Apagado com pendências — veja o console','er');
  }else{
    toast('Excluído','ok');
  }

  // Tira da tela sem recarregar a lista inteira: numa base de 37 mil
  // contatos, recarregar joga fora a rolagem e a busca.
  CL_ITENS=CL_ITENS.filter(x=>x.id!==id);
  if(CL_TOTAL>0)CL_TOTAL--;
  clRender();
}

async function ibExcluirTudo(chave){
  const c=IB_CONVS.find(x=>x.chave===chave);

  if((prompt('Para confirmar, digite APAGAR')||'').trim().toUpperCase()!=='APAGAR'){
    toast('Cancelado','er');return;
  }

  if(erros.length){
    console.error('[excluir] falhas:',erros);

async function ibCarregarChat(c,silencioso){
  const box=$('ib-chat');
  if(!box)return;
  if(!silencioso){
    box.innerHTML=`<div class="inb-chat-head"><div class="av" style="background:${avC(c.nome)}">${avL(c.nome)}</div>
        <div class="inb-chat-nome">${esc(c.nome)}</div>${chatBadgeHtml(c.canal)}</div>
      <div class="inb-chat-body"><div id="ib-chat-janela"></div><div class="chatfeed" id="ib-chat-feed"><div class="fhint" style="text-align:center;padding:20px 0">Carregando...</div></div></div>
      <div class="inb-chat-send">
        <textarea id="ib-chat-input" placeholder="Escreva uma mensagem..."></textarea>
        <button class="btn btnp" style="width:100%;margin-top:9px" id="ib-chat-btn" onclick="ibEnviarMensagem()">Enviar</button>
        <div class="chataviso" id="ib-chat-aviso"></div>
      </div>`;
  }
  const filtro=c.clienteId?{coluna:'cliente_id',valor:c.clienteId}:{coluna:'telefone_chave',valor:c.telefoneChave};
  if(!filtro.valor)return;
  const{data,error}=await sb.from('crm_mensagens').select('*').eq(filtro.coluna,filtro.valor).order('criado_em',{ascending:true}).limit(300);
  const feed=$('ib-chat-feed');
  if(!feed)return;
  if(error){feed.innerHTML='<div class="fhint" style="text-align:center;padding:20px 0">Erro ao carregar a conversa: '+esc(error.message)+'</div>';return;}
  const msgs=data||[];
  const assinatura=msgs.length+'|'+(msgs.length?(msgs[msgs.length-1].id||''):'');
  const jan=$('ib-chat-janela');
  if(jan)jan.innerHTML=chatJanelaHtml(msgs,c.canal);
  const av=$('ib-chat-aviso');
  if(av)av.innerHTML='O envio real ainda não está ligado. A mensagem fica registrada aqui na conversa e sai de verdade quando a API de envio do canal for conectada.';
  if(silencioso&&assinatura===ibChatAssinatura)return;
  ibChatAssinatura=assinatura;
  if(!msgs.length){feed.innerHTML='<div class="fhint" style="text-align:center;padding:20px 0">Nenhuma mensagem ainda.</div>';return;}
  let html='',diaAnt='';
  msgs.forEach(m=>{
    const dia=chatDiaMsg(m);
    if(dia!==diaAnt){html+=`<div class="chatdia">${esc(dia)}</div>`;diaAnt=dia;}
    const cls=m.direcao==='entrada'?'chatb-in':(m.autor_tipo==='bot'?'chatb-bot':'chatb-out');
    const autor=m.direcao==='entrada'?'':(m.autor_tipo==='bot'?'Samara · ':(nomeUsuario(m.usuario_id)?nomeUsuario(m.usuario_id)+' · ':''));
    const pend=m.status==='pendente_envio'?' · ⏳ não enviada':'';
    html+=`<div class="chatb ${cls}">${chatCorpoMsg(m)}<span class="chatb-meta">${esc(autor)}${chatHoraMsg(m)}${pend}</span></div>`;
  });
  feed.innerHTML=html;
  feed.scrollTop=feed.scrollHeight;
}
function pararInboxChatPoll(){if(ibChatTimer){clearInterval(ibChatTimer);ibChatTimer=null;}}
async function ibEnviarMensagem(){
  const c=IB_CONVS.find(x=>x.chave===ibSelId);
  const inp=$('ib-chat-input');
  if(!c||!inp)return;
  const txt=(inp.value||'').trim();
  if(!txt){toast('Escreva a mensagem primeiro','er');return;}
  if(!c.canal){toast('Este contato não tem um canal de WhatsApp definido','er');return;}
  const btn=$('ib-chat-btn');
  if(btn){btn.disabled=true;btn.textContent='Registrando...';}
  const{error}=await sb.from('crm_mensagens').insert({
    cliente_id:c.clienteId,
    telefone_chave:c.telefoneChave||null,
    telefone_bruto:c.ultimaMsg?c.ultimaMsg.telefone_bruto:null,
    canal:c.canal,
    direcao:'saida',
    autor_tipo:'humano',
    usuario_id:U.id,
    tipo:'texto',
    texto:txt,
    status:'pendente_envio',
    enviada_em:new Date().toISOString()
  });
  if(btn){btn.disabled=false;btn.textContent='Enviar';}
  if(error){toast('Erro ao registrar: '+error.message,'er');return;}
  inp.value='';
  ibChatAssinatura='';
  ibCarregarChat(c);
  toast('Mensagem registrada na conversa (envio real ainda não ligado)','in');
}

// ============================================================
// CRIAR CLIENTE A PARTIR DE UM CONTATO NOVO (lead) NA CAIXA DE ENTRADA
// Regra: um contato (telefone) nunca pode virar dois cartões.
// ============================================================
function ibAbrirCriarCliente(chave){
  const c=IB_CONVS.find(x=>x.chave===chave);
  if(!c)return;
  const optQ=QPERM.map(q=>`<option value="${q}">${QUADROS[q].rotulo}</option>`).join('');
  pararInboxPoll();
  abrirModal(`
    <button class="mbc" onclick="ibCancelarCriarCliente()">×</button>
    <div class="mbt">Criar cliente a partir deste contato</div>
    <div class="mbs">O histórico de mensagens já trocadas com este número entra automaticamente no card, na aba Chat.</div>
    <div class="fld" style="margin-bottom:13px"><label>Nome completo</label><input type="text" id="ibc-nome" placeholder="Nome da cliente"/></div>
    <div class="fg" style="margin-bottom:13px">
      <div class="fld"><label>Quadro</label><select id="ibc-quadro" onchange="ibcTrocarQuadro()">${optQ}</select></div>
      <div class="fld"><label>Lista</label><select id="ibc-lista"><option value="">Carregando...</option></select></div>
    </div>
    <div class="fld" style="margin-bottom:20px"><label>Telefone</label><input type="text" id="ibc-tel" value="${escA(c.ultimaMsg.telefone_bruto||c.telefoneChave||'')}"/></div>
    <div class="brow" style="justify-content:flex-end;gap:9px">
      <button class="btn btns" onclick="ibCancelarCriarCliente()">Cancelar</button>
      <button class="btn btnp" id="ibc-btn-criar" onclick="ibConfirmarCriarCliente('${escA(chave)}')">Criar cliente</button>
    </div>`);
  ibcTrocarQuadro();
}
function ibCancelarCriarCliente(){
  fecharModal();
  if(location.hash.slice(1)==='/inbox')ibIniciarListaPoll();
}
async function ibcTrocarQuadro(){
  const sel=$('ibc-lista'),q=$('ibc-quadro');
  if(!sel||!q)return;
  const{data}=await sb.from('crm_listas').select('*').eq('quadro',q.value).eq('arquivada',false).order('ordem');
  sel.innerHTML=(data||[]).map(l=>`<option value="${l.id}">${esc(l.nome)}</option>`).join('')||'<option value="">Nenhuma lista neste quadro</option>';
}
async function ibConfirmarCriarCliente(chave){
  const c=IB_CONVS.find(x=>x.chave===chave);
  if(!c)return;
  const nome=($('ibc-nome').value||'').trim();
  const listaId=$('ibc-lista').value,quadro=$('ibc-quadro').value;
  const tel=($('ibc-tel').value||'').trim();
  if(!nome){toast('Digite o nome da cliente','er');return;}
  if(!listaId){toast('Escolha uma lista','er');return;}
  const btn=$('ibc-btn-criar');
  if(btn){btn.disabled=true;btn.textContent='Verificando...';}
  if(c.telefoneChave){
    const{data:existente}=await sb.from('crm_clientes').select('id,nome_completo').eq('telefone_chave',c.telefoneChave).limit(1);
    if(existente&&existente.length){
      if(btn){btn.disabled=false;btn.textContent='Criar cliente';}
      const ex=existente[0];
      if(confirm('Este número já é de uma cliente cadastrada: '+ex.nome_completo+'. Não é possível ter dois cartões para o mesmo contato. Abrir o cartão dela agora?')){
        fecharModal();abrirCardCliente(ex.id);
      }else if(location.hash.slice(1)==='/inbox')ibIniciarListaPoll();
      return;
    }
  }
  if(btn)btn.textContent='Criando...';
  const{data:novo,error}=await sb.from('crm_clientes').insert({nome_completo:nome,telefone_principal:tel||null,canal_whatsapp:c.canal||null,quadro,lista_id:listaId}).select('id').single();
  if(error||!novo){if(btn){btn.disabled=false;btn.textContent='Criar cliente';}toast('Erro ao criar cliente: '+(error?error.message:''),'er');return;}
  let migradas=0;
  if(c.telefoneChave){
    const{data:atualizadas}=await sb.from('crm_mensagens').update({cliente_id:novo.id}).eq('telefone_chave',c.telefoneChave).is('cliente_id',null).select('id');
    migradas=(atualizadas||[]).length;
  }
  await registrarAtividade(novo.id,'card criado a partir de uma conversa de WhatsApp'+(migradas?' · '+migradas+' '+(migradas>1?'mensagens importadas':'mensagem importada')+' do histórico':''));
  toast('Cliente criada a partir da conversa','ok');
  fecharModal();
  abrirCardCliente(novo.id);
}
</script>

if('serviceWorker' in navigator){
  window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
}
